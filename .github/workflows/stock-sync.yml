name: Sinkron Stock & Distribusi
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tarik snapshot stock toko dan DC
        env:
          MOKA_ACCESS_TOKEN: ${{ secrets.MOKA_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRAND_MAP: ${{ vars.MOKA_BRAND_MAP_JSON }}
        run: python3 scripts/sync_stock_v78.py
