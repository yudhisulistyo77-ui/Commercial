name: Sinkron Stock & Distribusi
# V84: stok saat ini dari Item Library Moka + penjualan 14/30/90 hari dari Item Sales.
# Dijalankan tombol "Tarik Stock" (Edge Function stock-sync) atau Run workflow manual.
# Jadwal harian stock ada di workflow "Sinkron Moka POS" (job stock).
on:
  workflow_dispatch:
    inputs:
      outlets:
        description: "Batasi outlet Moka (nama, pisahkan koma). Kosong = semua"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: commercial-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pemeriksaan awal (token Moka & izin tulis Supabase)
        env:
          MOKA_ACCESS_TOKEN: ${{ secrets.MOKA_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/health_v84.py
      - name: Tarik stock toko & DC (Moka API)
        env:
          MOKA_ACCESS_TOKEN: ${{ secrets.MOKA_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRAND_MAP: ${{ vars.MOKA_BRAND_MAP_JSON }}
          ONLY_OUTLETS: ${{ inputs.outlets }}
        run: python3 scripts/sync_stock_v84.py
