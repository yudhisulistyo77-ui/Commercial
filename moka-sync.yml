name: Sinkron Moka POS

# Menarik data Moka ke Supabase untuk Dashboard Commercial.
# - Jadwal harian (mode full): bulan berjalan s.d. kemarin + katalog item & harga.
# - Tombol "Sinkron Moka" di dashboard / Run workflow manual (mode live): data s.d. menit ini.
# Semua kunci dibaca dari GitHub Secrets, tidak ada token di repo.

on:
  schedule:
    - cron: "37 20 * * *"   # 04:37 WITA setiap hari
  workflow_dispatch:
    inputs:
      mode:
        description: "live = sampai menit ini (cepat) · full = sebulan penuh s.d. kemarin"
        type: choice
        options: [live, full]
        default: live
      months:
        description: "Khusus mode full: bulan (YYYY-MM, pisahkan koma, atau 2026-01..2026-10). Kosong = bulan berjalan"
        required: false
        default: ""
      include_library:
        description: "Perbarui library item dan Price List"
        type: boolean
        default: true
      date_from:
        description: "Awal rentang YYYY-MM-DD (opsional)"
        required: false
        default: ""
      date_to:
        description: "Akhir rentang YYYY-MM-DD (opsional)"
        required: false
        default: ""
      skip_unchanged:
        description: "Lewati detail periode lama jika checkpoint dan ringkasan masih cocok"
        type: boolean
        default: true
      force_refresh:
        description: "Tarik ulang semua detail meskipun ada checkpoint"
        type: boolean
        default: false
      outlets:
        description: "Batasi ke outlet Moka tertentu (nama, pisahkan koma). Kosong = semua"
        required: false
        default: ""
      dry_run:
        description: "Uji coba saja (tidak menulis ke database)"
        type: boolean
        default: false
      run_id:
        description: "Diisi otomatis oleh tombol Sinkron di dashboard"
        required: false
        default: ""

concurrency:
  group: moka-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Periksa konfigurasi
        env:
          MOKA_ACCESS_TOKEN: ${{ secrets.MOKA_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PYCONFIG'
          import os
          missing = [k for k in ('MOKA_ACCESS_TOKEN','SUPABASE_URL','SUPABASE_SERVICE_KEY') if not os.environ.get(k)]
          if missing: raise SystemExit('GitHub Secrets belum lengkap: ' + ', '.join(missing))
          if os.environ['SUPABASE_SERVICE_KEY'].startswith('sb_publishable_'):
              raise SystemExit('SUPABASE_SERVICE_KEY harus secret/service_role, bukan publishable key.')
          PYCONFIG

      - name: Tarik data Moka → Supabase
        env:
          MOKA_ACCESS_TOKEN: ${{ secrets.MOKA_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SKIP_UNCHANGED: ${{ (github.event_name == 'schedule' || inputs.skip_unchanged) && '1' || '0' }}
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '0' }}
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
          SYNC_MONTHS: ${{ inputs.months }}
          SYNC_FROM: ${{ inputs.date_from }}
          SYNC_TO: ${{ inputs.date_to }}
          INCLUDE_LIBRARY: ${{ (github.event_name == 'schedule' || inputs.include_library) && '1' || '0' }}
          ONLY_OUTLETS: ${{ inputs.outlets }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RUN_ID: ${{ inputs.run_id }}
          BRAND_MAP: ${{ vars.MOKA_BRAND_MAP_JSON }}
          WORKERS: "2"
          STOCK_BATCH_SIZE: "250"
          MOKA_TZ_OFFSET: "7"
          LOCAL_TZ_OFFSET: "8"
          MOKA_TOKEN_EXPIRES: "2027-05-04"
        run: python3 moka_sync.py

      - name: Tandai proses yang berhenti
        if: failure() || cancelled()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 - <<'PYFAIL'
          import os, json, urllib.request
          from datetime import datetime, timezone
          if not all(os.environ.get(k) for k in ('SUPABASE_URL','SUPABASE_KEY','RUN_ID')): raise SystemExit(0)
          headers = {'apikey':os.environ['SUPABASE_KEY'],'Content-Type':'application/json'}
          if os.environ['SUPABASE_KEY'].startswith('eyJ'): headers['Authorization']='Bearer '+os.environ['SUPABASE_KEY']
          url=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/moka_sync_runs?id=eq.'+os.environ['RUN_ID']+'&status=in.(requested,running)'
          body=json.dumps({'status':'error','finished_at':datetime.now(timezone.utc).isoformat(),'message':'GitHub Actions gagal/dibatalkan. Buka log workflow untuk rincian.'}).encode()
          urllib.request.urlopen(urllib.request.Request(url,headers=headers,data=body,method='PATCH'),timeout=30).close()
          PYFAIL

      - name: Simpan hasil uji coba
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: moka-sync-output
          path: moka-sync-output/
          if-no-files-found: ignore
          retention-days: 7
