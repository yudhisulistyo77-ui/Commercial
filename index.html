        /* item 8 (ronde 11): diurutkan dari NET SALES y3 terbesar→terkecil (bukan qty) — tabel ini
           menonjolkan NET SALES, jadi urutan & gradasi warnanya ikut metrik itu juga.
           round 12 (lanjutan): kolom ITEM/qty DIHAPUS sesuai permintaan user — tabel ini sekarang
           murni data sales (NET SALES per tahun + growth/gap), tidak lagi memuat unit terjual. */
        arr.sort((a,b)=>(b[1][2]?.sales||0)-(a[1][2]?.sales||0));
        const maxN=arr.length?(arr[0][1][2]?.sales||0):0;
        const heads=[H(title,{s:1}),...st.y.map(y=>H('NET SALES '+y,{r:1})),H(`Δ NET ${y3}/${y2}`,{r:1}),H(`NET SALES GAP ${y3}/${y2}`,{r:1}),H(`Δ NET ${y3}/${y1}`,{r:1}),H(`NET SALES GAP ${y3}/${y1}`,{r:1})];
        const rows=arr.slice(0,limit).map(([k,v])=>{ const n=v.map(x=>x?x.sales:0);
          return [keyCell(k),...n.map((x,i)=>i===2?magCell(x,maxN,compact(x)):compact(x)),growthPill(n[2],n[1]),gapTxt(n[2],n[1]),growthPill(n[2],n[0]),gapTxt(n[2],n[0])]; });
        const totN=res[dim].map(r=>r.reduce((s,x)=>s+x.sales,0));
        return card(`Item sales per ${title.toLowerCase()}`,`${ymLabel(y1,m1,m2)} · ${ymLabel(y2,m1,m2)} · ${ymLabel(y3,m1,m2)} · diurutkan NET SALES ${y3} terbesar→terkecil`,
          mkTable(heads,rows,dim==='store'||dim==='category'?['TOTAL',...totN.map(x=>compact(x)),growthPill(totN[2],totN[1]),gapTxt(totN[2],totN[1]),growthPill(totN[2],totN[0]),gapTxt(totN[2],totN[0])]:null));
      };
      host.append(mk('store','Toko',k=>k,60));

      host.append(mk('color','Warna',k=>colorChip(k),30));
      host.append(mk('size','Ukuran',k=>k,20));
    }catch(e){ host.innerHTML=''; host.append(el('div',{class:'note warn'},'Gagal memuat item sales: '+e.message+' — jalankan migrasi database terbaru.')); }
  })();
}

/* =====================================================================
   SAME STORE SALES GROWTH (SSSG) — round 9 item 6, DIROMBAK round 10 item 4/5
   round 9: toko yang belum buka pada 1 Jan tahun pembanding dikeluarkan sepenuhnya ("Belum penuh").
   round 10 item 4: toko TIDAK LAGI dikeluarkan — dibandingkan dengan jendela (window) yang dijangkarkan
   ke TANGGAL BUKA toko itu sendiri, direplikasi di tiap tahun yang dibandingkan (mis. toko buka 3 Mar 2025
   dibandingkan 3 Mar → cut-off setiap tahun, bukan 1 Jan → cut-off). Karena data penjualan di database ini
   hanya bulanan (sales_actual/v_sales_dashboard & item_sales, TIDAK ada rincian harian), bulan AWAL jendela
   (bulan buka) & bulan AKHIR (bulan cut-off) diperkirakan secara proporsional: sales bulan itu dibagi rata
   per hari (sales bulanan ÷ jumlah hari bulan itu) lalu dikalikan jumlah hari yang termasuk dalam jendela.
   Bulan-bulan penuh di antaranya dihitung 100% apa adanya. Teknik "bagi rata per hari" ini SAMA PERSIS
   dengan yang sudah dipakai H2H untuk cut-off bulan berjalan (lihat h2hData()/dim2/cutoffDay) — di sini
   dipakai juga untuk ujung AWAL, bukan cuma ujung akhir. Ini estimasi, bukan angka harian asli — didokumentasikan
   di kartu metodologi di bawah. Sebuah toko tanpa opening_date, ATAU yang "ulang tahun buka"-nya (bulan/
   tanggal buka) belum lewat dibanding cut-off tahun ini (misal buka 20 Des, cut-off 5 Okt), tidak bisa
   dibandingkan sama sekali pada cut-off ini — window-nya akan selalu negatif di tahun manapun selama
   cut-off tahunan tetap sebelum tanggal ulang-tahun bukanya; ditandai jelas di tabel, tidak dipaksa "—"
   diam-diam.
   round 10 item 5: cut-off akhir jendela kini bisa diatur user (S.sssg.cutoffTo, default hari ini) — sama
   persis pola H2H (dateTo/cutoffInfo) — bukan dikunci ke "hari ini" selamanya. Tahun berjalan (y3) diambil
   dari tahun pada tanggal cut-off itu sendiri, supaya konsisten dengan tanggal yang dipilih.
   Ditulis sebagai fungsi paralel dari H2H (bukan refactor) secara sengaja — H2H sudah sangat panjang/teruji,
   dan risiko meregresi H2H dinilai lebih mahal daripada duplikasi logika di sini; hanya TEKNIK ekstrapolasi
   cut-off-day yang dipakai bersama, bukan h2hData() itu sendiri (h2hData() tidak bisa menyatakan bulan
   awal selain Januari).
   ===================================================================== */
function sssgInit(){
  const key='sssg-v2';
  if(!S.sssg||S.sssg.key!==key){
    const today=new Date();
    S.sssg={key,cutoffTo:today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0')};
  }
  return S.sssg;
}
/* round 11 item 2: y (tahun berjalan/y3) KINI TERKUNCI ke tahun kalender berjalan sebenarnya
   (h2hCurrentYear() — sama persis dengan H2H), TIDAK LAGI ikut tahun dari tanggal "Sampai tanggal"
   yang dipilih user. Hanya bulan & tanggal (m/day) dari date-picker itu yang dipakai sbg cut-off
   jendela — direplikasi ke setiap tahun yang dibandingkan (lihat sssgWindowAnchor/sssgStoreWindowData
   di bawah), persis seperti diminta: toko buka 23 Mar 2025 → jendela 23 Mar–cutoff di SETIAP tahun
   (2025: 23 Mar 2025–cutoff; 2026: 23 Mar 2026–cutoff). */
function sssgCutoffParsed(st){
  const y3=h2hCurrentYear();
  const d=new Date((st.cutoffTo||'')+'T00:00:00');
  if(isNaN(d)){ const t=new Date(); return {y:y3,m:t.getMonth()+1,day:t.getDate(),label:t.toLocaleDateString('id-ID',{dateStyle:'long'})}; }
  return {y:y3,m:d.getMonth()+1,day:d.getDate(),label:d.toLocaleDateString('id-ID',{dateStyle:'long'})};
}
/* Tanggal buka toko sebagai {m,day,year} — null kalau tidak ada opening_date atau tak valid */
function sssgOpenMD(store){
  if(!store||!store.opening_date) return null;
  const d=new Date(store.opening_date+'T00:00:00');
  if(isNaN(d)) return null;
  return {m:d.getMonth()+1, day:d.getDate(), year:d.getFullYear()};
}
/* Valid artinya: toko punya opening_date DAN bulan/tanggal bukanya sudah "lewat" relatif cut-off tahun ini
   (kalau belum, window bulan-buka→cut-off akan negatif di tahun manapun — toko ini belum bisa dibandingkan
   sama sekali pada cut-off yang dipilih, bukan cuma utk tahun tertentu). */
function sssgWindowAnchor(store,cutoffM,cutoffDay){
  const o=sssgOpenMD(store); if(!o) return null;
  if(o.m>cutoffM || (o.m===cutoffM && o.day>cutoffDay)) return null;
  return o;
}
/* Sales (dan metrik lain) toko pada jendela [bulan buka/tanggal buka] → [cutoffM/cutoffDay] TAHUN y,
   dgn ekstrapolasi proporsional-hari pada bulan awal & bulan akhir (teknik yg sama dgn h2hData()).
   null kalau toko belum ada pada tahun itu (y < tahun buka). */
function sssgStoreWindowData(store,year,anchor,cutoffM,cutoffDay){
  if(!anchor || year<anchor.year) return null;
  const m1=anchor.m, d1=anchor.day, m2=cutoffM, d2=cutoffDay;
  const out={sales:0,kom:0,usr:0,kt:0,ut:0,um:0,tgt:0,trx:0,val:0,days:0};
  for(let m=m1;m<=m2;m++){
    const dim=daysInMonth(year,m);
    let frac=1;
    if(m===m1 && m===m2) frac=Math.max(0,d2-d1+1)/dim;
    else if(m===m1) frac=(dim-d1+1)/dim;
    else if(m===m2) frac=d2/dim;
    out.days+=dim*frac;   // item 2/5: jumlah hari NYATA dlm jendela (mengikuti tgl buka toko), utk rata2 sales harian
    const row=S.dashAll.find(r=>r.year===year&&r.month===m&&r.store_id===store.id);
    const trxRow=S.trxAll.find(r=>r.year===year&&r.month===m&&r.store_id===store.id);
    if(row){ out.sales+=N(row.total_sales)*frac; out.kom+=N(row.sales_komersial)*frac; out.usr+=N(row.sales_user)*frac;
      out.kt+=N(row.sales_komersial_tigalapan)*frac; out.ut+=N(row.sales_user_tigalapan)*frac; out.um+=N(row.sales_user_mamu)*frac;
      out.tgt+=N(row.target_total); }   // target TIDAK diekstrapolasi, sama seperti h2hData()
    if(trxRow){ out.trx+=N(trxRow.jumlah_transaksi)*frac; out.val+=N(trxRow.nilai_transaksi)*frac; }
  }
  return out;
}
/* Kumpulkan data semua toko pada cakupan filter (storeOk), dgn window per-toko sendiri. */
function sssgData(years,cutoffM,cutoffDay){
  const out=new Map();
  S.stores.forEach(store=>{
    if(store.name==='DC TIGALAPAN') return;     // bukan toko ritel
    if(!storeOk(store.id)) return;
    const anchor=sssgWindowAnchor(store,cutoffM,cutoffDay);
    const by={}; years.forEach(y=>{ by[y]=sssgStoreWindowData(store,y,anchor,cutoffM,cutoffDay); });
    out.set(store.id,{anchor,by,name:store.name,opening_date:store.opening_date||null});
  });
  return out;
}
function renderSSSG(){
  parkFilters();
  const p=$('#p-sssg'); p.innerHTML='';
  const sst=sssgInit();
  const cf=sssgCutoffParsed(sst), y3=cf.y, y2=y3-1, y1=y3-2, cutoffM=cf.m, cutoffDay=cf.day;
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Same Store Sales Growth'),
    el('p',{},`Tiap toko dibandingkan pada jendela tanggal buka toko itu sendiri s.d. ${cf.label} (${y1}, ${y2}, ${y3}) · `+
      scopeLabel()))));
  const pf=pageFilterBar('sssg');
  if(S.demo) p.append(demoBanner());

  /* round 10 item 5: kartu filter gabungan — Brand/SPV/Toko (pageFilterBar) + cut-off akhir jendela yang
     bisa diubah user, pola persis sama dengan kartu "Filter & Atur Perbandingan" di H2H. */
  const dateTo=el('input',{type:'date',id:'sssg-cutoff-to',value:sst.cutoffTo||'',style:'width:150px'});
  dateTo.onchange=()=>{ sst.cutoffTo=dateTo.value||sst.cutoffTo; renderSSSG(); };
  const resetToday=el('button',{class:'btn sm',onclick:()=>{ const t=new Date(); sst.cutoffTo=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); renderSSSG(); }},'Set ke hari ini');
  p.append(card('Filter & Atur Perbandingan','Brand/SPV/Toko memfilter cakupan toko; "Sampai tanggal" mengatur ujung akhir jendela perbandingan setiap toko (ujung awal selalu tanggal buka toko itu sendiri).',
    pf?el('div',{class:'rowline',style:'flex-wrap:wrap'},...[...pf.childNodes]):null,
    el('div',{class:'rowline',style:'margin-top:11px;align-items:center;flex-wrap:wrap'},
      el('div',{class:'fld'},el('label',{for:'sssg-cutoff-to'},'Sampai tanggal (cut-off, direplikasi ke tiap tahun)'),dateTo),
      resetToday,
      el('span',{class:'sub'},`Tahun berjalan mengikuti tahun pada tanggal cut-off ini: ${y1}/${y2}/${y3}.`))));

  const D=sssgData([y1,y2,y3],cutoffM,cutoffDay);
  const idsAll=[...D.keys()];
  const names=new Map(idsAll.map(id=>[id,D.get(id).name]));
  const G=(y,id,k)=>{ const by=D.get(id)?.by?.[y]; return by?N(by[k]):0; };
  const hasY=(y,id)=>!!(D.get(id)?.by?.[y]);
  const noAnchor=idsAll.filter(id=>!D.get(id).anchor).map(id=>names.get(id));

  const idsY2=idsAll.filter(id=>hasY(y2,id)&&hasY(y3,id));    // valid same-window utk y3 vs y2
  const idsFull=idsAll.filter(id=>hasY(y1,id)&&hasY(y3,id));  // valid same-window utk y3 vs y1 (3 tahun)
  const T=(y,k,set)=>set.reduce((s,id)=>s+G(y,id,k),0);

  if(noAnchor.length) p.append(el('div',{class:'note warn'},el('b',{},'Tidak bisa dibandingkan pada cut-off ini: '),noAnchor.join(', ')+'.'));

  /* ---------- tiles — round 16 item 3: disamakan STRUKTURNYA persis dengan H2H (tl: 3 tile Total Sales
     per tahun + 1 tile Growth; tl2: Growth y3-vs-y1 + Target harian + Pencapaian thd target + AOV) —
     dipakai idsFull (toko dgn window valid di 3 tahun sekaligus) sebagai SATU himpunan toko yang sama utk
     ketiga tahun di baris ini, persis seperti H2H memakai satu himpunan `liveIds` yang sama di seluruh tile. ---------- */
  const tl=el('div',{class:'grid g4'});
  [y1,y2,y3].forEach((y,i)=>tl.append(tile(`Total sales ${y}`,compact(T(y,'sales',idsFull)),
    `${idsFull.length} toko same-window (jendela thd ${y1})`+(i===2?` · target ${compact(T(y,'tgt',idsFull))}`:''),null)));
  const s3F=T(y3,'sales',idsFull), s2F=T(y2,'sales',idsFull), s1F=T(y1,'sales',idsFull);
  const g32F=s2F>0?(s3F-s2F)/s2F:null;
  tl.append(tile(`Growth ${y3} vs ${y2}`,pct(g32F),`GAP ${s2F>0?compact(s3F-s2F):'—'}`,null,
    g32F==null?el('span',{class:'pill neu'},'—'):el('span',{class:'pill '+(g32F>=0?'ok':'bad')},g32F>=0?'Tumbuh':'Turun')));
  p.append(tl);
  const tl2=el('div',{class:'grid g4'});
  const g31F=s1F>0?(s3F-s1F)/s1F:null;
  tl2.append(tile(`Growth ${y3} vs ${y1}`,pct(g31F),`GAP ${s1F>0?compact(s3F-s1F):'—'}`,null,
    g31F==null?el('span',{class:'pill neu'},'—'):el('span',{class:'pill '+(g31F>=0?'ok':'bad')},g31F>=0?'Tumbuh':'Turun')));
  const daysF3=T(y3,'days',idsFull), tgtDaily3=daysF3>0?T(y3,'tgt',idsFull)/daysF3:null;
  tl2.append(tile(`Target harian ${y3}`,tgtDaily3!=null?compact(tgtDaily3):'—','rata² target per hari — target jendela ÷ jumlah hari jendela (same-window, mengikuti tgl buka toko)',null));
  const tgtF3=T(y3,'tgt',idsFull);
  tl2.append(tile(`Pencapaian thd target ${y3}`,pct(tgtF3>0?s3F/tgtF3:null),'sales same-window vs target same-window, toko dgn window valid thd '+y1,null));
  const aovYF=y=>{ const c=T(y,'trx',idsFull); return c>0?T(y,'val',idsFull)/c:null; };
  const aov3F=aovYF(y3), aov2F=aovYF(y2), aovGF=(aov3F!=null&&aov2F>0)?(aov3F-aov2F)/aov2F:null;
  tl2.append(tile(`AOV ${y3} vs ${y2}`,aov3F!=null?rp(aov3F):'—',aovGF!=null?`${aovGF>=0?'naik':'turun'} ${pct(Math.abs(aovGF))} dari AOV ${y2} (${aov2F!=null?rp(aov2F):'—'})`:'belum ada pembanding',
    null,aovGF==null?null:el('span',{class:'pill '+(aovGF>=0?'ok':'bad')},aovGF>=0?'Naik':'Turun')));
  p.append(tl2);

  /* round 17 item 1: tile tambahan "Toko ikut/tumbuh/turun" (round 12) dan "Rata² sales harian" (round 16)
     DIHAPUS dari sini — user melaporkan jumlah card SSSG kebanyakan & indikatornya tidak sama dengan H2H.
     SSSG sekarang berhenti PERSIS di 8 tile (2 baris × 4), sama persis jumlah & jenis indikatornya dengan
     H2H (Total sales y1/y2/y3 + Growth y3vsy2, lalu Growth y3vsy1 + Target harian + Pencapaian + AOV) —
     tidak ada tile tambahan lagi. Info "toko ikut" tetap tersirat dari subtitle tile Total Sales ("N toko
     same-window") dan dari baris warning di atas (toko yang tidak bisa dibandingkan pada cut-off ini);
     metrik rata-rata sales harian per permintaan user (item 2 round 16) TETAP ADA, tapi dipindah penuh ke
     tabel "Rata-rata Sales Harian per Toko" di bawah (lebih tepat sebagai tabel presisi per-toko daripada
     tile ringkasan yang menambah jumlah card). `avgDaily`/field `days` TIDAK dihapus — tetap dipakai oleh
     tabel tersebut. */

  /* ---------- chart per bulan same-window (idsY2) — pendekatan: pakai sales bulanan apa adanya (tanpa
     pecahan hari) utk visual tren, karena jendela awal tiap toko berbeda-beda sehingga sumbu bulan Jan–Des
     tidak lagi "jendela" yang sama literal; grafik ini jadi gambaran kasar, angka presisi ada di tabel. ---------- */
  const monSS=(y,set)=>MONTHS.map((_,i)=>S.dashAll.filter(r=>r.year===y&&r.month===i+1&&set.includes(r.store_id)).reduce((s,r)=>s+N(r.total_sales),0));
  const cols=['var(--s7)','var(--s2)','var(--s1)'];
  const serSS=[y1,y2,y3].map((y,i)=>({name:String(y),color:cols[i],vals:monSS(y,idsY2)}));
  p.append(chartCard('Sales per bulan, toko same-window ('+y2+' & '+y3+')','bulan kalender penuh (ilustratif) — angka jendela presisi per toko ada di tabel di bawah',
    el('div',{},legend(serSS),groupedBars(MON3,serSS,{h:300}))));

  /* ---------- Bulan demi bulan (same-window idsY2 & idsFull) — item 4: section yang ada di H2H tapi
     belum ada di SSSG. Dihitung dari sales kalender bulanan apa adanya (sama seperti chart di atas,
     bukan pecahan hari) karena jendela per-toko tidak selaras ke kalender Jan–Des yang sama. ---------- */
  {
    const serM={y1:monSS(y1,idsFull),y2:monSS(y2,idsY2),y3fory2:monSS(y3,idsY2),y3fory1:monSS(y3,idsFull)};
    const heads=[H('BULAN',{s:1}),H('SALES '+y1,{r:1}),H('SALES '+y2,{r:1}),H('SALES '+y3,{r:1}),H(`Δ ${y3} VS ${y2}`,{r:1}),H(`GAP ${y3}-${y2}`,{r:1}),H(`Δ ${y3} VS ${y1}`,{r:1}),H(`GAP ${y3}-${y1}`,{r:1})];
    const rows=MONTHS.map((mn,i)=>{ const a=serM.y1[i],b=serM.y2[i],c2=serM.y3fory2[i],c1=serM.y3fory1[i];
      if(!a&&!b&&!c2&&!c1) return null;
      return [mn,compact(a),compact(b),compact(c2),growthPill(c2,b),gapTxt(c2,b),growthPill(c1,a),gapTxt(c1,a)]; }).filter(Boolean);
    const totA=serM.y1.reduce((s,v)=>s+v,0), totB=serM.y2.reduce((s,v)=>s+v,0), totC2=serM.y3fory2.reduce((s,v)=>s+v,0), totC1=serM.y3fory1.reduce((s,v)=>s+v,0);
    p.append(card('Bulan demi bulan (same-window)','sales bulanan toko same-window — kolom '+y3+' vs '+y2+' pakai cakupan idsY2, kolom '+y3+' vs '+y1+' pakai cakupan idsFull (3 tahun penuh)',
      mkTable(heads,rows,['TOTAL (12 bln)',compact(totA),compact(totB),compact(totC2),growthPill(totC2,totB),gapTxt(totC2,totB),growthPill(totC1,totA),gapTxt(totC1,totA)])));
  }

  /* ---------- transaksi & AOV (same-window idsY2) — round 12: tambah Δ TRX/AOV y3 vs y1 (2024 vs 2026)
     langsung, dan kolom UPT (Unit Per Transaksi) dari item_rollup dimensi toko, jendela kalender
     pendekatan Jan–cut-off (sama seperti blok item sales same-window di bawah). ---------- */
  {
    const trxHost=el('div',{}); p.append(trxHost);
    trxHost.append(el('div',{class:'empty'},'Memuat Transaksi & AOV…'));
    (async()=>{
      let units={};
      try{
        const res=await Promise.all([y1,y2,y3].map(y=>rollup('store',y,1,cutoffM,{stores:idsAll,limit:60})));
        [y1,y2,y3].forEach((y,i)=>{ units[y]=new Map(res[i].map(r=>[r.k,r.qty])); });
      }catch(e){ [y1,y2,y3].forEach(y=>units[y]=new Map()); }
      trxHost.innerHTML='';
      const aov=(y,id)=>{ const c=G(y,id,'trx'); return c>0?G(y,id,'val')/c:null; };
      const upt=(y,id)=>{ const c=G(y,id,'trx'), u=units[y].get(names.get(id)); return (c>0&&u!=null)?u/c:null; };
      const uptTxt=v=>v==null?'—':v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
      const heads=[H('TOKO',{s:1}),...[y1,y2,y3].map(y=>H('TRX '+y,{r:1})),H(`Δ TRX ${y3}/${y2}`,{r:1}),H(`Δ TRX ${y3}/${y1}`,{r:1}),
        ...[y1,y2,y3].map(y=>H('AOV '+y,{r:1})),H(`Δ AOV ${y3}/${y2}`,{r:1}),H(`Δ AOV ${y3}/${y1}`,{r:1}),
        ...[y1,y2,y3].map(y=>H('UPT '+y,{r:1})),H(`Δ UPT ${y3}/${y2}`,{r:1})];
      const rows=idsY2.filter(id=>[y2,y3].some(y=>G(y,id,'trx')>0)).map(id=>[names.get(id),...[y1,y2,y3].map(y=>int(G(y,id,'trx'))),
        growthPill(G(y3,id,'trx'),G(y2,id,'trx')),growthPill(G(y3,id,'trx'),G(y1,id,'trx')),
        ...[y1,y2,y3].map(y=>rp(aov(y,id))),growthPill(aov(y3,id)||0,aov(y2,id)||0),growthPill(aov(y3,id)||0,aov(y1,id)||0),
        ...[y1,y2,y3].map(y=>uptTxt(upt(y,id))),growthPill(upt(y3,id)||0,upt(y2,id)||0)]);
      const aT=(y,set)=>{ const c=T(y,'trx',set); return c>0?T(y,'val',set)/c:null; };
      const uT=(y,set)=>{ const c=T(y,'trx',set); let u=0; set.forEach(id=>{ u+=units[y].get(names.get(id))||0; }); return c>0?u/c:null; };
      trxHost.append(card('Transaksi & AOV (same-window)',`${y1}/${y2}/${y3} · cut-off ${cf.label} · UPT = unit terjual ÷ jumlah transaksi`,
        mkTable(heads,rows,['TOTAL',...[y1,y2,y3].map(y=>int(T(y,'trx',idsY2))),growthPill(T(y3,'trx',idsY2),T(y2,'trx',idsY2)),growthPill(T(y3,'trx',idsY2),T(y1,'trx',idsY2)),
          ...[y1,y2,y3].map(y=>rp(aT(y,idsY2))),growthPill(aT(y3,idsY2)||0,aT(y2,idsY2)||0),growthPill(aT(y3,idsY2)||0,aT(y1,idsY2)||0),
          ...[y1,y2,y3].map(y=>uptTxt(uT(y,idsY2))),growthPill(uT(y3,idsY2)||0,uT(y2,idsY2)||0)])));

  /* ---------- item sales (same-window penuh, idsFull — angka konsisten 3 tahun; m1/m2 kalender penuh
     dipakai sbg pendekatan krn item_rollup tidak mendukung pecahan hari per toko). item 4: diperluas
     dari 2 dimensi (toko/kategori) ke 5 dimensi persis seperti H2H (toko/kategori/produk/warna/ukuran). ---------- */
  const host=el('div',{style:'display:flex;flex-direction:column;gap:18px'});

        arr.sort((a,b)=>(b[1][2]?.sales||0)-(a[1][2]?.sales||0));

        const rows=arr.slice(0,limit).map(([k,v])=>{ const n=v.map(x=>x?x.sales:0);

      };
      host.append(mk('store','Toko',k=>k,60));
      host.append(mk('category','Kategori',k=>k,40));
      host.append(mk('product','Produk',k=>k,60));
      host.append(mk('color','Warna',k=>colorChip(k),30));
      host.append(mk('size','Ukuran',k=>k,20));
    }catch(e){ host.innerHTML=''; host.append(el('div',{class:'note warn'},'Gagal memuat item sales: '+e.message)); }
  })();

/* =====================================================================
   PROGRAM SALES — round 17: kelompokkan beberapa kategori item jadi satu
   "program" (mis. Program Lebaran, Promo Akhir Tahun) dengan TARGET
   sendiri per bulan. Realisasi sales program TIDAK ditarik dari tabel
   baru — murni dijumlah dari sales item yang sudah ada (rollup kategori,
   fungsi yang sama dipakai H2H/SSSG/Item Sales), difilter ke kategori
   yang dipilih program itu. Halaman dilengkapi kartu & analisa H2H-style:
   tahun berjalan (h2hCurrentYear()) dibandingkan hingga 2 tahun sebelumnya,
   per bulan terpilih — pola & fungsi pembanding PERSIS sama dengan H2H
   (growthPill/gapTxt/mkTable dgn footer TOTAL), bukan logika baru.

   CATATAN PENTING (dicatat jujur, bukan disembunyikan): definisi program
   & targetnya idealnya disimpan di tabel khusus (mis. `sales_programs` +
   `sales_program_targets`, dengan unique(program_id,year,month) seperti
   pola channel_targets/kpi_weekly). Sesi yang mengerjakan round ini TIDAK
   kebagian akses tool database langsung (Supabase MCP menolak dgn
   "FGA Authentication Error. Unauthorized"), sehingga tabel baru itu
   TIDAK bisa dibuat. Sebagai solusi yang tetap berfungsi penuh hari ini,
   seluruh data program (nama, kategori, target per bulan) disimpan
   sebagai SATU blob JSON di `app_settings` (key 'sales_programs_json') —
   baca/tulisnya diisolasi lewat programsLoad()/programsSave() di bawah
   supaya kalau nanti akses tool database tersedia lagi, migrasi ke tabel
   sungguhan tinggal mengganti isi 2 fungsi ini saja, UI tidak perlu
   disentuh. Ini bukan batasan permanen, melainkan keterbatasan sesi ini. */
function programsLoad(){
  try{ const raw=S.settings&&S.settings.sales_programs_json; const arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr.map(pr=>({id:pr.id,name:pr.name,categories:Array.isArray(pr.categories)?pr.categories:[],targets:pr.targets||{}})):[]; }
  catch(e){ return []; }
}
async function programsSave(arr){ await DB.write('app_settings',[{key:'sales_programs_json',value:JSON.stringify(arr)}],'key'); S.settings.sales_programs_json=JSON.stringify(arr); }
async function programCategorySales(categories,year,m1,m2){
  const months=[]; for(let m=m1;m<=m2;m++) months.push(m);
  const perMonth=await Promise.all(months.map(m=>rollup('category',year,m,m,{})));
  return perMonth.map(rows=>rows.filter(r=>categories.includes(r.k)).reduce((s,r)=>s+r.sales,0));
}
/* Round 20: target program SEBELUMNYA selalu satu angka blended utk SELURUH program (kunci polos
   "tahun-bulan"), walau programnya punya beberapa kategori — tidak ada cara mengisi target terpisah per
   kategori ("masing2 punya target untuk dicapai", keluhan user). Diubah jadi kunci majemuk
   "KATEGORI|tahun-bulan" supaya tiap kategori di dalam satu program bisa punya target sendiri; migrasi
   data lama (kunci polos, dibuat sebelum round ini) ditangani oleh progCatTarget() sendiri — dibaca
   sebagai fallback HANYA kalau programnya memang cuma 1 kategori (supaya tidak salah assign ke kategori
   yang keliru pada program multi-kategori lama, yang sebelum round ini memang tidak pernah mendukung
   per-kategori sama sekali). Target per-bulan (fungsi tgtOf di renderProgram) menjumlah progCatTarget()
   di semua kategori program, jadi "Target {y3}" tile/kolom TOTAL otomatis tetap benar tanpa perlu
   disentuh — hanya sumber datanya yang sekarang per-kategori. */
function progCatTarget(targetsObj,prog,cat,y,m){
  const t=targetsObj||{};
  const k=cat+'|'+y+'-'+m;
  if(t[k]!=null && t[k]!=='') return N(t[k]);
  if(prog.categories.length===1){ const legacy=t[y+'-'+m]; if(legacy!=null && legacy!=='') return N(legacy); }
  return 0;
}
function renderProgram(){
  parkFilters();
  const p=$('#p-program'); p.innerHTML='';
  const programs=programsLoad();
  const y3=h2hCurrentYear(), y2=y3-1, y1=y3-2, years=[y1,y2,y3];
  if(!S.programSel||!programs.find(pr=>pr.id===S.programSel)) S.programSel=programs.length?programs[0].id:null;
  if(!S.programM1) S.programM1=1;
  if(!S.programM2) S.programM2=lastMonthWithData(y3);

  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Program Sales'),
    el('p',{},`Kelompokkan kategori produk jadi program bertarget sendiri — realisasi ditarik dari sales item yang sudah ada by kategori. Dibandingkan thd tahun berjalan ${y3} vs hingga 2 tahun sebelumnya (${y1}/${y2}), persis seperti H2H.`))));
  const pf_prog=pageFilterBar('program'); if(pf_prog) p.append(pf_prog);
  if(S.demo) p.append(demoBanner());

  /* ---------- kelola program: buat baru ---------- */
  const mgCard=el('div',{class:'card'});
  mgCard.append(el('header',{},el('h2',{},'Buat Program Baru'),el('span',{class:'sub'},programs.length+' program terdaftar')));
  const nameIn=el('input',{type:'text',placeholder:'mis. Program Lebaran 2026',style:'min-width:240px'});
  /* Round 18: daftar kategori diganti dari chip-toggle (bisa jadi deretan tombol sangat panjang kalau
     kategori banyak) jadi dropdown multi-select reusable (multiSelectDropdown — sama dengan filter
     Brand/SPV/Toko), lebih rapi dan sudah otomatis dapat kotak cari begitu kategori >6. */
  const catState=[];
  const catHostWrap=el('div',{class:'fld',style:'min-width:220px'},el('label',{},'Kategori'),
    el('div',{},el('span',{class:'sub'},'Memuat daftar kategori…')));
  (async()=>{
    const cats=await itemCategoryList();
    const catDiv=el('div');
    catHostWrap.lastChild.replaceWith(catDiv);
    if(!cats.length){ catDiv.append(el('span',{class:'sub'},'Belum ada kategori item pada data.')); return; }
    multiSelectDropdown(catDiv, cats.map(c=>({value:c,label:c})), catState, arr=>{ catState.length=0; catState.push(...arr); },
      {allLabel:'Pilih kategori',allowAll:false});
  })();
  mgCard.append(el('div',{class:'rowline',style:'flex-wrap:wrap;align-items:flex-end'},
    el('div',{class:'fld'},el('label',{},'Nama program'),nameIn),
    catHostWrap,
    el('button',{class:'btn pri',onclick:async()=>{
      if(guard()) return;
      if(!nameIn.value.trim()){ toast('Isi nama programnya dulu.'); return; }
      if(!catState.length){ toast('Pilih minimal 1 kategori di atas.'); return; }
      const arr=programsLoad();
      arr.push({id:'pr'+Date.now(),name:nameIn.value.trim(),categories:[...catState],targets:{}});

      /* Round 20: tgtOf() sekarang menjumlah target PER KATEGORI (progCatTarget) di seluruh kategori

      const tgtOf=(y,m)=>prog.categories.reduce((s,c)=>s+progCatTarget(prog.targets,prog,c,y,m),0);

        host.append(card('Bulan demi bulan',ymLabel(y1,m1,m2)+' · '+ymLabel(y2,m1,m2)+' · '+ymLabel(y3,m1,m2),

      /* ---------- per kategori (kalau program punya >1 kategori) ----------

      if(prog.categories.length>1){
        const perCatYear={};
        await Promise.all(years.map(async y=>{
          const rows=await rollup('category',y,m1,m2,{});
          perCatYear[y]=new Map(rows.map(r=>[r.k,r.sales]));
        }));
        const catTgtY3=c=>monthsArr.reduce((s,m)=>s+progCatTarget(prog.targets,prog,c,y3,m),0);
        const heads=[H('KATEGORI',{s:1}),...years.map(y=>H(String(y),{r:1})),H(`Δ ${y3} VS ${y2}`,{r:1}),H(`GAP ${y3}-${y2}`,{r:1}),H(`Δ ${y3} VS ${y1}`,{r:1}),H(`GAP ${y3}-${y1}`,{r:1}),H(`TARGET ${y3}`,{r:1}),H(`ACHIEV ${y3}`,{r:1}),H('PORSI '+y3,{r:1})];
        const catRows=prog.categories.map(c=>{ const v=years.map(y=>N(perCatYear[y].get(c))); const t=catTgtY3(c);
          return [c,...v.map(x=>compact(x)),growthPill(v[2],v[1]),gapTxt(v[2],v[1]),growthPill(v[2],v[0]),gapTxt(v[2],v[0]),compact(t),pillCell(t>0?v[2]/t:null),pct(s3?v[2]/s3:null)]; })
          .sort((ra,rb)=>N(rb[3].props?.['data-v'])-N(ra[3].props?.['data-v']));
        host.append(card('Per kategori',`Rincian sales program per kategori, lengkap target & achievement masing-masing (${years.join('/')})`,
          mkTable(heads,catRows,
            ['TOTAL',...years.map(y=>compact(totY(y))),growthPill(s3,s2),gapTxt(s3,s2),growthPill(s3,s1),gapTxt(s3,s1),compact(t3),pillCell(t3>0?s3/t3:null),pct(1)])));
      }

      /* ---------- target per bulan — editable, 3 tahun sekaligus (y1/y2/y3), disimpan ke blob JSON program
         Round 19: tabel 12-baris diganti dropdown "Bulan" — hanya SATU baris input per bulan yang tampil
         sekaligus, draft disimpan di memori supaya pindah bulan tidak membuang input yang belum Simpan.
         Round 20: SEBELUMNYA satu baris input itu cuma 1 target blended utk SELURUH program — tidak bisa
         dipisah per kategori saat program punya >1 kategori (keluhan user "masing² punya target untuk
         dicapai"). Sekarang, kalau program punya >1 kategori, baris input digandakan per kategori (satu
         grup input per kategori, label namanya di atas) untuk bulan yang sama; kunci draft memakai format
         majemuk "KATEGORI|tahun-bulan" (lihat progCatTarget()) — utk program 1-kategori tetap cukup satu
         grup input saja (UI tidak berubah dari sebelumnya), migrasi data lama ditangani progCatTarget()
         sendiri saat draft di-inisialisasi di bawah. ---------- */
      {
        /* migrasi: draft SELALU memakai kunci majemuk kategori|tahun-bulan; kunci lama (polos, dari
           sebelum round 20, hanya mungkin ada pada program 1-kategori) disalin ke kunci baru di sini —
           sekali disimpan ulang lewat tombol "Simpan target", kunci lama otomatis tidak terpakai lagi. */
        const draft={};
        Object.keys(prog.targets||{}).forEach(k=>{ if(k.includes('|')) draft[k]=prog.targets[k]; });
        if(prog.categories.length===1){
          const cat=prog.categories[0];
          Object.keys(prog.targets||{}).forEach(k=>{
            if(!k.includes('|')){ const nk=cat+'|'+k; if(draft[nk]==null) draft[nk]=prog.targets[k]; }
          });
        }
        const nowM=new Date().getMonth()+1;
        let curM=monthsArr.includes(nowM)?nowM:monthsArr[0];
        const mSelTgt=el('select',{},...monthsArr.map(m=>el('option',{value:m},MONTHS[m-1])));
        mSelTgt.value=String(curM);
        const rowHost=el('div',{style:'display:flex;flex-direction:column;gap:12px'});
        const filledHost=el('div',{class:'sub',style:'margin-top:10px'});
        function paintFilled(){
          const withVal=monthsArr.filter(m=>prog.categories.some(c=>years.some(y=>{ const v=draft[c+'|'+y+'-'+m]; return v!=null&&v!==''; })));
          filledHost.textContent=withVal.length?('Bulan sudah terisi: '+withVal.map(m=>MONTHS[m-1]).join(', ')):'Belum ada bulan yang diisi.';
        }
        function paintRow(){
          rowHost.innerHTML='';
          prog.categories.forEach(cat=>{
            const grp=el('div',{style:'display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end'});
            if(prog.categories.length>1) grp.append(el('div',{class:'fld',style:'min-width:150px'},el('label',{},'Kategori'),el('div',{style:'font-weight:700;padding:7px 0'},cat)));
            years.forEach(y=>{
              const key=cat+'|'+y+'-'+curM;
              const inp=el('input',{type:'number',min:'0',value:draft[key]!=null?draft[key]:'',style:'width:150px',
                oninput:e=>{ const v=e.target.value; if(v==='') delete draft[key]; else draft[key]=N(v); paintFilled(); }});
              grp.append(el('div',{class:'fld'},el('label',{},'Target '+y),inp));
            });
            rowHost.append(grp);
          });
        }
        mSelTgt.onchange=e=>{ curM=Number(e.target.value); paintRow(); };
        paintRow(); paintFilled();
        host.append(card('Target per bulan',(prog.categories.length>1?'Target dipisah per kategori — ':'')+'pilih bulan, isi target per tahun, lalu Simpan — dipakai utk kolom ACHIEV di tabel di atas (tahun berjalan '+y3+').',
          el('div',{style:'display:flex;flex-direction:column;gap:4px'},
            el('div',{class:'fld',style:'max-width:220px'},el('label',{},'Bulan'),mSelTgt),
            rowHost, filledHost),
          el('div',{class:'rowline',style:'margin-top:13px'},
            el('button',{class:'btn pri',onclick:async()=>{
              if(guard()) return;
              const arr=programsLoad(); const target=arr.find(pr=>pr.id===prog.id); if(!target) return;
              target.targets=draft;
              try{ await programsSave(arr); toast('Target disimpan.'); renderProgram(); }catch(e){ toast('Gagal: '+e.message); } }},'Simpan target'))));
      }
    }catch(e){ host.innerHTML=''; host.append(el('div',{class:'note warn'},'Gagal memuat realisasi sales program: '+e.message)); }
  })();
}

/* =====================================================================
   MARKETPLACE — Shopee & TikTok dari Sales Type
   ===================================================================== */
function mktChannels(){
  const set=new Set(['SHOPEE','TIKTOK']);
  S.map.forEach(m=>{ if(m.channel) set.add(String(m.channel).toUpperCase()); });
  S.mkt.forEach(r=>set.add(r.channel)); S.chanTargets.forEach(t=>set.add(String(t.channel).toUpperCase()));
  return [...set];
}
function mktRows(year,m1,m2,ch){
  return S.mkt.filter(r=>r.year===year&&r.month>=m1&&r.month<=m2&&(!ch||r.channel===ch)&&storeOk(r.store_id));
}
function chanTarget(ch,year,m1,m2){
  const ids=scopeStoreIds();
  const all=S.chanTargets.filter(t=>String(t.channel).toUpperCase()===ch&&t.year===year&&t.month>=m1&&t.month<=m2);
  if(ids) return all.filter(t=>t.store_id!=null&&ids.includes(t.store_id)).reduce((s,t)=>s+N(t.target),0);
  const overall=all.filter(t=>t.store_id==null).reduce((s,t)=>s+N(t.target),0);
  return overall||all.reduce((s,t)=>s+N(t.target),0);
}
/* round 17: channel 'MARKETPLACE' (bucket generik round 10) sudah dinormalisasi jadi SHOPEE di loadAll()
   (lihat normCh di sana) sehingga tidak akan pernah muncul sebagai channel tersendiri lagi di sini — entri
   MARKETPLACE di peta warna ini dipertahankan hanya sebagai jaga-jaga (fallback warna, tidak pernah
   dipakai dalam alur normal) dan BUKAN lagi channel yang dipilih user; opsi dropdown-nya sudah dihapus. */
const CH_COLOR={SHOPEE:'var(--s2)',TIKTOK:'var(--s5)',TOKOPEDIA:'var(--s3)',LAZADA:'var(--s7)',MARKETPLACE:'var(--s6)'};
function renderMkt(){
  parkFilters();
  const p=$('#p-mkt'); p.innerHTML='';
  const [m1,m2]=periodM1M2(S.year);
  const chs=mktChannels();
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Marketplace'),
    el('p',{},'Penjualan Shopee & TikTok dari kolom Sales Type, pencapaian dan analisisnya per channel. '+
      ymLabel(S.year,m1,m2)+' · '+periodLabel().split(' · ').slice(1).join(' · ')))));
  const pf_mkt=pageFilterBar('mkt'); if(pf_mkt) p.append(pf_mkt);
  if(S.demo) p.append(demoBanner());
  const tot=y=>mktRows(y,m1,m2).reduce((s,r)=>s+N(r.amount),0);
  const allSales=S.dash.filter(r=>r.month>=m1&&r.month<=m2&&storeOk(r.store_id)).reduce((s,r)=>s+N(r.total_sales),0);
  if(!S.mkt.length) p.append(el('div',{class:'note warn'},el('b',{},'Belum ada penjualan marketplace pada data. '),
    'Sales Type yang namanya mengandung Shopee atau Tiktok otomatis dikenali. Tipe lain (mis. Tokopedia, Lazada) bisa ditandai di Pengaturan → Database Sales Type → kolom Channel.'));

  /* Round 18: SEBELUMNYA dibatasi tepat 4 tile (Total/Growth/Channel terbaik + maks 2 channel lain) —
     begitu channel bertambah dari 2 default (Shopee/Tiktok) jadi 3-4 (Tokopedia/Lazada, round 17 item 3
     menyebut "bisa ditambah nantinya"), channel ke-3/4 tidak pernah tampil di tile sama sekali walau
     datanya ada. Sekarang: 3 tile ringkasan (Total/Growth/Channel terbaik) LALU satu tile per channel
     yang BENAR-BENAR ada datanya (tanpa dibatasi jumlahnya) — grid g4 otomatis membungkus ke baris baru,
     jadi selalu lengkap sesuai channel yang tersedia. */
  const tl=el('div',{class:'grid g4 gauto'});
  const totCy=tot(S.year), totPy=tot(S.year-1);
  const mktGrowth=totPy>0?(totCy-totPy)/totPy:null;
  const chTotals=chs.map(ch=>({ch,s:mktRows(S.year,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0)})).sort((a,b)=>b.s-a.s);
  const bestCh=chTotals[0];
  tl.append(tile('Total marketplace',compact(totCy),`${pct(allSales?totCy/allSales:null)} dari total sales toko`,null));
  tl.append(tile(`Growth vs ${S.year-1}`, mktGrowth!=null?pct(mktGrowth):'—',
    mktGrowth!=null?(mktGrowth>=0?'naik':'turun')+' dibanding tahun lalu':`belum ada data ${S.year-1}`, mktGrowth!=null?(mktGrowth>=0?1:0):null));
  if(bestCh&&bestCh.s>0) tl.append(tile('Channel terbaik',bestCh.ch,`${compact(bestCh.s)} · ${pct(totCy?bestCh.s/totCy:null)} dari total marketplace`,null));
  chTotals.forEach(({ch,s})=>{
    const t=chanTarget(ch,S.year,m1,m2);
    tl.append(tile(ch,compact(s),t>0?`target ${compact(t)} · GAP ${compact(s-t)}`:(s>0?'target belum diisi (lihat bawah)':'belum ada data pada periode ini'),t>0?s/t:null));
  });
  p.append(tl);

  /* ringkasan + analisis per channel */
  const sumHeads=[H('CHANNEL',{s:1}),H('SALES',{r:1}),H('TARGET',{r:1}),H('ACHIEV',{r:1}),H('GAP',{r:1}),H('TRANSAKSI',{r:1}),H('AOV',{r:1}),
    H(`SALES ${S.year-1}`,{r:1}),H('GROWTH',{r:1}),H('GAP GROWTH',{r:1}),H('PORSI THD TOTAL',{r:1})];
  const chSales=ch=>mktRows(S.year,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0);
  const chsSorted=chs.slice().sort((a,b)=>chSales(b)-chSales(a));   // item 8: diurutkan sales terbesar→terkecil
  const maxChSales=chsSorted.length?chSales(chsSorted[0]):0;
  const sumRows=chsSorted.map(ch=>{ const rr=mktRows(S.year,m1,m2,ch), s=rr.reduce((a,r)=>a+N(r.amount),0), c=rr.reduce((a,r)=>a+N(r.trx),0);
    const t=chanTarget(ch,S.year,m1,m2), py=mktRows(S.year-1,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0);
    return [ch,magCell(s,maxChSales,compact(s)),t>0?compact(t):'—',pillCell(t>0?s/t:null),t>0?compact(s-t):'—',int(c),c>0?rp(s/c):'—',py>0?compact(py):'',growthPill(s,py),gapTxt(s,py),pct(allSales?s/allSales:null)]; });
  p.append(card('Pencapaian per channel',ymLabel(S.year,m1,m2)+' · diurutkan sales terbesar→terkecil',mkTable(sumHeads,sumRows)));

  /* grafik per bulan per channel — round 7 item 6: SEBELUMNYA ditaruh dalam grid 2 kolom (g2) sehingga
     tiap chart groupedBars() tampil ±separuh lebar (teks/bar jadi kecil) dibanding chart H2H sepenuh-lebar
     yang memakai fungsi SAMA. Sekarang ditumpuk satu per baris, selebar card, agar ukurannya sepadan. */
  /* round 9 item 5: bar Sales/Target + garis Achievement digabung dalam SATU chart (comboBarsLine),
     bukan dua elemen (groupedBars + lineChart) ditumpuk seperti sebelumnya. */
  /* Round 18: sebelumnya dibatasi `.slice(0,2)` (cuma 2 chart teratas) — sekarang tampilkan chart utk
     SEMUA channel yang punya data pada tahun ini ATAU tahun lalu (bukan cuma 2 teratas tahun ini),
     supaya channel baru (Tokopedia/Lazada dkk) tetap kebagian analisisnya begitu datanya ada. */
  chsSorted.filter(ch=>chSales(ch)>0||mktRows(S.year-1,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0)>0).forEach(ch=>{
    const sales=MONTHS.map((_,i)=>mktRows(S.year,i+1,i+1,ch).reduce((a,r)=>a+N(r.amount),0));
    const tg=MONTHS.map((_,i)=>chanTarget(ch,S.year,i+1,i+1));
    const ser=[{name:'Sales',color:CH_COLOR[ch]||'var(--s1)',vals:sales},{name:'Target',color:'var(--grid)',vals:tg}];
    const ach=MONTHS.map((_,i)=>tg[i]>0&&sales[i]>0?sales[i]/tg[i]:null);
    const wrap=el('div',{},
      el('div',{style:'display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px'},
        legend(ser), el('span',{class:'sub'},'— ● Achievement (garis, sumbu kanan %)')),
      comboBarsLine(MON3,ser,ach,{h:320,lineRef:1,lineColor:CH_COLOR[ch]==='var(--s7)'?'var(--s1)':'var(--s7)',lineName:'Achievement'}),
      el('div',{class:'sub',style:'margin-top:4px'},'Sumbu kiri: Rp (batang Sales/Target) · Sumbu kanan: % (garis Achievement, titik putus = bulan tanpa sales/target)'));
    p.append(chartCard(ch+' — sales, target & achievement per bulan',S.year,wrap));
  });

  /* analisis otomatis */
  const notes=[];
  chs.forEach(ch=>{
    const rr=mktRows(S.year,m1,m2,ch); const s=rr.reduce((a,r)=>a+N(r.amount),0);
    if(!s) return;
    const byS=new Map(); rr.forEach(r=>byS.set(r.store_name,(byS.get(r.store_name)||0)+N(r.amount)));
    const best=[...byS.entries()].sort((a,b)=>b[1]-a[1])[0];
    const byM=new Map(); rr.forEach(r=>byM.set(r.month,(byM.get(r.month)||0)+N(r.amount)));
    const bm=[...byM.entries()].sort((a,b)=>b[1]-a[1])[0];
    const t=chanTarget(ch,S.year,m1,m2), py=mktRows(S.year-1,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0);
    const mths=byM.size||1;
    notes.push(el('div',{class:'item'},el('div',{class:'t'},ch+' · '+compact(s)),
      el('div',{class:'c'},`Kontribusi terbesar dari ${best[0]} (${pct(best[1]/s)}). Bulan terbaik ${MONTHS[bm[0]-1]} (${compact(bm[1])}). `+
        `Rata-rata ${compact(s/mths)} per bulan berjalan`+(m2<12?`, proyeksi setahun ±${compact(s/mths*12)}`:'')+'. '+
        (t>0?`Pencapaian ${pct(s/t)} dari target ${compact(t)} (GAP ${compact(s-t)}). `:'Target belum diisi. ')+
        (py>0?`Dibanding ${S.year-1}: ${s>=py?'naik':'turun'} ${pct(Math.abs((s-py)/py),0)}.`:`Belum ada pembanding ${S.year-1}.`))));
  });
  if(notes.length) p.append(card('Analisis marketplace','dihitung otomatis dari data pada filter aktif',el('div',{style:'display:flex;flex-direction:column;gap:9px'},...notes)));

  /* per toko x channel */
  {
    const stores=[...new Set(mktRows(S.year,m1,m2).map(r=>r.store_name))]
      .sort((a,b)=>mktRows(S.year,m1,m2).filter(r=>r.store_name===b).reduce((s,r)=>s+N(r.amount),0)-mktRows(S.year,m1,m2).filter(r=>r.store_name===a).reduce((s,r)=>s+N(r.amount),0));  // item 8: diurutkan total marketplace terbesar→terkecil
    const heads=[H('TOKO',{s:1}),...chs.flatMap(ch=>[H(ch+' SALES',{r:1}),H(ch+' TRX',{r:1})]),H('TOTAL MARKETPLACE',{r:1}),H('PORSI THD SALES TOKO',{r:1})];
    const totals=stores.map(n=>mktRows(S.year,m1,m2).filter(r=>r.store_name===n).reduce((a,r)=>a+N(r.amount),0));
    const maxStoreMkt=Math.max(0,...totals);
    const rows=stores.map((n,i)=>{ const cells=chs.flatMap(ch=>{ const rr=mktRows(S.year,m1,m2,ch).filter(r=>r.store_name===n);
        return [compact(rr.reduce((a,r)=>a+N(r.amount),0)),int(rr.reduce((a,r)=>a+N(r.trx),0))]; });
      const tt=totals[i];
      const ss=S.dash.filter(r=>r.store_name===n&&r.month>=m1&&r.month<=m2).reduce((a,r)=>a+N(r.total_sales),0);
      return [n,...cells,magCell(tt,maxStoreMkt,compact(tt)),pct(ss?tt/ss:null)]; });
    p.append(card('Marketplace per toko',ymLabel(S.year,m1,m2)+' · diurutkan total marketplace terbesar→terkecil',mkTable(heads,rows)));
  }
  /* per bulan */
  {
    const heads=[H('BULAN',{s:1}),...chs.flatMap(ch=>[H(ch+' SALES',{r:1}),H(ch+' TARGET',{r:1}),H(ch+' ACHIEV',{r:1})]),H('TOTAL',{r:1})];
    const rows=MONTHS.map((mn,i)=>{ const cells=chs.flatMap(ch=>{ const s=mktRows(S.year,i+1,i+1,ch).reduce((a,r)=>a+N(r.amount),0), t=chanTarget(ch,S.year,i+1,i+1);
        return [compact(s),t>0?compact(t):'—',pillCell(t>0&&s>0?s/t:null)]; });
      return [mn,...cells,compact(mktRows(S.year,i+1,i+1).reduce((a,r)=>a+N(r.amount),0))]; });
    p.append(card('Marketplace per bulan',String(S.year),mkTable(heads,rows)));
  }

  /* editor target */
  const ed=el('div',{class:'card'});
  ed.append(el('header',{},el('h2',{},'Target marketplace '+S.year),el('span',{class:'sub'},'target keseluruhan per channel per bulan (Rp); kosongkan bila tidak ada')));
  const inputs={};
  const tb=el('tbody');
  chs.forEach(ch=>{
    const tr=el('tr',{},el('td',{class:'sticky1',style:'font-weight:700'},ch));
    MONTHS.forEach((_,i)=>{ const cur=S.chanTargets.find(t=>String(t.channel).toUpperCase()===ch&&t.year===S.year&&t.month===i+1&&t.store_id==null);
      const inp=el('input',{type:'number',min:'0',step:'1000',value:cur?String(Math.round(N(cur.target))):'',style:'width:104px'}); inputs[ch+'|'+(i+1)]=inp; tr.append(el('td',{},inp)); });
    tb.append(tr); });
  ed.append(el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},[H('CHANNEL'),...MON3.map(m=>H(m))].map((h,i)=>el('th',{class:i===0?'sticky1':''},h.t)))),tb)));
  ed.append(el('div',{class:'rowline',style:'margin-top:12px'},el('button',{class:'btn pri',onclick:async()=>{
    if(guard()) return;
    try{
      for(const ch of chs) for(let m=1;m<=12;m++){ const v=inputs[ch+'|'+m].value;
        await DB.del('channel_targets',`channel=eq.${encodeURIComponent(ch)}&year=eq.${S.year}&month=eq.${m}&store_id=is.null`);
        if(v!==''&&N(v)>0) await DB.write('channel_targets',[{channel:ch,store_id:null,year:S.year,month:m,target:N(v)}]); }
      toast('Target marketplace tersimpan.'); await loadAll();
    }catch(e){ toast('Gagal: '+e.message); } }},'Simpan target')));
  p.append(ed);
  p.append(el('div',{class:'note'},el('b',{},'Catatan. '),'Penjualan marketplace tetap ikut dalam total sales toko (Sales Type Shopee/Tiktok terpetakan ke segmen User). '+
    'Halaman ini hanya memisahkannya untuk dianalisis. Channel tiap Sales Type diatur di Pengaturan → Database Sales Type.'));
}

/* =====================================================================
   TRACKING DATA — status ingest per toko×bulan & deteksi anomali (round 9 item 4)
   ===================================================================== */
function dtStores(){ return S.stores.filter(s=>s.name!=='DC TIGALAPAN'); }   // DC bukan toko ritel, dikecualikan
function dtStatus(store,year,month,row,todayY,todayM){
  if(store.opening_date){
    const d=new Date(store.opening_date+'T00:00:00');
    if(!isNaN(d) && (year<d.getFullYear() || (year===d.getFullYear() && month<d.getMonth()+1))) return 'closed';   // belum buka
  }
  const sales=N(row&&row.total_sales);
  if(sales>0) return 'ok';
  const isFuture = year>todayY || (year===todayY && month>todayM);
  if(isFuture) return 'future';                      // belum waktunya
  return 'missing';                                   // kosong — sudah lewat tapi tak ada data
}
const DT_STATUS_LABEL={ok:'Ada data',missing:'Kosong',future:'Belum waktunya',closed:'Belum buka'};
const DT_STATUS_CLASS={ok:'ok',missing:'bad',future:'neu',closed:'neu'};
function renderDataTrack(){
  parkFilters();
  const p=$('#p-datatrack'); p.innerHTML='';
  const today=new Date(), todayY=today.getFullYear(), todayM=today.getMonth()+1;
  /* round 10 item 6: tampilkan hingga 3 tahun sekaligus. Kalau filter Tahun global cuma 1 nilai (biasa),
     default-nya [tahun-2, tahun-1, tahun] — kalau user multi-select Tahun lewat chip atas, hormati pilihan
     itu persis (tidak dipaksa -2/-1). */
  const years=(S.years&&S.years.length>1)?S.years.slice().sort((a,b)=>a-b):[S.year-2,S.year-1,S.year];
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Tracking Data'),
    el('p',{},`Status kelengkapan data per toko × bulan, dan deteksi anomali otomatis. Tahun ${years.join(', ')} · per ${today.toLocaleDateString('id-ID',{dateStyle:'long'})}.`))));
  const pf=pageFilterBar('datatrack'); if(pf) p.append(pf);
  if(S.demo) p.append(demoBanner());

  const stores=dtStores();
  const mFilter=S.month||0;    // 0 = semua bulan (filter ini hanya menyaring tabel anomali/ingest log)

  /* ---------- cakupan + anomali, dihitung per tahun yang ditampilkan ---------- */
  const perYear=years.map(year=>{
    const dashByKey=new Map(S.dashAll.filter(r=>r.year===year).map(r=>[r.store_id+'|'+r.month,r]));
    const trxByKey=new Map(S.trxAll.filter(r=>r.year===year).map(r=>[r.store_id+'|'+r.month,r]));
    const cells=[];
    stores.forEach(st=>{ for(let m=1;m<=12;m++){
      cells.push({store:st,month:m,status:dtStatus(st,year,m,dashByKey.get(st.id+'|'+m),todayY,todayM)});
    }});
    const anoms=[];
    stores.forEach(st=>{
      const aovHist=[];
      for(let m=1;m<=12;m++){
        const st_=dtStatus(st,year,m,dashByKey.get(st.id+'|'+m),todayY,todayM);
        if(st_==='closed'||st_==='future') continue;
        const row=dashByKey.get(st.id+'|'+m), trxRow=trxByKey.get(st.id+'|'+m);
        const sales=N(row&&row.total_sales), target=N(row&&row.target_total);
        const ym=MON3[m-1]+' '+year;
        if(target>0 && sales>0){ const ach=sales/target;
          if(ach<0.1) anoms.push({store:st.name,ym,year,month:m,metric:'Achievement',value:pct(ach),
            note:`Sales hanya ${pct(ach)} dari target (${compact(sales)} vs target ${compact(target)}) — jauh di bawah wajar, kemungkinan data belum lengkap masuk.`});
          else if(ach>3) anoms.push({store:st.name,ym,year,month:m,metric:'Achievement',value:pct(ach),
            note:`Sales ${pct(ach)} dari target (${compact(sales)} vs target ${compact(target)}) — 300%+ dari target, cek apakah target salah input.`});
        }
        if(m>1){ const prevRow=dashByKey.get(st.id+'|'+(m-1)), prev=N(prevRow&&prevRow.total_sales);
          if(prev>0 && sales>=0){ const chg=(sales-prev)/prev;
            if(chg<-0.7) anoms.push({store:st.name,ym,year,month:m,metric:'MoM sales',value:pct(chg),
              note:`Sales turun ${pct(Math.abs(chg))} dari bulan sebelumnya (${compact(prev)} → ${compact(sales)}) — turun drastis, cek apakah data bulan ini sudah lengkap.`});
            else if(chg>3) anoms.push({store:st.name,ym,year,month:m,metric:'MoM sales',value:'+'+pct(chg),
              note:`Sales naik ${pct(chg)} dari bulan sebelumnya (${compact(prev)} → ${compact(sales)}) — lonjakan tajam, cek kemungkinan duplikasi data.`});
          }
        }
        if(trxRow && N(trxRow.jumlah_transaksi)>0){
          const aov=N(trxRow.nilai_transaksi)/N(trxRow.jumlah_transaksi);
          if(aovHist.length>=2){ const avg=aovHist.reduce((a,b)=>a+b,0)/aovHist.length;
            if(avg>0 && (aov>avg*2.5||aov<avg*0.4)) anoms.push({store:st.name,ym,year,month:m,metric:'AOV',value:rp(aov),
              note:`AOV ${rp(aov)} jauh berbeda dari rata² toko ini (${rp(avg)}) — kemungkinan salah input nilai/jumlah transaksi.`});
          }
          aovHist.push(aov);
        }
        const trxCount=N(trxRow&&trxRow.jumlah_transaksi);
        if(sales>0 && trxCount===0) anoms.push({store:st.name,ym,year,month:m,metric:'Konsistensi',value:compact(sales),
          note:`Ada sales (${compact(sales)}) tapi jumlah transaksi tercatat 0 — data Sales Type & Transaksi tidak sinkron.`});
        else if(sales===0 && trxCount>0) anoms.push({store:st.name,ym,year,month:m,metric:'Konsistensi',value:int(trxCount)+' trx',
          note:`Ada ${int(trxCount)} transaksi tercatat tapi sales 0 — data Sales Type & Transaksi tidak sinkron.`});
      }
    });
    return {year,cells,anoms};
  });
  const allAnoms=perYear.flatMap(y=>y.anoms).filter(a=>!mFilter||a.month===mFilter);
  const allExpected=perYear.flatMap(y=>y.cells.filter(c=>c.status==='ok'||c.status==='missing'));
  const allCovered=allExpected.filter(c=>c.status==='ok');
  const lastLog=S.logs[0];   // sudah terurut created_at.desc dari loadAll()

  /* ---------- tiles ringkasan (gabungan semua tahun yang ditampilkan) ---------- */
  const tl=el('div',{class:'grid g4'});
  tl.append(tile('Cakupan data',allExpected.length?pct(allCovered.length/allExpected.length):'—',
    `${int(allCovered.length)} dari ${int(allExpected.length)} toko×bulan terisi · ${years.join('/')}`,allExpected.length?allCovered.length/allExpected.length:null));
  tl.append(tile('Toko×bulan hilang',int(allExpected.length-allCovered.length),'sudah lewat tanggalnya tapi belum ada sales',null,
    el('span',{class:'pill '+((allExpected.length-allCovered.length)>0?'bad':'ok')},(allExpected.length-allCovered.length)>0?'Perlu dicek':'Lengkap')));
  tl.append(tile('Sinkron terakhir',lastLog?new Date(lastLog.created_at).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}):'—',
    lastLog?lastLog.file_name:'belum ada riwayat upload',null));
  tl.append(tile('Anomali terdeteksi',int(allAnoms.length),'dari achievement, MoM, AOV & konsistensi'+(mFilter?' · '+MONTHS[mFilter-1]:''),null,
    el('span',{class:'pill '+(allAnoms.length?'bad':'ok')},allAnoms.length?'Ada temuan':'Bersih')));
  p.append(tl);

  /* ---------- matriks cakupan — satu kartu per tahun, Jan–Des penuh (round 10 item 6) ---------- */
  perYear.forEach(({year,cells})=>{
    const heads=[H('TOKO',{s:1}),...MON3.map(m=>H(m,{r:1}))];
    const rows=stores.map(st=>{
      const rowCells=[st.name];
      for(let m=1;m<=12;m++){ const c=cells.find(c=>c.store.id===st.id&&c.month===m);
        rowCells.push(el('span',{class:'pill '+DT_STATUS_CLASS[c.status]+(mFilter&&mFilter===m?' mid':'')},DT_STATUS_LABEL[c.status])); }
      return rowCells;
    });
    p.append(card(`Matriks cakupan per toko × bulan — ${year}`,`Ada data = sales>0 · Kosong = sudah lewat tapi belum ada sales · Belum buka = sebelum opening_date toko · Belum waktunya = bulan di masa depan`,
      mkTable(heads,rows)));
  });

  /* ---------- item 5 (ronde ini): cakupan per JENIS DATA upload (Item Sales / Sales Type / Transaksi),
     bukan cuma gabungannya seperti matriks sales di atas. Item Sales & Sales Type dicek dari riwayat
     ingest_log (yang menyimpan store_id/year/month per upload); Transaksi dicek dari data aktualnya
     (S.trxAll) karena upload Transaksi bisa satu file gabungan tanpa store/periode di ingest_log itu
     sendiri. "Lainnya" (Target, Master produk/DATABASE STOCK, Database Sales Type) bukan data per
     toko×bulan, jadi ditampilkan sebagai status upload terakhir saja. ---------- */
  {
    const hasItemLog=(sid,y,m)=>S.logs.some(l=>l.kind==='ITEM_SALES'&&l.store_id===sid&&l.year===y&&l.month===m&&l.status==='OK');
    const hasSalesTypeLog=(sid,y,m)=>S.logs.some(l=>l.kind==='SALES_TYPE'&&l.store_id===sid&&l.year===y&&l.month===m&&l.status==='OK');
    const hasTrx=(sid,y,m)=>S.trxAll.some(r=>r.store_id===sid&&r.year===y&&r.month===m&&N(r.jumlah_transaksi)>0);
    const typeStatus=(fn,st,year,month)=>{
      if(st.opening_date){ const d=new Date(st.opening_date+'T00:00:00');
        if(!isNaN(d)&&(year<d.getFullYear()||(year===d.getFullYear()&&month<d.getMonth()+1))) return 'closed'; }
      if(fn(st.id,year,month)) return 'ok';
      const isFuture=year>todayY||(year===todayY&&month>todayM);
      return isFuture?'future':'missing';
    };
    const monthsCovered=(fn,st,year)=>{ let c=0,expect=0; for(let m=1;m<=12;m++){ const s=typeStatus(fn,st,year,m); if(s==='closed'||s==='future') continue; expect++; if(s==='ok') c++; } return {c,expect}; };
    const typeDefs=[['ITEM_SALES','Item Sales',hasItemLog,'item'],['SALES_TYPE','Sales Type',hasSalesTypeLog,'sales'],['TRANSAKSI',"Transaksi",hasTrx,'trx']];

    /* ringkasan tiles per jenis, gabungan semua tahun yang ditampilkan */
    const tl2=el('div',{class:'grid g4'});
    typeDefs.forEach(([kindKey,label,fn])=>{
      let c=0,e=0; years.forEach(y=>stores.forEach(st=>{ const r=monthsCovered(fn,st,y); c+=r.c; e+=r.expect; }));
      tl2.append(tile('Cakupan '+label,e?pct(c/e):'—',`${int(c)} dari ${int(e)} toko×bulan terisi · ${years.join('/')}`,e?c/e:null));
    });
    const lastMap=S.logs.find(l=>l.kind==='MAPPING'), lastKpi=S.logs.find(l=>l.kind==='KPI');
    tl2.append(tile('Master/Mapping terakhir',lastMap?new Date(lastMap.created_at).toLocaleDateString('id-ID',{dateStyle:'short'}):'—',
      lastMap?lastMap.file_name:'belum pernah diupload (Target/Master produk/Database Sales Type)',null));
    p.append(tl2);

    /* tabel ringkas per toko: bulan terisi dari 12, per jenis data, per tahun ditampilkan */
    const heads2=[H('TOKO',{s:1}),...years.flatMap(y=>typeDefs.map(([,label])=>H(label+' '+y,{r:1})))];
    const rows2=stores.map(st=>[st.name,...years.flatMap(y=>typeDefs.map(([,,fn])=>{ const r=monthsCovered(fn,st,y);
      return el('span',{class:'pill '+(r.expect===0?'neu':r.c===r.expect?'ok':r.c===0?'bad':'mid')},r.expect===0?'—':`${r.c}/${r.expect}`); }))]);
    p.append(card('Cakupan per jenis data upload',`Jumlah bulan terisi dari bulan yang seharusnya sudah ada · ${years.join(', ')} · Item Sales/Sales Type dari riwayat upload — data yang dimasukkan lewat jalur lain (muat-massal) bisa tertulis "Kosong" di sini meski datanya sudah ada; silang-cek dgn matriks di atas. Transaksi sudah dicek dari data aktual.`,
      mkTable(heads2,rows2)));
    p.append(el('div',{class:'rowline',style:'flex-wrap:wrap'},
      el('span',{class:'sub'},'Unggah data yang masih kosong di halaman Upload Data: '),
      ...typeDefs.map(([,label])=>el('button',{class:'btn sm',onclick:()=>go('upload')},'⭱ '+label)),
      el('button',{class:'btn sm',onclick:()=>go('upload')},'⭱ Target / Master / Database Sales Type')));
  }

  /* ---------- anomali (disaring ke bulan terpilih bila ada) ---------- */
  if(allAnoms.length){
    p.append(card('Anomali terdeteksi',`${allAnoms.length} temuan pada tahun ${years.join(', ')}`+(mFilter?' · '+MONTHS[mFilter-1]:''),
      el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},
        ['TOKO','PERIODE','METRIK','NILAI','KETERANGAN'].map((h,i)=>el('th',{class:i===0?'sticky1':''},h)))),
        el('tbody',{},allAnoms.map(a=>el('tr',{},
          el('td',{class:'sticky1'},a.store), el('td',{},a.ym), el('td',{},a.metric),
          el('td',{class:'mono'},a.value), el('td',{},a.note))))))));
  } else {
    p.append(el('div',{class:'note'},el('b',{},'Tidak ada anomali. '),'Tidak ada temuan achievement/MoM/AOV/konsistensi yang mencurigakan pada tahun '+years.join(', ')+(mFilter?' · '+MONTHS[mFilter-1]:'')+'.'));
  }

  /* ---------- riwayat ingest_log ---------- */
  if(S.logs.length){
    const tb=el('tbody');
    S.logs.forEach(l=>{ const st=S.stores.find(s=>s.id===l.store_id);
      tb.append(el('tr',{},
        el('td',{},new Date(l.created_at).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})),
        el('td',{},l.kind), el('td',{class:'sticky1'},l.file_name),
        el('td',{},st?st.name:'—'),
        el('td',{},l.year&&l.month?MON3[l.month-1]+' '+l.year:'—'),
        el('td',{class:'r'},int(l.rows_total)),
        el('td',{class:'r'},int(l.rows_unmapped)),
        el('td',{class:'r'},compact(l.total_amount)),
        el('td',{},el('span',{class:'pill '+(l.status==='OK'?'ok':'bad')},l.status)))); });
    p.append(card('Riwayat upload (ingest log)',`${S.logs.length} baris`,
      el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},
        ['WAKTU','JENIS','FILE','TOKO','PERIODE','BARIS','BELUM MAP','NILAI','STATUS']
          .map((h,i)=>el('th',{class:(i>4&&i<8?'r':'')+(i===2?' sticky1':'')},h)))),tb))));
  } else {
    p.append(el('div',{class:'empty'},el('b',{},'Belum ada riwayat upload'),'Mode contoh tidak menyimpan ingest_log — hubungkan Supabase untuk melihat riwayat yang sebenarnya.'));

/* =====================================================================
   PICA / MOM
   ===================================================================== */
const PICA_KINDS={TASK:'Tugas',ISSUE:'Issue',SPECIAL:'Penugasan khusus',MOM:'MOM'};
const PICA_STATUS={OPEN:'Belum jalan',ON_PROGRESS:'Berjalan',DONE:'Selesai',DROPPED:'Dibatalkan'};
const PICA_PRIO={HIGH:'Tinggi',MEDIUM:'Sedang',LOW:'Rendah'};
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function picLabel(n){ const p=S.people.find(x=>x.name===n); return p?p.label:(n||'—'); }
function picaOverdue(x){ return x.due_date && x.due_date<todayStr() && (x.status==='OPEN'||x.status==='ON_PROGRESS'); }
function gcalLink(x){
  const d=x.due_date||x.meeting_date; if(!d) return null;
  const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+1);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(`[${PICA_KINDS[x.kind]||x.kind}] ${x.title} — PIC: ${picLabel(x.pic)}`)
    +'&dates='+d.replace(/-/g,'')+'/'+t.toISOString().slice(0,10).replace(/-/g,'')+'&details='+encodeURIComponent((x.detail||'')+'\nStatus: '+(PICA_STATUS[x.status]||x.status));
}
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsText(rows){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sales Command//PICA MOM//ID','CALSCALE:GREGORIAN','X-WR-CALNAME:Sales Command - PICA/MOM'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  rows.forEach(x=>{ [['due',x.due_date],['mtg',x.meeting_date]].forEach(([tag,d])=>{ if(!d) return;
    const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+1);
    L.push('BEGIN:VEVENT',`UID:pica-${x.id}-${tag}@sales-command`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d.replace(/-/g,'')}`,
      `DTEND;VALUE=DATE:${t.toISOString().slice(0,10).replace(/-/g,'')}`,
      `SUMMARY:${icsEscape(`[${PICA_KINDS[x.kind]||x.kind}] ${x.title} - PIC: ${picLabel(x.pic)}`)}`,`DESCRIPTION:${icsEscape(x.detail||'')}`,
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Pengingat','TRIGGER:-P1D','END:VALARM','END:VEVENT'); }); });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}

/* Filter lokal halaman Breakdown — terpisah dari filter bar global (item 4/5) */
function bdLocalStoreOk(sid){
  const st=S.stores.find(s=>s.id===sid); if(!st) return false;
  const f=S.bdFilter||{};
  if(f.store && String(sid)!==f.store) return false;
  if(f.spv && st.spv!==f.spv) return false;
  return true;
}
function bdLocalIds(){ const ids=S.stores.filter(s=>bdLocalStoreOk(s.id)).map(s=>s.id); return ids.length===S.stores.length?null:ids; }
function bdRows(year,m1,m2){ return S.dashAll.filter(r=>r.year===year&&r.month>=m1&&r.month<=m2&&bdLocalStoreOk(r.store_id)); }
/* panggil h2hData (logika jendela tanggal yang sama dipakai halaman H2H) dengan filter toko/SPV lokal halaman ini,
   tanpa mengubah filter global — ditukar sesaat karena h2hData murni sinkron (tanpa await di dalamnya) */
function bdH2h(years,m1,m2){
  const os=S.store, ov=S.spv; S.store=(S.bdFilter&&S.bdFilter.store)||''; S.spv=(S.bdFilter&&S.bdFilter.spv)||'';
  try{ return h2hData(years,m1,m2,0); } finally{ S.store=os; S.spv=ov; }
}
/* round 12 item 1: sama pola dgn bdH2h — tukar sesaat filter toko/SPV global ke filter lokal halaman
   Breakdown supaya rollup() (unit terjual, utk UPT) ikut scope yang sama dgn tabel di halaman ini. */
async function bdRollup(dim,year,m1,m2,o={}){
  const os=S.store, ov=S.spv; S.store=(S.bdFilter&&S.bdFilter.store)||''; S.spv=(S.bdFilter&&S.bdFilter.spv)||'';
  try{ return await rollup(dim,year,m1,m2,{...o,category:(S.bdFilter&&S.bdFilter.category)||o.category||null}); } finally{ S.store=os; S.spv=ov; }
}
function renderBreakdown(){

  /* total sales */

  const h2 = bdH2h([y1,y2,y3],m1,m2);

  atl.append(tile('AOV '+y3,rp(t3.aov),'rata-rata nilai per transaksi',null));

  {
    const trxDetailHost=el('div',{}); p.append(trxDetailHost);
    const baseRows=[['Jumlah transaksi',int(t1.trx),int(t2.trx),int(t3.trx),deltaTrxY1==null?'—':pct(deltaTrxY1),deltaTrxY2==null?'—':pct(deltaTrxY2)],

    trxDetailHost.append(card('Detail Transaksi & AOV','dibandingkan terhadap tahun berjalan, jendela tanggal sama seperti H2H',mkTable(heads,baseRows)));

    items.length?el('div',{style:'display:flex;flex-direction:column;gap:9px'},
      ...items.map(it=>el('div',{class:'item'},el('div',{class:'t'},it.t),el('div',{class:'c'},it.c))))
    :el('div',{class:'empty'},'Tidak ada indikasi masalah pada cakupan filter ini.'));

  /* 1. toko di bawah target — daftar konkret (bukan Pareto), diurutkan dari gap terbesar */
  const st=byStore(rows).filter(r=>r.target_total>0);
  const stProblem=st.map(r=>({label:r.store_name,v:r.gap_sales,achiev:r.achiev_total,sales:r.total_sales,target:r.target_total}));
  const shortfall=stProblem.filter(x=>x.v<0).slice().sort((a,b)=>a.v-b.v);
  const totalShort=shortfall.reduce((s,x)=>s+x.v,0);   // total shortfall (negatif) = total GAP yg perlu dikejar
  p.append(issueList('1. Toko di bawah target',`${ymLabel(y3,m1,m2)} · ${shortfall.length} dari ${stProblem.length} toko ber-target tidak mencapai target`,
    shortfall.map(x=>({t:`${x.label} — GAP ${compact(x.v)}`,
      c:`Sales ${compact(x.sales)} dari target ${compact(x.target)} (achievement ${pct(x.achiev)}). ${totalShort<0?pct(x.v/totalShort)+' dari total GAP seluruh toko di bawah target.':''}`}))));
  let _cum=0;
  const gapRows=shortfall.map(x=>{ _cum+=x.v; const share=totalShort<0?x.v/totalShort:0, cumShare=totalShort<0?_cum/totalShort:0;
    return [x.label,compact(x.v),pct(share),pct(Math.min(1,cumShare))]; });
  if(gapRows.length) p.append(card('Kontribusi toko terhadap total GAP',
    `Total GAP (toko di bawah target) ${compact(totalShort)} pada ${ymLabel(y3,m1,m2)} — diurutkan dari penyumbang gap terbesar`,
    mkTable([H('TOKO',{s:1}),H('GAP',{r:1}),H('% DARI TOTAL GAP',{r:1}),H('% KUMULATIF',{r:1})],gapRows)));
  p.append(el('div',{class:'note'},el('b',{},'Catatan granularitas. '),
    'Kontribusi GAP di atas dihitung per toko dari v_sales_dashboard (sales vs target_total), yang memang punya target per toko per bulan. '+
    'Target TIDAK tersedia per produk/kategori/warna/ukuran pada data saat ini, jadi temuan GAP-vs-target difokuskan di level toko saja — '+
    'rincian produk/brand/warna/ukuran di bawah (bagian 3-6) tetap dianalisis lewat YoY (turun vs tahun lalu), bukan vs target, karena targetnya tidak ada di level itu.'));

  /* 2. toko turun YoY — pelengkap dari temuan GAP-vs-target di atas, juga daftar konkret */
  const byS=new Map();
  rows.forEach(r=>{ const o=byS.get(r.store_id)||{n:r.store_name,cy:0}; o.cy+=N(r.total_sales); byS.set(r.store_id,o); });
  rowsPy.forEach(r=>{ const o=byS.get(r.store_id)||{n:r.store_name,cy:0}; o.py=(o.py||0)+N(r.total_sales); byS.set(r.store_id,o); });
  const stYoy=[...byS.values()].filter(o=>o.py>0).map(o=>({label:o.n,v:o.cy-o.py,cy:o.cy,py:o.py}));
  const stYoyDown=stYoy.filter(x=>x.v<0).sort((a,b)=>a.v-b.v);
  p.append(issueList(`2. Toko turun dibanding ${y2} (YoY)`,`${ymLabel(y3,m1,m2)} vs ${ymLabel(y2,m1,m2)} · ${stYoyDown.length} dari ${stYoy.length} toko dengan pembanding turun`,
    stYoyDown.map(x=>({t:`${x.label} — turun ${compact(Math.abs(x.v))} (${pct(x.py?x.v/x.py:null)})`,
      c:`${compact(x.cy)} di ${y3} vs ${compact(x.py)} di ${y2}.`}))));

  /* data tambahan untuk Ringkasan 5 Why — per SPV Area & per bulan (dipakai di bagian bawah halaman) */
  const bySpv=new Map();
  rows.forEach(r=>{ const sObj=S.stores.find(s=>s.id===r.store_id); const spv=(sObj&&sObj.spv)||'(tanpa SPV)';
    const o=bySpv.get(spv)||{n:spv,cy:0,py:0}; o.cy+=N(r.total_sales); bySpv.set(spv,o); });
  rowsPy.forEach(r=>{ const sObj=S.stores.find(s=>s.id===r.store_id); const spv=(sObj&&sObj.spv)||'(tanpa SPV)';
    const o=bySpv.get(spv)||{n:spv,cy:0,py:0}; o.py+=N(r.total_sales); bySpv.set(spv,o); });
  const spvYoy=[...bySpv.values()].filter(o=>o.py>0).map(o=>({...o,delta:o.cy-o.py})).sort((a,b)=>a.delta-b.delta);
  const byMonth=new Map();
  rows.forEach(r=>{ const o=byMonth.get(r.month)||{m:r.month,cy:0,py:0}; o.cy+=N(r.total_sales); byMonth.set(r.month,o); });
  rowsPy.forEach(r=>{ const o=byMonth.get(r.month)||{m:r.month,cy:0,py:0}; o.py+=N(r.total_sales); byMonth.set(r.month,o); });
  const monthYoy=[...byMonth.values()].filter(o=>o.py>0).map(o=>({...o,delta:o.cy-o.py})).sort((a,b)=>a.delta-b.delta);

  /* 3-6: item/brand/warna/ukuran turun — perlu rollup dari database (async) */
  const host=el('div',{style:'display:flex;flex-direction:column;gap:18px'});
  p.append(host);
  host.append(el('div',{class:'empty'},'Memuat rincian produk, brand, warna & ukuran…'));
  (async()=>{
    try{
      const dims=['product','brand','color','size'];
      const res={}; await Promise.all(dims.map(async d=>{
        res[d]=await Promise.all([y2,y3].map(y=>rollup(d,y,m1,m2,{limit:400,stores:bdLocalIds(),category:f.category||null})));
      }));
      host.innerHTML='';
      const titles={product:'3. Produk turun signifikan',brand:'4. Brand turun signifikan',color:'5. Warna turun signifikan',size:'6. Ukuran turun signifikan'};
      dims.forEach(d=>{
        const [py,cy]=res[d];
        const pm=new Map(py.map(r=>[r.k,N(r.sales)])), cm=new Map(cy.map(r=>[r.k,N(r.sales)]));
        const items=[...pm.keys()].filter(k=>k&&!/^\(Tanpa/.test(k)).map(k=>({label:k,v:(cm.get(k)||0)-pm.get(k),cy:cm.get(k)||0,py:pm.get(k)}));
        const down=items.filter(x=>x.v<0).sort((a,b)=>a.v-b.v).slice(0,15);
        host.append(issueList(titles[d]+' (net sales, YoY)',ymLabel(y3,m1,m2)+' vs '+ymLabel(y2,m1,m2)+` · ${down.length} dari ${items.length} turun`,
          down.map(x=>({t:`${x.label} — turun ${compact(Math.abs(x.v))} (${pct(x.py?x.v/x.py:null)})`,
            c:`${compact(x.cy)} di ${y3} vs ${compact(x.py)} di ${y2}.`}))));
      });
      /* tambahan item 8: toko/produk dengan sales nol/mendekati nol di y3 padahal ada aktivitas di y2 —
         indikasi aktivitas berhenti (stock-out, toko tutup sementara, dsb), bukan sekadar turun. */
      const zeroStores=[...byS.values()].filter(o=>(o.py||0)>0 && (o.cy||0)<=((o.py||0)*0.05));
      host.append(issueList('Toko nyaris tanpa aktivitas di periode ini',`${ymLabel(y3,m1,m2)} · sales ${y3} ≤5% dari ${y2} — indikasi stock-out/toko tutup/berhenti jual`,
        zeroStores.sort((a,b)=>(b.py||0)-(a.py||0)).map(o=>({t:`${o.n} — sales ${y3} ${compact(o.cy||0)}`,c:`Padahal ${compact(o.py)} di ${y2} pada periode sama — perlu dicek ketersediaan stok/operasional.`}))));
      bdRenderSummary(res);
    }catch(e){ host.innerHTML=''; host.append(el('div',{class:'note warn'},'Gagal memuat rincian item: '+e.message)); }
  })();

  /* Ringkasan 5 Why (otomatis) — ditulis sebagai closing synthesis, ditaruh paling bawah
     halaman ini (lihat bdRenderSummary, dipanggil setelah semua kartu analisis di atas selesai
     tampil, termasuk 3-6 yang async & bagian 7 Transaksi & AOV di bawah). */
  function bdRenderSummary(res){
    const topStoreGap=stProblem.slice().sort((x,y)=>x.v-y.v)[0];        // GAP thd target terburuk
    const topStoreYoy=stYoy.slice().sort((x,y)=>x.v-y.v)[0];            // turun YoY terbesar
    const topSpv=spvYoy[0];
    const worstMonth=monthYoy[0];
    const pick=(dim)=>{ const [py,cy]=res[dim]; const pm=new Map(py.map(r=>[r.k,N(r.sales)])), cm=new Map(cy.map(r=>[r.k,N(r.sales)]));
      return [...pm.keys()].filter(k=>k&&!/^\(Tanpa/.test(k)).map(k=>({k,v:(cm.get(k)||0)-pm.get(k),cy:cm.get(k)||0,py:pm.get(k)}))
        .sort((x,y)=>x.v-y.v)[0]; };
    const topProd=pick('product'), topBrand=pick('brand'), topColor=pick('color'), topSize=pick('size');
    /* traffic (jumlah transaksi) vs pricing (AOV) — dihitung ulang di sini dari h2 (bagian 7, sudah tersedia
       karena bagian ini dipanggil lewat microtask setelah kode sinkron bagian 7 berjalan) */
    const trafficDrove = deltaTrxY2!=null && deltaAovY2!=null && Math.abs(deltaTrxY2) >= Math.abs(deltaAovY2);
    const notes=[];
    notes.push({t:'Apa yang terjadi (berdampak ke GAP)?',c:
      `Total GAP thd target (toko-toko di bawah target saja) ${compact(totalShort)} pada ${ymLabel(y3,m1,m2)}, achievement keseluruhan ${pct(a.achiev_total)}. `+
      (topStoreGap?`Penyumbang terbesar: ${topStoreGap.label} (${compact(topStoreGap.v)}, ${pct(totalShort<0?topStoreGap.v/totalShort:null)} dari total GAP).`:'tidak ada toko dengan target pada filter ini.')+' '+
      (gap<0?`Sales ${compact(a.total_sales)} juga turun ${compact(Math.abs(gap))} (${pct(totPy?gap/totPy:null)}) dibanding periode sama ${y2} (${compact(totPy)}).`
        :`Sales ${compact(a.total_sales)} justru tumbuh ${compact(gap)} (${pct(totPy?gap/totPy:null)}) dibanding ${y2} (${compact(totPy)}) walau GAP thd target masih ada.`)});
    notes.push({t:'Di toko mana paling terasa?',c:
      (topStoreGap?`Kontribusi GAP terbesar ada di ${topStoreGap.label}: ${compact(topStoreGap.v)} (${pct(totalShort<0?topStoreGap.v/totalShort:null)} dari total GAP thd target). `:'')+
      (topStoreYoy&&topStoreYoy.v<0?`Penurunan YoY terbesar ada di ${topStoreYoy.label}, turun ${compact(Math.abs(topStoreYoy.v))} dibanding ${y2}.`
        :topStoreYoy?`Toko dengan selisih YoY terbesar: ${topStoreYoy.label} (${compact(topStoreYoy.v)}), masih tumbuh.`:'belum ada toko dengan pembanding tahun lalu pada filter ini.')});
    notes.push({t:'Di SPV Area mana akar masalahnya?',c:
      topSpv?`${spvLabel(topSpv.n)||topSpv.n} mencatat selisih YoY terbesar: ${compact(topSpv.delta)} (${compact(topSpv.cy)} di ${y3} vs ${compact(topSpv.py)} di ${y2}, ${pct(topSpv.py?topSpv.delta/topSpv.py:null)}). `+
        (spvYoy.length>1?`Area berikutnya: ${spvLabel(spvYoy[1].n)||spvYoy[1].n} (${compact(spvYoy[1].delta)}).`:'')
        :'tidak ada data SPV Area dengan pembanding tahun lalu untuk dibandingkan.'});
    notes.push({t:'Di periode/bulan mana paling dalam?',c:
      worstMonth?`Bulan ${MONTHS[worstMonth.m-1]} ${y3} punya selisih YoY terdalam: ${compact(worstMonth.delta)} (${compact(worstMonth.cy)} vs ${compact(worstMonth.py)} di bulan sama ${y2}, ${pct(worstMonth.py?worstMonth.delta/worstMonth.py:null)}). `+
        (monthYoy.length>1?`Disusul ${MONTHS[monthYoy[1].m-1]} (${compact(monthYoy[1].delta)}).`:'')
        :'rentang periode yang dipilih hanya 1 bulan atau tanpa pembanding tahun lalu.'});
    notes.push({t:'Produk/brand/warna/ukuran mana penyebabnya?',c:
      [topProd&&topProd.v<0?`Produk "${topProd.k}" turun ${compact(Math.abs(topProd.v))} (dari ${compact(topProd.py)} jadi ${compact(topProd.cy)}).`:null,
       topBrand&&topBrand.v<0?`Brand ${topBrand.k} turun ${compact(Math.abs(topBrand.v))}.`:null,
       topColor&&topColor.v<0?`Warna ${topColor.k} turun ${compact(Math.abs(topColor.v))}.`:null,
       topSize&&topSize.v<0?`Ukuran ${topSize.k} turun ${compact(Math.abs(topSize.v))}.`:null].filter(Boolean).join(' ')
       ||'tidak ditemukan penurunan signifikan di level produk/brand/warna/ukuran pada filter ini.'});
    notes.push({t:'Soal traffic (transaksi) atau harga (AOV)?',c:
      (deltaTrxY2==null||deltaAovY2==null)?'belum cukup data transaksi tahun lalu pada jendela tanggal yang sama untuk disimpulkan.':
      trafficDrove?`Lebih didorong oleh jumlah transaksi (traffic): Δ transaksi ${pct(deltaTrxY2)} vs Δ AOV ${pct(deltaAovY2)} dibanding ${y2}. `+
        `Artinya kemungkinan soal kunjungan/lalu-lintas pembeli (traffic toko/marketplace) atau ketersediaan stok, bukan harga jual.`
        :`Lebih didorong oleh AOV (nilai rata-rata transaksi): Δ AOV ${pct(deltaAovY2)} vs Δ transaksi ${pct(deltaTrxY2)} dibanding ${y2}. `+
        `Artinya kemungkinan soal pricing/diskon/mix produk, bukan jumlah pembeli.`});
    p.append(card('Ringkasan 5 Why (otomatis)','sintesis penutup dari seluruh kartu analisis di atas — titik awal investigasi, telusuri lebih lanjut ke PICA/MOM',
      el('div',{style:'display:flex;flex-direction:column;gap:9px'},...notes.map((n,i)=>el('div',{class:'item'},el('div',{class:'t'},`Why ${i+1} — ${n.t}`),el('div',{class:'c'},n.c))))));
  }

}

function renderPica(){

  const p=$('#p-pica'); p.innerHTML='';
  const f=S.pf||(S.pf={kind:'',pic:'',status:'',active:true});

    el('p',{},'Tugas, issue, penugasan khusus dan hasil rapat (MOM) lengkap dengan PIC, status dan tenggat — sambungan Google Calendar diatur di Pengaturan → Integrasi.')),
    el('span',{class:'spacer'}),el('button',{class:'btn pri',onclick:()=>picaForm()},'+ Tambah butir')));

  const all=S.pica, today=todayStr();

  tl.append(tile('Jatuh tempo 7 hari',int(in7.length),'tenggat dalam sepekan',null));
  tl.append(tile('Selesai',int(all.filter(x=>x.status==='DONE').length),all.length?pct(all.filter(x=>x.status==='DONE').length/all.length,0)+' dari semua butir':'—',null));

  /* ringkasan per PIC */
  {
    const pics=[...new Set([...S.people.filter(x=>x.is_active!==false).map(x=>x.name),...all.map(x=>x.pic).filter(Boolean)])];
    const rows=pics.map(n=>{ const m=all.filter(x=>x.pic===n); return [picLabel(n),int(m.filter(x=>x.status==='OPEN').length),int(m.filter(x=>x.status==='ON_PROGRESS').length),
      int(m.filter(x=>x.status==='DONE').length),int(m.filter(picaOverdue).length),int(m.length)]; }).filter(r=>r[5].raw>0||true);
    p.append(card('Beban per PIC','',mkTable([H('PIC',{s:1}),H('BELUM JALAN',{r:1}),H('BERJALAN',{r:1}),H('SELESAI',{r:1}),H('TERLAMBAT',{r:1}),H('TOTAL',{r:1})],rows)));
  }

  /* filter */
  const mkSel=(id,label,opts,val,key)=>el('div',{class:'fld'},el('label',{for:id},label),
    el('select',{id,onchange:e=>{ f[key]=e.target.value; renderPica(); }},opts.map(([v,t])=>el('option',{value:v,selected:val===v?'':null},t))));
  const picOpts=[['','Semua PIC'],...[...new Set([...S.people.map(x=>x.name),...all.map(x=>x.pic).filter(Boolean)])].map(n=>[n,picLabel(n)])];
  p.append(el('div',{class:'rowline'},
    mkSel('pf-kind','Jenis',[['','Semua jenis'],...Object.entries(PICA_KINDS)],f.kind,'kind'),
    mkSel('pf-pic','PIC',picOpts,f.pic,'pic'),
    mkSel('pf-status','Status',[['','Semua status'],...Object.entries(PICA_STATUS)],f.status,'status')));
  let rows=all.filter(x=>(!f.kind||x.kind===f.kind)&&(!f.pic||x.pic===f.pic)&&(!f.status||x.status===f.status));
  const heads=[H('#',{r:1}),H('JENIS'),H('JUDUL',{s:1}),H('PIC'),H('STATUS'),H('PRIORITAS'),H('TENGGAT'),H('RAPAT'),H('TOKO'),H('')];
  const tb=el('tbody');
  rows.forEach((x,i)=>{ const st=S.stores.find(s=>s.id===x.store_id); const g=gcalLink(x);
    tb.append(el('tr',{},
      el('td',{class:'r'},String(x.id)),
      el('td',{},el('span',{class:'pill neu'},PICA_KINDS[x.kind]||x.kind)),
      el('td',{class:'sticky1',style:'white-space:normal;min-width:240px;max-width:380px',title:x.detail||''},el('div',{style:'font-weight:600'},x.title),
        x.detail?el('div',{style:'font-size:11.5px;color:var(--muted);font-weight:400'},x.detail.length>110?x.detail.slice(0,110)+'…':x.detail):null),
      el('td',{},picLabel(x.pic)),
      el('td',{},el('span',{class:'pill '+(x.status==='DONE'?'ok':x.status==='ON_PROGRESS'?'mid':x.status==='DROPPED'?'neu':'neu')},PICA_STATUS[x.status]||x.status)),
      el('td',{},el('span',{class:'pill '+(x.priority==='HIGH'?'bad':x.priority==='LOW'?'neu':'mid')},PICA_PRIO[x.priority]||'—')),
      el('td',{style:picaOverdue(x)?'color:var(--crit);font-weight:700':''},x.due_date||'—',picaOverdue(x)?' ⚠':''),
      el('td',{},x.meeting_date||'—'),
      el('td',{},st?st.name:'Semua'),
      el('td',{},el('div',{class:'rowline',style:'flex-wrap:nowrap'},
        el('button',{class:'btn sm',onclick:()=>picaForm(x)},'Ubah'),
        x.status!=='DONE'?el('button',{class:'btn sm',onclick:async()=>{ if(guard())return; try{ await DB.patch('pica','id=eq.'+x.id,{status:'DONE',updated_at:new Date().toISOString()}); toast('Ditandai selesai.'); await loadAll(); }catch(e){ toast('Gagal: '+e.message); } }},'Selesai'):null,
        g?el('a',{class:'btn sm',href:g,target:'_blank',rel:'noopener',style:'text-decoration:none'},'+ Kalender'):null,
        el('button',{class:'btn sm',onclick:async()=>{ if(guard())return; if(!confirm('Hapus butir ini?'))return; try{ await DB.del('pica','id=eq.'+x.id); toast('Dihapus.'); await loadAll(); }catch(e){ toast('Gagal: '+e.message); } }},'Hapus')))));
  });
  if(!rows.length) tb.append(el('tr',{},el('td',{colspan:String(heads.length),style:'color:var(--muted)'},'Belum ada butir. Tekan “+ Tambah butir”.')));
  p.append(card('Daftar PICA / MOM',`${rows.length} butir`,el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},heads.map(h=>el('th',{class:(h.r?'r':'')+(h.s?' sticky1':'')},h.t)))),tb))));
}

function picaForm(x={}){
