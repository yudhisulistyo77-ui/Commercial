   PICA / MOM
   ===================================================================== */
const PICA_KINDS={TASK:'Tugas',ISSUE:'Issue',SPECIAL:'Penugasan khusus',MOM:'MOM'};
const PICA_STATUS={OPEN:'Belum jalan',ON_PROGRESS:'Berjalan',DONE:'Selesai',DROPPED:'Dibatalkan'};
const PICA_PRIO={HIGH:'Tinggi',MEDIUM:'Sedang',LOW:'Rendah'};
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function picLabel(n){ const p=S.people.find(x=>x.name===n); return p?p.label:(n||'—'); }
function picaOverdue(x){ return x.due_date && x.due_date<todayStr() && (x.status==='OPEN'||x.status==='ON_PROGRESS'); }
function gcalLink(x){
  const d=x.due_date||x.meeting_date; if(!d) return null;
  const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+1);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(`[${PICA_KINDS[x.kind]||x.kind}] ${x.title} — PIC: ${picLabel(x.pic)}`)
    +'&dates='+d.replace(/-/g,'')+'/'+t.toISOString().slice(0,10).replace(/-/g,'')+'&details='+encodeURIComponent((x.detail||'')+'\nStatus: '+(PICA_STATUS[x.status]||x.status));
}
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsText(rows){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sales Command//PICA MOM//ID','CALSCALE:GREGORIAN','X-WR-CALNAME:Sales Command - PICA/MOM'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  rows.forEach(x=>{ [['due',x.due_date],['mtg',x.meeting_date]].forEach(([tag,d])=>{ if(!d) return;
    const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+1);
    L.push('BEGIN:VEVENT',`UID:pica-${x.id}-${tag}@sales-command`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d.replace(/-/g,'')}`,
      `DTEND;VALUE=DATE:${t.toISOString().slice(0,10).replace(/-/g,'')}`,
      `SUMMARY:${icsEscape(`[${PICA_KINDS[x.kind]||x.kind}] ${x.title} - PIC: ${picLabel(x.pic)}`)}`,`DESCRIPTION:${icsEscape(x.detail||'')}`,
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Pengingat','TRIGGER:-P1D','END:VALARM','END:VEVENT'); }); });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}

/* =====================================================================
   BREAKDOWN PROBLEM / 5 WHY — pemindaian indikasi masalah (round 8: Pareto dihapus dari halaman ini,
   lihat issueList() di dalam renderBreakdown; fungsi paretoChart() sendiri sudah tidak dipakai di mana pun)
   ===================================================================== */
/* Filter lokal halaman Breakdown — terpisah dari filter bar global (item 4/5) */
function bdLocalStoreOk(sid){
  const st=S.stores.find(s=>s.id===sid); if(!st) return false;
  const f=S.bdFilter||{};
  if(f.store && String(sid)!==f.store) return false;
  if(f.spv && st.spv!==f.spv) return false;
  return true;
}
function bdLocalIds(){ const ids=S.stores.filter(s=>bdLocalStoreOk(s.id)).map(s=>s.id); return ids.length===S.stores.length?null:ids; }
function bdRows(year,m1,m2){ return S.dashAll.filter(r=>r.year===year&&r.month>=m1&&r.month<=m2&&bdLocalStoreOk(r.store_id)); }
/* panggil h2hData (logika jendela tanggal yang sama dipakai halaman H2H) dengan filter toko/SPV lokal halaman ini,
   tanpa mengubah filter global — ditukar sesaat karena h2hData murni sinkron (tanpa await di dalamnya) */
function bdH2h(years,m1,m2){
  const os=S.store, ov=S.spv; S.store=(S.bdFilter&&S.bdFilter.store)||''; S.spv=(S.bdFilter&&S.bdFilter.spv)||'';
  try{ return h2hData(years,m1,m2,0); } finally{ S.store=os; S.spv=ov; }
}
/* round 12 item 1: sama pola dgn bdH2h — tukar sesaat filter toko/SPV global ke filter lokal halaman
   Breakdown supaya rollup() (unit terjual, utk UPT) ikut scope yang sama dgn tabel di halaman ini. */
async function bdRollup(dim,year,m1,m2,o={}){
  const os=S.store, ov=S.spv; S.store=(S.bdFilter&&S.bdFilter.store)||''; S.spv=(S.bdFilter&&S.bdFilter.spv)||'';
  try{ return await rollup(dim,year,m1,m2,{...o,category:(S.bdFilter&&S.bdFilter.category)||o.category||null}); } finally{ S.store=os; S.spv=ov; }
}
function renderBreakdown(){
  parkFilters();
  const p=$('#p-breakdown'); p.innerHTML='';
  if(!S.bdFilter) S.bdFilter={spv:'',store:'',m1:S.month||1,m2:S.month||lastMonthWithData(S.year)};
  const f=S.bdFilter;
  const y3=S.year, y2=S.year-1, y1=S.year-2, m1=f.m1||1, m2=f.m2||lastMonthWithData(y3);
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Breakdown Problem'),
    el('p',{},`Pemindaian menyeluruh indikasi masalah pada data: toko di bawah target, toko/produk/brand/warna/ukuran turun YoY, aktivitas nyaris nol, dan anomali transaksi/AOV — ditampilkan sebagai daftar temuan konkret per kategori, diakhiri sintesis 5 Why. `+ymLabel(y3,m1,m2)))));
  const pf_breakdown=pageFilterBar('breakdown');
  if(S.demo) p.append(demoBanner());

  /* filter lokal halaman ini (tidak memengaruhi filter bar global). round 8 item 2: digabung jadi
     SATU card bersama pageFilterBar('breakdown') di atas, bukan dua box terpisah seperti sebelumnya. */
  const mSel=(k)=>{ const s=el('select',{},MONTHS.map((m,i)=>el('option',{value:String(i+1),selected:f[k]===i+1?'':null},m)));
    s.onchange=()=>{ f[k]=Number(s.value); if(f.m1>f.m2){ if(k==='m1')f.m2=f.m1; else f.m1=f.m2; } renderBreakdown(); }; return s; };
  const spvOpts=[...new Set(S.stores.map(s=>s.spv).filter(Boolean))].sort();
  const spvSel=el('select',{},el('option',{value:''},'Semua SPV'),spvOpts.map(n=>el('option',{value:n,selected:f.spv===n?'':null},spvLabel(n))));
  spvSel.onchange=()=>{ f.spv=spvSel.value; f.store=''; renderBreakdown(); };
  const storeOpts=S.stores.filter(s=>!f.spv||s.spv===f.spv);
  const storeSel=el('select',{},el('option',{value:''},'Semua toko'),storeOpts.map(s=>el('option',{value:String(s.id),selected:f.store===String(s.id)?'':null},s.name)));
  storeSel.onchange=()=>{ f.store=storeSel.value; renderBreakdown(); };
  const catSel=el('select',{},el('option',{value:''},'Semua kategori'));
  catSel.onchange=()=>{ f.category=catSel.value; renderBreakdown(); };
  itemCategoryList().then(list=>{ list.forEach(c=>catSel.append(el('option',{value:c,selected:f.category===c?'':null},c))); });
  const clearBtn=el('button',{class:'btn sm',title:'Reset filter halaman ini'},'Clear');
  clearBtn.onclick=()=>{ S.bdFilter={spv:'',store:'',category:'',m1:S.month||1,m2:S.month||lastMonthWithData(S.year)}; renderBreakdown(); };
  p.append(card('Filter halaman ini','periode, Brand/SPV/Toko (global) dan SPV Area/toko/kategori khusus untuk analisis akar masalah ini — digabung dalam satu kartu',
    pf_breakdown?el('div',{class:'rowline',style:'flex-wrap:wrap'},...[...pf_breakdown.childNodes]):null,
    pf_breakdown?el('div',{class:'pf-sub'}):null,
    el('div',{class:'rowline',style:'flex-wrap:wrap'},
      el('div',{class:'fld'},el('label',{},'Dari bulan'),mSel('m1')),
      el('div',{class:'fld'},el('label',{},'Sampai bulan'),mSel('m2')),
      el('div',{class:'fld'},el('label',{},'SPV Area'),spvSel),
      el('div',{class:'fld'},el('label',{},'Toko'),storeSel),
      el('div',{class:'fld'},el('label',{},'Kategori'),catSel),
      clearBtn)));

  /* total sales */
  const rows=bdRows(y3,m1,m2), a=agg(rows);
  const rowsPy=bdRows(y2,m1,m2);
  const totPy=rowsPy.reduce((s,r)=>s+N(r.total_sales),0);
  const gap=a.total_sales-totPy;
  const tl=el('div',{class:'grid g4'});
  tl.append(tile(`Total sales ${y3}`,compact(a.total_sales),ymLabel(y3,m1,m2),null));
  tl.append(tile(`Total sales ${y2}`,compact(totPy),ymLabel(y2,m1,m2),null));
  tl.append(tile('Selisih (GAP)',compact(gap),gap>=0?'tumbuh dibanding tahun lalu':'turun — perlu ditelusuri',null,
    el('span',{class:'pill '+(gap>=0?'ok':'bad')},gap>=0?'Tumbuh':'Turun')));
  tl.append(tile('GAP thd target',compact(a.gap_sales),a.gap_sales>=0?'di atas target':'di bawah target',a.achiev_total));
  p.append(tl);

  /* item 6 (ronde ini): kartu Transaksi & AOV dipindah ke paling atas, langsung di bawah card Sales —
     sebelumnya ditaruh sebagai "7." di paling bawah halaman. Logika hitung (jendela tanggal H2H) tidak
     diubah, hanya posisi tampilnya; deltaTrxY2/deltaAovY2 dkk tetap dipakai belakangan oleh
     bdRenderSummary() (dipanggil lewat microtask setelah kode sinkron ini selesai, jadi urutan deklarasi
     di sini tidak masalah). */
  const h2 = bdH2h([y1,y2,y3],m1,m2);
  const sumTrx=(y)=>{ let trx=0,val=0; h2[y].forEach(o=>{ trx+=o.trx; val+=o.val; }); return {trx,val,aov:trx>0?val/trx:null}; };
  const t3=sumTrx(y3), t2=sumTrx(y2), t1=sumTrx(y1);
  const deltaTrxY2 = t2.trx>0?(t3.trx-t2.trx)/t2.trx:null, deltaTrxY1 = t1.trx>0?(t3.trx-t1.trx)/t1.trx:null;
  const deltaAovY2 = t2.aov>0?(t3.aov-t2.aov)/t2.aov:null, deltaAovY1 = t1.aov>0?(t3.aov-t1.aov)/t1.aov:null;
  const atl=el('div',{class:'grid g4'});
  atl.append(tile('Jumlah transaksi '+y3,int(t3.trx),ymLabel(y3,m1,m2),null));
  atl.append(tile('vs '+y2,deltaTrxY2==null?'—':pct(deltaTrxY2),compact(t2.trx)+' transaksi di '+y2,null,
    deltaTrxY2==null?null:el('span',{class:'pill '+(deltaTrxY2>=0?'ok':'bad')},deltaTrxY2>=0?'Naik':'Turun')));
  atl.append(tile('vs '+y1,deltaTrxY1==null?'—':pct(deltaTrxY1),compact(t1.trx)+' transaksi di '+y1,null,
    deltaTrxY1==null?null:el('span',{class:'pill '+(deltaTrxY1>=0?'ok':'bad')},deltaTrxY1>=0?'Naik':'Turun')));
  atl.append(tile('AOV '+y3,rp(t3.aov),'rata-rata nilai per transaksi',null));
  p.append(el('div',{class:'phead'},el('div',{},el('h2',{style:'font-size:17px'},'Transaksi & AOV'),
    el('p',{},`Jumlah transaksi dan Average Order Value dibandingkan ${y2} dan ${y1}, memakai jendela tanggal yang sama dengan halaman H2H. `+ymLabel(y3,m1,m2)))));
  p.append(atl);
  {
    const trxDetailHost=el('div',{}); p.append(trxDetailHost);
    const baseRows=[['Jumlah transaksi',int(t1.trx),int(t2.trx),int(t3.trx),deltaTrxY1==null?'—':pct(deltaTrxY1),deltaTrxY2==null?'—':pct(deltaTrxY2)],
       ['Nilai transaksi',compact(t1.val),compact(t2.val),compact(t3.val),'',''],
       ['AOV',rp(t1.aov),rp(t2.aov),rp(t3.aov),deltaAovY1==null?'—':pct(deltaAovY1),deltaAovY2==null?'—':pct(deltaAovY2)]];
    const heads=[H('METRIK'),H(String(y1),{r:1}),H(String(y2),{r:1}),H(String(y3),{r:1}),H('Δ vs '+y1,{r:1}),H('Δ vs '+y2,{r:1})];
    trxDetailHost.append(card('Detail Transaksi & AOV','dibandingkan terhadap tahun berjalan, jendela tanggal sama seperti H2H',mkTable(heads,baseRows)));
    /* round 12 item 1: tambah baris UPT (unit terjual ÷ jumlah transaksi), dimuat async lalu
       render ulang kartunya supaya tidak memblokir tabel utama. */
    (async()=>{
      try{
        const [u1,u2,u3]=await Promise.all([y1,y2,y3].map(y=>bdRollup('store',y,m1,m2,{limit:60})));
        const units=r=>r.reduce((s,x)=>s+x.qty,0);
        const upt1=t1.trx>0?units(u1)/t1.trx:null, upt2=t2.trx>0?units(u2)/t2.trx:null, upt3=t3.trx>0?units(u3)/t3.trx:null;
        const dU1=(upt1>0&&upt3!=null)?(upt3-upt1)/upt1:null, dU2=(upt2>0&&upt3!=null)?(upt3-upt2)/upt2:null;
        const uptTxt=v=>v==null?'—':v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
        trxDetailHost.innerHTML='';
        trxDetailHost.append(card('Detail Transaksi & AOV','dibandingkan terhadap tahun berjalan, jendela tanggal sama seperti H2H · UPT = unit terjual ÷ jumlah transaksi',
          mkTable(heads,[...baseRows,['UPT',uptTxt(upt1),uptTxt(upt2),uptTxt(upt3),dU1==null?'—':pct(dU1),dU2==null?'—':pct(dU2)]])));
      }catch(e){ /* UPT opsional — tabel dasar tanpa UPT tetap tampil kalau gagal */ }
    })();
  }

  /* round 8 item 8: Pareto DIHAPUS dari halaman ini atas permintaan pengguna — fokus dipindah ke
     daftar temuan/indikasi masalah yang konkret, dikelompokkan per kategori isu, bukan bar-chart
     ranking. Helper kecil issueList() dipakai berulang di bawah untuk format "kartu temuan" ini. */
  const issueList=(title,sub,items)=>card(title,sub,
    items.length?el('div',{style:'display:flex;flex-direction:column;gap:9px'},
      ...items.map(it=>el('div',{class:'item'},el('div',{class:'t'},it.t),el('div',{class:'c'},it.c))))
    :el('div',{class:'empty'},'Tidak ada indikasi masalah pada cakupan filter ini.'));

  /* 1. toko di bawah target — daftar konkret (bukan Pareto), diurutkan dari gap terbesar */
  const st=byStore(rows).filter(r=>r.target_total>0);
  const stProblem=st.map(r=>({label:r.store_name,v:r.gap_sales,achiev:r.achiev_total,sales:r.total_sales,target:r.target_total}));
  const shortfall=stProblem.filter(x=>x.v<0).slice().sort((a,b)=>a.v-b.v);
  const totalShort=shortfall.reduce((s,x)=>s+x.v,0);   // total shortfall (negatif) = total GAP yg perlu dikejar
  p.append(issueList('1. Toko di bawah target',`${ymLabel(y3,m1,m2)} · ${shortfall.length} dari ${stProblem.length} toko ber-target tidak mencapai target`,
    shortfall.map(x=>({t:`${x.label} — GAP ${compact(x.v)}`,
      c:`Sales ${compact(x.sales)} dari target ${compact(x.target)} (achievement ${achPct(x.achiev)}). ${totalShort<0?pct(x.v/totalShort)+' dari total GAP seluruh toko di bawah target.':''}`}))));
  let _cum=0;
  const gapRows=shortfall.map(x=>{ _cum+=x.v; const share=totalShort<0?x.v/totalShort:0, cumShare=totalShort<0?_cum/totalShort:0;
    return [x.label,compact(x.v),pct(share),pct(Math.min(1,cumShare))]; });
  if(gapRows.length) p.append(card('Kontribusi toko terhadap total GAP',
    `Total GAP (toko di bawah target) ${compact(totalShort)} pada ${ymLabel(y3,m1,m2)} — diurutkan dari penyumbang gap terbesar`,
    mkTable([H('TOKO',{s:1}),H('GAP',{r:1}),H('% DARI TOTAL GAP',{r:1}),H('% KUMULATIF',{r:1})],gapRows)));
  p.append(el('div',{class:'note'},el('b',{},'Catatan granularitas. '),
    'Kontribusi GAP di atas dihitung per toko dari v_sales_dashboard (sales vs target_total), yang memang punya target per toko per bulan. '+
    'Target TIDAK tersedia per produk/kategori/warna/ukuran pada data saat ini, jadi temuan GAP-vs-target difokuskan di level toko saja — '+
    'rincian produk/brand/warna/ukuran di bawah (bagian 3-6) tetap dianalisis lewat YoY (turun vs tahun lalu), bukan vs target, karena targetnya tidak ada di level itu.'));

  /* 2. toko turun YoY — pelengkap dari temuan GAP-vs-target di atas, juga daftar konkret */
  const byS=new Map();
  rows.forEach(r=>{ const o=byS.get(r.store_id)||{n:r.store_name,cy:0}; o.cy+=N(r.total_sales); byS.set(r.store_id,o); });
  rowsPy.forEach(r=>{ const o=byS.get(r.store_id)||{n:r.store_name,cy:0}; o.py=(o.py||0)+N(r.total_sales); byS.set(r.store_id,o); });
  const stYoy=[...byS.values()].filter(o=>o.py>0).map(o=>({label:o.n,v:o.cy-o.py,cy:o.cy,py:o.py}));
  const stYoyDown=stYoy.filter(x=>x.v<0).sort((a,b)=>a.v-b.v);
  p.append(issueList(`2. Toko turun dibanding ${y2} (YoY)`,`${ymLabel(y3,m1,m2)} vs ${ymLabel(y2,m1,m2)} · ${stYoyDown.length} dari ${stYoy.length} toko dengan pembanding turun`,
    stYoyDown.map(x=>({t:`${x.label} — turun ${compact(Math.abs(x.v))} (${pct(x.py?x.v/x.py:null)})`,
      c:`${compact(x.cy)} di ${y3} vs ${compact(x.py)} di ${y2}.`}))));

  /* data tambahan untuk Ringkasan 5 Why — per SPV Area & per bulan (dipakai di bagian bawah halaman) */
  const bySpv=new Map();
  rows.forEach(r=>{ const sObj=S.stores.find(s=>s.id===r.store_id); const spv=(sObj&&sObj.spv)||'(tanpa SPV)';
    const o=bySpv.get(spv)||{n:spv,cy:0,py:0}; o.cy+=N(r.total_sales); bySpv.set(spv,o); });
  rowsPy.forEach(r=>{ const sObj=S.stores.find(s=>s.id===r.store_id); const spv=(sObj&&sObj.spv)||'(tanpa SPV)';
    const o=bySpv.get(spv)||{n:spv,cy:0,py:0}; o.py+=N(r.total_sales); bySpv.set(spv,o); });
  const spvYoy=[...bySpv.values()].filter(o=>o.py>0).map(o=>({...o,delta:o.cy-o.py})).sort((a,b)=>a.delta-b.delta);
  const byMonth=new Map();
  rows.forEach(r=>{ const o=byMonth.get(r.month)||{m:r.month,cy:0,py:0}; o.cy+=N(r.total_sales); byMonth.set(r.month,o); });
  rowsPy.forEach(r=>{ const o=byMonth.get(r.month)||{m:r.month,cy:0,py:0}; o.py+=N(r.total_sales); byMonth.set(r.month,o); });
  const monthYoy=[...byMonth.values()].filter(o=>o.py>0).map(o=>({...o,delta:o.cy-o.py})).sort((a,b)=>a.delta-b.delta);

  /* 3-6: item/brand/warna/ukuran turun — perlu rollup dari database (async) */
  const host=el('div',{style:'display:flex;flex-direction:column;gap:18px'});
  p.append(host);
  host.append(el('div',{class:'empty'},'Memuat rincian produk, brand, warna & ukuran…'));
  (async()=>{
    try{
      /* round 22: dim 'color' dihitung client-side dari dim 'product' — lihat colorRowsFromProducts. */
      const dims=['product','brand','size'];
      const res={}; await Promise.all(dims.map(async d=>{
        res[d]=await Promise.all([y2,y3].map(y=>rollup(d,y,m1,m2,{limit:400,stores:bdLocalIds(),category:f.category||null})));
      }));
      res.color=res.product.map(yearRows=>colorRowsFromProducts(yearRows));
      host.innerHTML='';
      const titles={product:'3. Produk turun signifikan',brand:'4. Brand turun signifikan',color:'5. Warna turun signifikan',size:'6. Ukuran turun signifikan'};
      ['product','brand','color','size'].forEach(d=>{
        const [py,cy]=res[d];
        const pm=new Map(py.map(r=>[r.k,N(r.sales)])), cm=new Map(cy.map(r=>[r.k,N(r.sales)]));
        const items=[...pm.keys()].filter(k=>k&&!/^\(Tanpa/.test(k)).map(k=>({label:k,v:(cm.get(k)||0)-pm.get(k),cy:cm.get(k)||0,py:pm.get(k)}));
        const down=items.filter(x=>x.v<0).sort((a,b)=>a.v-b.v).slice(0,15);
        host.append(issueList(titles[d]+' (net sales, YoY)',ymLabel(y3,m1,m2)+' vs '+ymLabel(y2,m1,m2)+` · ${down.length} dari ${items.length} turun`,
          down.map(x=>({t:`${x.label} — turun ${compact(Math.abs(x.v))} (${pct(x.py?x.v/x.py:null)})`,
            c:`${compact(x.cy)} di ${y3} vs ${compact(x.py)} di ${y2}.`}))));
      });
      /* tambahan item 8: toko/produk dengan sales nol/mendekati nol di y3 padahal ada aktivitas di y2 —
         indikasi aktivitas berhenti (stock-out, toko tutup sementara, dsb), bukan sekadar turun. */
      const zeroStores=[...byS.values()].filter(o=>(o.py||0)>0 && (o.cy||0)<=((o.py||0)*0.05));
      host.append(issueList('Toko nyaris tanpa aktivitas di periode ini',`${ymLabel(y3,m1,m2)} · sales ${y3} ≤5% dari ${y2} — indikasi stock-out/toko tutup/berhenti jual`,
        zeroStores.sort((a,b)=>(b.py||0)-(a.py||0)).map(o=>({t:`${o.n} — sales ${y3} ${compact(o.cy||0)}`,c:`Padahal ${compact(o.py)} di ${y2} pada periode sama — perlu dicek ketersediaan stok/operasional.`}))));
      bdRenderSummary(res);
    }catch(e){ host.innerHTML=''; host.append(el('div',{class:'note warn'},'Gagal memuat rincian item: '+e.message)); }
  })();

  /* Ringkasan 5 Why (otomatis) — ditulis sebagai closing synthesis, ditaruh paling bawah
     halaman ini (lihat bdRenderSummary, dipanggil setelah semua kartu analisis di atas selesai
     tampil, termasuk 3-6 yang async & bagian 7 Transaksi & AOV di bawah). */
  function bdRenderSummary(res){
    const topStoreGap=stProblem.slice().sort((x,y)=>x.v-y.v)[0];        // GAP thd target terburuk
    const topStoreYoy=stYoy.slice().sort((x,y)=>x.v-y.v)[0];            // turun YoY terbesar
    const topSpv=spvYoy[0];
    const worstMonth=monthYoy[0];
    const pick=(dim)=>{ const [py,cy]=res[dim]; const pm=new Map(py.map(r=>[r.k,N(r.sales)])), cm=new Map(cy.map(r=>[r.k,N(r.sales)]));
      return [...pm.keys()].filter(k=>k&&!/^\(Tanpa/.test(k)).map(k=>({k,v:(cm.get(k)||0)-pm.get(k),cy:cm.get(k)||0,py:pm.get(k)}))
        .sort((x,y)=>x.v-y.v)[0]; };
    const topProd=pick('product'), topBrand=pick('brand'), topColor=pick('color'), topSize=pick('size');
    /* traffic (jumlah transaksi) vs pricing (AOV) — dihitung ulang di sini dari h2 (bagian 7, sudah tersedia
       karena bagian ini dipanggil lewat microtask setelah kode sinkron bagian 7 berjalan) */
    const trafficDrove = deltaTrxY2!=null && deltaAovY2!=null && Math.abs(deltaTrxY2) >= Math.abs(deltaAovY2);
    const notes=[];
    notes.push({t:'Apa yang terjadi (berdampak ke GAP)?',c:
      `Total GAP thd target (toko-toko di bawah target saja) ${compact(totalShort)} pada ${ymLabel(y3,m1,m2)}, achievement keseluruhan ${achPct(a.achiev_total)}. `+
      (topStoreGap?`Penyumbang terbesar: ${topStoreGap.label} (${compact(topStoreGap.v)}, ${pct(totalShort<0?topStoreGap.v/totalShort:null)} dari total GAP).`:'tidak ada toko dengan target pada filter ini.')+' '+
      (gap<0?`Sales ${compact(a.total_sales)} juga turun ${compact(Math.abs(gap))} (${pct(totPy?gap/totPy:null)}) dibanding periode sama ${y2} (${compact(totPy)}).`
        :`Sales ${compact(a.total_sales)} justru tumbuh ${compact(gap)} (${pct(totPy?gap/totPy:null)}) dibanding ${y2} (${compact(totPy)}) walau GAP thd target masih ada.`)});
    notes.push({t:'Di toko mana paling terasa?',c:
      (topStoreGap?`Kontribusi GAP terbesar ada di ${topStoreGap.label}: ${compact(topStoreGap.v)} (${pct(totalShort<0?topStoreGap.v/totalShort:null)} dari total GAP thd target). `:'')+
      (topStoreYoy&&topStoreYoy.v<0?`Penurunan YoY terbesar ada di ${topStoreYoy.label}, turun ${compact(Math.abs(topStoreYoy.v))} dibanding ${y2}.`
        :topStoreYoy?`Toko dengan selisih YoY terbesar: ${topStoreYoy.label} (${compact(topStoreYoy.v)}), masih tumbuh.`:'belum ada toko dengan pembanding tahun lalu pada filter ini.')});
    notes.push({t:'Di SPV Area mana akar masalahnya?',c:
      topSpv?`${spvLabel(topSpv.n)||topSpv.n} mencatat selisih YoY terbesar: ${compact(topSpv.delta)} (${compact(topSpv.cy)} di ${y3} vs ${compact(topSpv.py)} di ${y2}, ${pct(topSpv.py?topSpv.delta/topSpv.py:null)}). `+
        (spvYoy.length>1?`Area berikutnya: ${spvLabel(spvYoy[1].n)||spvYoy[1].n} (${compact(spvYoy[1].delta)}).`:'')
        :'tidak ada data SPV Area dengan pembanding tahun lalu untuk dibandingkan.'});
    notes.push({t:'Di periode/bulan mana paling dalam?',c:
      worstMonth?`Bulan ${MONTHS[worstMonth.m-1]} ${y3} punya selisih YoY terdalam: ${compact(worstMonth.delta)} (${compact(worstMonth.cy)} vs ${compact(worstMonth.py)} di bulan sama ${y2}, ${pct(worstMonth.py?worstMonth.delta/worstMonth.py:null)}). `+
        (monthYoy.length>1?`Disusul ${MONTHS[monthYoy[1].m-1]} (${compact(monthYoy[1].delta)}).`:'')
        :'rentang periode yang dipilih hanya 1 bulan atau tanpa pembanding tahun lalu.'});
    notes.push({t:'Produk/brand/warna/ukuran mana penyebabnya?',c:
      [topProd&&topProd.v<0?`Produk "${topProd.k}" turun ${compact(Math.abs(topProd.v))} (dari ${compact(topProd.py)} jadi ${compact(topProd.cy)}).`:null,
       topBrand&&topBrand.v<0?`Brand ${topBrand.k} turun ${compact(Math.abs(topBrand.v))}.`:null,
       topColor&&topColor.v<0?`Warna ${topColor.k} turun ${compact(Math.abs(topColor.v))}.`:null,
       topSize&&topSize.v<0?`Ukuran ${topSize.k} turun ${compact(Math.abs(topSize.v))}.`:null].filter(Boolean).join(' ')
       ||'tidak ditemukan penurunan signifikan di level produk/brand/warna/ukuran pada filter ini.'});
    notes.push({t:'Soal traffic (transaksi) atau harga (AOV)?',c:
      (deltaTrxY2==null||deltaAovY2==null)?'belum cukup data transaksi tahun lalu pada jendela tanggal yang sama untuk disimpulkan.':
      trafficDrove?`Lebih didorong oleh jumlah transaksi (traffic): Δ transaksi ${pct(deltaTrxY2)} vs Δ AOV ${pct(deltaAovY2)} dibanding ${y2}. `+
        `Artinya kemungkinan soal kunjungan/lalu-lintas pembeli (traffic toko/marketplace) atau ketersediaan stok, bukan harga jual.`
        :`Lebih didorong oleh AOV (nilai rata-rata transaksi): Δ AOV ${pct(deltaAovY2)} vs Δ transaksi ${pct(deltaTrxY2)} dibanding ${y2}. `+
        `Artinya kemungkinan soal pricing/diskon/mix produk, bukan jumlah pembeli.`});
    p.append(card('Ringkasan 5 Why (otomatis)','sintesis penutup dari seluruh kartu analisis di atas — titik awal investigasi, telusuri lebih lanjut ke PICA/MOM',
      el('div',{style:'display:flex;flex-direction:column;gap:9px'},...notes.map((n,i)=>el('div',{class:'item'},el('div',{class:'t'},`Why ${i+1} — ${n.t}`),el('div',{class:'c'},n.c))))));
  }

}

function renderPica(){
  parkFilters();
  const p=$('#p-pica'); p.innerHTML='';
  const f=S.pf||(S.pf={kind:'',pic:'',status:'',active:true});
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'PICA / MOM'),
    el('p',{},'Tugas, issue, penugasan khusus dan hasil rapat (MOM) lengkap dengan PIC, status dan tenggat — sambungan Google Calendar diatur di Pengaturan → Integrasi.')),
    el('span',{class:'spacer'}),el('button',{class:'btn pri',onclick:()=>picaForm()},'+ Tambah butir')));
  if(S.demo) p.append(demoBanner());
  const all=S.pica, today=todayStr();
  const act=all.filter(x=>x.status==='OPEN'||x.status==='ON_PROGRESS');
  const od=act.filter(picaOverdue);
  const in7=act.filter(x=>x.due_date&&x.due_date>=today&&x.due_date<=(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})());
  const tl=el('div',{class:'grid g4'});
  tl.append(tile('Aktif',int(act.length),'belum jalan + berjalan',null));
  tl.append(tile('Lewat tenggat',int(od.length),od.length?'perlu ditindak segera':'tidak ada yang terlambat',null,el('span',{class:'pill '+(od.length?'bad':'ok')},od.length?'Terlambat':'Aman')));
  tl.append(tile('Jatuh tempo 7 hari',int(in7.length),'tenggat dalam sepekan',null));
  tl.append(tile('Selesai',int(all.filter(x=>x.status==='DONE').length),all.length?pct(all.filter(x=>x.status==='DONE').length/all.length,0)+' dari semua butir':'—',null));
  const filled=all.map(picaProgress).filter(v=>v!=null);
  p.append(tl);
  if(filled.length)p.append(el('div',{class:'rowline note'},'Progress rata-rata:',pillCell(filled.reduce((a,b)=>a+b,0)/filled.length/100),filled.length+' butir memiliki progress'));

  /* ringkasan per PIC */
  {
    const pics=[...new Set([...S.people.filter(x=>x.is_active!==false).map(x=>x.name),...all.map(x=>x.pic).filter(Boolean)])];
    const rows=pics.map(n=>{ const m=all.filter(x=>x.pic===n); return [picLabel(n),int(m.filter(x=>x.status==='OPEN').length),int(m.filter(x=>x.status==='ON_PROGRESS').length),
      int(m.filter(x=>x.status==='DONE').length),int(m.filter(picaOverdue).length),int(m.length)]; }).filter(r=>r[5].raw>0||true);
    p.append(card('Beban per PIC','',mkTable([H('PIC',{s:1}),H('BELUM JALAN',{r:1}),H('BERJALAN',{r:1}),H('SELESAI',{r:1}),H('TERLAMBAT',{r:1}),H('TOTAL',{r:1})],rows)));
  }

  /* filter */
  const mkSel=(id,label,opts,val,key)=>el('div',{class:'fld'},el('label',{for:id},label),
    el('select',{id,onchange:e=>{ f[key]=e.target.value; renderPica(); }},opts.map(([v,t])=>el('option',{value:v,selected:val===v?'':null},t))));
  const picOpts=[['','Semua PIC'],...[...new Set([...S.people.map(x=>x.name),...all.map(x=>x.pic).filter(Boolean)])].map(n=>[n,picLabel(n)])];
  p.append(el('div',{class:'rowline'},
    mkSel('pf-kind','Jenis',[['','Semua jenis'],...Object.entries(PICA_KINDS)],f.kind,'kind'),
    mkSel('pf-pic','PIC',picOpts,f.pic,'pic'),
    mkSel('pf-status','Status',[['','Semua status'],...Object.entries(PICA_STATUS)],f.status,'status')));
  let rows=all.filter(x=>(!f.kind||x.kind===f.kind)&&(!f.pic||x.pic===f.pic)&&(!f.status||x.status===f.status));
  const heads=[H('#',{r:1}),H('JENIS'),H('JUDUL',{s:1}),H('PIC'),H('STATUS'),H('PRIORITAS'),H('TENGGAT'),H('WEEK UPDATE'),H('PROGRESS'),H('TOKO'),H('')];
  const tb=el('tbody');
  rows.forEach((x,i)=>{ const st=S.stores.find(s=>s.id===x.store_id); const g=gcalLink(x);
    tb.append(el('tr',{},
      el('td',{class:'r'},String(x.id)),
      el('td',{},el('span',{class:'pill neu'},PICA_KINDS[x.kind]||x.kind)),
      el('td',{class:'sticky1',style:'white-space:normal;min-width:240px;max-width:380px',title:x.detail||''},el('div',{style:'font-weight:600'},x.title),
        x.detail?el('div',{style:'font-size:11.5px;color:var(--muted);font-weight:400'},x.detail):null),
      el('td',{},picLabel(x.pic)),
      el('td',{},el('span',{class:'pill '+(x.status==='DONE'?'ok':x.status==='ON_PROGRESS'?'mid':x.status==='DROPPED'?'neu':'neu')},PICA_STATUS[x.status]||x.status)),
      el('td',{},el('span',{class:'pill '+(x.priority==='HIGH'?'bad':x.priority==='LOW'?'neu':'mid')},PICA_PRIO[x.priority]||'—')),
      el('td',{style:picaOverdue(x)?'color:var(--crit);font-weight:700':''},x.due_date||'—',picaOverdue(x)?' ⚠':''),
      el('td',{},isoWeek(x.meeting_date),el('div',{class:'sub'},x.meeting_date||'')),
      el('td',{},pillCell(picaProgress(x)==null?null:picaProgress(x)/100)),
      el('td',{},st?st.name:'Semua'),
      el('td',{},el('div',{class:'rowline',style:'flex-wrap:nowrap'},
        el('button',{class:'btn sm',onclick:()=>picaForm(x)},'Ubah'),
        x.status!=='DONE'?el('button',{class:'btn sm',onclick:async()=>{ if(guard())return; try{ await DB.patch('pica','id=eq.'+x.id,{status:'DONE',updated_at:new Date().toISOString()}); await opsPut('pica',String(x.id),{progress:100}); toast('Ditandai selesai.'); await loadAll(); }catch(e){ toast('Gagal: '+e.message); } }},'Selesai'):null,
        g?el('a',{class:'btn sm',href:g,target:'_blank',rel:'noopener',style:'text-decoration:none'},'+ Kalender'):null,
        el('button',{class:'btn sm',onclick:async()=>{ if(guard())return; if(!confirm('Hapus butir ini?'))return; try{ await DB.del('pica','id=eq.'+x.id); await opsRemove('pica',String(x.id)); toast('Dihapus.'); await loadAll(); }catch(e){ toast('Gagal: '+e.message); } }},'Hapus')))));
  });
  if(!rows.length) tb.append(el('tr',{},el('td',{colspan:String(heads.length),style:'color:var(--muted)'},'Belum ada butir. Tekan “+ Tambah butir”.')));
  p.append(card('Daftar PICA / MOM',`${rows.length} butir`,el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},heads.map(h=>el('th',{class:(h.r?'r':'')+(h.s?' sticky1':'')},h.t)))),tb))));
}

function picaForm(x={}){
  const bx=el('div',{class:'box'});

/* =====================================================================
   TARIK DATA LANGSUNG DARI GOOGLE SHEET (butuh sheet bisa dibaca lewat link)
   ===================================================================== */
async function sheetCsvFile(tab){
  const id=S.settings.source_spreadsheet||'1am4zrJ3TK-ODZmrVFNQv3Ci1nudh-AUb50EzQ5daL9M';
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
  let r; try{ r=await fetch(url); }catch(e){ throw new Error('tidak bisa mengambil sheet dari browser ini ('+e.message+') — unduh tab itu sebagai CSV lalu unggah manual'); }
  if(!r.ok) throw new Error('HTTP '+r.status+' dari Google Sheet');
  const txt=await r.text();
  if(/^\s*<(!doctype|html)/i.test(txt)) throw new Error('sheet tidak bisa dibaca publik — bagikan “siapa saja yang punya link” atau unggah CSV manual');
  return new File([txt],tab+'.csv',{type:'text/csv'});
}
async function pullSheet(kind,btn){
  if(guard()) return;
  const old=btn.textContent; btn.disabled=true; btn.textContent='Menarik…';
  try{
    logLine(`\n=== tarik dari Google Sheet · ${kind} ===`);
    if(kind==='trx'){ const f=await sheetCsvFile('TRANSAKSI'); const rows=await readSheet(f,NEED.trx); await ingestTrx(f,rows); }
    else if(kind==='master'){ const f=await sheetCsvFile('DATABASE STOCK'); const rows=await readSheet(f,NEED.master); logLine(`  ▸ ${int(rows.length)} baris master terbaca`); await ingestMaster(f,rows); }
    else if(kind==='target'){ await pullTargets(); }
    else if(kind==='spv'){ await pullSpv(); }
    S.rollCache.clear(); await loadAll(); toast('Selesai ditarik dari Google Sheet.');
  }catch(e){ logLine('  ✗ '+e.message); toast('Gagal: '+e.message); }
  btn.disabled=false; btn.textContent=old;
}
/* Parser inti sheet TARGET (dipakai baik untuk tarik Drive dulu maupun upload manual).
   Struktur: row header bulan di baris pertama, lalu section "TOTAL TARGET NAMA TOKO" (section
   pertama ini headernya ikut di row 0 makanya sec diawali 'TOTAL'), "TARGET KOMERSIAL",
   "TARGET USER", lalu "TARGET BRAND". */
function parseTargetAoa(aoa){
  const hdr=aoa[0]||[]; const per=[];
  for(let i=1;i<=12;i++){ const t=String(hdr[i]||''); const m=monthFromWord(t.split(/[\s-]+/)[0]); const ym=/(\d{2,4})\s*$/.exec(t);
    per.push({m:m||i,y:ym?(ym[1].length===2?2000+Number(ym[1]):Number(ym[1])):S.year}); }
  let sec='TOTAL'; const T=new Map(), BT=[];
  for(const row of aoa.slice(1)){
    const nm=String(row[0]||'').trim(), up=nm.toUpperCase(); if(!nm) continue;
    if(/^TOTAL TARGET/.test(up)){ sec='TOTAL'; continue; } if(up==='TARGET KOMERSIAL'){ sec='KOM'; continue; }
    if(up==='TARGET USER'){ sec='USER'; continue; } if(up==='TARGET BRAND'){ sec='BRAND'; continue; }
    if(up==='NAMA TOKO'||up==='TOTAL') continue;
    if(sec==='BRAND'){ per.forEach((pp,i)=>BT.push({brand:up,year:pp.y,month:pp.m,target:num(row[i+1])})); continue; }
    if(!sec) continue;
    const sid=findStore(nm); if(!sid) continue;
    per.forEach((pp,i)=>{ const k=sid+'|'+pp.y+'|'+pp.m; const o=T.get(k)||{store_id:sid,year:pp.y,month:pp.m,target_total:0,target_komersial:0,target_user:0};
      const v=num(row[i+1]); if(sec==='TOTAL')o.target_total=v; else if(sec==='KOM')o.target_komersial=v; else o.target_user=v; T.set(k,o); });
  }
  /* jaring pengaman: TOTAL TARGET = KOMERSIAL + USER selalu, jadi bila section TOTAL kosong/tidak
     terbaca (misalnya file manual cuma punya 2 section), tetap hitung dari komersial+user */
  for(const o of T.values()) if(!o.target_total) o.target_total=o.target_komersial+o.target_user;
  return {T,BT};
}
async function pullTargets(){
  const f=await sheetCsvFile('TARGET');
  const wb=XLSX.read(await f.text(),{type:'string',raw:true});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
  const {T,BT}=parseTargetAoa(aoa);
  if(!T.size) throw new Error('tidak ada baris target yang dikenali');
  await DB.write('targets',[...T.values()],'store_id,year,month');
  if(BT.length) await DB.write('brand_targets',BT,'brand,year,month');
  logLine(`  ✓ TARGET · ${T.size} baris target toko-bulan, ${BT.length} baris target brand`);
}
/* Upload manual file TARGET (xlsx/csv dengan struktur sama seperti tab TARGET) */
async function ingestTarget(file){
  const isCsv=/\.csv$/i.test(file.name);
  const wb=isCsv ? XLSX.read(await file.text(),{type:'string',raw:true}) : XLSX.read(await file.arrayBuffer(),{type:'array'});
  let best=null;
  for(const sn of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});
    if(!aoa.length) continue;
    const {T,BT}=parseTargetAoa(aoa);
    if(!best||T.size>best.T.size) best={T,BT,sheet:sn};
  }
  if(!best||!best.T.size) throw new Error('tidak ada baris target yang dikenali pada file ini');
  await DB.write('targets',[...best.T.values()],'store_id,year,month');
  if(best.BT.length) await DB.write('brand_targets',best.BT,'brand,year,month');
  logLine(`  ▸ ${file.name}: sheet "${best.sheet}" · ${best.T.size} baris target toko-bulan, ${best.BT.length} baris target brand`);
}
async function pullSpv(){
  const f=await sheetCsvFile('MAPING SPV'); const rows=await readSheet(f,['SPV AREA','STORE NAME']);
  if(!rows.length) throw new Error('tab MAPING SPV kosong');
  const r0=rows[0]; const kM=col(r0,'OPR MGR'), kS=col(r0,'SPV AREA'), kN=col(r0,'STORE NAME'), kZ=col(r0,'ZONA'), kA=col(r0,'ALAMAT');
  let n=0; const skip=[]; const ppl=new Map();
  for(const r of rows){
    const nm=String(r[kN]||'').trim(); if(!nm) continue;
    const spv=String(r[kS]||'').trim().toUpperCase(), mgr=String(r[kM]||'').trim();
    if(spv) ppl.set(spv,{name:spv,label:'SPV '+spv[0]+spv.slice(1).toLowerCase(),role:'SPV',is_active:true,sort_order:10});
    if(mgr) ppl.set(mgr,{name:mgr,label:'Mgr '+mgr.split(' ')[0],role:'MGR',is_active:true,sort_order:1});
    const sid=findStore(nm); if(!sid){ skip.push(nm); continue; }
    await DB.patch('stores','id=eq.'+sid,{spv:spv||null,opr_mgr:mgr||null,zona:kZ?String(r[kZ]||'').trim()||null:null,alamat:kA?String(r[kA]||'').trim()||null:null}); n++;
  }
  const existing=new Set(S.people.map(q=>q.name)); const addP=[...ppl.values()].filter(q=>!existing.has(q.name));
  if(addP.length) await DB.write('people',addP,'name');
  logLine(`  ✓ MAPING SPV · ${n} toko diperbarui`+(skip.length?`, dilewati (belum ada di daftar toko): ${skip.join(', ')}`:''));
}

  const gm=new Map(); growthScope().filter(r=>r.growth_vs_y1!=null).forEach(r=>{ const o=gm.get(r.store_id)||{cy:0,py:0}; o.cy+=N(r.sales_cy); o.py+=N(r.sales_y1); gm.set(r.store_id,o); });

    return [r.store_name,s.spv?spvLabel(s.spv):'—',compact(r.total_sales),compact(r.target_total),pillCell(r.achiev_total),

  const a=agg(rows);
  return card('Ringkasan per toko',periodLabel(),mkTable(heads,body,['TOTAL','',compact(a.total_sales),compact(a.target_total),pillCell(a.achiev_total),compact(a.gap_sales),compact(a.sales_komersial),compact(a.sales_user),'','','','']));

function normColor(s){return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]+/g,' ').trim().replace(/\s+/g,' ');}
let OPS_COLOR_SOURCE=null,OPS_COLOR_TRIE=null;
const OPS_COLOR_CACHE=new Map();
function colorMatches(name){
  const clean=normColor(name);if(!clean)return [];
  const source=S.settings?.ops_color_map||'';
  if(source!==OPS_COLOR_SOURCE||!OPS_COLOR_TRIE){
    OPS_COLOR_SOURCE=source;OPS_COLOR_CACHE.clear();
    const custom=opsObject(source)||{},base={...COLOR_BASE,...COLOR_COMPOUND,...OPS_COLORS},dict={...base};
    for(const [k,h] of Object.entries(base)){
      if(!/^(LIGHT|DARK|PALE|DEEP) /.test(k))for(const [m,to,t] of [['LIGHT','w',.45],['PALE','w',.6],['DARK','k',.3],['DEEP','k',.2]])if(!dict[m+' '+k])dict[m+' '+k]=mixHex(h,to,t);
      if(!/ (MUDA|TERANG|TUA|GELAP)$/.test(k))for(const [m,to,t] of [['MUDA','w',.45],['TERANG','w',.3],['TUA','k',.3],['GELAP','k',.4]])if(!dict[k+' '+m])dict[k+' '+m]=mixHex(h,to,t);
    }
    for(const [k,v] of Object.entries(custom))if(/^#[0-9a-f]{6}$/i.test(v)&&normColor(k))dict[normColor(k)]=v;
    OPS_COLOR_TRIE={next:new Map()};
    for(const [label,hex] of Object.entries(dict)){let node=OPS_COLOR_TRIE;const words=label.split(' ');for(const word of words){if(!node.next.has(word))node.next.set(word,{next:new Map()});node=node.next.get(word);}node.color={label,hex,words:words.length};}
  }
  if(OPS_COLOR_CACHE.has(clean))return OPS_COLOR_CACHE.get(clean);
  const tokens=clean.split(' '),hits=[];
  for(let start=0;start<tokens.length;start++){let node=OPS_COLOR_TRIE;for(let end=start;end<tokens.length;end++){node=node.next.get(tokens[end]);if(!node)break;if(node.color)hits.push({...node.color,start,end});}}
  hits.sort((a,b)=>b.words-a.words||b.label.length-a.label.length||a.start-b.start);
  const selected=[];for(const hit of hits)if(!selected.some(x=>hit.start<=x.end&&hit.end>=x.start))selected.push(hit);
  const result=selected.sort((a,b)=>a.start-b.start);if(OPS_COLOR_CACHE.size>=5000)OPS_COLOR_CACHE.delete(OPS_COLOR_CACHE.keys().next().value);OPS_COLOR_CACHE.set(clean,result);return result;
}
function colorMatch(name){const hits=colorMatches(name);if(!hits.length)return null;const sorted=[...hits].sort((a,b)=>b.words-a.words||b.label.length-a.label.length||b.start-a.start),best=sorted[0];const combined=/\/|\+|\b(?:AND|DAN)\b/i.test(String(name))&&hits.length>1;return {label:combined?hits.map(x=>x.label).join(' / '):best.label,hex:best.hex,colors:combined?hits.map(x=>x.hex):[best.hex],ambiguous:!combined&&hits.length>1};}
function colorHex(name){return colorMatch(name)?.hex||null;}
function deriveWarna(name){return colorMatch(name)?.label||null;}
function parseColor(name){return deriveWarna(name);}
function colorChip(name){const match=colorMatch(name);if(!match)return el('span',{class:'cchip unmapped',title:'Belum dipetakan — tambahkan nama warna khusus di Pengaturan'},name||'—');const bg=match.colors.length>1?'linear-gradient(110deg,'+match.colors.map((c,i)=>c+' '+(i*100/match.colors.length)+'%, '+c+' '+((i+1)*100/match.colors.length)+'%').join(',')+')':match.hex;return el('span',{class:'cchip',title:match.label,style:`background:${bg};color:${lum(match.hex)>.42?'#15202b':'#fff'}`},String(name));}
