    el('div',{class:'rowline',style:'flex-wrap:wrap;align-items:flex-end'},

/* round 10 item 9: pillCell tetap pakai kelas ok/mid/bad (bentuk & ambang 90%/100% tidak berubah), tapi
   untuk ok/bad warnanya sekarang digradasi lewat trendColor() berdasar seberapa jauh dari 100% — capaian
   101% vs 150% kini kelihatan beda pekatnya, bukan hijau flat yang sama. Zona 'mid' (90–100%) dibiarkan
   warn flat seperti sebelumnya karena itu memang zona peringatan, bukan skala naik/turun. */
function pillCell(a){
  if(a==null) return el('span',{class:'pill neu'},'—');
  const cls=achClass(a);
  const extra = cls!=='mid' ? {style:`color:${trendColor(a-1)};background:${trendBg(a-1)};border-color:${trendBorder(a-1)}`} : {};
  return el('span',Object.assign({class:'pill '+cls,'data-v':a},extra),pct(a,0));
}

/* ---------- ITEM SALES ---------- */
async function renderItem(){
  parkFilters();
  const p=$('#p-item'); p.innerHTML='';
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Item Sales'),
    el('p',{},'Total Item Sold sudah bersih: item sold − item refunded. '+periodLabel()))));
  const pf_item=pageFilterBar('item'); if(pf_item) p.append(pf_item);
  if(S.demo) p.append(demoBanner());
  /* round 9 item 1: pakai periodM1M2()/scopeStoreIds() yang sama persis dengan rollup()/Brand Performance,
     supaya total Item Sales selalu konsisten dengan Brand Performance pada filter apa pun.
     round 10 item 7: halaman ini TIDAK LAGI menarik baris mentah item_sales ke browser — item_sales punya
     ~108rb baris/tahun dan DB.selAll() diam-diam berhenti paginasi di cap=40000 baris, jadi untuk cakupan
     penuh (setahun, 13 toko) hanya ~37% baris yang kebaca dan totalnya salah (lebih kecil dari Brand
     Performance yang memakai RPC item_rollup, agregasi penuh di server). Sekarang Item Sales memakai 3 RPC
     server-side baru (item_totals/item_top/item_categories_scoped) yang mengagregasi SELURUH baris di
     database tanpa batas — jadi totalnya WAJIB sama persis dengan tile "Total item sales" di Brand
     Performance untuk filter yang identik. */
  const [im1,im2]=periodM1M2(S.year);
  const ids=scopeStoreIds();
  const pStores=ids&&ids.length?ids:(ids?[-1]:null);
  const ex=excludedCats();

  /* daftar kategori untuk dropdown lokal — discope ke tahun/periode/toko aktif (round 10 item 7),
     bukan daftar kategori global yang tidak sadar demo/filter seperti sebelumnya */
  const catKey=`${S.year}|${im1}|${im2}|${JSON.stringify(pStores)}`;
  if(S.itemCatListScope!==catKey){
    p.append(el('div',{class:'empty'},'Memuat kategori…'));
    (async()=>{
      try{
        if(S.demo) S.itemCatList=[...new Set(demoItems().map(r=>r.category_name).filter(Boolean))].sort();
        else{ const rows=await DB.rpc('item_categories_scoped',{p_year:S.year,p_m1:im1,p_m2:im2,p_stores:pStores});
          S.itemCatList=rows.map(r=>r.category).filter(Boolean).sort(); }
        S.itemCatListScope=catKey; renderItem();
      }catch(e){ toast('Gagal memuat kategori: '+e.message); }
    })();
    return;
  }
  const catOpts=S.itemCatList||[];
  const catSel=el('select',{id:'item-cat'},el('option',{value:''},'Semua kategori'),
    catOpts.map(c=>el('option',{value:c,selected:S.itemCat===c?'':null},c)));
  catSel.onchange=()=>{ S.itemCat=catSel.value; renderItem(); };
  p.append(el('div',{class:'rowline',style:'margin-bottom:11px'},
    el('div',{class:'fld'},el('label',{for:'item-cat'},'Kategori'),catSel)));

  /* tiles + peringkat item: dari item_totals / item_top (agregasi server, bukan raw rows) */
  const key=`${S.year}|${im1}|${im2}|${S.store}|${S.brand}|${S.spv}|${S.itemCat||''}`;
  if(S.itemScope!==key){
    p.append(el('div',{class:'empty'},'Memuat data item…'));
    (async()=>{
      try{
        if(S.demo){
          const all=demoItems();
          const catScoped=all.filter(r=>!S.itemCat||r.category_name===S.itemCat);
          const rows=catScoped.filter(r=>!isExcludedCat(r.category_name,ex));
          const sold=rows.reduce((s,r)=>s+N(r.item_sold),0), ref=rows.reduce((s,r)=>s+N(r.item_refunded),0), net=rows.reduce((s,r)=>s+N(r.net_sales),0);
          S.itemTotals={sold,refunded:ref,net_sales:net,sku_count:new Set(rows.map(r=>r.sku||r.item_name)).size,row_count:rows.length};
          const itm=new Map();
          rows.forEach(r=>{ const k=(r.item_name||'')+'|'+(r.item_variant_name||'');
            const o=itm.get(k)||{item_name:r.item_name,item_variant_name:r.item_variant_name,category:r.category_name,sku:r.sku,sold:0,refunded:0,net_sales:0};
            o.sold+=N(r.item_sold); o.refunded+=N(r.item_refunded); o.net_sales+=N(r.net_sales); itm.set(k,o); });
          S.itemTop=[...itm.values()].sort((a,b)=>(b.sold-b.refunded)-(a.sold-a.refunded)).slice(0,300);
          S.itemScope=key; renderItem(); return;
        }
        const args={p_year:S.year,p_m1:im1,p_m2:im2,p_stores:pStores,p_category:S.itemCat||null,p_exclude:ex.length?ex:null};
        const [totRows,topRows]=await Promise.all([
          DB.rpc('item_totals',args),
          DB.rpc('item_top',{...args,p_limit:300})
        ]);
        S.itemTotals=(totRows&&totRows[0])?totRows[0]:{sold:0,refunded:0,net_sales:0,sku_count:0,row_count:0};
        S.itemTop=topRows||[];
        S.itemScope=key; renderItem();
      }catch(e){ toast('Gagal memuat item: '+e.message); }
    })();
    return;
  }
  const tot=S.itemTotals||{sold:0,refunded:0,net_sales:0,sku_count:0,row_count:0};
  if(!N(tot.row_count)){ p.append(el('div',{class:'empty'},el('b',{},'Belum ada data item'),
    'Unggah file dari folder Item Sales di menu Upload Data.')); return; }

  const sold=N(tot.sold), ref=N(tot.refunded), net=N(tot.net_sales);
  const tiles=el('div',{class:'grid g4'});
  tiles.append(tile('Total Item Sold',int(sold-ref),`${int(sold)} terjual − ${int(ref)} refund`,null));
  tiles.append(tile('Net Sales',compact(net),'nilai bersih item',null));
  tiles.append(tile('Item Refunded',int(ref), sold?pct(ref/sold)+' dari item terjual':'—',null,
    el('span',{class:'pill '+(sold&&ref/sold>0.03?'bad':'ok')}, sold&&ref/sold>0.03?'Perlu dicek':'Wajar')));
  tiles.append(tile('Jumlah SKU',int(tot.sku_count),'SKU unik terjual',null));
  p.append(tiles);
  p.append(el('div',{class:'note'},el('b',{},'Catatan: '),
    'kategori kemasan (plastik OPP dsb) sudah dikecualikan di server sebelum angka di atas dihitung. '+
    'Daftar kategori yang dikecualikan bisa diubah di Pengaturan.'));

  /* kategori — rollup() sudah server-side & konsisten, cukup panggil ulang (tanpa fetch raw rows) */
  const catHost=chartCard('Net sales per kategori','Memuat…',el('div',{class:'empty'},'Memuat…'));
  p.append(catHost);
  rollup('category',S.year,im1,im2,{stores:ids,category:S.itemCat||undefined}).then(catArr=>{
    const sorted=catArr.slice().sort((a,b)=>b.sales-a.sales);
    catHost.replaceWith(chartCard('Net sales per kategori',`${sorted.length} kategori`,
      hBars(sorted.slice(0,12).map(r=>({label:r.k,v:r.sales,
        tip:`<div class="row"><span>Net sales</span><span>${compact(r.sales)}</span></div><div class="row"><span>Item sold</span><span>${int(r.qty)}</span></div>`})),
        {lw:168})));
  }).catch(e=>{ catHost.replaceWith(el('div',{class:'note warn'},'Gagal memuat kategori: '+e.message)); });

  /* top item — dari RPC item_top, group by item_name+variant+category+sku di server, tanpa batas 40k baris */
  const top=S.itemTop||[];
  const tb=el('tbody');
  top.forEach((r,i)=>tb.append(el('tr',{},
    el('td',{class:'r'},String(i+1)),
    el('td',{class:'sticky1'},r.item_name||'—'),
    el('td',{},r.item_variant_name||'—'),
    el('td',{},r.category||'—'),
    el('td',{class:'mono'},r.sku||'—'),
    el('td',{class:'r'},int(r.sold)),
    el('td',{class:'r'},int(r.refunded)),
    el('td',{class:'r',style:'font-weight:700'},int(r.sold-r.refunded)),
    el('td',{class:'r'},compact(r.net_sales)))));
  if(!top.length) tb.append(el('tr',{},el('td',{colspan:'9',style:'color:var(--muted)'},'Semua baris terkecualikan atau belum ada data.')));
  p.append(el('div',{class:'card'},
    el('header',{},el('h2',{},'Peringkat item'),el('span',{class:'sub'},`menampilkan ${top.length} teratas (agregasi server, lengkap)`)),
    el('div',{class:'tw'},el('table',{},
      el('thead',{},el('tr',{},['#','ITEM NAME','VARIANT','CATEGORY','SKU','ITEM SOLD','REFUNDED','TOTAL ITEM SOLD','NET SALES']
        .map((h,i)=>el('th',{class:(i===0||i>4?'r':'')+(i===1?' sticky1':'')},h)))),tb))));
}

/* ---------- TRANSAKSI & AOV ---------- */
function renderTrx(){
  parkFilters();
  const p=$('#p-trx'); p.innerHTML='';
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Transaksi & AOV'),
    el('p',{},'AOV = nilai transaksi ÷ jumlah transaksi. '+periodLabel()))));
  const pf_trx=pageFilterBar('trx'); if(pf_trx) p.append(pf_trx);
  if(S.demo) p.append(demoBanner());
  const t=trxScope();
  const sum=t.reduce((s,r)=>s+N(r.jumlah_transaksi),0), val=t.reduce((s,r)=>s+N(r.nilai_transaksi),0);
  const tiles=el('div',{class:'grid g4'});
  tiles.append(tile('Jumlah Transaksi',int(sum),'total struk',null));
  tiles.append(tile('Nilai Transaksi',compact(val),'total nilai',null));
  tiles.append(tile('AOV',sum?rp(val/sum):'—','rata-rata per transaksi',null));
  const uptTile=tile('UPT',sum?'Memuat…':'—','unit per transaksi',null);
  tiles.append(uptTile);
  p.append(tiles);
  /* round 12 item 1: UPT (Unit Per Transaksi) = unit terjual (item_rollup) ÷ jumlah transaksi — dimuat
     async supaya tile total tidak menunggu jaringan. */
  (async()=>{
    if(!sum){ uptTile.querySelector('.v').textContent='—'; return; }
    try{
      const [pm1,pm2]=periodM1M2(S.year);
      const res=await rollup('store',S.year,pm1,pm2,{limit:60});
      const units=res.reduce((s,r)=>s+r.qty,0);
      uptTile.querySelector('.v').textContent=(units/sum).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
    }catch(e){ uptTile.querySelector('.v').textContent='—'; }
  })();

  /* tren bulanan */
  const base=S.trx.filter(r=>storeOk(r.store_id));
  const mAov=MONTHS.map((_,i)=>{ const rs=base.filter(r=>r.month===i+1);
    const c=rs.reduce((s,r)=>s+N(r.jumlah_transaksi),0), v=rs.reduce((s,r)=>s+N(r.nilai_transaksi),0);
    return c>0?v/c:null; });
  const mTrx=MONTHS.map((_,i)=>base.filter(r=>r.month===i+1).reduce((s,r)=>s+N(r.jumlah_transaksi),0));
  const row=el('div',{class:'grid g2'});
  row.append(chartCard('AOV per bulan',S.year,lineChart(MON3,mAov,{h:225,name:'AOV',color:'var(--s3)',tip:v=>rp(v)})));
  row.append(chartCard('Jumlah transaksi per bulan',S.year,
    groupedBars(MON3,[{name:'Transaksi',color:'var(--s1)',vals:mTrx}],{h:260})));
  p.append(row);

  /* tabel + input — round 10 item 8: tambah kolom AKSI (Edit/Hapus) utk baris is_manual=true. Baris
     non-manual (dibangun otomatis dari Sales Type lewat rebuild_transaksi_from_raw) tidak boleh dihapus
     tangan — ditandai pill "Otomatis" netral, tanpa tombol aksi. */
  window.S_trxEditing=window.S_trxEditing||new Set();
  const tb=el('tbody');
  t.sort((a,b)=>a.month-b.month||a.store_name.localeCompare(b.store_name)).forEach(r=>{
    const rowKey=r.store_id+'|'+r.year+'|'+r.month;
    const editing=window.S_trxEditing.has(rowKey);
    let cCell,vCell,aksiCell;
    if(editing){
      const cIn2=el('input',{type:'number',min:'0',step:'1',value:String(Math.round(N(r.jumlah_transaksi))),style:'width:110px'});
      const vIn2=el('input',{type:'number',min:'0',step:'1',value:String(Math.round(N(r.nilai_transaksi))),style:'width:140px'});
      cCell=cIn2; vCell=vIn2;
      const save=el('button',{class:'btn sm pri',onclick:async()=>{
        try{
          await DB.write('transaksi',[{store_id:r.store_id,year:r.year,month:r.month,jumlah_transaksi:N(cIn2.value),nilai_transaksi:N(vIn2.value)}],'store_id,year,month');
          toast('Tersimpan.'); window.S_trxEditing.delete(rowKey); await loadAll(); renderTrx();
        }catch(e){ toast('Gagal: '+e.message); }
      }},'Simpan');
      const cancel=el('button',{class:'btn sm',onclick:()=>{ window.S_trxEditing.delete(rowKey); renderTrx(); }},'Batal');
      aksiCell=el('span',{style:'display:flex;gap:5px'},save,cancel);
    } else {
      cCell=int(r.jumlah_transaksi); vCell=compact(r.nilai_transaksi);
      if(r.is_manual){
        const edit=el('button',{class:'btn sm',onclick:()=>{ window.S_trxEditing.add(rowKey); renderTrx(); }},'Edit');
        const del=el('button',{class:'btn sm',onclick:async()=>{
          if(!confirm(`Hapus data transaksi ${r.store_name} - ${MONTHS[r.month-1]} ${r.year}?`)) return;
          try{ await DB.del('transaksi','store_id=eq.'+r.store_id+'&year=eq.'+r.year+'&month=eq.'+r.month);
            toast('Dihapus.'); await loadAll(); renderTrx();
          }catch(e){ toast('Gagal menghapus: '+e.message); }
        }},'Hapus');
        aksiCell=el('span',{style:'display:flex;gap:5px'},edit,del);
      } else {
        aksiCell=el('span',{class:'pill neu',title:'Dibangun otomatis dari upload Sales Type — tidak bisa dihapus manual'},'Otomatis');
      }

/* ---------- KPI (Input KPI / Weekly / Dashboard) ---------- */
/* Replikasi model kalkulasi template "Scorecard KPI Commercial":
   Weekly (Target,W1..W5,Bulanan override,Metode MTD) -> Bulanan MTD (per bulan, roll-up ke YTD
   via Metode YTD) -> Input KPI (Capaian Aktual, Capaian Adj, Skor KPI, Indikator, Grade) -> Dashboard.
   KPI lama yang belum punya baris kpi_weekly tetap memakai jalur lama (target_override/actual_override
   atau autoKpi) demi kompatibilitas. */
function kpiSet(key,def){ const v=S.settings[key]; return v==null||v===''?def:v; }
function kpiSetN(key,def){ const v=Number(kpiSet(key,def)); return isFinite(v)?v:def; }
function kpiGreenYellow(){ return [kpiSetN('kpi_threshold_green',.95),kpiSetN('kpi_threshold_yellow',.80)]; }
function kpiCapMax(){ return kpiSetN('kpi_cap_max',1.0); }
function kpiNormalize(){ return /ya|yes|true|1/i.test(String(kpiSet('kpi_normalize_weight','Ya'))); }
function kpiPerspektifList(){ return String(kpiSet('kpi_perspektif_list','Financial,Customer,Internal Business Process,Learning & Growth')).split(',').map(s=>s.trim()).filter(Boolean); }
function gradeOf(score){
  if(score==null) return '—';
  const e=kpiSetN('kpi_grade_e',.70), d=kpiSetN('kpi_grade_d',.80), c=kpiSetN('kpi_grade_c',.90), b=kpiSetN('kpi_grade_b',.95), a=kpiSetN('kpi_grade_a',1.0);
  if(score<=e) return 'E'; if(score<=d) return 'D'; if(score<=c) return 'C'; if(score<=b) return 'B'; return 'A';
}
function gradeLabel(g){ return {A:'Sangat Baik',B:'Baik',C:'Cukup',D:'Kurang',E:'Sangat Kurang'}[g]||''; }
function kpiWeeklyRow(kpiId,year,month){ return S.kpiWeekly.find(w=>w.kpi_id===kpiId&&w.year===year&&w.month===month); }
/* hitung realisasi & target MTD satu KPI pada satu bulan dari sheet Weekly */
function kpiMonthFromWeekly(mt,year,month){
  const w=kpiWeeklyRow(mt.id,year,month);
  if(!w) return null;
  const weeks=[w.w1,w.w2,w.w3,w.w4,w.w5].filter(v=>v!=null&&v!=='').map(Number);
  let realisasi=null;
  if(w.bulanan_override!=null && w.bulanan_override!=='') realisasi=Number(w.bulanan_override);
  else if(weeks.length) realisasi = (w.metode_mtd==='Rata-rata') ? (weeks.reduce((s,v)=>s+v,0)/weeks.length) : weeks.reduce((s,v)=>s+v,0);
  const target = w.target!=null&&w.target!==''?Number(w.target):null;
  return {target,realisasi,metode_mtd:w.metode_mtd||'Akumulasi',weeks,hasWeekly:true,w};
}
/* hasil lengkap satu KPI pada satu bulan: target/realisasi/capaian/adj/skor/grade/indikator */
function kpiMonthCalc(mt,year,month){
  const lower=String(mt.direction||'').toLowerCase()==='lower';
  const running=!/freeze|take ?out/i.test(mt.status||'Running');
  const wk=kpiMonthFromWeekly(mt,year,month);
  let target=null,realisasi=null,source='none';
  if(wk){ target=wk.target; realisasi=wk.realisasi; source='weekly'; }
  if(isAutoRevenueCode(mt.code)){
    /* Realisasi KPI bertipe Revenue SELALU ditimpa dari data Sales & Target live (bukan Weekly) —
       target tetap dari Weekly (diisi manual per bulan), hanya realisasi yang otomatis. */
    realisasi=autoRevenueForMonth(mt.code,year,month); source='auto_revenue';
  } else {
    const reportMonth = S.month || lastMonthWithData(year);
    if(target==null && realisasi==null && month===reportMonth){
      // fallback lama (hanya dipakai utk bulan laporan aktif, & hanya bila KPI ini sama sekali tidak punya data Weekly di bulan manapun)
      const hasAnyWeekly=S.kpiWeekly.some(w=>w.kpi_id===mt.id);
      if(!hasAnyWeekly){
        const auto=autoKpi(mt.code);
        target = mt.target_override!=null?N(mt.target_override):(auto?auto.target:null);
        realisasi = mt.actual_override!=null?N(mt.actual_override):(auto?auto.actual:null);
        source='legacy';
      }
    }
  }
  let capaian=null;
  if(target!=null && realisasi!=null && target!==0)
    capaian = lower ? target/realisasi : realisasi/target;
  const capMax=kpiCapMax();
  const adj = capaian!=null ? Math.min(capMax,Math.max(0,capaian)) : null;
  const bobot=N(mt.weight);
  const skor = running && adj!=null ? adj*bobot/100 : 0;
  const [green,yellow]=kpiGreenYellow();
  let indikator = (realisasi==null) ? 'Belum ada data' : (adj>=green?'Tercapai':adj>=yellow?'Waspada':'Kritis');
  if(!running) indikator=mt.status;
  return {mt,year,month,target,realisasi,capaian,adj,skor,bobot,running,indikator,grade:gradeOf(adj),source};
}
/* roll-up YTD Jan..uptoMonth sesuai Metode YTD KPI itu sendiri */
function kpiYtdCalc(mt,year,uptoMonth){
  const months=[]; for(let m=1;m<=uptoMonth;m++) months.push(kpiMonthCalc(mt,year,m));
  const withData=months.filter(m=>m.realisasi!=null);
  const metode=mt.metode_ytd||'Akumulasi';
  let targetYtd=null,realisasiYtd=null;
  if(withData.length){
    if(metode==='Rata-rata'){
      targetYtd = withData.filter(m=>m.target!=null).length? withData.filter(m=>m.target!=null).reduce((s,m)=>s+m.target,0)/withData.filter(m=>m.target!=null).length : null;
      realisasiYtd = withData.reduce((s,m)=>s+m.realisasi,0)/withData.length;
    } else {
      targetYtd = withData.some(m=>m.target!=null)? withData.reduce((s,m)=>s+(m.target||0),0) : null;
      realisasiYtd = withData.reduce((s,m)=>s+m.realisasi,0);
    }
  }
  const lower=String(mt.direction||'').toLowerCase()==='lower';
  let capaian=null;
  if(targetYtd!=null && realisasiYtd!=null && targetYtd!==0) capaian = lower? targetYtd/realisasiYtd : realisasiYtd/targetYtd;
  const capMax=kpiCapMax();
  const adj = capaian!=null?Math.min(capMax,Math.max(0,capaian)):null;
  const running=!/freeze|take ?out/i.test(mt.status||'Running');
  const bobot=N(mt.weight);
  const skor = running && adj!=null ? adj*bobot/100 : 0;
  const [green,yellow]=kpiGreenYellow();
  let indikator=(realisasiYtd==null)?'Belum ada data':(adj>=green?'Tercapai':adj>=yellow?'Waspada':'Kritis');
  if(!running) indikator=mt.status;
  return {mt,targetYtd,realisasiYtd,capaian,adj,skor,bobot,running,indikator,grade:gradeOf(adj),months};
}
/* total skor organisasi pada satu bulan/ytd, dengan normalisasi bobot (hanya KPI Running) bila aktif */
function kpiTotal(rows){ // rows: hasil kpiMonthCalc/kpiYtdCalc untuk semua metrik
  const running=rows.filter(r=>r.running);
  const wsum=running.reduce((s,r)=>s+r.bobot,0);
  const rawScore=running.reduce((s,r)=>s+r.skor,0); // skor sudah adj*bobot/100
  const score = kpiNormalize() && wsum>0 ? (running.reduce((s,r)=>s+(r.adj!=null?r.adj*r.bobot:0),0)/wsum) : rawScore;
  return {wsum,score,running};
}
function kpiRowCalc(mt){ // dipakai tab Input KPI, memakai bulan filter aktif (atau bulan terakhir berdata)
  const month = S.month || lastMonthWithData(S.year);
  const ytd = kpiYtdCalc(mt,S.year,month);
  const autoRevenue=isAutoRevenueCode(mt.code);
  return {mt,target:ytd.targetYtd,actual:ytd.realisasiYtd,capaian:ytd.capaian,adj:ytd.adj,skor:ytd.skor,
    indikator:ytd.indikator,running:ytd.running,grade:ytd.grade,autoRevenue,
    auto:autoRevenue||(ytd.months.some(m=>m.source==='weekly')===false)};
}

/* ===== Tab: Dashboard (presentasi, read-only, terhitung dari Weekly+Input KPI) ===== */
function renderKpiDashboard(p){
  if(!S.metrics.length) return;
  /* Round 21: kartu identitas (Perusahaan/Departemen/Nama/NIK/Jabatan/Atasan) sesuai sheet "Pengaturan"
     template — diisi lewat tab Pengaturan baru, ditampilkan di sini kalau terisi. */
  const idFields=[['Perusahaan',kpiSet('kpi_id_perusahaan','')],['Departemen',kpiSet('kpi_id_departemen','')],
    ['Nama',kpiSet('kpi_id_nama','')],['NIK',kpiSet('kpi_id_nik','')],['Jabatan',kpiSet('kpi_id_jabatan','')],
    ['Atasan Langsung',kpiSet('kpi_id_atasan1','')],['Atasan Tidak Langsung',kpiSet('kpi_id_atasan2','')]].filter(([,v])=>v);
  if(idFields.length) p.append(el('div',{class:'card'},el('div',{class:'grid g4'},
    idFields.map(([l,v])=>el('div',{},el('div',{class:'sub'},l),el('div',{style:'font-weight:600'},v))))));
  const month=S.month||lastMonthWithData(S.year);
  const metrics=S.metrics.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const monthRows=metrics.map(mt=>kpiMonthCalc(mt,S.year,month));
  const ytdRows=metrics.map(mt=>kpiYtdCalc(mt,S.year,month));
  const totMtd=kpiTotal(monthRows);
  const totYtd=kpiTotal(ytdRows.map(r=>({running:r.running,bobot:r.bobot,skor:r.skor,adj:r.adj})));
  const prevMonth=month>1?month-1:null;
  const prevRows=prevMonth?metrics.map(mt=>kpiMonthCalc(mt,S.year,prevMonth)):[];
  const totPrev=prevMonth?kpiTotal(prevRows):null;
  const running=monthRows.filter(r=>r.running);
  const terukur=running.filter(r=>r.realisasi!=null);
  const tercapai=terukur.filter(r=>r.indikator==='Tercapai').length;
  const kritis=running.filter(r=>r.indikator==='Kritis').length;
  const belum=running.filter(r=>r.indikator==='Belum ada data').length;
  const grade=gradeOf(totMtd.score);
  /* prioritas: KPI Running dengan poin hilang terbesar = (1-adj)*bobot*100 */
  const priorityList=running.filter(r=>r.adj!=null).map(r=>({name:r.mt.name,poin:(1-r.adj)*r.bobot})).sort((a,b)=>b.poin-a.poin);
  const worst=priorityList[0];
  const deltaPts = totPrev!=null ? (totMtd.score-totPrev.score)*100 : null;
  const narasi = `MTD ${MONTHS[month-1]}: skor ${pct(totMtd.score)} – Grade ${grade} (${gradeLabel(grade)}). `+
    `${tercapai} dari ${terukur.length} KPI terukur tercapai, ${kritis} kritis, ${belum} belum ada data.`+
    (deltaPts!=null?` ${deltaPts>=0?'Naik':'Turun'} ${Math.abs(deltaPts).toFixed(1)} poin dari bulan lalu.`:'')+
    ` Skor YTD ${pct(totYtd.score)}.`+(worst?` Prioritas bulan ini: ${worst.name}.`:'');

  const tiles=el('div',{class:'grid g4'});
  tiles.append(tile('Skor MTD',pct(totMtd.score),'Grade '+grade+' · '+gradeLabel(grade),totMtd.score));
  tiles.append(tile('KPI Terukur Tercapai',`${tercapai} / ${terukur.length}`,running.length+' KPI Running',null));
  tiles.append(tile('KPI Kritis',int(kritis),kritis?'perlu tindak lanjut':'tidak ada',null,
    kritis?el('span',{class:'pill bad'},'Perhatian'):el('span',{class:'pill ok'},'Aman')));
  tiles.append(tile('Belum Ada Data',int(belum),'KPI Running tanpa realisasi',null));
  p.append(tiles);
  p.append(el('div',{class:'card'},el('header',{},el('h2',{},'Ringkasan')),el('p',{style:'margin:0;font-size:13.5px;line-height:1.6'},narasi)));

  /* skor MTD per bulan (Jan-Des) */
  const perBulan=[]; for(let m=1;m<=12;m++){ const rs=metrics.map(mt=>kpiMonthCalc(mt,S.year,m)); const t=kpiTotal(rs); const ada=rs.some(r=>r.realisasi!=null); perBulan.push({m,score:ada?t.score:null,grade:ada?gradeOf(t.score):null}); }
  p.append(chartCard('Skor MTD per Bulan (Jan–Des)',''+S.year,
    hBars(perBulan.filter(b=>b.score!=null).map(b=>({label:MONTHS[b.m-1],v:b.score,tip:`<b>${MONTHS[b.m-1]}</b><div class="row"><span>Skor</span><span>${pct(b.score)}</span></div><div class="row"><span>Grade</span><span>${b.grade}</span></div>`})),
      {mode:'ach',fmt:v=>pct(v,0),name:'Skor',min:1,lw:70})));

  /* detail KPI MTD */
  const detTb=el('tbody');
  monthRows.forEach(r=>detTb.append(el('tr',{},
    el('td',{class:'sticky1'},r.mt.name), el('td',{},r.mt.perspektif||''), el('td',{class:'r'},int(r.bobot)),
    el('td',{class:'r'},r.target==null?'—':fmtKpi(r.target,r.mt.unit)), el('td',{class:'r'},r.realisasi==null?'—':fmtKpi(r.realisasi,r.mt.unit)),
    el('td',{class:'r'},r.capaian==null?'—':pct(r.capaian)), el('td',{class:'r'},pct(r.skor)),
    el('td',{},r.indikator==='Belum ada data'?el('span',{class:'pill neu'},'—'):el('span',{class:'pill '+(r.indikator==='Tercapai'?'ok':r.indikator==='Kritis'?'bad':'mid')},r.indikator)))));
  detTb.append(el('tr',{class:'tot'},el('td',{class:'sticky1'},'TOTAL / SKOR MTD'),el('td',{},''),el('td',{class:'r'},int(totMtd.wsum)),
    el('td',{},''),el('td',{},''),el('td',{},''),el('td',{class:'r'},pct(totMtd.score)),el('td',{},'')));
  p.append(el('div',{class:'card'},el('header',{},el('h2',{},`Detail KPI — MTD ${MONTHS[month-1]} ${S.year}`)),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},
      ['KPI','PERSPEKTIF','BOBOT','TARGET MTD','REALISASI MTD','CAPAIAN','SKOR','INDIKATOR'].map((h,i)=>el('th',{class:(i===2||i>=3&&i<=6?'r':'')+(i===0?' sticky1':'')},h)))),detTb))));

  /* monitoring mingguan: ringkasan + per-KPI */
  const weeksLbl=['W1','W2','W3','W4','W5'];
  const sumRow=(key)=>weeksLbl.map((_,wi)=>{
    let n=0,cnt=0;
    metrics.forEach(mt=>{ const w=kpiWeeklyRow(mt.id,S.year,month); if(!w) return; const v=[w.w1,w.w2,w.w3,w.w4,w.w5][wi];
      if(v==null||v==='') return; cnt++;
      if(key==='terisi') n++;
      else if(key==='tercapai'){ const t=w.target; if(t&&v!=null){ const lower=String(mt.direction||'').toLowerCase()==='lower'; const c=lower?t/v:v/t; if(c>=kpiGreenYellow()[0]) n++; } }
      else if(key==='kritis'){ const t=w.target; if(t&&v!=null){ const lower=String(mt.direction||'').toLowerCase()==='lower'; const c=lower?t/v:v/t; if(c<kpiGreenYellow()[1]) n++; } }
    });
    return n;
  });
  const wkMonitorTb=el('tbody');
  wkMonitorTb.append(el('tr',{},el('td',{class:'sticky1'},'KPI terisi'),...sumRow('terisi').map(v=>el('td',{class:'r'},int(v))),el('td',{class:'r'},int(terukur.length))));
  wkMonitorTb.append(el('tr',{},el('td',{class:'sticky1'},'KPI tercapai'),...sumRow('tercapai').map(v=>el('td',{class:'r'},int(v))),el('td',{class:'r'},int(tercapai))));
  wkMonitorTb.append(el('tr',{},el('td',{class:'sticky1'},'KPI kritis'),...sumRow('kritis').map(v=>el('td',{class:'r'},int(v))),el('td',{class:'r'},int(kritis))));
  p.append(el('div',{class:'card'},el('header',{},el('h2',{},'Monitoring Mingguan — ringkasan')),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},['','W1','W2','W3','W4','W5','MTD'].map((h,i)=>el('th',{class:i>0?'r':'sticky1'},h)))),wkMonitorTb))));

  const wkDetTb=el('tbody');
  metrics.forEach(mt=>{
    const w=kpiWeeklyRow(mt.id,S.year,month)||{};
    const calc=kpiMonthCalc(mt,S.year,month);
    const [green,yellow]=kpiGreenYellow();
    const cellFor=(v)=>{
      if(v==null||v==='') return el('td',{class:'r'},'—');
      const t=w.target; let cls='';
      if(t){ const lower=String(mt.direction||'').toLowerCase()==='lower'; const c=lower?t/v:v/t; cls=c>=green?'ok':c>=yellow?'mid':'bad'; }
      return el('td',{class:'r'},el('span',{class:'pill '+(cls||'neu')},fmtKpi(v,mt.unit)));
    };
    wkDetTb.append(el('tr',{},el('td',{class:'sticky1'},mt.name),el('td',{class:'r'},w.target==null?'—':fmtKpi(w.target,mt.unit)),
      cellFor(w.w1),cellFor(w.w2),cellFor(w.w3),cellFor(w.w4),cellFor(w.w5),
      el('td',{class:'r'},calc.realisasi==null?'—':fmtKpi(calc.realisasi,mt.unit)),
      el('td',{},calc.indikator==='Belum ada data'?el('span',{class:'pill neu'},'—'):el('span',{class:'pill '+(calc.indikator==='Tercapai'?'ok':calc.indikator==='Kritis'?'bad':'mid')},calc.indikator))));
  });
  p.append(el('div',{class:'card'},el('header',{},el('h2',{},'Monitoring Mingguan — per KPI'),el('span',{class:'sub'},'hijau ≥'+pct(green2(),0)+' target, kuning ≥'+pct(yellow2(),0)+', merah di bawahnya')),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},
      ['KPI','TARGET','W1','W2','W3','W4','W5','MTD','INDIKATOR MTD'].map((h,i)=>el('th',{class:(i>=1&&i<=7?'r':'')+(i===0?' sticky1':'')},h)))),wkDetTb))));

  /* capaian per KPI (urut terendah) & per perspektif */
  const byAdjAsc=running.filter(r=>r.adj!=null).sort((a,b)=>a.adj-b.adj);
  p.append(chartCard('Capaian per KPI (urut dari terendah)',MONTHS[month-1]+' '+S.year,
    hBars(byAdjAsc.map(r=>({label:r.mt.name,v:r.adj})),{mode:'ach',fmt:v=>pct(v,0),name:'Capaian',min:1,lw:185})));
  const perspMap=new Map();
  running.forEach(r=>{ const k=r.mt.perspektif||'Lainnya'; if(!perspMap.has(k)) perspMap.set(k,{n:0,sum:0}); const o=perspMap.get(k); if(r.adj!=null){o.n++;o.sum+=r.adj;} });
  const perspRows=[...perspMap.entries()].map(([k,o])=>({label:k,v:o.n?o.sum/o.n:0})).sort((a,b)=>a.v-b.v);
  p.append(chartCard('Capaian per Perspektif',MONTHS[month-1]+' '+S.year,
    hBars(perspRows,{mode:'ach',fmt:v=>pct(v,0),name:'Capaian rata-rata',min:1,lw:185})));

  /* prioritas perbaikan */
  p.append(el('div',{class:'card'},el('header',{},el('h2',{},'Prioritas Perbaikan'),el('span',{class:'sub'},'skor hilang terbesar = (1−Capaian Adj)×Bobot')),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},['#','KPI','POIN HILANG'].map((h,i)=>el('th',{class:i===2?'r':''},h)))),
      el('tbody',{},priorityList.slice(0,10).map((x,i)=>el('tr',{},el('td',{},String(i+1)),el('td',{},x.name),el('td',{class:'r'},x.poin.toFixed(2)))))))));
}

/* Round 21: dua definisi fmtKpi()/autoKpi() identik yang kebetulan ada di file (sisa gabungan sesi
   sebelumnya, harmless karena deklarasi kedua cuma menimpa yang pertama — tapi membingungkan untuk
   dibaca/dirawat) dirapikan jadi SATU di sini, sekalian diperluas: fmtKpi() sekarang mengenali lebih
   banyak variasi penulisan satuan (Rp/Rp./IDR, Score/Rating dengan 2 desimal) supaya KPI "Revenue" dan
   KPI jenis skor (mis. Customer Satisfaction) tampil wajar tanpa harus mengetik satuan persis 'IDR'. */
function fmtKpi(v,unit){ if(v==null)return '—';
  const u=String(unit||'').toLowerCase();
  if(u==='%'||u.includes('persen')) return pct(v>2?v/100:v);
  if(u==='idr'||u.includes('rp')) return compact(v);
  if(u.includes('score')||u.includes('rating')||u.includes('skor')) return (Math.round(N(v)*100)/100).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
  return int(v); }
/* KPI yang bisa dihitung langsung dari data sales (jalur lama, dipakai bila KPI belum punya data Weekly
   sama sekali DAN bulan itu adalah bulan laporan aktif — lihat kpiMonthCalc). */
function autoKpi(code){
  const rows=scope(S.dash), a=agg(rows), t=trxScope();
  const tc=t.reduce((s,r)=>s+N(r.jumlah_transaksi),0), tv=t.reduce((s,r)=>s+N(r.nilai_transaksi),0);
  const g=growthScope().filter(r=>r.growth_vs_y1!=null);
  const gc=g.reduce((s,r)=>s+N(r.sales_cy),0), gp=g.reduce((s,r)=>s+N(r.sales_y1),0);
  switch(code){
    case 'ACH_TOTAL': return a.target_total>0?{target:1,actual:a.total_sales/a.target_total}:null;
    case 'ACH_KOM':   return a.target_komersial>0?{target:1,actual:a.sales_komersial/a.target_komersial}:null;
    case 'ACH_USER':  return a.target_user>0?{target:1,actual:a.sales_user/a.target_user}:null;
    case 'GROWTH_YOY':return gp>0?{target:null,actual:(gc-gp)/gp}:null;
    case 'AOV':       return tc>0?{target:null,actual:tv/tc}:null;
    case 'TRX':       return tc>0?{target:null,actual:tc}:null;
    default: return null;
  }
}
/* Round 21: kode KPI yang REALISASI-nya SELALU ditarik langsung dari data Sales & Target (bukan
   menunggu KPI itu kosong dari Weekly dulu seperti jalur legacy autoKpi() di atas) — ini yang
   dipakai KPI "Revenue" sesuai permintaan user ("untuk revenue ambil dari data pencapaian"). Target
   TETAP diisi manual lewat tab Weekly/Input KPI (sesuai template: hanya Realisasi yang otomatis),
   dan nilainya LIVE per bulan dari v_sales_dashboard — bukan dari tabel Weekly sama sekali — supaya
   selalu sinkron begitu ada input sales baru, untuk tahun/bulan MANAPUN (pakai dashAllRows(), bukan
   S.dash yang di mode nyata cuma berisi tahun filter aktif). */
const AUTO_REVENUE_CODES={REVENUE_RP:r=>N(r.total_sales), REVENUE_KOM_RP:r=>N(r.sales_komersial), REVENUE_USER_RP:r=>N(r.sales_user)};
function isAutoRevenueCode(code){ return !!AUTO_REVENUE_CODES[code]; }
function autoRevenueForMonth(code,year,month){
  const f=AUTO_REVENUE_CODES[code]; if(!f) return null;
  return dashAllRows().filter(r=>r.year===year&&r.month===month).reduce((s,r)=>s+f(r),0);
}

/* Temuan otomatis dari data */
function analyze(){
  const out=[], rows=scope(S.dash), a=agg(rows);
  if(!rows.length) return out;
  if(a.target_total>0){
    const ok=a.achiev_total>=1;
    out.push({tag:ok?'Tercapai':'Belum tercapai',tone:ok?'ok':'bad',
      title:`Achievement total ${pct(a.achiev_total)}`,
      text:`Sales ${compact(a.total_sales)} terhadap target ${compact(a.target_total)}. `+
           `GAP ${compact(a.gap_sales)} (${a.gap_sales>=0?'di atas':'di bawah'} target) pada ${periodLabel()}.`});
  }
  if(a.target_komersial>0 && a.target_user>0){
    const k=a.achiev_komersial, u=a.achiev_user;
    const lag = k<u ? 'Komersial' : 'User';
    out.push({tag:'Segmen',tone:'neu',title:`${lag} tertinggal`,
      text:`Komersial ${pct(k)} (${compact(a.sales_komersial)} dari ${compact(a.target_komersial)}), `+
           `User ${pct(u)} (${compact(a.sales_user)} dari ${compact(a.target_user)}). `+
           `Selisih capaian ${pct(Math.abs(k-u))} — fokus perbaikan ada di segmen ${lag.toLowerCase()}.`});
  }
  const st=byStore(rows).filter(r=>r.target_total>0);
  if(st.length>1){
    const srt=[...st].sort((x,y)=>(y.achiev_total??-1)-(x.achiev_total??-1));
    const best=srt[0], worst=srt[srt.length-1];
    out.push({tag:'Tertinggi',tone:'ok',title:`${best.store_name} ${pct(best.achiev_total)}`,
      text:`Capaian terbaik: ${compact(best.total_sales)} dari target ${compact(best.target_total)}. Pola yang berhasil di sini layak direplikasi.`});
    out.push({tag:'Terendah',tone:'bad',title:`${worst.store_name} ${pct(worst.achiev_total)}`,
      text:`Capaian terendah: ${compact(worst.total_sales)} dari target ${compact(worst.target_total)}, kurang ${compact(Math.abs(worst.gap_sales))}. Perlu rencana pemulihan.`});
    const below=srt.filter(r=>r.achiev_total!=null&&r.achiev_total<1);
    if(below.length) out.push({tag:'Sebaran',tone:below.length>st.length/2?'bad':'mid',
      title:`${below.length} dari ${st.length} toko di bawah target`,
      text:'Toko di bawah target: '+below.map(r=>`${r.store_name} (${pct(r.achiev_total)})`).join(', ')+'.'});
  }
  const g=growthScope().filter(r=>r.growth_vs_y1!=null);
  if(g.length){
    const gc=g.reduce((s,r)=>s+N(r.sales_cy),0), gp=g.reduce((s,r)=>s+N(r.sales_y1),0);
    if(gp>0){ const gr=(gc-gp)/gp;
      out.push({tag:'Growth',tone:gr>=0?'ok':'bad',title:`${pct(gr)} vs ${S.year-1}`,
        text:`Dari ${g.length} baris toko-bulan yang punya pembanding: ${compact(gc)} tahun ini vs ${compact(gp)} tahun lalu, `+
             `GAP growth ${compact(gc-gp)}. Toko tanpa pembanding tidak dihitung.`}); }
  }
  const t=trxScope(); const tc=t.reduce((s,r)=>s+N(r.jumlah_transaksi),0), tv=t.reduce((s,r)=>s+N(r.nilai_transaksi),0);
  if(tc>0) out.push({tag:'Kualitas',tone:'neu',title:`AOV ${rp(tv/tc)}`,
    text:`${int(tc)} transaksi menghasilkan ${compact(tv)}. Menaikkan AOV lewat bundling atau upselling menambah sales tanpa menambah trafik.`});
  if(S.unmapped.length) out.push({tag:'Data',tone:'mid',
    title:`${S.unmapped.length} sales type belum termapping`,
    text:`Nilai ${compact(S.unmapped.reduce((s,r)=>s+N(r.total_amount),0))} belum masuk hitungan karena tipenya belum terdaftar di database Sales Type. Selesaikan di Pengaturan.`});
  return out;
}

/* ---------- parsing ---------- */
/* jarak edit, dipakai untuk memaafkan salah ketik nama bulan */
function lev(a,b){
  const m=a.length,n=b.length; let prev=[...Array(n+1).keys()],cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
/* "SEPTEMBER" cocok persis; "SPTEMBER" tetap terbaca September. */
function monthFromWord(w){
  const s=String(w||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!s) return null;
  if(MONTH_WORDS[s]) return MONTH_WORDS[s];
  if(s.length<4) return null;                       // hindari salah tebak dari singkatan
  let best=null, bd=2;
  for(const name in MONTH_WORDS){
    if(name.length<4 || Math.abs(name.length-s.length)>1) continue;
    const d=lev(s,name);
    if(d<bd){ bd=d; best=MONTH_WORDS[name]; }
  }
  return bd<=1 ? best : null;
}
function parseName(fn){
  const base=fn.replace(/\.(xlsx|xls|csv)$/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  const words=base.split(' ');
  let mi=-1, mon=null;
  for(let i=words.length-1;i>=0;i--){
    const m=monthFromWord(words[i]);
    if(m){ mi=i; mon=m; break; }
  }
  /* tanpa \b di depan, supaya "JULI2026" tetap terbaca tahunnya */
  const ym=base.match(/(?<!\d)(20\d{2})(?!\d)/);
  const year=ym?Number(ym[1]):null;
  let store = mi>0 ? words.slice(0,mi).join(' ') : base.replace(/\b20\d{2}\b/,'').trim();
  return {store:store.trim(), month:mon, year};
}
function findStore(name){
  const n=String(name||'').toUpperCase().replace(/\s+/g,' ').trim();
  let a=S.aliases.find(x=>x.alias.toUpperCase().replace(/\s+/g,' ').trim()===n);
  if(a) return a.store_id;
  let s=S.stores.find(x=>x.name.toUpperCase().replace(/\s+/g,' ').trim()===n);
  if(s) return s.id;
  const sq=n.replace(/\s/g,'');
  a=S.aliases.find(x=>x.alias.toUpperCase().replace(/\s/g,'')===sq); if(a) return a.store_id;
  s=S.stores.find(x=>x.name.toUpperCase().replace(/\s/g,'')===sq); if(s) return s.id;
  return null;
}
/* Pembacaan file yang tahan banting:
   - rentang sheet (!ref) dihitung ulang dari sel yang benar-benar ada (file POS sering salah mencatatnya,
     akibatnya hanya sebagian baris terbaca)
   - baris judul di atas tabel dilewati: header dicari dari baris yang paling cocok dengan kolom yang diharapkan
   - semua sheet diperiksa, sheet dengan baris terbanyak yang cocok dipakai */
function fixRef(ws){
  let r1=1e9,c1=1e9,r2=-1,c2=-1;
  for(const k in ws){ if(k[0]==='!') continue;
    const a=XLSX.utils.decode_cell(k);
    if(a.r<r1)r1=a.r; if(a.c<c1)c1=a.c; if(a.r>r2)r2=a.r; if(a.c>c2)c2=a.c; }
  if(r2>=0) ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:r2,c:c2}});
}
const normKey=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function readSheet(file,need=[]){
  const buf=await file.arrayBuffer();
  let wb;
  try{ wb=XLSX.read(buf,{type:'array',cellDates:false}); }
  catch(e){ throw new Error('file tidak bisa dibuka ('+e.message+')'); }
  let best=null;
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name]; if(!ws) continue;
    const declared=ws['!ref']; fixRef(ws);
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
    if(!aoa.length) continue;
    let h=0, hs=-1;
    const needN=need.map(normKey);
    for(let i=0;i<Math.min(aoa.length,40);i++){
      const cells=aoa[i].map(normKey);
      const sc=needN.filter(nk=>cells.some(c=>c&&(c===nk||c.includes(nk)))).length;
      if(sc>hs){ hs=sc; h=i; }
    }
    if(!needN.length) h=0;
    const seen=new Map();
    const head=aoa[h].map((c,i)=>{ let k=String(c??'').trim()||('__KOLOM_'+(i+1));
      const n=(seen.get(k)||0)+1; seen.set(k,n); return n>1?k+'_'+n:k; });
    const rows=[];
    for(let i=h+1;i<aoa.length;i++){
      const o={}; let any=false;
      head.forEach((k,j)=>{ const v=aoa[i][j]; o[k]=v===undefined?'':v; if(v!==''&&v!=null) any=true; });
      if(any) rows.push(o);
    }
    const cand={sheet:name,rows,score:hs,headerRow:h+1,declared,total:aoa.length};
    if(!best || cand.score>best.score || (cand.score===best.score && rows.length>best.rows.length)) best=cand;
  }
  if(!best) return Object.assign([],{info:{sheet:'-',headerRow:0,total:0}});
  const out=best.rows; out.info=best; return out;
}
/* cari kunci kolom secara longgar */
function col(row, ...cands){
  const keys=Object.keys(row);
  for(const c of cands){
    const t=c.toLowerCase().replace(/[^a-z0-9]/g,'');
    const k=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'')===t);
    if(k) return k;
  }
  for(const c of cands){
    const t=c.toLowerCase().replace(/[^a-z0-9]/g,'');
    const k=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'').includes(t));
    if(k) return k;
  }
  return null;
}
function colx(row,...cands){ const keys=Object.keys(row);
  for(const c of cands){ const t=normKey(c); const k=keys.find(k=>normKey(k)===t); if(k) return k; } return null; }
/* Angka bisa datang sebagai "3.328.619.750" (ribuan) atau "12,5" (desimal). */
function num(v){ if(v==null||v==='')return 0;
  if(typeof v==='number')return v;
  const s=String(v).replace(/[^\d,.\-]/g,'');
  if(!s||s==='-') return 0;
  const dots=(s.match(/\./g)||[]).length;
  if(/,\d{1,2}$/.test(s))                                   // koma sebagai desimal
    return Number(s.replace(/\./g,'').replace(',','.'))||0;
  if(dots===1 && /\.\d{1,2}$/.test(s))                      // titik sebagai desimal (format Inggris)
    return Number(s.replace(/,/g,''))||0;
  return Number(s.replace(/[.,]/g,''))||0;                  // sisanya pemisah ribuan
}

const NEED={sales:['Sales Type','Total Collected'],item:['Item Name','Item Sold'],trx:['NAMA TOKO','TRANSAKSI'],
  map:['SALES TYPE','KETERANGAN','SEGMEN'],kpi:['KPI','BOBOT'],master:['Item Name','Brand Name','Category Name']};
async function handleFiles(files,kind){
  if(guard()) return;
  if(!S.ready){ toast('Hubungkan database dulu.'); return; }
  if(!files.length) return;
  logLine(`\n=== ${files.length} file · jenis ${kind} · ${new Date().toLocaleTimeString('id-ID')} ===`);
  let okN=0, failN=0;
  for(const f of files){
    try{
      if(kind==='target'){ await ingestTarget(f); okN++; continue; }  // struktur sheet TARGET beda (bukan header-kolom biasa), ditangani sendiri
      const rows=await readSheet(f,NEED[kind]||[]);
      const inf=rows.info||{};
      logLine(`  ▸ ${f.name}: sheet “${inf.sheet}”, header di baris ${inf.headerRow}, ${int(rows.length)} baris data terbaca`);
      if(kind==='sales') await ingestSales(f,rows);
      else if(kind==='item') await ingestItem(f,rows);
      else if(kind==='trx') await ingestTrx(f,rows);
      else if(kind==='map') await ingestMap(f,rows);
      else if(kind==='kpi') await ingestKpi(f,rows);
      else if(kind==='master') await ingestMaster(f,rows);
      okN++;
    }catch(e){ failN++; logLine(`  ✗ ${f.name} — ${e.message}`); console.error(e); }
  }
  logLine(`--- selesai: ${okN} berhasil, ${failN} gagal ---`);
  if(kind==='sales'||kind==='map'){
    try{ await DB.rpc('rebuild_sales_actual',{}); logLine('  → sales_actual dihitung ulang dari mapping'); }
    catch(e){ logLine('  ! gagal hitung ulang: '+e.message); }
  }
  if(kind==='sales'){
    try{ await DB.rpc('rebuild_transaksi_from_raw',{}); logLine('  → transaksi & AOV diperbarui dari kolom Count (baris yang diinput manual tidak ditimpa)'); }
    catch(e){ logLine('  ! gagal perbarui transaksi: '+e.message); }
  }
  S.itemScope=''; S.rollCache.clear();
  await loadAll();
  toast(`${okN} file diproses${failN?', '+failN+' gagal':''}.`);
}

/* Toko / bulan / tahun per baris bila ada kolomnya (file gabungan); kalau tidak, dari nama file. */
function periodKeys(r0){
  return {kS:colx(r0,'Nama Toko','Toko','Store','Store Name','Outlet','Cabang'),
          kM:colx(r0,'Bulan','Month','Periode'), kY:colx(r0,'Tahun','Year')};
}
function periodCtx(file,r,k){
  const fn=parseName(file.name);
  let sid=null, month=fn.month, year=fn.year;
  if(k.kS){ const t=String(r[k.kS]??'').trim();
    if(!t) return {err:'nama toko kosong'};
    sid=findStore(t); if(!sid) return {err:`toko “${t}” belum ada di alias`}; }
  else sid=findStore(fn.store);
  if(k.kM){ const mv=r[k.kM]; const m=(typeof mv==='number'&&mv>=1&&mv<=12)?mv:monthFromWord(mv); if(m) month=m; }
  if(k.kY){ const y=num(r[k.kY]); if(y>=2000&&y<2100) year=y; }
  if(!sid) return {err:`toko “${fn.store}” (dari nama file) belum ada di alias`};
  if(!month||!year) return {err:'bulan/tahun tidak terbaca'};
  return {sid,month,year};
}
function reportSkips(bad){
  if(!bad.size) return;
  logLine('    ! dilewati: '+[...bad.entries()].slice(0,5).map(([k,v])=>`${v}× ${k}`).join('; '));
}

async function ingestSales(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kType=col(r0,'Sales Type','salestype','type','tipe');
  const kAmt =col(r0,'Total Collected','totalcollected','total','amount','nilai');
  const kCnt =col(r0,'Count','jumlah','qty','trx');
  if(!kType||!kAmt) throw new Error('kolom Sales Type / Total Collected tidak ditemukan');
  const pk=periodKeys(r0);
  const groups=new Map(), bad=new Map(); let used=0, merged=0;
  for(const r of rows){
    const t=String(r[kType]??'').trim();
    if(!t) continue;
    if(/^(total|grand total|jumlah)$/i.test(t)) continue;
    const c=periodCtx(file,r,pk);
    if(c.err){ bad.set(c.err,(bad.get(c.err)||0)+1); continue; }
    const key=c.sid+'|'+c.year+'|'+c.month;
    const g=groups.get(key)||{sid:c.sid,year:c.year,month:c.month,types:new Map()};
    const o=g.types.get(t); const amt=num(r[kAmt]), cnt=kCnt?num(r[kCnt]):0;
    if(o){ o.amount+=amt; o.cnt+=cnt; merged++; } else g.types.set(t,{amount:amt,cnt});
    groups.set(key,g); used++;
  }
  if(!groups.size){ const why=[...bad.keys()][0]; throw new Error(why||'tidak ada baris sales type yang valid'); }
  reportSkips(bad);
  if(merged) logLine(`    ℹ ${int(merged)} baris dengan Sales Type sama digabung (dijumlahkan)`);
  const known=new Set(S.map.map(m=>m.sales_type.toUpperCase().trim()));
  for(const g of groups.values()){
    const out=[]; let tot=0;
    for(const [t,o] of g.types){ out.push({store_id:g.sid,year:g.year,month:g.month,sales_type:t,trx_count:o.cnt,amount:o.amount,source_file:file.name}); tot+=o.amount; }
    await DB.del('sales_type_raw',`store_id=eq.${g.sid}&year=eq.${g.year}&month=eq.${g.month}`);
    await DB.write('sales_type_raw',out,'store_id,year,month,sales_type');
    const unmapped=out.filter(o=>!known.has(o.sales_type.toUpperCase().trim()));
    await DB.write('ingest_log',[{kind:'SALES_TYPE',file_name:file.name,store_id:g.sid,year:g.year,month:g.month,
      rows_total:out.length,rows_mapped:out.length-unmapped.length,rows_unmapped:unmapped.length,
      total_amount:tot,status:'OK',
      message:unmapped.length?('belum termapping: '+unmapped.slice(0,8).map(u=>u.sales_type).join(', ')):null}]);
    logLine(`  ✓ ${S.stores.find(s=>s.id===g.sid)?.name} ${MON3[g.month-1]} ${g.year} · ${out.length} tipe · ${compact(tot)}`
      +(unmapped.length?` · ${unmapped.length} belum termapping`:''));
  }
  logLine(`    Σ ${int(rows.length)} baris dibaca → ${int(used)} dipakai → ${groups.size} periode toko`);
}

async function ingestItem(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kN=col(r0,'Item Name','itemname','nama item','item');
  const kV=col(r0,'Item Variant Name','variant','varian');
  const kC=col(r0,'Category Name','category','kategori');
  const kS=colx(r0,'SKU','Master SKU','kode');
  const kSold=col(r0,'Item Sold','itemsold','sold','terjual');
  const kRef =col(r0,'Item Refunded','itemrefunded','refunded','refund');
  const kNet =col(r0,'Net Sales','netsales','net','nilai');
  if(!kN) throw new Error('kolom Item Name tidak ditemukan');
  const pk=periodKeys(r0);
  const groups=new Map(), bad=new Map(); let used=0;
  for(const r of rows){
    const n=String(r[kN]??'').trim();
    if(!n || /^(total|grand total)$/i.test(n)) continue;
    const c=periodCtx(file,r,pk);
    if(c.err){ bad.set(c.err,(bad.get(c.err)||0)+1); continue; }
    const key=c.sid+'|'+c.year+'|'+c.month;
    const g=groups.get(key)||{sid:c.sid,year:c.year,month:c.month,out:[],sold:0,ref:0,net:0};
    const a=kSold?num(r[kSold]):0, b=kRef?num(r[kRef]):0, d=kNet?num(r[kNet]):0;
    g.out.push({store_id:c.sid,year:c.year,month:c.month,item_name:n,
      item_variant_name:kV?String(r[kV]??'').trim()||null:null,
      category_name:kC?String(r[kC]??'').trim()||null:null,
      sku:kS?String(r[kS]??'').trim()||null:null,
      item_sold:a,item_refunded:b,net_sales:d,source_file:file.name});
    g.sold+=a; g.ref+=b; g.net+=d; groups.set(key,g); used++;
  }
  if(!groups.size){ const why=[...bad.keys()][0]; throw new Error(why||'tidak ada baris item yang valid'); }
  reportSkips(bad);
  for(const g of groups.values()){
    await DB.del('item_sales',`store_id=eq.${g.sid}&year=eq.${g.year}&month=eq.${g.month}`);
    await DB.write('item_sales',g.out);
    await DB.write('ingest_log',[{kind:'ITEM_SALES',file_name:file.name,store_id:g.sid,year:g.year,month:g.month,
      rows_total:g.out.length,rows_mapped:g.out.length,rows_unmapped:0,total_amount:g.net,status:'OK'}]);
    logLine(`  ✓ ${S.stores.find(s=>s.id===g.sid)?.name} ${MON3[g.month-1]} ${g.year} · ${int(g.out.length)} item · `
      +`sold ${int(g.sold)} − refund ${int(g.ref)} = ${int(g.sold-g.ref)} · ${compact(g.net)}`);
  }
  logLine(`    Σ ${int(rows.length)} baris dibaca → ${int(used)} tersimpan → ${groups.size} periode toko`);
}

async function ingestTrx(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kY=col(r0,'TAHUN','year'), kM=col(r0,'BULAN','month'), kS=col(r0,'NAMA TOKO','store','toko');
  const kC=colx(r0,'TRANSAKSI','jumlah transaksi','trx','count')||col(r0,'TRANSAKSI','trx','count');
  const kV=colx(r0,'NILAI TRANSAKSI','total nilai','nilai');
  const kA=col(r0,'AOV','RATA - RATA NILAI TRANSAKSI','ratarata');
  if(!kS||!kC) throw new Error('kolom NAMA TOKO / TRANSAKSI tidak ditemukan');
  const out=new Map(); const bad=new Map(); let blank=0;
  for(const r of rows){
    const nm=String(r[kS]??'').trim();
    if(!nm||/^(total|grand total)$/i.test(nm)) continue;
    const sid=findStore(nm); if(!sid){ bad.set(`toko “${nm}” tidak dikenal`,(bad.get(`toko “${nm}” tidak dikenal`)||0)+1); continue; }
    let mo=null;
    if(kM){ const mv=r[kM]; mo = typeof mv==='number' ? mv : monthFromWord(mv); }
    const yr = kY?num(r[kY]):S.year;
    if(!mo||!yr){ bad.set('periode tidak terbaca',(bad.get('periode tidak terbaca')||0)+1); continue; }
    const cnt=num(r[kC]);
    const aov=kA?num(r[kA]):0;
    let val = kV?num(r[kV]):0;
    if(!val && aov) val = cnt*aov;
    if(!cnt && !val){ blank++; continue; }              // baris kosong (bulan belum berjalan) tidak menimpa data
    out.set(sid+'|'+yr+'|'+mo,{store_id:sid,year:yr,month:mo,jumlah_transaksi:cnt,nilai_transaksi:val,is_manual:true});
  }
  if(!out.size) throw new Error('tidak ada baris transaksi yang berisi angka');
  const arr=[...out.values()];
  await DB.write('transaksi',arr,'store_id,year,month');
  const badN=[...bad.values()].reduce((a,b)=>a+b,0);
  await DB.write('ingest_log',[{kind:'TRANSAKSI',file_name:file.name,
    rows_total:arr.length,rows_mapped:arr.length,rows_unmapped:badN,
    total_amount:arr.reduce((s,r)=>s+r.nilai_transaksi,0),status:'OK'}]);
  logLine(`  ✓ ${file.name} · ${arr.length} baris transaksi tersimpan, ${blank} baris kosong dilewati${badN?`, ${badN} tidak dikenali`:''}`);
  reportSkips(bad);
}

async function ingestMaster(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kI=col(r0,'Item Name','itemname'), kB=col(r0,'Brand Name','brand'), kC=col(r0,'Category Name','category'),
        kN=colx(r0,'Name','Nama'), kW=col(r0,'WARNA','warna','color'), kS=col(r0,'Master SKU','sku');
  if(!kI) throw new Error('kolom Item Name tidak ditemukan');
  const m=new Map();
  for(const r of rows){
    const it=String(r[kI]??'').trim(); if(!it) continue;
    m.set(it,{item_name:it,brand:kB?String(r[kB]??'').trim().toUpperCase()||null:null,
      category:kC?String(r[kC]??'').trim()||null:null, name:kN?String(r[kN]??'').trim()||null:null,
      warna:kW?String(r[kW]??'').trim().toUpperCase()||null:null, sku:kS?String(r[kS]??'').trim()||null:null});
  }
  const arr=[...m.values()];
  if(!arr.length) throw new Error('tidak ada baris master yang valid');
  await DB.write('product_master',arr,'item_name');
  await DB.write('ingest_log',[{kind:'MAPPING',file_name:file.name+' (master produk)',rows_total:arr.length,rows_mapped:arr.length,rows_unmapped:0,status:'OK'}]);
  logLine(`  ✓ ${file.name} · ${int(arr.length)} item master (brand, kategori, warna)`);
}

async function ingestMap(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kT=col(r0,'SALES TYPE','salestype','type');
  const kK=col(r0,'KETERANGAN','keterangan','ket');
  const kG=col(r0,'SEGMEN','segmen','segment');
  const kB=col(r0,'BRAND','brand'), kCh=colx(r0,'CHANNEL','Marketplace');
  if(!kT||!kK||!kG) throw new Error('kolom SALES TYPE / KETERANGAN / SEGMEN tidak ditemukan');
  const out=[]; let bad=0;
  for(const r of rows){
    const t=String(r[kT]??'').trim();
    if(!t||/^sales type$/i.test(t)) continue;
    const k=String(r[kK]??'').trim().toUpperCase();
    const g=String(r[kG]??'').trim().toUpperCase().replace(/\s+/g,' ');
    if(!['KOMERSIAL','USER'].includes(k) || !SEGMENS.includes(g)){ bad++; continue; }
    const o={sales_type:t,keterangan:k,segmen:g,brand:kB?String(r[kB]??'').trim()||null:null};
    if(kCh) o.channel=String(r[kCh]??'').trim().toUpperCase()||null;
    out.push(o);
  }
  if(!out.length) throw new Error('tidak ada baris mapping yang valid');
  await DB.write('sales_type_map',out,'sales_type');
  await DB.write('ingest_log',[{kind:'MAPPING',file_name:file.name,rows_total:out.length,
    rows_mapped:out.length,rows_unmapped:bad,status:'OK'}]);
  logLine(`  ✓ ${file.name} · ${out.length} aturan mapping${bad?` · ${bad} baris dilewati`:''}`);
}

async function ingestKpi(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kC=col(r0,'KODE','code'), kN=col(r0,'KPI','METRIK','NAMA','name','indikator');
  const kP=col(r0,'PERSPEKTIF'), kU=col(r0,'UOM','SATUAN','unit'), kPer=col(r0,'PERIODE');
  const kD=col(r0,'POLARITAS','ARAH','direction');
  const kW=col(r0,'BOBOT','weight'), kSt=col(r0,'STATUS');
  const kT=col(r0,'TARGET YTD','TARGET'), kA=col(r0,'REALISASI YTD','AKTUAL','ACTUAL','realisasi');
  const kCat=col(r0,'CATATAN','note');
  if(!kN) throw new Error('kolom KPI/nama metrik tidak ditemukan — pastikan header sesuai template (No;KPI;Perspektif;UOM;...)');
  const mets=[]; let i=0;
  for(const r of rows){
    const nm=String(r[kN]??'').trim();
    if(!nm||/^(total|grand total|total \/ cek bobot)$/i.test(nm)) continue;
    const code=(kC&&String(r[kC]??'').trim()) || nm.toUpperCase().replace(/[^A-Z0-9]+/g,'_').slice(0,40);
    const wRaw=kW?String(r[kW]??'').replace('%',''):'0';
    mets.push({code,name:nm,
      perspektif:kP?String(r[kP]??'').trim()||null:null,
      unit:kU?String(r[kU]??'').trim()||null:null,
      periode:kPer?String(r[kPer]??'').trim()||'Monthly':'Monthly',
      direction:(kD&&/min|kecil|lower|turun|rendah/i.test(String(r[kD])))?'lower':'higher',
      weight:num(wRaw)||0,
      status:kSt?String(r[kSt]??'').trim()||'Running':'Running',
      catatan:kCat?String(r[kCat]??'').trim()||null:null,
      target_override:kT?(num(String(r[kT]??'').replace('%',''))||null):null,
      actual_override:kA?(num(String(r[kA]??'').replace('%',''))||null):null,
      sort_order:++i});
  }
  if(!mets.length) throw new Error('tidak ada baris KPI yang terbaca dari file ini');
  await DB.write('kpi_metrics',mets,'code');
  await DB.write('ingest_log',[{kind:'KPI',file_name:file.name,rows_total:mets.length,
    rows_mapped:mets.length,rows_unmapped:0,status:'OK'}]);
  logLine(`  ✓ ${file.name} · ${mets.length} metrik KPI diperbarui`);
}

function hexRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
function rgbHex(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mixHex(h,to,t){ const a=hexRgb(h), b=to==='w'?[255,255,255]:[0,0,0]; return rgbHex(a.map((v,i)=>v+(b[i]-v)*t)); }
const _colorMemo=new Map();
function colorHex(name){
  const key=String(name||'').toUpperCase().trim(); if(!key) return null;
  if(_colorMemo.has(key)) return _colorMemo.get(key);
  const clean=key.replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  let hex=null;
  /* Round 18: cocokkan kompon di MANA PUN dalam nama (bukan cuma prefix) — nama warna di data sering
     diawali kode SKU/prefix lain sebelum nama warnanya sendiri, mis. "01 DUSTY PINK" atau "DEFECT NAVY
     BIRU TUA". `' '+clean+' '` dibubuhi spasi di kedua ujung supaya pencocokan kata-utuh konsisten di
     awal/tengah/akhir string tanpa exception khusus. */
  const padded=' '+clean+' ';
  for(const c in COLOR_COMPOUND) if(padded.includes(' '+c+' ')){ hex=COLOR_COMPOUND[c]; break; }
  if(!hex){
    const toks=clean.split(' ');
    for(const t of toks){ if(COLOR_BASE[t]){ hex=COLOR_BASE[t]; break; } }
    /* Round 20: modifier MUDA/TUA (dipakai sejak awal) diperluas juga ke padanan Inggris LIGHT/DARK
       (dan TERANG/GELAP) — user melaporkan banyak warna brand MAMU masih jatuh ke fallback hash. Tanpa
       akses baca tabel master warna produksi, satu hipotesis paling mungkin: MAMU memakai kombinasi
       "LIGHT/DARK + nama warna dasar" (mis. "DARK GREY", "LIGHT BROWN") alih-alih "nama + MUDA/TUA" ala
       TIGALAPAN — sebelumnya kombinasi itu HANYA tertangkap kalau sudah di-hardcode satu-satu di
       COLOR_COMPOUND (mis. "LIGHT BROWN" ada, tapi "LIGHT GREY"/"DARK BLUE" dkk tidak) dan jatuh ke hash
       begitu kombinasinya belum terdaftar. Generalisasi ini membuat SEMUA kombinasi LIGHT/DARK + warna
       dasar yang sudah ada di COLOR_BASE otomatis dikenali, tanpa perlu mendaftarkan tiap kombinasi
       satu per satu. */
    if(hex){
      if(toks.includes('MUDA')||toks.includes('LIGHT')||toks.includes('TERANG')) hex=mixHex(hex,'w',.45);
      else if(toks.includes('TUA')||toks.includes('DARK')||toks.includes('GELAP')) hex=mixHex(hex,'k',.3);
    }
  }
  if(!hex){ let h=0; for(const ch of clean) h=(h*31+ch.charCodeAt(0))%360;
    hex=rgbHex(hslRgb(h,.42,.55)); }
  _colorMemo.set(key,hex); return hex;
}
function hslRgb(h,s,l){ const a=s*Math.min(l,1-l), f=n=>{ const k=(n+h/30)%12; return l-a*Math.max(-1,Math.min(k-3,9-k,1)); };
  return [f(0)*255,f(8)*255,f(4)*255]; }
function lum(hex){ const [r,g,b]=hexRgb(hex).map(v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); });
  return .2126*r+.7152*g+.0722*b; }

/* ---------- tabel: header bisa diklik (besar→kecil), kolom cari, ekspor Excel ---------- */
function parseDisp(t){
  t=String(t||'').trim();
  if(!t||t==='—'||t==='-') return null;
  let m=/^(-?)\s*Rp\s*(-?[\d.,]+)\s*(T|M|jt|rb)?$/.exec(t);
  if(m){ let n=m[2]; n=n.includes(',')?n.replace(/\./g,'').replace(',','.'):n.replace(/\./g,'');
    let v=Number(n); if(isNaN(v)) return t;
    v*= {T:1e12,M:1e9,jt:1e6,rb:1e3}[m[3]]||1; return m[1]?-v:v; }
  m=/^(-?[\d.,]+)\s*%$/.exec(t);
  if(m){ const v=Number(m[1].replace(/\./g,'').replace(',','.')); return isNaN(v)?t:v/100; }
  if(/^-?[\d.,]+$/.test(t)){ const v=/,\d{1,2}$/.test(t)?Number(t.replace(/\./g,'').replace(',','.')):Number(t.replace(/[.,]/g,'')); return isNaN(v)?t:v; }
  return t;
}
function cellVal(td){
  let v=td.dataset.v; if(v==null||v==='') v=td.querySelector('[data-v]')?.dataset.v;
  if(v!=null&&v!==''&&!isNaN(Number(v))) return Number(v);
  return parseDisp(td.textContent);
}
function sortTable(tbl,ci,dir){
  const tb=tbl.tBodies[0]; if(!tb) return;
  const rows=[...tb.rows].filter(r=>!r.classList.contains('tot')), tots=[...tb.rows].filter(r=>r.classList.contains('tot'));
  const vals=rows.map(r=>r.cells[ci]?cellVal(r.cells[ci]):null);
  const numeric=vals.filter(v=>typeof v==='number').length >= vals.filter(v=>v!=null).length/2;
  const idx=rows.map((r,i)=>i);
  idx.sort((a,b)=>{
    let x=vals[a], y=vals[b];
    if(numeric){ x=typeof x==='number'?x:null; y=typeof y==='number'?y:null; }
    if(x==null&&y==null) return a-b; if(x==null) return 1; if(y==null) return -1;   // kosong selalu di bawah
    const c=numeric?x-y:String(x).localeCompare(String(y),'id',{numeric:true,sensitivity:'base'});
    return (dir==='asc'?c:-c)||a-b; });
  idx.forEach(i=>tb.append(rows[i])); tots.forEach(r=>tb.append(r));
}
function exportTable(tbl,name){
  const aoa=[[...tbl.tHead.rows[0].cells].map(th=>th.dataset.t||th.textContent.replace(/[▲▼]/g,'').trim())];
  const pctCols=new Set();
  for(const tr of tbl.tBodies[0].rows){
    if(tr.style.display==='none') continue;
    aoa.push([...tr.cells].map((td,i)=>{
      const v=cellVal(td);
      if(typeof v==='number'){ if(/%\s*$/.test(td.textContent)) pctCols.add(i); return v; }
      return td.textContent.trim(); }));
  }
  const fname=(name||'data').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10);
  try{
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    for(let r=1;r<aoa.length;r++) for(const c of pctCols){ const cell=ws[XLSX.utils.encode_cell({r,c})]; if(cell&&cell.t==='n') cell.z='0.0%'; }
    ws['!cols']=aoa[0].map((h,i)=>({wch:Math.min(46,Math.max(10,String(h).length+2,...aoa.slice(1,40).map(r=>String(r[i]??'').length+1)))}));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Data'); XLSX.writeFile(wb,fname+'.xlsx');
    toast('Mengunduh '+fname+'.xlsx');
  }catch(e){
    try{ const csv=aoa.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=fname+'.csv'; a.click();
      toast('Mengunduh '+fname+'.csv'); }
    catch(e2){ toast('Unduhan diblokir di halaman ini — buka versi hosting / file standalone.'); }
  }
}
function enhanceTable(tbl){
  if(tbl.dataset.enh) return; tbl.dataset.enh='1';
  const wrap=tbl.closest('.tw'); if(!wrap||!tbl.tHead||!tbl.tBodies[0]) return;
  const heads=[...tbl.tHead.rows[0].cells];
  heads.forEach((th,i)=>{
    if(!th.textContent.trim()) return;
    th.dataset.t=th.textContent.trim(); th.style.cursor='pointer'; th.title='Klik untuk mengurutkan';
    const ar=document.createElement('span'); ar.className='sortar'; th.append(ar);
    th.addEventListener('click',()=>{
      const cur=th.dataset.dir;
      const rows=[...tbl.tBodies[0].rows].filter(r=>!r.classList.contains('tot'));
      const numeric=rows.map(r=>r.cells[i]?cellVal(r.cells[i]):null).filter(v=>typeof v==='number').length>=rows.length/2;
      const dir=cur?(cur==='desc'?'asc':'desc'):(numeric?'desc':'asc');   // klik pertama pada angka = besar → kecil
      heads.forEach(h=>{ delete h.dataset.dir; const a=h.querySelector('.sortar'); if(a) a.textContent=''; });
      th.dataset.dir=dir; ar.textContent=dir==='desc'?' ▼':' ▲';

    for(const tr of tbl.tBodies[0].rows){ if(tr.classList.contains('tot')) continue;
      const ok=!t||tr.textContent.toLowerCase().includes(t); tr.style.display=ok?'':'none'; if(ok) shown++; }
    cnt.textContent=(t?shown+' dari ':'')+nRows+' baris'; });
  const inCard=!!wrap.closest('.card');
  const title=wrap.closest('.card')?.querySelector('header h2')?.textContent
    || document.querySelector('.page.on .phead h1')?.textContent || 'data';

    onclick:e=>copyNodeAsImage(wrap,e.currentTarget,wrap)},'⧉ Salin ke slide'));
  bar.append(el('button',{class:'btn sm',type:'button',onclick:()=>exportTable(tbl,title)},'⭳ Unduh Excel'));
  wrap.before(bar);
}

/* round 13 (visual fidelity): sama seperti bakeSvgPaint() di atas untuk grafik, warna/gaya pill/chip/
   header tabel dkk di SINI didefinisikan lewat kelas CSS + var()/color-mix() di <style> halaman (mis.
   .pill.ok{background:color-mix(in srgb,var(--good) 13%,transparent)...}) — begitu tabel/kartu disalin
   sebagai HTML lepas (ditempel ke Word/PowerPoint/Excel/Gmail dkk, yang TIDAK memuat <style> halaman ini
   dan banyak yang tidak mendukung color-mix()), semua pewarnaan itu hilang/jadi hitam polos. Perbaikannya:
   SEBELUM elemen diserialisasi jadi HTML, baca nilai RESOLVED dari elemen ASLI (masih terpasang di
   dokumen — getComputedStyle() otomatis menyelesaikan var()/color-mix() jadi rgb() literal) dan "bekukan"
   jadi inline style eksplisit di elemen clone — supaya tampilannya tetap sama persis dengan di app
   meski ditempel di aplikasi lain yang tidak kenal stylesheet/variabel CSS kita. */
function bakeVisualStyles(orig,clone){
  const PROPS=['color','backgroundColor','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor',
    'borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','borderTopStyle','borderRightStyle',
    'borderBottomStyle','borderLeftStyle','borderRadius','fontWeight','textAlign','textTransform','letterSpacing',
    'fontSize','whiteSpace','paddingTop','paddingRight','paddingBottom','paddingLeft','display','verticalAlign'];
  /* buang deklarasi lama yang masih memuat var()/color-mix() literal — dibiarkan, teks mentahnya tetap
     ada di HTML yang disalin walau ditimpa, dan beberapa aplikasi tujuan (Word dkk) tidak selalu
     menangani deklarasi tertimpa/tak-valid dengan rapi. Style non-warna (mis. width kolom sticky) yang
     TIDAK memuat var()/color-mix() tetap dipertahankan apa adanya. */
  const stripVarDecls=s=>(s||'').split(';').filter(d=>{ const t=d.trim(); return t&&!/var\(--|color-mix\(/.test(t); }).join(';');
  const COLOR_PROPS=new Set(['color','backgroundColor','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor']);
  const walk=(o,c)=>{
    if(!o||!c||o.nodeType!==1||c.nodeType!==1) return;
    const cs=getComputedStyle(o);
    let extra=stripVarDecls(c.getAttribute('style'));
    PROPS.forEach(p=>{ let v=cs[p]; if(v==null||v===''||v==='rgba(0, 0, 0, 0)'||v==='transparent') return;
      if(COLOR_PROPS.has(p)) v=canonColor(v);
      extra+=`;${p.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}:${v}`; });
    if(extra) c.setAttribute('style',extra); else c.removeAttribute('style');
    const oc=o.children, cc=c.children;
    for(let i=0;i<oc.length;i++) walk(oc[i],cc[i]);
  };
  walk(orig,clone);
}
/* item 4 (ronde ini): salin kartu/tabel/ringkasan apa pun ke clipboard dalam format "kolom" (tabel HTML
   asli + fallback TSV plain-text), supaya saat ditempel (Ctrl+V) ke slide presentasi / Word / Excel,
   strukturnya ikut terbawa — bukan cuma gambar datar seperti copyChartAsImage(). */
function buildCopyText(node){
  const parts=[];
  node.querySelectorAll('table').forEach(tbl=>{
    const rows=[...tbl.rows].filter(r=>r.style.display!=='none').map(r=>[...r.cells].map(c=>c.textContent.trim().replace(/\s+/g,' ')).join('\t'));
    if(rows.length) parts.push(rows.join('\n'));
  });
  if(!parts.length){
    const tiles=[...node.querySelectorAll('.tile')];
    if(tiles.length) parts.push(tiles.map(t=>{
      const k=t.querySelector('.k')?.textContent||'', v=t.querySelector('.v')?.textContent||'', m=t.querySelector('.m')?.textContent||'';
      return [k,v,m].filter(Boolean).join('\t');
    }).join('\n'));
  }
  if(!parts.length) parts.push((node.innerText||node.textContent||'').trim());
  return parts.join('\n\n');
}
function buildCopyHtml(node){
  const tables=[...node.querySelectorAll('table')];
  if(tables.length) return tables.map(t=>{
    const wrap=t.closest('.tw')||t.parentElement||t;
    const wrapBg=getComputedStyle(wrap).backgroundColor;
    const clone=t.cloneNode(true);
    bakeVisualStyles(t,clone);     // round 13: bekukan warna pill/chip/header SEBELUM menghapus .sortar
    clone.querySelectorAll('.sortar').forEach(n=>n.remove());
    return `<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font-family:sans-serif;font-size:12px;background:${wrapBg}">`+clone.innerHTML+'</table>';
  }).join('<br>');
  const tiles=[...node.querySelectorAll('.tile')];
  if(tiles.length){
    const cellHtml=origEl=>{
      if(!origEl) return '';
      const clone=origEl.cloneNode(true);
      bakeVisualStyles(origEl,clone);
      const wrap=document.createElement('div'); wrap.append(clone);
      return wrap.innerHTML;
    };
    const rows=tiles.map(t=>{
      const kEl=t.querySelector('.k'), vEl=t.querySelector('.v'), mEl=t.querySelector('.m');
      return `<tr><td style="font-weight:600;padding:4px 10px;border:1px solid #ccc">${cellHtml(kEl)}</td>`+
        `<td style="padding:4px 10px;border:1px solid #ccc">${cellHtml(vEl)}</td>`+
        `<td style="padding:4px 10px;border:1px solid #ccc">${cellHtml(mEl)}</td></tr>`;
    }).join('');
    return `<table border="1" cellspacing="0" cellpadding="0" style="border-collapse:collapse;font-family:sans-serif;font-size:12px">${rows}</table>`;
  }
  return `<div style="font-family:sans-serif;font-size:12px">${(node.innerText||node.textContent||'').trim().replace(/\n/g,'<br>')}</div>`;
}
async function copyNodeRich(node,btn){
  const old=btn.textContent;
  try{
    btn.disabled=true; btn.textContent='Menyiapkan…';
    const html=buildCopyHtml(node), text=buildCopyText(node);
    try{
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([text],{type:'text/plain'})})]);
      toast('Disalin — tempel (Ctrl+V) ke slide/dokumen, kolom tabel ikut terbawa.');
    }catch(e2){
      await navigator.clipboard.writeText(text);
      toast('Disalin sebagai teks (browser ini tidak mendukung salin kaya).');
    }
  }catch(e){ toast('Gagal menyalin: '+e.message); }
  btn.disabled=false; btn.textContent=old;
}

/* round 10 item 9: satu helper warna tren untuk SEMUA indikator naik/turun di seluruh app — hijau=naik/baik,
   merah=turun/jelek (tidak pernah tertukar), DAN intensitas warnanya mengikuti besar perubahan (bukan cuma
   dua warna flat seperti sebelumnya). `ratio` = pecahan bertanda seberapa besar perubahannya, mis.
   (cur-prev)/prev untuk growth, atau (achievement-1) untuk capaian vs target 100%. Diklem ke langit-langit
   yang wajar (50%) lalu dipetakan lewat akar (sqrt) ke intensitas 25%–100% — perubahan kecil tetap kebaca
   tapi jelas lebih redup dari perubahan besar. Pakai color-mix yang sama persis dengan .pill.ok/.pill.bad
   di <style> (~baris 163-164) supaya tetap konsisten tema terang/gelap. */
function trendColor(ratio){
  if(ratio==null||!isFinite(ratio)) return 'var(--muted)';
  const CEIL=.5; // perubahan ≥50% sudah dianggap "paling pekat"
  const mag=Math.min(Math.abs(ratio),CEIL)/CEIL;
  const intensity=Math.round((0.25+Math.sqrt(mag)*0.75)*100);
  const base=ratio>=0?'var(--good)':'var(--crit)';
  return `color-mix(in srgb, ${base} ${intensity}%, var(--muted))`;
}
function trendBg(ratio){ const c=trendColor(ratio); return `color-mix(in srgb, ${c} 14%, transparent)`; }
function trendBorder(ratio){ const c=trendColor(ratio); return `color-mix(in srgb, ${c} 40%, transparent)`; }
/* item 8 (ronde ini): gradien BESAR/KECIL untuk kolom net sales yang diurutkan dari terbesar ke
   terkecil — beda tujuan dari trendColor() di atas (itu soal arah naik/turun, hijau/merah). Ini
   soal rank: baris net sales paling besar = warna paling pekat/terang, makin kecil nilainya makin
   pudar — supaya urutan besar→kecil langsung "kebaca" dari warnanya juga, bukan cuma posisi baris. */
function magColor(v,max){
  if(v==null||!isFinite(v)||!max||max<=0) return 'var(--ink)';
  const frac=Math.max(0,Math.min(1,v/max));
  const intensity=Math.round((0.35+Math.sqrt(frac)*0.65)*100);
  return `color-mix(in srgb, var(--accent) ${intensity}%, var(--ink-2))`;
}
function magCell(v,max,txt){ return el('span',{style:`color:${magColor(v,max)};font-weight:700`},txt); }
/* item 1 (ronde ini): pengganti paragraf metodologi yang panjang — daftar poin ringkas, bukan
   prosa. Dipakai di SSSG dan bisa dipakai ulang di tempat lain yang butuh catatan serupa. */
function noteList(title,points){

function growthPill(cur,prev){
  if(prev==null||!(prev>0)) return el('span',{style:'color:var(--muted)'},'');          // tanpa pembanding → kosong
  const g=(cur-prev)/prev, c=trendColor(g);
  return el('span',{class:'pill '+(g>=0?'ok':'bad'),
    style:`color:${c};background:${trendBg(g)};border-color:${trendBorder(g)}`,'data-v':g},(g>=0?'▲ ':'▼ ')+pct(Math.abs(g))); }
function gapTxt(cur,prev){
  if(prev==null||!(prev>0)) return '';
  const d=cur-prev; const ratio=d/prev;
  const s=el('span',{style:`color:${trendColor(ratio)}`,'data-v':d},compact(d)); return s; }

/* ---------- rollup item sales (dihitung di database, ringan) ---------- */
async function rollup(dim,year,m1,m2,o={}){
  const ids=o.stores===undefined?scopeStoreIds():o.stores, ex=excludedCats();
  const key=JSON.stringify([dim,year,m1,m2,o.brand||null,o.category||null,o.limit||300,ids,ex]);
  if(S.rollCache.has(key)) return S.rollCache.get(key);
  let rows;
  if(S.demo) rows=demoRollup(dim,year,m1,m2,o.brand,o.category);
  else rows=await DB.rpc('item_rollup',{p_dim:dim,p_year:year,p_m1:m1,p_m2:m2,p_stores:ids&&ids.length?ids:(ids?[-1]:null),
    p_brand:o.brand||null,p_exclude:ex.length?ex:null,p_limit:o.limit||300,p_category:o.category||null});
  rows=rows.map(r=>({k:r.k,qty:N(r.qty),refunded:N(r.refunded),sales:N(r.sales),n:N(r.n_stores)}));
  S.rollCache.set(key,rows); return rows;
}
/* Daftar kategori item distinct, dipakai untuk filter Kategori lokal (item 10) di Top Product & Breakdown */
let _catListCache=null;
async function itemCategoryList(){
  if(_catListCache) return _catListCache;
  if(S.demo){ _catListCache=[...new Set(demoItems().map(r=>r.category_name).filter(Boolean))].sort(); return _catListCache; }
  try{ const rows=await DB.rpc('item_categories',{}); _catListCache=rows.map(r=>r.category).filter(Boolean).sort(); }
  catch(e){ _catListCache=[]; }
  return _catListCache;
}
function demoRollup(dim,year,m1,m2,brand,category){
  const f=({2024:.62,2025:.82}[year]||1)*((m2-m1+1)/9);
  const agg=new Map();
  demoItems().forEach(r=>{
    const catBrand=/MAMU/.test(r.category_name)?'MAMU':/MYNO/.test(r.category_name)?'MYNO':'TIGALAPAN';
    if(brand&&brand!==catBrand) return;
    if(category&&r.category_name!==category) return;
    const k={product:parseProduct(r.item_name),color:parseColor(r.item_name)||'(Tanpa warna)',size:parseSize(r.item_name)||'(Tanpa size)',
      category:r.category_name,brand:catBrand,store:(S.stores[(r.sku||'').length%S.stores.length]||{}).name||'-'}[dim]||r.item_name;
    const o=agg.get(k)||{k,qty:0,refunded:0,sales:0,n:1};
    const j=0.85+seeded((k+year).length*7+k.charCodeAt(0))*0.3;
    o.qty+=r.item_sold_real*f*j; o.refunded+=r.item_refunded*f; o.sales+=r.net_sales*f*j; agg.set(k,o); });
  return [...agg.values()].sort((a,b)=>b.sales-a.sales).map(o=>({k:o.k,qty:Math.round(o.qty),refunded:Math.round(o.refunded),sales:Math.round(o.sales),n_stores:1}));
}
/* gabungkan hasil rollup beberapa tahun: Map key → [rowTahun1, rowTahun2, ...] */
function mergeRoll(perYear){
  const m=new Map();
  perYear.forEach((rows,yi)=>rows.forEach(r=>{ if(!m.has(r.k)) m.set(r.k,new Array(perYear.length).fill(null)); m.get(r.k)[yi]=r; }));
  return m;
}

/* H2H selalu dibandingkan terhadap TAHUN BERJALAN YANG SEBENARNYA (kalender), bukan terhadap
   S.year/filter Tahun di atas (yang sejak item multi-select bisa berubah-ubah jadi MAX tahun
   terpilih). Round 7 item 1: y3 (tahun berjalan) dikunci lewat h2hCurrentYear() — filter Tahun
   global TIDAK memengaruhi anchor tahun H2H lagi (lihat FILTER_VISIBILITY.h2h, 'year' dihapus). */
function h2hCurrentYear(){
  const now=new Date().getFullYear();
  const years=new Set(S.dashAll.map(r=>r.year));
  if(years.has(now)) return now;                       // tahun kalender sekarang, kalau datanya sudah ada
  const by=Number(S.settings.base_year);
  if(by && years.has(by)) return by;                    // fallback: base_year dari Pengaturan (dipakai jg di tempat lain sbg "tahun operasional")
  const list=[...years].sort((a,b)=>b-a);
  return list[0]||by||now;                              // fallback terakhir: tahun terbaru yang punya data sama sekali
}
function h2hInit(){
  const y3=h2hCurrentYear();
  const key='h2h|'+S.month;                             // tidak lagi tergantung S.year — hanya filter bulan global dipakai sbg default awal
  if(!S.h2h||S.h2h.key!==key){
    const lm=lastMonthWithData(y3);
    const today=new Date();
    S.h2h={key,y:[y3-2,y3-1,y3],m1:S.month||1,m2:S.month||lm,
      cutoffFrom:null,cutoffTo:today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0')};
  } else {
    S.h2h.y=[y3-2,y3-1,y3];   // jaga-jaga kalau data/base_year berubah tanpa reset key
  }
  return S.h2h;
}
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function h2hData(years,m1,m2,cutoffDay){
  const out={};
  for(const y of years){
    const m=new Map();
    const get=id=>{ if(!m.has(id)) m.set(id,{name:(S.stores.find(s=>s.id===id)||{}).name||String(id),sales:0,kom:0,usr:0,kt:0,ut:0,um:0,tgt:0,tgtDays:0,trx:0,val:0}); return m.get(id); };
    /* faktor ekstrapolasi hanya dipakai utk bulan terakhir rentang (m2), supaya periode parsial
       (mis. baru tanggal 4) diproyeksikan setara satu bulan penuh: rata² harian × jumlah hari bulan itu */
    const dim2=daysInMonth(y,m2);
    const fac = (cutoffDay && cutoffDay>0 && cutoffDay<dim2) ? dim2/cutoffDay : 1;
    S.dashAll.forEach(r=>{ if(r.year!==y||r.month<m1||r.month>m2||!storeOk(r.store_id)) return;
      const f = r.month===m2 ? fac : 1;
      const o=get(r.store_id); o.sales+=N(r.total_sales)*f; o.kom+=N(r.sales_komersial)*f; o.usr+=N(r.sales_user)*f;
      o.kt+=N(r.sales_komersial_tigalapan)*f; o.ut+=N(r.sales_user_tigalapan)*f; o.um+=N(r.sales_user_mamu)*f;
      o.tgt+=N(r.target_total);   // target tidak diekstrapolasi — tetap target bulan penuh
      o.tgtDays+=N(r.target_total)/daysInMonth(y,r.month); });
    S.trxAll.forEach(r=>{ if(r.year!==y||r.month<m1||r.month>m2||!storeOk(r.store_id)) return;
      const f = r.month===m2 ? fac : 1;
      const o=get(r.store_id); o.trx+=N(r.jumlah_transaksi)*f; o.val+=N(r.nilai_transaksi)*f; });
    out[y]=m;
  }
  return out;
}
function sumObj(maps,key){ return maps.reduce((s,o)=>s+N(o[key]),0); }

  /* round 8 item 7: tile ke-4 sebelumnya kosong (filler g4) — isi dengan AOV growth y3 vs y2, metrik nyata

  host.append(el('div',{class:'empty'},'Memuat item sales tiga tahun…'));

      const res={}; await Promise.all(dims.map(async d=>{ res[d]=await Promise.all(st.y.map(y=>rollup(d,y,m1,m2,{limit:d==='product'?400:200}))); }));
