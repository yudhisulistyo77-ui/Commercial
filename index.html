<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#bd2579">
<title>Store Operation — Commercial Departement</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* Layout: rail navigasi kiri + area kerja berisi bar filter sticky lalu kartu-kartu data. */
:root{
  --bg:#f5f6f9; --surface:#fdfdfe; --surface-2:#f0f2f6; --ink:#0d0f14; --ink-2:#555c69;
  --muted:#858c99; --grid:#e4e7ee; --line:#cbd0db; --ring:rgba(13,15,20,.09);
  --accent:#2a78d6; --accent-soft:#e7f0fc; --accent2:#9333ea; --grad:linear-gradient(135deg,#7c3aed,#d6336c);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --target-bar:#8d94a3;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300;
  --font-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --rail:272px; --shadow:0 1px 2px rgba(13,15,20,.05),0 1px 1px rgba(13,15,20,.03);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0c0e11; --surface:#16191e; --surface-2:#1e2228; --ink:#ffffff; --ink-2:#c3c7d0;
  --muted:#8a9099; --grid:#252a31; --line:#383e47; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#17283c; --accent2:#a855f7; --grad:linear-gradient(135deg,#8b5cf6,#ec4899);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --target-bar:#6b7280;
  --good-ink:#0ca30c; color-scheme:dark; --shadow:0 1px 2px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0c0e11; --surface:#16191e; --surface-2:#1e2228; --ink:#ffffff; --ink-2:#c3c7d0;
  --muted:#8a9099; --grid:#252a31; --line:#383e47; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#17283c; --accent2:#a855f7; --grad:linear-gradient(135deg,#8b5cf6,#ec4899);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --target-bar:#6b7280;
  --good-ink:#0ca30c; color-scheme:dark; --shadow:0 1px 2px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-num);font-size:.92em}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100%}
#rail{width:var(--rail);flex:0 0 var(--rail);background:var(--surface);border-right:1px solid var(--ring);
  display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;z-index:30}
.brand{padding:14px 16px 13px;border-bottom:1px solid var(--ring);display:flex;flex-direction:column;gap:9px;position:relative}
.brand .mkrow{display:flex;gap:10px;align-items:center;width:100%;padding-right:30px}
/* round 9 item 2: logo (gear + wordmark CMC) dipakai apa adanya dari file webp aslinya — file itu TIDAK
   punya kanal alpha (RGB biasa) dan latarnya "dibakar" putih (≈254,254,254), bukan transparan; sudah dicek
   dengan PIL. Mengganti bg kotak menjadi transparan tidak akan menghilangkan kotak putih itu (pikselnya
   tetap putih), jadi "menyesuaikan baground" di sini dikerjakan dengan cara yang realistis: kartu kecil
   (bukan kotak tegas dgn shadow berat seperti round 8) dengan warna senada tema (ring/garis tipis, bayangan
   amat tipis) sehingga tetap terasa menyatu di light & dark, bukan sekadar kotak putih yang "nabrak".
   round 10 item 1: teks "Store Operation / Commercial Departement" sekarang di SAMPING logo (bukan di
   bawah seperti round 9) — agar ini cukup muat, rail dilebarkan 242px→272px (var(--rail)), logo diperkecil
   68px→56px (masih jelas terbaca), dan tombol lipat (#railcollapse) dipindah keluar dari baris logo+teks:
   ditaruh absolute di pojok kanan-atas .brand, bukan berdesakan di baris yang sama. */
.brand .mk{width:56px;height:56px;border-radius:12px;background:#fdfdfd;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;box-shadow:0 1px 2px rgba(0,0,0,.08);border:1px solid var(--ring);padding:5px;overflow:hidden}
.brand .mk img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
.brand-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.brand-txt b{display:block;font-size:13.5px;font-weight:800;letter-spacing:.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand #railcollapse{position:absolute;top:10px;right:10px;margin-left:0}
#shell.railcollapsed .brand{align-items:center;padding:14px 8px}
#shell.railcollapsed .brand .mkrow{flex-direction:column;gap:6px;padding-right:0}
#shell.railcollapsed .brand .mk{width:46px;height:46px;border-radius:11px;padding:4px}
#shell.railcollapsed .brand .mk img{height:auto;width:100%;object-fit:contain}
#shell.railcollapsed .brand #railcollapse{position:static;margin:4px auto 0}
nav{padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.navgrp{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:12px 10px 5px;font-weight:600}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;
  background:transparent;cursor:pointer;color:var(--ink-2);font-weight:500}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(124,58,237,.3)}
nav button svg{width:17px;height:17px;flex:0 0 auto}
.railfoot{padding:11px;border-top:1px solid var(--ring);display:flex;gap:8px;align-items:center}
#main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- filter bar ---------- */
#filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(9px);border-bottom:1px solid var(--ring);padding:6px 20px;display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0;flex:0 0 auto}
.fld label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fld select{width:100%}
#f-year{min-width:70px}
#f-month{min-width:132px}
#f-range{min-width:150px}
#f-brand,#f-spv,#f-store{min-width:130px}
/* round 8 item 1/4: dropdown multi-select reusable (lihat multiSelectDropdown()) — ganti chip-row
   permanen (round 7) dan native <select multiple> lama, dipakai utk Tahun/Toko/Brand/Kategori dll. */
.msd{position:relative;display:inline-block}
.msd-btn{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;min-width:0}
.msd-btn span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.msd-btn svg{flex:0 0 auto;width:11px;height:11px;opacity:.65;transition:transform .12s}
.msd.open .msd-btn svg{transform:rotate(180deg)}
.msd-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:200px;max-width:280px;max-height:320px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:none;
  flex-direction:column}
.msd.open .msd-pop{display:flex}
/* Round 18: kotak cari — field tetap di atas, baris foot (Bersihkan/Pilih semua) tetap di bawah, hanya
   daftar opsi (.msd-opts) yang scroll bila panjang. */
.msd-search{width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:4px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface-2);font-size:12.5px;flex:0 0 auto}
.msd-opts{overflow-y:auto;flex:1 1 auto;min-height:0}
.msd-empty{padding:8px 7px;font-size:12.5px;color:var(--muted)}
.msd-opt{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:13px}
.msd-opt:hover{background:var(--surface-2)}
.msd-opt input{margin:0}
.msd-foot{display:flex;gap:6px;padding:5px 6px 2px;border-top:1px solid var(--ring);margin-top:4px;flex:0 0 auto}
.msd-foot button{flex:1;font-size:11px;padding:3px 6px}
/* ---------- per-page filter row (item 2) ---------- */
.pagefilters{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end;padding:9px 14px;margin:0;
  background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);box-shadow:var(--shadow)}
.pagefilters .fld{min-width:0;flex:0 0 auto}
.pagefilters #f-custom-wrap{display:flex!important}
.pagefilters .pf-sub{flex-basis:100%;height:0;border-top:1px dashed var(--ring);margin:1px 0}
@media(max-width:620px){.pagefilters{gap:7px}.pagefilters .fld{flex:1 1 128px}}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;min-width:0}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.spacer{flex:1}

/* ---------- page ---------- */
.page{padding:20px;padding-block:16px 56px;display:none;flex-direction:column;gap:15px;max-width:1680px;margin:0 auto;width:100%}
/* round 9 item 3: jarak phead → baris filter dipersempit secara khusus (tanpa mengecilkan jarak antar
   kartu konten di bawahnya, yang masih pakai gap 15px standar di atas) */
.phead + .pagefilters{margin-top:-5px}
.page.on{display:flex}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.phead h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.phead p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5}

.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow)}
.card>header{display:flex;align-items:baseline;gap:10px;margin:-2px 0 14px;flex-wrap:wrap}
.card>header h2{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card>header .sub{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* Round 19: grid auto-fit — dipakai baris tile yang jumlah itemnya variabel (mis. Marketplace, jumlah
   channel bisa 2-5+) supaya baris TERAKHIR yang tidak genap kelipatan 4 tidak menyisakan tile
   menggantung sendirian/terlalu kecil di pojok kiri (laporan user "card tidak proporsional") —
   tiap tile punya lebar minimum 200px dan melar mengisi sisa baris secara merata. */
.gauto{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g23,.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:620px){.g4{grid-template-columns:minmax(0,1fr)}}
/* item 4: #main's own box width (not viewport) drives reflow — fixes rail-open (242px) desktop
   not narrowing content enough to trip the viewport media queries above */
#main{container-type:inline-size;container-name:main}
@container main (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g23,.g2{grid-template-columns:minmax(0,1fr)}}
@container main (max-width:540px){.g4{grid-template-columns:minmax(0,1fr)}}

/* ---------- stat tiles ---------- */
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:7px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:.85}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tile .m{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:3px;background:var(--grad)}
.meter.ok i{background:var(--good)} .meter.mid i{background:var(--warn)} .meter.bad i{background:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.pill.bad{background:color-mix(in srgb,var(--crit) 13%,transparent);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 32%,transparent)}
.pill.mid{background:color-mix(in srgb,var(--warn) 17%,transparent);color:#8a5a00;border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
:root[data-theme="dark"] .pill.mid,:root:not([data-theme="light"]) .pill.mid{color:var(--warn)}
.pill.neu{background:var(--surface-2);color:var(--ink-2);border-color:var(--ring)}
/* Round 18: nilai negatif APAPUN (Rp, %, angka biasa) yang dibentuk lewat T()/rp()/compact()/pct()/int()
   otomatis dibungkus span.negval di el() — supaya minus konsisten merah di SELURUH app tanpa menyentuh
   tiap titik pemanggilan satu per satu. */
.negval{color:var(--crit);font-weight:700}
.badge{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:700;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--ring)}

/* ---------- table ---------- */
.tw{overflow-x:auto;border:1px solid var(--ring);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
col.narrow{width:1%}
th{background:var(--surface-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);
  font-weight:700;position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--surface-2)}
tr.tot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line)}
tr.segparent td{font-weight:700}
tr.segsub td{color:var(--ink-2);font-weight:400;font-size:12.5px}
tr.segsub td.sticky1{padding-left:26px}
tbody tr:last-child td{border-bottom:0}
.sticky1{position:sticky;left:0;background:var(--surface);z-index:2}
th.sticky1{z-index:3}
tbody tr:hover .sticky1{background:var(--surface-2)}

/* ---------- chart ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:9px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 7px 22px rgba(0,0,0,.17);opacity:0;transition:opacity .1s;max-width:250px}
#tip b{display:block;margin-bottom:4px;font-size:12px}
#tip .row{display:flex;justify-content:space-between;gap:14px}
#tip .row span:last-child{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- misc ---------- */
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--surface);transition:.14s}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:14px;margin-bottom:4px}
.drop p{margin:0;color:var(--muted);font-size:12.5px}
.note{background:var(--surface-2);border:1px solid var(--ring);border-left:3px solid var(--accent);border-radius:8px;
  padding:11px 13px;font-size:13px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn)}
.note b{color:var(--ink)}
.log{font-family:var(--font-num);font-size:11.5px;max-height:230px;overflow:auto;background:var(--surface-2);
  border:1px solid var(--ring);border-radius:8px;padding:10px;white-space:pre-wrap;line-height:1.65}
.pdca{display:grid;gap:13px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.pdca{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.pdca{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.col>h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;padding:11px 13px;border-bottom:1px solid var(--ring);
  display:flex;align-items:center;gap:8px}
.col>h3 .dot{width:8px;height:8px;border-radius:999px}
.col .body{padding:11px;display:flex;flex-direction:column;gap:9px;flex:1}
.item{background:var(--surface-2);border:1px solid var(--ring);border-radius:8px;padding:10px}
.item .t{font-weight:600;font-size:13px;margin-bottom:3px}
.item .c{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap}
.item .f{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.rowline{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px}
.modal .box{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:20px;max-width:560px;width:100%;
  max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.badgepair{display:flex;gap:6px;align-items:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);z-index:120;background:var(--ink);
  color:var(--bg);padding:10px 17px;border-radius:999px;font-size:13px;font-weight:600;transition:transform .22s;max-width:92vw}
#toast.on{transform:translateX(-50%) translateY(0)}
/* round 8 item 5: progress bar tipis global + spinner kecil utk withLoading() */
#topbar{position:fixed;top:0;left:0;height:2.5px;width:0;background:var(--grad);z-index:200;opacity:0;transition:opacity .15s}
#topbar.on{opacity:1;width:60%;transition:width 8s cubic-bezier(.1,.6,.2,1),opacity .15s}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;
  animation:spin .6s linear infinite;margin-right:6px;vertical-align:-1.5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Round 20: user minta SEMUA kolom bernilai Rupiah tetap ringkas (format jt/M/rb/T seperti sebelumnya),
   tapi sampai 2 angka di belakang koma dan TIDAK dibulatkan ke atas — angka apa adanya sesuai nilai sales
   yang ada. Sebelumnya tier jt/rb dipotong 0 desimal dan tier T/M dipotong 2 desimal TAPI lewat
   `toLocaleString(maximumFractionDigits)` yang MEMBULATKAN (round-half-up/even), bukan memotong — mis.
   Rp 1.236.000 pada tier "jt" sebelumnya tampil "Rp 1 jt" (dibulatkan dari 1,236), sekarang harus tampil
   "Rp 1,23 jt" (dipotong/truncate, bukan dibulatkan ke 1,24). `trunc2()` memotong ke 2 desimal dengan
   Math.floor SEBELUM diformat, baru `toLocaleString` dipanggil hanya untuk pemisah ribuan + menjamin 2
   desimal selalu tampil (minimumFractionDigits:2) — toLocaleString tidak lagi sempat membulatkan karena
   angkanya sudah tepat 2 desimal saat masuk ke situ. */
function trunc2(x){ return Math.floor(x*100+1e-9)/100; }

   `minimumFractionDigits` membuat `toLocaleString` otomatis memotong trailing zero (default minimum

   dipakai duluan supaya tetap truncate, bukan dibulatkan. */
function compact(v){ if(v==null||isNaN(v))return T('—');
  const a=Math.abs(v), s=v<0?'-':'';
  const f2=x=>trunc2(x).toLocaleString('id-ID',{maximumFractionDigits:2});
  let t;
  if(a>=1e12) t=s+'Rp '+f2(a/1e12)+' T';
  else if(a>=1e9)  t=s+'Rp '+f2(a/1e9 )+' M';
  else if(a>=1e6)  t=s+'Rp '+f2(a/1e6 )+' jt';
  else if(a>=1e3)  t=s+'Rp '+f2(a/1e3 )+' rb';
  else t=s+'Rp '+f2(a);
  return T(t,v); }
function pct(v,dec=2){ return (v==null||isNaN(v))?T('—'):T((v*100).toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec})+'%',v); }
function int(v){ return (v==null||isNaN(v))?T('—'):T(Math.round(v).toLocaleString('id-ID'),Math.round(v)); }

/* Round 18: PDCA — lampirkan link yang bisa dibuka langsung di browser. Tabel `pdca` di Supabase tidak
   punya kolom URL khusus (sesi ini tidak punya akses tool database utk migrasi skema), jadi link
   disimpan sebagai baris terakhir teks `content` sendiri ("Link: https://…") — tanpa perlu kolom baru.
   `linkify()` lalu mengubah SETIAP url http(s):// yang ada di content (baris Link ini, atau url apa pun
   yang diketik user di tengah teks) jadi <a> yang bisa langsung diklik saat ditampilkan. */
const URL_RE=/\bhttps?:\/\/[^\s<>()"']+/gi;
function linkify(text){
  const frag=document.createDocumentFragment();
  if(!text){ return frag; }
  let last=0, m;
  const re=new RegExp(URL_RE);
  while((m=re.exec(text))){
    if(m.index>last) frag.append(document.createTextNode(text.slice(last,m.index)));
    let url=m[0].replace(/[.,;)]+$/,'');
    frag.append(el('a',{href:url,target:'_blank',rel:'noopener noreferrer'},url));
    last=m.index+url.length;
    if(url.length<m[0].length) frag.append(document.createTextNode(m[0].slice(url.length)));
  }
  if(last<text.length) frag.append(document.createTextNode(text.slice(last)));
  return frag;
}
/* Pisahkan baris "Link: <url>" dari sisa content, utk mengisi field Link terpisah di form edit. */
function splitPdcaLink(content){
  const lines=(content||'').split('\n');
  const li=lines.findIndex(l=>/^Link:\s*https?:\/\//i.test(l.trim()));
  if(li<0) return {body:content||'', link:''};
  const link=lines[li].trim().replace(/^Link:\s*/i,'');
  lines.splice(li,1);
  return {body:lines.join('\n').replace(/\n+$/,''), link};
}
function joinPdcaLink(body,link){
  const b=(body||'').trim();
  if(!link) return b;
  return (b?b+'\n':'')+'Link: '+link.trim();
}

   sama persis dengan cara Link (round 18) disimpan tanpa kolom baru. */
function splitPdcaGroup(content){
  const lines=(content||'').split('\n');
  const gi=lines.findIndex(l=>/^Kelompok:\s*/i.test(l.trim()));
  if(gi<0) return {body:content||'', group:''};
  const group=lines[gi].trim().replace(/^Kelompok:\s*/i,'').trim();
  lines.splice(gi,1);
  return {body:lines.join('\n').replace(/^\n+|\n+$/g,''), group};
}
function joinPdcaGroup(body,group){
  const b=(body||'').trim(); const g=(group||'').trim();
  if(!g) return b;
  return 'Kelompok: '+g+(b?'\n'+b:'');
}

let _busyN=0;
function _busyPush(){ _busyN++; const b=$('#topbar'); if(b) b.classList.add('on'); }
function _busyPop(){ _busyN=Math.max(0,_busyN-1); if(_busyN===0){ const b=$('#topbar'); if(b) b.classList.remove('on'); } }
async function withLoading(btn,fn,label){
  const orig=btn?btn.innerHTML:null, wasDisabled=btn?btn.disabled:false;

  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'+(label||'Memproses…'); }
  try{ return await fn(); }
  finally{ _busyPop(); if(btn){ btn.disabled=wasDisabled; btn.innerHTML=orig; } }

/* ---------- Supabase REST ---------- */
function authHeaders(key){
  const h={apikey:key};
  if(/^eyJ/.test(key)) h.Authorization='Bearer '+key;   // hanya untuk key JWT lama
  return h;
}
const DB = {
  /* Key format lama (anon) berupa JWT dan boleh dikirim sebagai Bearer.
     Key format baru (sb_publishable_…) bukan JWT — kalau dikirim sebagai
     Bearer, Supabase menolaknya dengan 401. Jadi hanya apikey yang dipakai. */
  h(extra={}){ return Object.assign(authHeaders(S.key), {'Content-Type':'application/json'}, extra); },
  async sel(path){
    const r = await fetch(S.url.replace(/\/$/,'')+'/rest/v1/'+path, {headers:this.h()});
    if(!r.ok) throw new Error('['+r.status+'] '+(await r.text()).slice(0,220));
    return r.json();
  },
  async selAll(path, pageSize=1000, cap=40000){
    const out=[]; let from=0;
    for(;;){
      const r = await fetch(S.url.replace(/\/$/,'')+'/rest/v1/'+path,
        {headers:this.h({Range:`${from}-${from+pageSize-1}`,'Range-Unit':'items'})});
      if(!r.ok) throw new Error('['+r.status+'] '+(await r.text()).slice(0,220));
      const b = await r.json(); out.push(...b);
      if(b.length<pageSize || out.length>=cap) break;
      from += pageSize;
    }
    return out;
  },
  async write(table, rows, conflict){
    if(!rows.length) return 0;
    const q = conflict ? '?on_conflict='+conflict : '';
    const pref = conflict ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal';
    for(let i=0;i<rows.length;i+=400){
      const r = await fetch(S.url.replace(/\/$/,'')+'/rest/v1/'+table+q,
        {method:'POST', headers:this.h({Prefer:pref}), body:JSON.stringify(rows.slice(i,i+400))});
      if(!r.ok) throw new Error('['+r.status+'] '+(await r.text()).slice(0,300));
    }
    return rows.length;
  },
  async patch(table, q, body){
    const r = await fetch(S.url.replace(/\/$/,'')+'/rest/v1/'+table+'?'+q,
      {method:'PATCH', headers:this.h({Prefer:'return=minimal'}), body:JSON.stringify(body)});
    if(!r.ok) throw new Error('['+r.status+'] '+(await r.text()).slice(0,220));
  },
  async del(table, q){
    const r = await fetch(S.url.replace(/\/$/,'')+'/rest/v1/'+table+'?'+q,
      {method:'DELETE', headers:this.h({Prefer:'return=minimal'})});
    if(!r.ok) throw new Error('['+r.status+'] '+(await r.text()).slice(0,220));
  },
  async rpc(fn, args={}){
    const r = await fetch(S.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,
      {method:'POST', headers:this.h(), body:JSON.stringify(args)});
    if(!r.ok) throw new Error('['+r.status+'] '+(await r.text()).slice(0,220));
    return r.json();
  }
};

function pageFilterBar(id){

  if(!vis.length) return null;
  /* Ambil referensi & nilai SEBELUM memindah node apa pun: begitu sebuah elemen dipindah ke dalam
     `wrap` yang masih "lepas" (belum di-append ke dokumen), document.querySelector tidak lagi
     menemukannya (ia sudah keluar dari pohon dokumen hidup) — jadi semua $('#f-...') harus dipanggil
     duluan, baru append. */
  const rangeSel=$('#f-range'), rangeVal=rangeSel?rangeSel.value:'', customWrap=$('#f-custom-wrap');
  const wrap=el('div',{class:'pagefilters'});
  if(vis.includes('year')) wrap.append($('#f-year').closest('.fld'));
  if(vis.includes('month')) wrap.append($('#f-month').closest('.fld'));
  if(vis.includes('range')){ wrap.append(rangeSel.closest('.fld')); wrap.append(customWrap);
    customWrap.style.display = rangeVal==='custom' ? 'flex' : 'none'; }
  if(vis.includes('brand')) wrap.append($('#f-brand').closest('.fld'));
  if(vis.includes('spv')) wrap.append($('#f-spv').closest('.fld'));
  if(vis.includes('store')) wrap.append($('#f-store').closest('.fld'));
  const clearBtn=$('#f-clear'); if(clearBtn) wrap.append(clearBtn);   // round 7 item 4: Clear hidup berdampingan dgn filter halaman ini
  return wrap;
}

    else if(selected.length===1){ const o=options.find(o=>o.value===selected[0]); lbl.textContent=o?o.label:selected[0]; }
    else lbl.textContent=selected.length+' dipilih';
    lbl.title=lbl.textContent;
  };
  const renderOpts=()=>{
    optsHost.innerHTML='';
    const filtered=q?options.filter(o=>o.label.toLowerCase().includes(q)):options;
    if(!filtered.length){ optsHost.append(el('div',{class:'msd-empty'},'Tidak ada hasil.')); return; }
    filtered.forEach(o=>{
      const cb=el('input',{type:'checkbox'}); cb.checked=selected.includes(o.value);
      cb.onchange=()=>{
        const i=selected.indexOf(o.value);
        if(cb.checked){ if(i<0) selected.push(o.value); } else if(i>=0) selected.splice(i,1);
        renderLabel(); onChange(selected.slice());
      };
      optsHost.append(el('label',{class:'msd-opt'},cb,document.createTextNode(o.label)));
    });
  };
  const buildPop=()=>{
    pop.innerHTML='';
    if(searchBox){ searchBox.value=''; q=''; pop.append(searchBox); }
    pop.append(optsHost);
    renderOpts();
    if(opt.allowAll!==false){
      /* Round 19: "✕ Bersihkan" SEBELUMNYA hanya mengosongkan `selected` tapi MENINGGALKAN kotak cari
         (`q`/searchBox.value) apa adanya — kalau user sempat mengetik kata kunci, daftar checkbox di
         popover tetap tersaring sempit walau seleksinya sudah kosong, terasa seperti "belum benar-benar
         kembali ke tampilan awal" (laporan user). Sekarang kedua tombol footer juga mereset kotak cari. */
      pop.append(el('div',{class:'msd-foot'},
        el('button',{type:'button',class:'btn sm',title:'Kosongkan pilihan (tampilkan semua)',
          onclick:()=>{ selected.length=0; if(searchBox){ searchBox.value=''; q=''; } renderOpts(); renderLabel(); onChange(selected.slice()); }},'✕ Bersihkan'),
        el('button',{type:'button',class:'btn sm',onclick:()=>{ selected.length=0; options.forEach(o=>selected.push(o.value)); if(searchBox){ searchBox.value=''; q=''; } renderOpts(); renderLabel(); onChange(selected.slice()); }},'Pilih semua')));
    }
  };
  buildPop(); renderLabel();
  btn.onclick=e=>{ e.stopPropagation(); const willOpen=!msd.classList.contains('open');
    document.querySelectorAll('.msd.open').forEach(m=>{ if(m!==msd) m.classList.remove('open'); });
    msd.classList.toggle('open',willOpen);
    if(willOpen && searchBox) setTimeout(()=>searchBox.focus(),0); };
  msd.append(btn,pop); container.append(msd);
  return { rebuild:(newOptions,newSelected)=>{ options=newOptions; if(newSelected){ selected.length=0; selected.push(...newSelected); } buildPop(); renderLabel(); } };
}

      DB.selAll('app_settings?select=*'),
      DB.sel('ingest_log?select=*&order=created_at.desc&limit=1000'),   // round 9 item 4: dipakai Tracking Data, naikkan dari 40
      opt(DB.sel('people?select=*&order=sort_order,name')),
      opt(DB.sel('brand_targets?select=*')),
      opt(DB.sel('channel_targets?select=*')),

      opt(DB.sel('pica?select=*&order=due_date.asc.nullslast,id.desc&limit=1000')),
      opt(DB.sel('kpi_weekly?select=*'))
    ]);
    const trxAll=trxRows.filter(r=>r.is_manual===true).map(r=>{const st=stores.find(s=>s.id===r.store_id)||{};return {...r,store_name:st.name||String(r.store_id),brand:st.brand,spv:st.spv,aov:N(r.jumlah_transaksi)>0?N(r.nilai_transaksi)/N(r.jumlah_transaksi):null};});
    const dash=dashAll.filter(r=>r.year===S.year), trx=trxAll.filter(r=>r.year===S.year);
    /* round 17: channel "MARKETPLACE" (bucket generik round 10, dipakai sbg override MAMU TSM dkk) DIGABUNG
       jadi SHOPEE di SETIAP tempat channel dibaca — dilakukan di SATU titik di sini (bukan di tiap
       pemanggil) supaya konsisten di seluruh app tanpa perlu migrasi SQL manual ke tabel produksi (sesi ini
       tidak punya akses tool database langsung). Baris lama di `sales_type_map`/`channel_targets` yang
       masih tersimpan dengan channel='MARKETPLACE' TETAP ada apa adanya di database — ini hanya normalisasi
       di sisi tampilan/perhitungan, dilakukan di titik tunggal ini setiap kali data dimuat, jadi hasilnya
       selalu konsisten (dan kalau datanya nanti benar-benar dimigrasikan di database, tidak ada efek
       apa pun di sini karena nilainya memang sudah SHOPEE). */
    const normCh=v=>{ const u=String(v||'').toUpperCase(); return u==='MARKETPLACE'?'SHOPEE':(u||null); };
    map.forEach(m=>{ if(m.channel) m.channel=normCh(m.channel); });
    (chanTargets||[]).forEach(t=>{ if(t.channel) t.channel=normCh(t.channel); });
    (mkt||[]).forEach(r=>{ if(r.channel) r.channel=normCh(r.channel); });
    Object.assign(S,{stores,aliases,dash,dashAll,growth,trx,trxAll,map,unmapped,metrics,entries,pdca,logs,
      people,brandTargets,chanTargets,mkt,pica,kpiWeekly,ready:true,demo:false});
    S.rollCache.clear();
    S.settings = Object.fromEntries(settings.map(r=>[r.key,r.value]));
    fillFilters();
    setConn('Terhubung','ok');
  }catch(e){
    setConn('Gagal terhubung','bad');
    S.lastError=e.message;
    /* fetch yang gagal tanpa status HTTP = permintaan tidak pernah keluar
       (CSP sandbox, offline, atau host diblokir) */
    S.blocked=/failed to fetch|networkerror|load failed|network request failed/i.test(e.message||'');
    toast(S.blocked
      ? 'Permintaan jaringan diblokir — halaman ini kemungkinan versi pratinjau.'
      : 'Gagal memuat — buka Pengaturan lalu tekan Tes koneksi.');
    console.error(e);
    if(!S.dash.length) buildDemo();   // tetap ada yang bisa dilihat
  }
  _busyPop();
  render();
}

/* satu pintu untuk filter Brand · SPV · Toko */
function productFilterPage(){return ['item','brand','top'].includes(S.page);}
function storeOk(sid){
  const st=S.stores.find(s=>s.id===sid); if(!st) return false;
  const sl=storeList(); if(sl.length && !sl.includes(String(sid))) return false;
  const bl=productFilterPage()?[]:brandList(); if(bl.length && !bl.includes(st.brand)) return false;
  const pl=spvList(); if(pl.length && !pl.includes(st.spv)) return false;
  return true;
}

/* Rentang periode global tambahan (kuartal/custom) — item 5. Jika S.monthRange terisi [m1,m2],
   dipakai menggantikan pencocokan bulan tunggal/​YTD biasa. */
function inPeriod(month){
  if(S.monthRange) return month>=S.monthRange[0] && month<=S.monthRange[1];
  return !S.month || month===S.month;
}
function periodM1M2(y){
  if(S.monthRange) return S.monthRange.slice();
  return [S.month||1, S.month||lastMonthWithData(y)];
}
function scope(rows){
  return rows.filter(r=>{
    if(!inPeriod(r.month)) return false;
    return storeOk(r.store_id);
  });
}
/* Round 21: S.dash HANYA berisi baris tahun filter aktif (S.year) di mode nyata (lihat loadAll —
   `dash=dashAll.filter(r=>r.year===S.year)`), sedangkan S.dashAll berisi SEMUA tahun. Form yang
   punya dropdown Tahun sendiri (mis. "Tambah/Update Target Manual") butuh baris dari tahun MANAPUN,
   bukan cuma tahun filter aktif, jadi harus pakai dashAllRows() bukan S.dash langsung. Di mode demo
   S.dashAll tidak diisi (lihat loadDemo) sehingga fallback ke S.dash yang di demo memang sudah berisi
   semua tahun demo yang di-generate. */
function dashAllRows(){ return (S.dashAll&&S.dashAll.length)?S.dashAll:S.dash; }
const SUMK = ['sales_komersial','sales_user','sales_komersial_tigalapan','sales_user_tigalapan','sales_user_mamu',
              'target_komersial','target_user','target_total','total_sales','gap_sales'];
function agg(rows){
  const o = Object.fromEntries(SUMK.map(k=>[k,0]));
  for(const r of rows) for(const k of SUMK) o[k]+=N(r[k]);
  o.achiev_komersial = o.target_komersial>0 ? o.sales_komersial/o.target_komersial : null;
  o.achiev_user      = o.target_user>0      ? o.sales_user/o.target_user           : null;
  o.achiev_total     = o.target_total>0     ? o.total_sales/o.target_total         : null;
  return o;
}
/* item 2: ketika Tahun dipilih >1 (S.years.length>1), bandingkan total per tahun — aman & aditif,
   scope()/agg() di atas sama sekali tak bergantung pada S.year sehingga bisa dipakai lintas-tahun
   tanpa menyentuh logika satu-tahun yang sudah ada di tempat lain. */
function multiYearCompare(){
  if(S.years.length<2) return null;
  return S.years.slice().sort((a,b)=>a-b).map(y=>{

    return {year:y, ...agg(rows)};

    m.get(r.store_id).rows.push(r);

  return [...m.values()].map(g=>Object.assign({store_id:g.store_id,store_name:g.store_name}, agg(g.rows)));

const TIP = $('#tip');
function tipShow(e,html){ TIP.innerHTML=html; TIP.style.opacity='1';
  const r=TIP.getBoundingClientRect();
  let x=e.clientX+13, y=e.clientY-10;
  if(x+r.width>innerWidth-8) x=e.clientX-r.width-13;
  if(y+r.height>innerHeight-8) y=innerHeight-r.height-8;
  TIP.style.left=x+'px'; TIP.style.top=Math.max(8,y)+'px'; }
function tipHide(){ TIP.style.opacity='0'; }
const SVGNS='http://www.w3.org/2000/svg';
function sv(t,a={}){ const n=document.createElementNS(SVGNS,t); for(const[k,v] of Object.entries(a)) if(v!=null) n.setAttribute(k,v); return n; }
function niceMax(v){ if(v<=0)return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p;
  return (n<=1?1:n<=1.2?1.2:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=7.5?7.5:10)*p; }
function axisFmt(v){ const a=Math.abs(v);
  if(a>=1e12)return (v/1e12).toLocaleString('id-ID',{maximumFractionDigits:1})+'T';
  if(a>=1e9) return (v/1e9 ).toLocaleString('id-ID',{maximumFractionDigits:1})+'M';
  if(a>=1e6) return (v/1e6 ).toLocaleString('id-ID',{maximumFractionDigits:0})+'jt';
  if(a>=1e3) return (v/1e3 ).toLocaleString('id-ID',{maximumFractionDigits:0})+'rb';
  return v.toLocaleString('id-ID'); }

/* Grouped bars: series = [{name,color,vals[]}], labels[] */
function groupedBars(labels, series, opt={}){
  /* item 3/7: chart lebih besar secara default (260→300) tapi tetap responsif (viewBox %), dan
     label nilai di atas bar memakai format singkat (axisFmt, tanpa "Rp") + di-zig-zag per seri (j%2)
     supaya label antar-bar yang berdekatan dalam satu grup tidak saling tumpang-tindih. */
  const W=opt.w||760, H=opt.h||300, PL=opt.pl||52, PR=14, PT=opt.pt||30, PB=28;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals.map(v=>N(v)))));
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  for(let i=0;i<=4;i++){ const y=PT+ih-ih*i/4;
    svg.append(sv('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const tx=sv('text',{x:PL-8,y:y+3.5,'text-anchor':'end',fill:'var(--muted)','font-size':10,'font-family':'var(--font-ui)'});
    tx.textContent=axisFmt(max*i/4); svg.append(tx); }
  const bw=iw/labels.length, gap=Math.min(7,bw*.14), inner=(bw-gap*2)/series.length, bar=Math.max(2,inner-2);
  const fmtLbl=v=>opt.labelFmt?opt.labelFmt(v):axisFmt(v);
  labels.forEach((lb,i)=>{
    series.forEach((s,j)=>{
      const v=N(s.vals[i]); if(v<=0) return;
      const h=Math.max(1,ih*v/max), x=PL+bw*i+gap+inner*j+(inner-bar)/2, y=PT+ih-h;
      const r=sv('rect',{x,y,width:bar,height:h,rx:Math.min(4,bar/2),fill:s.color,stroke:'var(--surface)','stroke-width':2});
      r.style.cursor='pointer';
      r.addEventListener('pointerenter',e=>tipShow(e,`<b>${esc(lb)}</b>`+series.map(ss=>
        `<div class="row"><span>${esc(ss.name)}</span><span>${compact(N(ss.vals[i]))}</span></div>`).join('')));
      r.addEventListener('pointermove',e=>tipShow(e,TIP.innerHTML));
      r.addEventListener('pointerleave',tipHide);
      svg.append(r);
      if(bar>=8){   // label nilai langsung di atas bar, biar tak perlu hover
        const stagger=series.length>1?(j%2)*11:0;   // zig-zag anti-tumpang-tindih antar seri bersebelahan
        const lt=sv('text',{x:x+bar/2,y:y-4-stagger,'text-anchor':'middle',fill:'var(--ink-2)','font-size':8.5,'font-weight':600,'font-family':'var(--font-ui)'});
        /* Round 18: halo surface di belakang teks (lihat comboBarsLine) supaya label tidak hilang saat
           bertumpuk dengan bar/label seri lain. */
        lt.setAttribute('style','font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--surface);stroke-width:3px'); lt.textContent=fmtLbl(v); svg.append(lt);
      }
    });
    const t=sv('text',{x:PL+bw*i+bw/2,y:H-9,'text-anchor':'middle',fill:'var(--muted)','font-size':10,'font-family':'var(--font-ui)'});
    t.textContent=lb; svg.append(t);
  });
  svg.append(sv('line',{x1:PL,x2:W-PR,y1:PT+ih,y2:PT+ih,stroke:'var(--line)','stroke-width':1}));
  return svg;
}

/* round 9 item 5: bar (Sales/Target, skala Rupiah) + garis Achievement (skala %) DALAM SATU plot,
   dua sumbu vertikal independen berbagi area yang sama — bukan dua elemen ditumpuk. Geometri bar memakai
   pola yang sama dengan groupedBars(); garis dihitung di skala terpisah (0..max(100%,maxAch)) lalu
   diproyeksikan ke tinggi plot yang sama (ih). Segmen line diputus pada titik null, sama seperti lineChart(). */
function comboBarsLine(labels, barSeries, lineVals, opt={}){
  const W=opt.w||760, H=opt.h||320, PL=opt.pl||52, PR=opt.pr||46, PT=opt.pt||30, PB=28;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=niceMax(Math.max(1,...barSeries.flatMap(s=>s.vals.map(v=>N(v)))));
  const lineNums=lineVals.filter(v=>v!=null&&!isNaN(v));
  const lmax=Math.max(1, opt.lineRef??0, ...lineNums)*1.1;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  for(let i=0;i<=4;i++){ const y=PT+ih-ih*i/4;
    svg.append(sv('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const tx=sv('text',{x:PL-8,y:y+3.5,'text-anchor':'end',fill:'var(--muted)','font-size':10,'font-family':'var(--font-ui)'});
    tx.textContent=axisFmt(max*i/4); svg.append(tx);
    const tx2=sv('text',{x:W-PR+8,y:y+3.5,'text-anchor':'start',fill:'var(--muted)','font-size':10,'font-family':'var(--font-ui)'});
    tx2.textContent=(opt.lineFmt?opt.lineFmt(lmax*i/4):Math.round(lmax*i/4*100)+'%'); svg.append(tx2); }

/* Line chart dengan garis acuan 100% */
function lineChart(labels, vals, opt={}){
  const W=opt.w||760, H=opt.h||220, PL=48, PR=14, PT=22, PB=28;
  const iw=W-PL-PR, ih=H-PT-PB;
  const nums=vals.filter(v=>v!=null&&!isNaN(v));
  if(!nums.length) return el('div',{class:'empty'},'Belum ada data untuk digambar.');
  const hi=Math.max(...nums, opt.ref??0)*1.08, lo=Math.min(0,...nums);
  const sx=i=>PL+(labels.length>1?iw*i/(labels.length-1):iw/2);
  const sy=v=>PT+ih-ih*((v-lo)/((hi-lo)||1));
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, y=sy(v);
    svg.append(sv('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=sv('text',{x:PL-8,y:y+3.5,'text-anchor':'end',fill:'var(--muted)','font-size':10,'font-family':'var(--font-ui)'});
    t.textContent=opt.fmt?opt.fmt(v):axisFmt(v); svg.append(t); }
  if(opt.ref!=null){ const y=sy(opt.ref);
    svg.append(sv('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--line)','stroke-width':1.5,'stroke-dasharray':'5 4'}));

    t.textContent=opt.refLabel||'Target'; svg.append(t); }
  const pts=labels.map((_,i)=>vals[i]==null?null:[sx(i),sy(vals[i])]);
  const segs=[]; let cur=[];
  pts.forEach(p=>{ if(p){cur.push(p);} else if(cur.length){segs.push(cur);cur=[];} }); if(cur.length)segs.push(cur);
  const color=opt.color||'var(--s1)';
  segs.forEach(sg=>{
    if(sg.length>1){
      svg.append(sv('path',{d:'M'+sg.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L '),fill:'none',
        stroke:color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
      svg.append(sv('path',{d:'M'+sg.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+
        ` L ${sg[sg.length-1][0].toFixed(1)} ${sy(lo)} L ${sg[0][0].toFixed(1)} ${sy(lo)} Z`,
        fill:color,opacity:.1,stroke:'none'}));
    }

  labels.forEach((lb,i)=>{ if(pts[i]==null)return;
    const c=sv('circle',{cx:pts[i][0],cy:pts[i][1],r:4.5,fill:color,stroke:'var(--surface)','stroke-width':2});
    c.style.cursor='pointer';
    const txt=`<b>${esc(lb)}</b><div class="row"><span>${esc(opt.name||'Nilai')}</span><span>${opt.tip?opt.tip(vals[i]):compact(vals[i])}</span></div>`;
    c.addEventListener('pointerenter',e=>tipShow(e,txt));
    c.addEventListener('pointermove',e=>tipShow(e,txt));
    c.addEventListener('pointerleave',tipHide);
    svg.append(c);
    const lv=sv('text',{x:pts[i][0],y:pts[i][1]-10,'text-anchor':'middle',fill:'var(--ink-2)','font-size':9.5,'font-weight':600,'font-family':'var(--font-ui)'});
    lv.setAttribute('style','font-variant-numeric:tabular-nums'); lv.textContent=opt.fmt?opt.fmt(vals[i]):compact(vals[i]); svg.append(lv);
    const t=sv('text',{x:pts[i][0],y:H-9,'text-anchor':'middle',fill:'var(--muted)','font-size':10,'font-family':'var(--font-ui)'});
    t.textContent=lb; svg.append(t); });

/* Horizontal bars; mode 'ach' = garis 100%, mode 'div' = diverging dari nol */
function hBars(items, opt={}){
  if(!items.length) return el('div',{class:'empty'},'Belum ada data.');
  const fs=opt.fontSize||11;
  const LW=opt.lw||190, W=opt.w||760, PR=90, PT=4, PB=16;
  const wrapLabel=text=>{const out=[];let line='';for(const word of String(text).split(/\s+/)){if(line&&(line+' '+word).length>Math.floor((LW-16)/(fs*.55))){out.push(line);line=word;}else line+=(line?' ':'')+word;}out.push(line);return out;};
  const rowH=Math.max(opt.rowH||25,...items.map(d=>wrapLabel(d.label).length*(fs+3)+9));
  const H=PT+items.length*rowH+PB, iw=W-LW-PR;
  const div=opt.mode==='div';
  const maxV=Math.max(...items.map(d=>Math.abs(Number.isFinite(N(d.v))?N(d.v):0)),opt.min||0)||1;
  const max=niceMax(maxV);
  const zero=div?LW+iw/2:LW;
  const sw=div?iw/2:iw;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  if(opt.mode==='ach'){ const x=LW+sw*Math.min(1,1/ (max||1));
    svg.append(sv('line',{x1:x,x2:x,y1:PT,y2:H-PB,stroke:'var(--line)','stroke-width':1.5,'stroke-dasharray':'4 4'}));
    const t=sv('text',{x,y:H-5,'text-anchor':'middle',fill:'var(--ink-2)','font-size':9.5,'font-weight':600,'font-family':'var(--font-ui)'});
    t.textContent='100%'; svg.append(t); }
  if(div) svg.append(sv('line',{x1:zero,x2:zero,y1:PT,y2:H-PB,stroke:'var(--line)','stroke-width':1}));
  items.forEach((d,i)=>{
    const y=PT+i*rowH, raw=d.v, v=Number.isFinite(N(raw))?N(raw):(raw>0?max:0), bh=Math.min(14,rowH-9);
    const len=Math.max(1,sw*Math.abs(v)/max);
    const x=v<0?zero-len:zero;
    const col=d.color||(div?(v<0?'var(--s8)':'var(--s1)'):(opt.mode==='ach'?achColor(raw):'var(--s1)'));
    const lbl=sv('text',{x:LW-9,y:y+bh/2+4.5,'text-anchor':'end',fill:'var(--ink-2)','font-size':fs,'font-family':'var(--font-ui)'});
    wrapLabel(d.label).forEach((line,j)=>{const ts=sv('tspan',{x:LW-9,dy:j?fs+3:0});ts.textContent=line;lbl.append(ts);}); svg.append(lbl);
    const r=sv('rect',{x,y:y+2,width:len,height:bh,rx:Math.min(4,bh/2),fill:col,stroke:'var(--surface)','stroke-width':1.5});
    r.style.cursor='pointer';
    const txt=`<b>${esc(d.label)}</b>`+(d.tip||`<div class="row"><span>${esc(opt.name||'Nilai')}</span><span>${opt.fmt?opt.fmt(v):compact(v)}</span></div>`);
    r.addEventListener('pointerenter',e=>tipShow(e,txt));
    r.addEventListener('pointermove',e=>tipShow(e,txt));
    r.addEventListener('pointerleave',tipHide);
    svg.append(r);
    const vt=sv('text',{x:W-PR+6,y:y+bh/2+4.5,fill:'var(--ink)','font-size':fs,'font-weight':600,'font-family':'var(--font-ui)'});
    vt.setAttribute('style','font-variant-numeric:tabular-nums');
    vt.textContent=opt.mode==='ach'?achPct(raw):(opt.fmt?opt.fmt(v):compact(v)); if(opt.mode==='ach')vt.setAttribute('fill',achColor(raw)); svg.append(vt);
  });
  return svg;
}

/* Stacked horizontal bar 1 baris untuk komposisi segmen */
function stackBar(parts, total){

    seg.addEventListener('pointerenter',e=>tipShow(e,`<b>${esc(p.name)}</b><div class="row"><span>Nilai</span><span>${compact(p.v)}</span></div><div class="row"><span>Porsi</span><span>${pct(p.v/total)}</span></div>`));

/* Round 18: diagram donat — dipakai utk "Komposisi segmen" Dashboard (sebelumnya stackBar/bar horizontal

     TERENDAH, jadi kalah oleh rule class itu dan donat jadi melebar sepenuh kartu (sangat besar, tidak

     (bukan attribute width/height biasa) — inline style selalu menang atas selector class manapun yang

      : `M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} `+

  ctot.textContent=String(compact(total)); svg.append(ctot);
  const clbl=sv('text',{x:CX,y:CY+13,'text-anchor':'middle',fill:'var(--muted)','font-size':9.5,'font-weight':600,'font-family':'var(--font-ui)'});
  clbl.textContent=opt.centerLabel||'TOTAL'; svg.append(clbl);

  /* daftar rincian di samping donat — nama, nilai, dan persentase eksplisit per baris (bukan cuma warna) */
  const list=el('div',{style:'display:flex;flex-direction:column;gap:7px;min-width:180px'});
  parts.forEach(p=>{
    list.append(el('div',{style:'display:flex;align-items:center;gap:8px;font-size:13px'},
      el('i',{style:`width:11px;height:11px;border-radius:3px;background:${p.color};flex:0 0 auto`}),

  });
  wrap.append(list);

}

    const cs=getComputedStyle(o);
    if(o.hasAttribute('fill')||cs.fill) c.setAttribute('fill',canonColor(cs.fill));
    if(o.hasAttribute('stroke')&&cs.stroke!=='none') c.setAttribute('stroke',canonColor(cs.stroke));
    if(o.getAttribute('stroke')==='none') c.setAttribute('stroke','none');
    if(cs.opacity&&cs.opacity!=='1') c.setAttribute('opacity',cs.opacity);
    const oc=o.children, cc=c.children;
    for(let i=0;i<oc.length;i++) walk(oc[i],cc[i]);
  };
  walk(orig,clone);
}
/* round 16: "Salin ke slide" dirombak total supaya hasilnya BENAR-BENAR gambar (PNG) yang sama persis
   dengan tampilan di dashboard — sebelumnya ada 2 jalur terpisah yang tidak memuaskan: copyChartAsImage()
   (round 9-13) hanya merender elemen <svg> grafik menjadi PNG (judul kartu, legenda teks, dan tabel di
   luar <svg> tidak ikut), sementara copyNodeRich()/buildCopyHtml() (round 12-13) untuk kartu tabel/tile
   SELALU menghasilkan markup <table> HTML — begitu ditempel ke PowerPoint/Word, aplikasi tujuan merender
   ulang tabel itu memakai gaya defaultnya sendiri (font, border, padding beda), bukan gambar piksel yang
   identik dengan tampilan di layar. capturePngOfNode() di bawah memakai html2canvas (CDN, lihat <head>)
   untuk merasterkan SELURUH node (kartu lengkap: header + tabel/tile/chart) jadi satu <canvas>/PNG, jadi
   hasil salin selalu identik piksel-demi-piksel dengan yang terlihat di layar, untuk SEMUA jenis kartu
   (chart, tabel, grid tile) lewat satu fungsi yang sama. Tombol "Salin ke slide" disembunyikan sesaat
   sebelum capture supaya tidak ikut kefoto. Kalau html2canvas gagal dimuat (mis. CDN diblokir) atau
   melempar error, fallback ke copyNodeRich() (tabel HTML) supaya pengguna tetap dapat sesuatu yang bisa
   ditempel, bukan error polos. */
async function capturePngOfNode(node){
  if(typeof html2canvas!=='function') throw new Error('html2canvas tidak tersedia (CDN mungkin diblokir)');
  const hideEls=[...node.querySelectorAll('button')];
  const prevVis=hideEls.map(b=>b.style.visibility);
  hideEls.forEach(b=>{ b.style.visibility='hidden'; });
  let host=null;
  try{
    const bgHost=node.closest('.card')||node;
    const bgRaw=getComputedStyle(bgHost).backgroundColor;
    const bg=canonColor(bgRaw);   // round 17: canonicalize juga — bgRaw bisa berupa color(srgb...) pada tema tertentu
    /* round 17: kloning + "bake" SELURUH fungsi warna color(...) jadi rgb()/rgba() literal pada clone
       (lihat bakeColorFunctions di atas), lalu clone itu yang dipasang sesaat ke DOM (off-screen, tidak
       terlihat pengguna) sebelum dikirim ke html2canvas — bukan node ASLI secara langsung seperti
       sebelumnya. Ini memastikan html2canvas (parser CSS sendiri) tidak pernah bertemu sintaks warna yang
       tidak didukungnya, apapun sumbernya (var(), color-mix(), atau color(srgb...) langsung). */
    const rect=node.getBoundingClientRect();
    const clone=node.cloneNode(true);
    bakeColorFunctions(node,clone);
    host=el('div',{style:`position:fixed;left:-99999px;top:0;width:${Math.ceil(rect.width)}px;background:${(!bg||bg==='rgba(0, 0, 0, 0)')?'#ffffff':bg}`});
    host.append(clone);
    document.body.append(host);
    const canvas=await html2canvas(clone,{
      backgroundColor:(!bg||bg==='rgba(0, 0, 0, 0)')?'#ffffff':bg,
      scale:2, useCORS:true, logging:false
    });
    return await new Promise(res=>canvas.toBlob(res,'image/png'));
  } finally {
    hideEls.forEach((b,i)=>{ b.style.visibility=prevVis[i]; });
    if(host) host.remove();
  }
}
async function copyNodeAsImage(node,btn,fallbackNode){
  const old=btn.textContent;
  try{
    btn.disabled=true; btn.textContent='Menyiapkan…';
    const blob=await capturePngOfNode(node);
    if(!blob) throw new Error('gagal membuat gambar');
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('Disalin sebagai gambar (PNG) — tempel (Ctrl+V) langsung ke slide, tampilannya sama persis dengan dashboard.');
    }catch(e2){
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='salinan.png'; a.click();
      toast('Browser ini tidak mendukung salin gambar ke clipboard — diunduh sebagai PNG.');
    }
  }catch(e){
    try{ await copyNodeRich(fallbackNode||node,btn); toast('Disalin sebagai tabel (gagal membuat PNG: '+e.message+').'); }
    catch(e2){ toast('Gagal menyalin: '+e.message); }
  }
  btn.disabled=false; btn.textContent=old;
}

function cleanUrl(v){ let s=String(v||'').trim().replace(/\s+/g,'').replace(/\/+$/,'');

  return s; }
function cleanKey(v){ return String(v||'').replace(/\s+/g,'').trim(); }

/* Diagnosa bertahap: tiap langkah menunjuk penyebab yang berbeda. */
async function diagnose(box, url, key){
  box.textContent='Menjalankan tes…\n';
  const put=(s)=>{ box.textContent+=s+'\n'; box.scrollTop=box.scrollHeight; };
  const hdr=authHeaders(key);
  if(!url){ put('✗ URL kosong.'); return; }
  put('URL  : '+url);
  put('Key  : '+(key?`${key.slice(0,12)}… (${key.length} karakter, tipe ${key.startsWith('sb_publishable_')?'publishable':key.startsWith('sb_secret_')?'SECRET — salah, jangan dipakai':key.startsWith('eyJ')?'JWT':'tidak dikenali'})`:'(kosong)'));
  if(!key){ put('✗ Anon key belum diisi.'); return; }
  if(key.startsWith('sb_secret_')||/service_role/.test(key)){
    put('✗ Ini kunci rahasia (service_role / secret). Ganti dengan anon / publishable key.'); return; }

  /* 1. endpoint hidup? */
  let r;
  try{ r=await fetch(url+'/rest/v1/',{headers:hdr}); }
  catch(e){
    put('✗ Permintaan tidak pernah keluar: '+e.message);
    put('');
    put('Tidak ada status HTTP sama sekali, artinya browser menghentikannya sebelum dikirim.');
    put('Penyebab paling sering: halaman ini dibuka sebagai artifact di claude.ai, yang');
    put('berjalan di sandbox dan memblokir semua permintaan ke domain luar — termasuk Supabase.');
    put('Anon key tidak ada hubungannya; sebagus apa pun key-nya tetap akan gagal di sini.');
    put('');
    put('Solusi: buka halaman ini dari hosting (mis. URL Netlify Anda) atau dari file');
    put('sales-command-standalone.html di komputer Anda. Isinya sama persis.');
    put('');
    put('Kemungkinan lain, kalau Anda sudah memakai versi hosting: komputer sedang offline,');
    put('URL salah ketik, atau project Supabase sedang di-pause.');
    return; }
  put('1. Hubungi /rest/v1/ → HTTP '+r.status);
  if(r.status===401){ const t=await r.text();
    put('   ✗ Key ditolak. Salin ulang anon key dari Project Settings → API Keys.');
    put('   Pesan server: '+t.slice(0,220)); return; }
  if(!r.ok && r.status!==404){ put('   ✗ '+(await r.text()).slice(0,220)); return; }
  put('   ✓ Key diterima.');

  /* 2. tabel & view satu per satu */
  const need=[['stores','tabel'],['targets','tabel'],['store_aliases','tabel'],['sales_type_map','tabel'],
              ['sales_actual','tabel'],['sales_type_raw','tabel'],['item_sales','tabel'],['transaksi','tabel'],
              ['kpi_metrics','tabel'],['kpi_entries','tabel'],['pdca','tabel'],['app_settings','tabel'],
              ['ingest_log','tabel'],['v_sales_dashboard','view'],['v_growth','view'],
              ['v_transaksi','view'],['v_unmapped_sales_type','view']];
  put('2. Cek tabel & view:');
  const missing=[], denied=[];
  for(const [name,kind] of need){
    try{
      const rr=await fetch(`${url}/rest/v1/${name}?select=*&limit=1`,{headers:hdr});
      if(rr.ok){ put(`   ✓ ${name}`); continue; }
      const body=await rr.text();
      if(rr.status===404){ missing.push(name); put(`   ✗ ${name} — tidak ditemukan (${kind} belum dibuat)`); }
      else if(rr.status===401||rr.status===403){ denied.push(name); put(`   ✗ ${name} — akses ditolak (${rr.status})`); }
      else put(`   ✗ ${name} — HTTP ${rr.status} ${body.slice(0,120)}`);
    }catch(e){ put(`   ✗ ${name} — ${e.message}`); }
  }

  /* 3. fungsi RPC */
  put('3. Cek fungsi:');
  for(const fn of ['rebuild_sales_actual']){
    try{
      const rr=await fetch(`${url}/rest/v1/rpc/${fn}`,{method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},hdr),body:'{}'});
      put(rr.ok?`   ✓ ${fn}`:`   ✗ ${fn} — HTTP ${rr.status} ${(await rr.text()).slice(0,120)}`);
    }catch(e){ put(`   ✗ ${fn} — ${e.message}`); }
  }

  /* 4. isi data */
  put('4. Cek isi data:');
  try{
    const rr=await fetch(`${url}/rest/v1/targets?select=target_total&year=eq.2026&month=eq.1`,{headers:hdr});
    if(rr.ok){ const rows=await rr.json();
      const tot=rows.reduce((s,x)=>s+Number(x.target_total||0),0);
      put(`   Target Januari 2026: ${rows.length} baris, total ${tot.toLocaleString('id-ID')}`);
      put(tot===8173459200 ? '   ✓ Cocok dengan sheet TARGET.'
          : rows.length===0 ? '   ✗ Kosong — bagian seed di file SQL belum dijalankan.'
          : '   ! Tidak sama dengan 8.173.459.200 — seed mungkin jalan sebagian.');
    } else put('   ✗ HTTP '+rr.status);
  }catch(e){ put('   ✗ '+e.message); }

  /* kesimpulan */
  put('');
  if(missing.length) put('KESIMPULAN: '+missing.length+' objek belum ada ('+missing.slice(0,6).join(', ')+
    (missing.length>6?', …':'')+'). File SQL belum jalan sampai selesai — jalankan ulang seluruh isinya dan perhatikan pesan error di SQL Editor.');
  else if(denied.length) put('KESIMPULAN: objek ada tapi anon tidak boleh membacanya. Jalankan di SQL Editor:\n'+
    '  grant usage on schema public to anon, authenticated;\n'+
    '  grant all on all tables in schema public to anon, authenticated;\n'+
    '  grant all on all sequences in schema public to anon, authenticated;\n'+
    '  grant execute on all functions in schema public to anon, authenticated;');
  else put('KESIMPULAN: semua objek terbaca. Tekan "Simpan & hubungkan" lalu Muat ulang.');
}

             H('TOTAL SALES',{r:1}),H('TOTAL TARGET',{r:1}),H('GAP TOTAL',{r:1}),H('ACHIEV',{r:1})],
      stRecap.map(r=>{

        return [r.store_name, compact(r.sales_komersial), r.target_komersial>0?compact(r.target_komersial):'—',
          el('span',{style:`color:${trendColor(r.target_komersial>0?gk/r.target_komersial:(gk>=0?1:-1))}`},compact(gk)),
          compact(r.sales_user), r.target_user>0?compact(r.target_user):'—',

function tile(k,v,m,ach,badge){
  const t=el('div',{class:'tile'});
  const av=ach!=null?ach:(/achievement|pencapaian|capaian|progress/i.test(k)&&v&&v.raw!=null?v.raw:null);
  t.append(el('div',{class:'k'},k), el('div',{class:'v num'},av!=null&&v&&String(v).includes('%')?pillCell(av):v));
  const mm=el('div',{class:'m'},m||''); if(badge) mm.prepend(badge);

    t.append(el('div',{class:'meter '+achMeter(ach)}, el('i',{style:`width:${w}%`}))); }

}

  /* tabel + input — round 10 item 8: tambah kolom AKSI (Edit/Hapus) utk baris is_manual=true. Baris

/* ---------- KPI (Input KPI / Weekly / Dashboard) ---------- */
/* Replikasi model kalkulasi template "Scorecard KPI Commercial":
   Weekly (Target,W1..W5,Bulanan override,Metode MTD) -> Bulanan MTD (per bulan, roll-up ke YTD
   via Metode YTD) -> Input KPI (Capaian Aktual, Capaian Adj, Skor KPI, Indikator, Grade) -> Dashboard.
   KPI lama yang belum punya baris kpi_weekly tetap memakai jalur lama (target_override/actual_override
   atau autoKpi) demi kompatibilitas. */
function kpiSet(key,def){ const v=S.settings[key]; return v==null||v===''?def:v; }
function kpiSetN(key,def){ const v=Number(kpiSet(key,def)); return isFinite(v)?v:def; }
function kpiGreenYellow(){ return [kpiSetN('kpi_threshold_green',.95),kpiSetN('kpi_threshold_yellow',.80)]; }
function kpiCapMax(){ return kpiSetN('kpi_cap_max',1.0); }
function kpiNormalize(){ return /ya|yes|true|1/i.test(String(kpiSet('kpi_normalize_weight','Ya'))); }
function kpiPerspektifList(){ return String(kpiSet('kpi_perspektif_list','Financial,Customer,Internal Business Process,Learning & Growth')).split(',').map(s=>s.trim()).filter(Boolean); }
function gradeOf(score){
  if(score==null) return '—';
  const e=kpiSetN('kpi_grade_e',.70), d=kpiSetN('kpi_grade_d',.80), c=kpiSetN('kpi_grade_c',.90), b=kpiSetN('kpi_grade_b',.95), a=kpiSetN('kpi_grade_a',1.0);
  if(score<=e) return 'E'; if(score<=d) return 'D'; if(score<=c) return 'C'; if(score<=b) return 'B'; return 'A';
}
function gradeLabel(g){ return {A:'Sangat Baik',B:'Baik',C:'Cukup',D:'Kurang',E:'Sangat Kurang'}[g]||''; }
function kpiWeeklyRow(kpiId,year,month){ return S.kpiWeekly.find(w=>w.kpi_id===kpiId&&w.year===year&&w.month===month); }
/* hitung realisasi & target MTD satu KPI pada satu bulan dari sheet Weekly */
function kpiMonthFromWeekly(mt,year,month){
  const w=kpiWeeklyRow(mt.id,year,month);
  if(!w) return null;
  const weeks=[w.w1,w.w2,w.w3,w.w4,w.w5].filter(v=>v!=null&&v!=='').map(Number);
  let realisasi=null;
  if(w.bulanan_override!=null && w.bulanan_override!=='') realisasi=Number(w.bulanan_override);
  else if(weeks.length) realisasi = (w.metode_mtd==='Rata-rata') ? (weeks.reduce((s,v)=>s+v,0)/weeks.length) : weeks.reduce((s,v)=>s+v,0);
  const target = w.target!=null&&w.target!==''?Number(w.target):null;
  return {target,realisasi,metode_mtd:w.metode_mtd||'Akumulasi',weeks,hasWeekly:true,w};
}
/* hasil lengkap satu KPI pada satu bulan: target/realisasi/capaian/adj/skor/grade/indikator */
function kpiMonthCalc(mt,year,month){
  const lower=String(mt.direction||'').toLowerCase()==='lower';
  const running=!/freeze|take ?out/i.test(mt.status||'Running');
  const wk=kpiMonthFromWeekly(mt,year,month);
  let target=null,realisasi=null,source='none';
  if(wk){ target=wk.target; realisasi=wk.realisasi; source='weekly'; }
  if(isAutoRevenueCode(mt.code)){
    /* Round 21b: Realisasi DAN Target KPI bertipe Revenue sekarang SAMA-SAMA ditarik live dari Sales
       & Target (target_total/target_komersial/target_user yang sudah ada di menu Sales & Target),
       tidak perlu diketik ulang manual di Weekly. Kalau user memang mengisi Target secara manual di
       Weekly utk bulan tertentu (mis. mau pakai angka target yang beda dari Sales & Target), itu
       dipakai sbg OVERRIDE utk bulan itu saja — supaya tombol "Muat Template" / isian lama tidak hilang
       begitu saja, tapi defaultnya sekarang otomatis mengikuti Sales & Target. */
    const autoTarget=autoTargetForMonth(mt.code,year,month);
    if(target==null) target=autoTarget;
    realisasi=autoRevenueForMonth(mt.code,year,month); source='auto_revenue';
  } else {
    const reportMonth = S.month || lastMonthWithData(year);
    if(target==null && realisasi==null && month===reportMonth){
      // fallback lama (hanya dipakai utk bulan laporan aktif, & hanya bila KPI ini sama sekali tidak punya data Weekly di bulan manapun)
      const hasAnyWeekly=S.kpiWeekly.some(w=>w.kpi_id===mt.id);
      if(!hasAnyWeekly){
        const auto=autoKpi(mt.code);
        target = mt.target_override!=null?N(mt.target_override):(auto?auto.target:null);
        realisasi = mt.actual_override!=null?N(mt.actual_override):(auto?auto.actual:null);
        source='legacy';
      }
    }
  }
  let capaian=null;
  if(target!=null && realisasi!=null && target!==0)
    capaian = lower ? target/realisasi : realisasi/target;
  const capMax=kpiCapMax();
  const adj = capaian!=null ? Math.min(capMax,Math.max(0,capaian)) : null;
  const bobot=N(mt.weight);
  const skor = running && adj!=null ? adj*bobot/100 : 0;
  const [green,yellow]=kpiGreenYellow();
  /* Round 21b: dicek dari adj==null (capaian tidak bisa dihitung), BUKAN cuma realisasi==null — KPI
     auto-revenue selalu punya realisasi angka (0 kalau belum ada baris sales sama sekali di bulan itu,
     bukan null), jadi kalau cuma cek realisasi==null, bulan tanpa Target (mis. belum ada baris Sales &
     Target sama sekali utk bulan itu) salah tampil 'Kritis' padahal seharusnya 'Belum ada data'. */
  let indikator = (adj==null) ? 'Belum ada data' : achLabel(capaian);
  if(!running) indikator=mt.status;
  return {mt,year,month,target,realisasi,capaian,adj,skor,bobot,running,indikator,grade:gradeOf(adj),source};
}
/* roll-up YTD Jan..uptoMonth sesuai Metode YTD KPI itu sendiri */
function kpiYtdCalc(mt,year,uptoMonth){
  const months=[]; for(let m=1;m<=uptoMonth;m++) months.push(kpiMonthCalc(mt,year,m));
  const withData=months.filter(m=>m.realisasi!=null);
  const metode=mt.metode_ytd||'Akumulasi';
  let targetYtd=null,realisasiYtd=null;
  if(withData.length){
    if(metode==='Rata-rata'){
      targetYtd = withData.filter(m=>m.target!=null).length? withData.filter(m=>m.target!=null).reduce((s,m)=>s+m.target,0)/withData.filter(m=>m.target!=null).length : null;
      realisasiYtd = withData.reduce((s,m)=>s+m.realisasi,0)/withData.length;
    } else {
      targetYtd = withData.some(m=>m.target!=null)? withData.reduce((s,m)=>s+(m.target||0),0) : null;
      realisasiYtd = withData.reduce((s,m)=>s+m.realisasi,0);
    }
  }
  const lower=String(mt.direction||'').toLowerCase()==='lower';
  let capaian=null;
  if(targetYtd!=null && realisasiYtd!=null && targetYtd!==0) capaian = lower? targetYtd/realisasiYtd : realisasiYtd/targetYtd;
  const capMax=kpiCapMax();
  const adj = capaian!=null?Math.min(capMax,Math.max(0,capaian)):null;
  const running=!/freeze|take ?out/i.test(mt.status||'Running');
  const bobot=N(mt.weight);
  const skor = running && adj!=null ? adj*bobot/100 : 0;
  const [green,yellow]=kpiGreenYellow();
  let indikator=(adj==null)?'Belum ada data':achLabel(capaian); // lihat catatan di kpiMonthCalc soal adj vs realisasi
  if(!running) indikator=mt.status;
  return {mt,targetYtd,realisasiYtd,capaian,adj,skor,bobot,running,indikator,grade:gradeOf(adj),months};
}
/* total skor organisasi pada satu bulan/ytd, dengan normalisasi bobot (hanya KPI Running) bila aktif */
function kpiTotal(rows){ // rows: hasil kpiMonthCalc/kpiYtdCalc untuk semua metrik
  const running=rows.filter(r=>r.running);
  const wsum=running.reduce((s,r)=>s+r.bobot,0);
  const rawScore=running.reduce((s,r)=>s+r.skor,0); // skor sudah adj*bobot/100
  const score = kpiNormalize() && wsum>0 ? (running.reduce((s,r)=>s+(r.adj!=null?r.adj*r.bobot:0),0)/wsum) : rawScore;
  return {wsum,score,running};
}
function kpiRowCalc(mt){ // dipakai tab Input KPI, memakai bulan filter aktif (atau bulan terakhir berdata)
  const month = S.month || lastMonthWithData(S.year);
  const ytd = kpiYtdCalc(mt,S.year,month);
  const autoRevenue=isAutoRevenueCode(mt.code);
  return {mt,target:ytd.targetYtd,actual:ytd.realisasiYtd,capaian:ytd.capaian,adj:ytd.adj,skor:ytd.skor,
    indikator:ytd.indikator,running:ytd.running,grade:ytd.grade,autoRevenue,
    auto:autoRevenue||(ytd.months.some(m=>m.source==='weekly')===false)};
}

/* ===== Tab: Input KPI (metadata + ringkasan auto, click-to-edit per baris) ===== */
if(!window.S_kpiEditing) window.S_kpiEditing=new Set();
function renderKpiInput(p){
  if(!S.metrics.length) return;
  const month=S.month||lastMonthWithData(S.year);
  const rows=S.metrics.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(kpiRowCalc);
  const running=rows.filter(r=>r.running);
  const tot=kpiTotal(rows.map(r=>({running:r.running,bobot:N(r.mt.weight),skor:r.skor,adj:r.adj})));
  const tiles=el('div',{class:'grid g4'});
  tiles.append(tile('Skor KPI total (YTD)', pct(tot.score), `${running.length} metrik Running`+(kpiNormalize()?' · dinormalisasi':''), tot.score));
  tiles.append(tile('Cek Bobot', pct(tot.wsum/100), Math.abs(tot.wsum-100)<0.5?'bobot sudah 100%':'bobot belum 100% — periksa baris Running', null,
    el('span',{class:'pill '+(Math.abs(tot.wsum-100)<0.5?'ok':'bad')},Math.abs(tot.wsum-100)<0.5?'Pas':'Tidak pas')));
  const okN=running.filter(r=>r.indikator==='Tercapai').length;
  tiles.append(tile('Tercapai',int(okN),running.length?pct(okN/running.length)+' dari metrik Running':'—',null));
  const critN=running.filter(r=>r.indikator==='Kritis').length;
  tiles.append(tile('Kritis',int(critN),critN?'perlu tindak lanjut segera':'tidak ada',null,
    critN?el('span',{class:'pill bad'},'Perhatian'):el('span',{class:'pill ok'},'Aman')));
  p.append(tiles);

  const tb=el('tbody');
  rows.forEach((r,i)=>{
    const mt=r.mt, editing=window.S_kpiEditing.has(mt.id);
    const persp=kpiPerspektifList();
    let cells;
    if(editing){
      const d={name:mt.name,perspektif:mt.perspektif||persp[0],unit:mt.unit,periode:mt.periode||'Monthly',weight:mt.weight,

/* ===== Tab: Dashboard (presentasi, read-only, terhitung dari Weekly+Input KPI) ===== */
function renderKpiDashboard(p){
  if(!S.metrics.length) return;
  /* Round 21: kartu identitas (Perusahaan/Departemen/Nama/NIK/Jabatan/Atasan) sesuai sheet "Pengaturan"
     template — diisi lewat tab Pengaturan baru, ditampilkan di sini kalau terisi. */
  const idFields=[['Perusahaan',kpiSet('kpi_id_perusahaan','')],['Departemen',kpiSet('kpi_id_departemen','')],
    ['Nama',kpiSet('kpi_id_nama','')],['NIK',kpiSet('kpi_id_nik','')],['Jabatan',kpiSet('kpi_id_jabatan','')],
    ['Atasan Langsung',kpiSet('kpi_id_atasan1','')],['Atasan Tidak Langsung',kpiSet('kpi_id_atasan2','')]].filter(([,v])=>v);
  if(idFields.length) p.append(el('div',{class:'card'},el('div',{class:'grid g4'},
    idFields.map(([l,v])=>el('div',{},el('div',{class:'sub'},l),el('div',{style:'font-weight:600'},v))))));
  const month=S.month||lastMonthWithData(S.year);
  const metrics=S.metrics.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const monthRows=metrics.map(mt=>kpiMonthCalc(mt,S.year,month));
  const ytdRows=metrics.map(mt=>kpiYtdCalc(mt,S.year,month));
  const totMtd=kpiTotal(monthRows);
  const totYtd=kpiTotal(ytdRows.map(r=>({running:r.running,bobot:r.bobot,skor:r.skor,adj:r.adj})));
  const prevMonth=month>1?month-1:null;
  const prevRows=prevMonth?metrics.map(mt=>kpiMonthCalc(mt,S.year,prevMonth)):[];
  const totPrev=prevMonth?kpiTotal(prevRows):null;
  const running=monthRows.filter(r=>r.running);
  const terukur=running.filter(r=>r.realisasi!=null);
  const tercapai=terukur.filter(r=>r.indikator==='Tercapai').length;
  const kritis=running.filter(r=>r.indikator==='Kritis').length;
  const belum=running.filter(r=>r.indikator==='Belum ada data').length;
  const grade=gradeOf(totMtd.score);
  /* prioritas: KPI Running dengan poin hilang terbesar = (1-adj)*bobot*100 */
  const priorityList=running.filter(r=>r.adj!=null).map(r=>({name:r.mt.name,poin:(1-r.adj)*r.bobot})).sort((a,b)=>b.poin-a.poin);
  const worst=priorityList[0];
  const deltaPts = totPrev!=null ? (totMtd.score-totPrev.score)*100 : null;
  const narasi = `MTD ${MONTHS[month-1]}: skor ${pct(totMtd.score)} – Grade ${grade} (${gradeLabel(grade)}). `+
    `${tercapai} dari ${terukur.length} KPI terukur tercapai, ${kritis} kritis, ${belum} belum ada data.`+
    (deltaPts!=null?` ${deltaPts>=0?'Naik':'Turun'} ${Math.abs(deltaPts).toFixed(1)} poin dari bulan lalu.`:'')+
    ` Skor YTD ${pct(totYtd.score)}.`+(worst?` Prioritas bulan ini: ${worst.name}.`:'');

  const tiles=el('div',{class:'grid g4'});
  tiles.append(tile('Skor MTD',pct(totMtd.score),'Grade '+grade+' · '+gradeLabel(grade),totMtd.score));
  tiles.append(tile('KPI Terukur Tercapai',`${tercapai} / ${terukur.length}`,running.length+' KPI Running',null));
  tiles.append(tile('KPI Kritis',int(kritis),kritis?'perlu tindak lanjut':'tidak ada',null,
    kritis?el('span',{class:'pill bad'},'Perhatian'):el('span',{class:'pill ok'},'Aman')));
  tiles.append(tile('Belum Ada Data',int(belum),'KPI Running tanpa realisasi',null));
  p.append(tiles);
  p.append(el('div',{class:'card'},el('header',{},el('h2',{},'Ringkasan')),el('p',{style:'margin:0;font-size:13.5px;line-height:1.6'},narasi)));

  /* skor MTD per bulan (Jan-Des) */
  const perBulan=[]; for(let m=1;m<=12;m++){ const rs=metrics.map(mt=>kpiMonthCalc(mt,S.year,m)); const t=kpiTotal(rs); const ada=rs.some(r=>r.realisasi!=null); perBulan.push({m,score:ada?t.score:null,grade:ada?gradeOf(t.score):null}); }
  p.append(chartCard('Skor MTD per Bulan (Jan–Des)',''+S.year,
    hBars(perBulan.filter(b=>b.score!=null).map(b=>({label:MONTHS[b.m-1],v:b.score,tip:`<b>${MONTHS[b.m-1]}</b><div class="row"><span>Skor</span><span>${pct(b.score)}</span></div><div class="row"><span>Grade</span><span>${b.grade}</span></div>`})),
      {mode:'ach',fmt:v=>pct(v,0),name:'Skor',min:1,lw:70})));

  /* detail KPI MTD */
  const detTb=el('tbody');
  monthRows.forEach(r=>detTb.append(el('tr',{},
    el('td',{class:'sticky1'},r.mt.name), el('td',{},r.mt.perspektif||''), el('td',{class:'r'},int(r.bobot)),
    el('td',{class:'r'},r.target==null?'—':fmtKpi(r.target,r.mt.unit)), el('td',{class:'r'},r.realisasi==null?'—':fmtKpi(r.realisasi,r.mt.unit)),
    el('td',{class:'r'},pillCell(r.capaian)), el('td',{class:'r'},pct(r.skor)),
    el('td',{},r.indikator==='Belum ada data'?el('span',{class:'pill neu'},'—'):el('span',{class:'pill '+(r.indikator==='Tercapai'?'ok':r.indikator==='Kritis'?'bad':r.indikator==='Mendekati target'?'soft':'mid')},r.indikator)))));
  detTb.append(el('tr',{class:'tot'},el('td',{class:'sticky1'},'TOTAL / SKOR MTD'),el('td',{},''),el('td',{class:'r'},int(totMtd.wsum)),
    el('td',{},''),el('td',{},''),el('td',{},''),el('td',{class:'r'},pct(totMtd.score)),el('td',{},'')));
  p.append(el('div',{class:'card'},el('header',{},el('h2',{},`Detail KPI — MTD ${MONTHS[month-1]} ${S.year}`)),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},
      ['KPI','PERSPEKTIF','BOBOT','TARGET MTD','REALISASI MTD','CAPAIAN','SKOR','INDIKATOR'].map((h,i)=>el('th',{class:(i===2||i>=3&&i<=6?'r':'')+(i===0?' sticky1':'')},h)))),detTb))));

  /* monitoring mingguan: ringkasan + per-KPI */
  const weeksLbl=['W1','W2','W3','W4','W5'];
  const sumRow=(key)=>weeksLbl.map((_,wi)=>{
    let n=0,cnt=0;
    metrics.forEach(mt=>{ const w=kpiWeeklyRow(mt.id,S.year,month); if(!w) return; const v=[w.w1,w.w2,w.w3,w.w4,w.w5][wi];
      if(v==null||v==='') return; cnt++;
      if(key==='terisi') n++;
      else if(key==='tercapai'){ const t=w.target; if(t&&v!=null){ const lower=String(mt.direction||'').toLowerCase()==='lower'; const c=lower?t/v:v/t; if(c>=1) n++; } }

/* Round 21: dua definisi fmtKpi()/autoKpi() identik yang kebetulan ada di file (sisa gabungan sesi
   sebelumnya, harmless karena deklarasi kedua cuma menimpa yang pertama — tapi membingungkan untuk
   dibaca/dirawat) dirapikan jadi SATU di sini, sekalian diperluas: fmtKpi() sekarang mengenali lebih
   banyak variasi penulisan satuan (Rp/Rp./IDR, Score/Rating dengan 2 desimal) supaya KPI "Revenue" dan
   KPI jenis skor (mis. Customer Satisfaction) tampil wajar tanpa harus mengetik satuan persis 'IDR'. */
function fmtKpi(v,unit){ if(v==null)return '—';
  const u=String(unit||'').toLowerCase();
  if(u==='%'||u.includes('persen')) return pct(v>2?v/100:v);
  if(u==='idr'||u.includes('rp')) return compact(v);
  if(u.includes('score')||u.includes('rating')||u.includes('skor')) return (Math.round(N(v)*100)/100).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
  return int(v); }
/* KPI yang bisa dihitung langsung dari data sales (jalur lama, dipakai bila KPI belum punya data Weekly
   sama sekali DAN bulan itu adalah bulan laporan aktif — lihat kpiMonthCalc). */
function autoKpi(code){
  const rows=scope(S.dash), a=agg(rows), t=trxScope();
  const tc=t.reduce((s,r)=>s+N(r.jumlah_transaksi),0), tv=t.reduce((s,r)=>s+N(r.nilai_transaksi),0);
  const g=growthScope().filter(r=>r.growth_vs_y1!=null);
  const gc=g.reduce((s,r)=>s+N(r.sales_cy),0), gp=g.reduce((s,r)=>s+N(r.sales_y1),0);
  switch(code){
    case 'ACH_TOTAL': return a.target_total>0?{target:1,actual:a.total_sales/a.target_total}:null;
    case 'ACH_KOM':   return a.target_komersial>0?{target:1,actual:a.sales_komersial/a.target_komersial}:null;
    case 'ACH_USER':  return a.target_user>0?{target:1,actual:a.sales_user/a.target_user}:null;
    case 'GROWTH_YOY':return gp>0?{target:null,actual:(gc-gp)/gp}:null;
    case 'AOV':       return tc>0?{target:null,actual:tv/tc}:null;
    case 'TRX':       return tc>0?{target:null,actual:tc}:null;
    default: return null;
  }
}
/* Round 21: kode KPI yang REALISASI-nya SELALU ditarik langsung dari data Sales & Target (bukan
   menunggu KPI itu kosong dari Weekly dulu seperti jalur legacy autoKpi() di atas) — ini yang
   dipakai KPI "Revenue" sesuai permintaan user ("untuk revenue ambil dari data pencapaian"), dan
   nilainya LIVE per bulan dari v_sales_dashboard — bukan dari tabel Weekly sama sekali — supaya
   selalu sinkron begitu ada input sales baru, untuk tahun/bulan MANAPUN (pakai dashAllRows(), bukan
   S.dash yang di mode nyata cuma berisi tahun filter aktif).
   Round 21b: user minta TARGET-nya juga ditarik otomatis ("target bisa ditarik otomatis dari target
   sales yang sudah ada") — sebelumnya hanya realisasi yang otomatis, target masih harus diketik ulang
   manual di tab Weekly padahal angkanya SAMA PERSIS dengan target_total/target_komersial/target_user
   yang sudah ada di menu Sales & Target. Ditambahkan getter target paralel per kode, dan kalau KPI-nya
   auto-revenue, Weekly tab TIDAK PERLU diisi sama sekali lagi (baik target maupun realisasi) — hanya
   dipakai sbg override opsional kalau user memang mau menimpa angka target utk bulan tertentu. */
const AUTO_REVENUE_CODES={
  REVENUE_RP:    {realisasi:r=>N(r.total_sales),      target:r=>N(r.target_total)},
  REVENUE_KOM_RP:{realisasi:r=>N(r.sales_komersial),   target:r=>N(r.target_komersial)},
  REVENUE_USER_RP:{realisasi:r=>N(r.sales_user),       target:r=>N(r.target_user)}
};
function isAutoRevenueCode(code){ return !!AUTO_REVENUE_CODES[code]; }
function autoRevenueForMonth(code,year,month){
  const f=AUTO_REVENUE_CODES[code]; if(!f) return null;
  return dashAllRows().filter(r=>r.year===year&&r.month===month).reduce((s,r)=>s+f.realisasi(r),0);
}
function autoTargetForMonth(code,year,month){
  const f=AUTO_REVENUE_CODES[code]; if(!f) return null;
  const rows=dashAllRows().filter(r=>r.year===year&&r.month===month);
  if(!rows.length) return null; // belum ada baris Sales & Target bulan itu sama sekali -> biarkan null, bukan 0
  const t=rows.reduce((s,r)=>s+f.target(r),0);
  return t>0?t:null;
}

  /* round 24: butir PDCA dikelompokkan jadi beberapa papan terpisah (misal "Program Diskon Oktober",

     di dalam content lewat baris "Kelompok: <nama>" (lihat splitPdcaGroup/joinPdcaGroup) karena tidak
