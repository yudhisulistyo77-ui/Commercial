/* Temuan otomatis dari data */
function analyze(){
  const out=[], rows=scope(S.dash), a=agg(rows);
  if(!rows.length) return out;
  if(a.target_total>0){
    const ok=a.achiev_total>=1;
    out.push({tag:ok?'Tercapai':'Belum tercapai',tone:ok?'ok':'bad',
      title:`Achievement total ${achPct(a.achiev_total)}`,
      text:`Sales ${compact(a.total_sales)} terhadap target ${compact(a.target_total)}. `+
           `GAP ${compact(a.gap_sales)} (${a.gap_sales>=0?'di atas':'di bawah'} target) pada ${periodLabel()}.`});
  }
  if(a.target_komersial>0 && a.target_user>0){
    const k=a.achiev_komersial, u=a.achiev_user;
    const lag = k<u ? 'Komersial' : 'User';
    out.push({tag:'Segmen',tone:'neu',title:`${lag} tertinggal`,
      text:`Komersial ${pct(k)} (${compact(a.sales_komersial)} dari ${compact(a.target_komersial)}), `+
           `User ${pct(u)} (${compact(a.sales_user)} dari ${compact(a.target_user)}). `+
           `Selisih capaian ${pct(Math.abs(k-u))} — fokus perbaikan ada di segmen ${lag.toLowerCase()}.`});
  }
  const st=byStore(rows).filter(r=>r.target_total>0);
  if(st.length>1){
    const srt=[...st].sort((x,y)=>(y.achiev_total??-1)-(x.achiev_total??-1));
    const best=srt[0], worst=srt[srt.length-1];
    out.push({tag:'Tertinggi',tone:'ok',title:`${best.store_name} ${pct(best.achiev_total)}`,
      text:`Capaian terbaik: ${compact(best.total_sales)} dari target ${compact(best.target_total)}. Pola yang berhasil di sini layak direplikasi.`});
    out.push({tag:'Terendah',tone:'bad',title:`${worst.store_name} ${pct(worst.achiev_total)}`,
      text:`Capaian terendah: ${compact(worst.total_sales)} dari target ${compact(worst.target_total)}, kurang ${compact(Math.abs(worst.gap_sales))}. Perlu rencana pemulihan.`});
    const below=srt.filter(r=>r.achiev_total!=null&&r.achiev_total<1);
    if(below.length) out.push({tag:'Sebaran',tone:below.length>st.length/2?'bad':'mid',
      title:`${below.length} dari ${st.length} toko di bawah target`,
      text:'Toko di bawah target: '+below.map(r=>`${r.store_name} (${achPct(r.achiev_total)})`).join(', ')+'.'});
  }
  const g=growthScope().filter(r=>r.growth_vs_y1!=null);
  if(g.length){
    const gc=g.reduce((s,r)=>s+N(r.sales_cy),0), gp=g.reduce((s,r)=>s+N(r.sales_y1),0);
    if(gp>0){ const gr=(gc-gp)/gp;
      out.push({tag:'Growth',tone:gr>=0?'ok':'bad',title:`${pct(gr)} vs ${S.year-1}`,
        text:`Dari ${g.length} baris toko-bulan yang punya pembanding: ${compact(gc)} tahun ini vs ${compact(gp)} tahun lalu, `+
             `GAP growth ${compact(gc-gp)}. Toko tanpa pembanding tidak dihitung.`}); }
  }
  const t=trxScope(); const tc=t.reduce((s,r)=>s+N(r.jumlah_transaksi),0), tv=t.reduce((s,r)=>s+N(r.nilai_transaksi),0);
  if(tc>0) out.push({tag:'Kualitas',tone:'neu',title:`AOV ${rp(tv/tc)}`,
    text:`${int(tc)} transaksi menghasilkan ${compact(tv)}. Menaikkan AOV lewat bundling atau upselling menambah sales tanpa menambah trafik.`});
  if(S.unmapped.length) out.push({tag:'Data',tone:'mid',
    title:`${S.unmapped.length} sales type belum termapping`,
    text:`Nilai ${compact(S.unmapped.reduce((s,r)=>s+N(r.total_amount),0))} belum masuk hitungan karena tipenya belum terdaftar di database Sales Type. Selesaikan di Pengaturan.`});
  return out;
}

/* ---------- parsing ---------- */
/* jarak edit, dipakai untuk memaafkan salah ketik nama bulan */
function lev(a,b){
  const m=a.length,n=b.length; let prev=[...Array(n+1).keys()],cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
/* "SEPTEMBER" cocok persis; "SPTEMBER" tetap terbaca September. */
function monthFromWord(w){
  const s=String(w||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!s) return null;
  if(MONTH_WORDS[s]) return MONTH_WORDS[s];
  if(s.length<4) return null;                       // hindari salah tebak dari singkatan
  let best=null, bd=2;
  for(const name in MONTH_WORDS){
    if(name.length<4 || Math.abs(name.length-s.length)>1) continue;
    const d=lev(s,name);
    if(d<bd){ bd=d; best=MONTH_WORDS[name]; }
  }
  return bd<=1 ? best : null;
}
function parseName(fn){
  const base=fn.replace(/\.(xlsx|xls|csv)$/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  const words=base.split(' ');
  let mi=-1, mon=null;
  for(let i=words.length-1;i>=0;i--){
    const m=monthFromWord(words[i]);
    if(m){ mi=i; mon=m; break; }
  }
  /* tanpa \b di depan, supaya "JULI2026" tetap terbaca tahunnya */
  const ym=base.match(/(?<!\d)(20\d{2})(?!\d)/);
  const year=ym?Number(ym[1]):null;
  let store = mi>0 ? words.slice(0,mi).join(' ') : base.replace(/\b20\d{2}\b/,'').trim();
  return {store:store.trim(), month:mon, year};
}
function findStore(name){
  const n=String(name||'').toUpperCase().replace(/\s+/g,' ').trim();
  let a=S.aliases.find(x=>x.alias.toUpperCase().replace(/\s+/g,' ').trim()===n);
  if(a) return a.store_id;
  let s=S.stores.find(x=>x.name.toUpperCase().replace(/\s+/g,' ').trim()===n);
  if(s) return s.id;
  const sq=n.replace(/\s/g,'');
  a=S.aliases.find(x=>x.alias.toUpperCase().replace(/\s/g,'')===sq); if(a) return a.store_id;
  s=S.stores.find(x=>x.name.toUpperCase().replace(/\s/g,'')===sq); if(s) return s.id;
  return null;
}
/* Pembacaan file yang tahan banting:
   - rentang sheet (!ref) dihitung ulang dari sel yang benar-benar ada (file POS sering salah mencatatnya,
     akibatnya hanya sebagian baris terbaca)
   - baris judul di atas tabel dilewati: header dicari dari baris yang paling cocok dengan kolom yang diharapkan
   - semua sheet diperiksa, sheet dengan baris terbanyak yang cocok dipakai */
function fixRef(ws){
  let r1=1e9,c1=1e9,r2=-1,c2=-1;
  for(const k in ws){ if(k[0]==='!') continue;
    const a=XLSX.utils.decode_cell(k);
    if(a.r<r1)r1=a.r; if(a.c<c1)c1=a.c; if(a.r>r2)r2=a.r; if(a.c>c2)c2=a.c; }
  if(r2>=0) ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:r2,c:c2}});
}
const normKey=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function readSheet(file,need=[]){
  const buf=await file.arrayBuffer();
  let wb;
  try{ wb=XLSX.read(buf,{type:'array',cellDates:false}); }
  catch(e){ throw new Error('file tidak bisa dibuka ('+e.message+')'); }
  let best=null;
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name]; if(!ws) continue;
    const declared=ws['!ref']; fixRef(ws);
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
    if(!aoa.length) continue;
    let h=0, hs=-1;
    const needN=need.map(normKey);
    for(let i=0;i<Math.min(aoa.length,40);i++){
      const cells=aoa[i].map(normKey);
      const sc=needN.filter(nk=>cells.some(c=>c&&(c===nk||c.includes(nk)))).length;
      if(sc>hs){ hs=sc; h=i; }
    }
    if(!needN.length) h=0;
    const seen=new Map();
    const head=aoa[h].map((c,i)=>{ let k=String(c??'').trim()||('__KOLOM_'+(i+1));
      const n=(seen.get(k)||0)+1; seen.set(k,n); return n>1?k+'_'+n:k; });
    const rows=[];
    for(let i=h+1;i<aoa.length;i++){
      const o={}; let any=false;
      head.forEach((k,j)=>{ const v=aoa[i][j]; o[k]=v===undefined?'':v; if(v!==''&&v!=null) any=true; });
      if(any) rows.push(o);
    }
    const cand={sheet:name,rows,score:hs,headerRow:h+1,declared,total:aoa.length};
    if(!best || cand.score>best.score || (cand.score===best.score && rows.length>best.rows.length)) best=cand;
  }
  if(!best) return Object.assign([],{info:{sheet:'-',headerRow:0,total:0}});
  const out=best.rows; out.info=best; return out;
}
/* cari kunci kolom secara longgar */
function col(row, ...cands){
  const keys=Object.keys(row);
  for(const c of cands){
    const t=c.toLowerCase().replace(/[^a-z0-9]/g,'');
    const k=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'')===t);
    if(k) return k;
  }
  for(const c of cands){
    const t=c.toLowerCase().replace(/[^a-z0-9]/g,'');
    const k=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'').includes(t));
    if(k) return k;
  }
  return null;
}
function colx(row,...cands){ const keys=Object.keys(row);
  for(const c of cands){ const t=normKey(c); const k=keys.find(k=>normKey(k)===t); if(k) return k; } return null; }
/* Angka bisa datang sebagai "3.328.619.750" (ribuan) atau "12,5" (desimal). */
function num(v){ if(v==null||v==='')return 0;
  if(typeof v==='number')return v;
  const s=String(v).replace(/[^\d,.\-]/g,'');
  if(!s||s==='-') return 0;
  const dots=(s.match(/\./g)||[]).length;
  if(/,\d{1,2}$/.test(s))                                   // koma sebagai desimal
    return Number(s.replace(/\./g,'').replace(',','.'))||0;
  if(dots===1 && /\.\d{1,2}$/.test(s))                      // titik sebagai desimal (format Inggris)
    return Number(s.replace(/,/g,''))||0;
  return Number(s.replace(/[.,]/g,''))||0;                  // sisanya pemisah ribuan
}

const NEED={sales:['Sales Type','Total Collected'],item:['Item Name','Item Sold'],trx:['NAMA TOKO','TRANSAKSI'],
  map:['SALES TYPE','KETERANGAN','SEGMEN'],kpi:['KPI','BOBOT'],master:['Item Name','Brand Name','Category Name']};
async function handleFiles(files,kind){
  if(guard()) return;
  if(!S.ready){ toast('Hubungkan database dulu.'); return; }
  if(!files.length) return;
  logLine(`\n=== ${files.length} file · jenis ${kind} · ${new Date().toLocaleTimeString('id-ID')} ===`);
  let okN=0, failN=0;
  for(const f of files){
    try{
      if(kind==='target'){ await ingestTarget(f); okN++; continue; }  // struktur sheet TARGET beda (bukan header-kolom biasa), ditangani sendiri
      const rows=await readSheet(f,NEED[kind]||[]);
      const inf=rows.info||{};
      logLine(`  ▸ ${f.name}: sheet “${inf.sheet}”, header di baris ${inf.headerRow}, ${int(rows.length)} baris data terbaca`);
      if(kind==='sales') await ingestSales(f,rows);
      else if(kind==='item') await ingestItem(f,rows);
      else if(kind==='trx') await ingestTrx(f,rows);
      else if(kind==='map') await ingestMap(f,rows);
      else if(kind==='kpi') await ingestKpi(f,rows);
      else if(kind==='master') await ingestMaster(f,rows);
      okN++;
    }catch(e){ failN++; logLine(`  ✗ ${f.name} — ${e.message}`); console.error(e); }
  }
  logLine(`--- selesai: ${okN} berhasil, ${failN} gagal ---`);
  if(kind==='sales'||kind==='map'){
    try{ await DB.rpc('rebuild_sales_actual',{}); logLine('  → sales_actual dihitung ulang dari mapping'); }
    catch(e){ logLine('  ! gagal hitung ulang: '+e.message); }
  }
  // TRX/AOV only come from manual entry or the dedicated transaction upload.
  S.itemScope=''; S.rollCache.clear();
  await loadAll();
  toast(`${okN} file diproses${failN?', '+failN+' gagal':''}.`);
}

/* Toko / bulan / tahun per baris bila ada kolomnya (file gabungan); kalau tidak, dari nama file. */
function periodKeys(r0){
  return {kS:colx(r0,'Nama Toko','Toko','Store','Store Name','Outlet','Cabang'),
          kM:colx(r0,'Bulan','Month','Periode'), kY:colx(r0,'Tahun','Year')};
}
function periodCtx(file,r,k){
  const fn=parseName(file.name);
  let sid=null, month=fn.month, year=fn.year;
  if(k.kS){ const t=String(r[k.kS]??'').trim();
    if(!t) return {err:'nama toko kosong'};
    sid=findStore(t); if(!sid) return {err:`toko “${t}” belum ada di alias`}; }
  else sid=findStore(fn.store);
  if(k.kM){ const mv=r[k.kM]; const m=(typeof mv==='number'&&mv>=1&&mv<=12)?mv:monthFromWord(mv); if(m) month=m; }
  if(k.kY){ const y=num(r[k.kY]); if(y>=2000&&y<2100) year=y; }
  if(!sid) return {err:`toko “${fn.store}” (dari nama file) belum ada di alias`};
  if(!month||!year) return {err:'bulan/tahun tidak terbaca'};
  return {sid,month,year};
}
function reportSkips(bad){
  if(!bad.size) return;
  logLine('    ! dilewati: '+[...bad.entries()].slice(0,5).map(([k,v])=>`${v}× ${k}`).join('; '));
}

async function ingestSales(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kType=col(r0,'Sales Type','salestype','type','tipe');
  const kAmt =col(r0,'Total Collected','totalcollected','total','amount','nilai');
  const kCnt =col(r0,'Count','jumlah','qty','trx');
  if(!kType||!kAmt) throw new Error('kolom Sales Type / Total Collected tidak ditemukan');
  const pk=periodKeys(r0);
  const groups=new Map(), bad=new Map(); let used=0, merged=0;
  for(const r of rows){
    const t=String(r[kType]??'').trim();
    if(!t) continue;
    if(/^(total|grand total|jumlah)$/i.test(t)) continue;
    const c=periodCtx(file,r,pk);
    if(c.err){ bad.set(c.err,(bad.get(c.err)||0)+1); continue; }
    const key=c.sid+'|'+c.year+'|'+c.month;
    const g=groups.get(key)||{sid:c.sid,year:c.year,month:c.month,types:new Map()};
    const o=g.types.get(t); const amt=num(r[kAmt]), cnt=kCnt?num(r[kCnt]):0;
    if(o){ o.amount+=amt; o.cnt+=cnt; merged++; } else g.types.set(t,{amount:amt,cnt});
    groups.set(key,g); used++;
  }
  if(!groups.size){ const why=[...bad.keys()][0]; throw new Error(why||'tidak ada baris sales type yang valid'); }
  reportSkips(bad);
  if(merged) logLine(`    ℹ ${int(merged)} baris dengan Sales Type sama digabung (dijumlahkan)`);
  const known=new Set(S.map.map(m=>m.sales_type.toUpperCase().trim()));
  for(const g of groups.values()){
    const out=[]; let tot=0;
    for(const [t,o] of g.types){ out.push({store_id:g.sid,year:g.year,month:g.month,sales_type:t,trx_count:o.cnt,amount:o.amount,source_file:file.name}); tot+=o.amount; }
    await DB.del('sales_type_raw',`store_id=eq.${g.sid}&year=eq.${g.year}&month=eq.${g.month}`);
    await DB.write('sales_type_raw',out,'store_id,year,month,sales_type');
    const unmapped=out.filter(o=>!known.has(o.sales_type.toUpperCase().trim()));
    await DB.write('ingest_log',[{kind:'SALES_TYPE',file_name:file.name,store_id:g.sid,year:g.year,month:g.month,
      rows_total:out.length,rows_mapped:out.length-unmapped.length,rows_unmapped:unmapped.length,
      total_amount:tot,status:'OK',
      message:unmapped.length?('belum termapping: '+unmapped.slice(0,8).map(u=>u.sales_type).join(', ')):null}]);
    logLine(`  ✓ ${S.stores.find(s=>s.id===g.sid)?.name} ${MON3[g.month-1]} ${g.year} · ${out.length} tipe · ${compact(tot)}`
      +(unmapped.length?` · ${unmapped.length} belum termapping`:''));
  }
  logLine(`    Σ ${int(rows.length)} baris dibaca → ${int(used)} dipakai → ${groups.size} periode toko`);
}

async function ingestItem(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kN=col(r0,'Item Name','itemname','nama item','item');
  const kV=col(r0,'Item Variant Name','variant','varian');
  const kC=col(r0,'Category Name','category','kategori');
  const kS=colx(r0,'SKU','Master SKU','kode');
  const kSold=col(r0,'Item Sold','itemsold','sold','terjual');
  const kRef =col(r0,'Item Refunded','itemrefunded','refunded','refund');
  const kNet =col(r0,'Net Sales','netsales','net','nilai');
  if(!kN) throw new Error('kolom Item Name tidak ditemukan');
  const pk=periodKeys(r0);
  const groups=new Map(), bad=new Map(); let used=0;
  for(const r of rows){
    const n=String(r[kN]??'').trim();
    if(!n || /^(total|grand total)$/i.test(n)) continue;
    const c=periodCtx(file,r,pk);
    if(c.err){ bad.set(c.err,(bad.get(c.err)||0)+1); continue; }
    const key=c.sid+'|'+c.year+'|'+c.month;
    const g=groups.get(key)||{sid:c.sid,year:c.year,month:c.month,out:[],sold:0,ref:0,net:0};
    const a=kSold?num(r[kSold]):0, b=kRef?num(r[kRef]):0, d=kNet?num(r[kNet]):0;
    g.out.push({store_id:c.sid,year:c.year,month:c.month,item_name:n,
      item_variant_name:kV?String(r[kV]??'').trim()||null:null,
      category_name:kC?String(r[kC]??'').trim()||null:null,
      sku:kS?String(r[kS]??'').trim()||null:null,
      item_sold:a,item_refunded:b,net_sales:d,source_file:file.name});
    g.sold+=a; g.ref+=b; g.net+=d; groups.set(key,g); used++;
  }
  if(!groups.size){ const why=[...bad.keys()][0]; throw new Error(why||'tidak ada baris item yang valid'); }
  reportSkips(bad);
  for(const g of groups.values()){
    await DB.del('item_sales',`store_id=eq.${g.sid}&year=eq.${g.year}&month=eq.${g.month}`);
    await DB.write('item_sales',g.out);
    await DB.write('ingest_log',[{kind:'ITEM_SALES',file_name:file.name,store_id:g.sid,year:g.year,month:g.month,
      rows_total:g.out.length,rows_mapped:g.out.length,rows_unmapped:0,total_amount:g.net,status:'OK'}]);
    logLine(`  ✓ ${S.stores.find(s=>s.id===g.sid)?.name} ${MON3[g.month-1]} ${g.year} · ${int(g.out.length)} item · `
      +`sold ${int(g.sold)} − refund ${int(g.ref)} = ${int(g.sold-g.ref)} · ${compact(g.net)}`);
  }
  logLine(`    Σ ${int(rows.length)} baris dibaca → ${int(used)} tersimpan → ${groups.size} periode toko`);
}

async function ingestTrx(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kY=col(r0,'TAHUN','year'), kM=col(r0,'BULAN','month'), kS=col(r0,'NAMA TOKO','store','toko');
  const kC=colx(r0,'TRANSAKSI','jumlah transaksi','trx','count')||col(r0,'TRANSAKSI','trx','count');
  const kV=colx(r0,'NILAI TRANSAKSI','total nilai','nilai');
  const kA=col(r0,'AOV','RATA - RATA NILAI TRANSAKSI','ratarata');
  if(!kS||!kC) throw new Error('kolom NAMA TOKO / TRANSAKSI tidak ditemukan');
  const out=new Map(); const bad=new Map(); let blank=0;
  for(const r of rows){
    const nm=String(r[kS]??'').trim();
    if(!nm||/^(total|grand total)$/i.test(nm)) continue;
    const sid=findStore(nm); if(!sid){ bad.set(`toko “${nm}” tidak dikenal`,(bad.get(`toko “${nm}” tidak dikenal`)||0)+1); continue; }
    let mo=null;
    if(kM){ const mv=r[kM]; mo = typeof mv==='number' ? mv : monthFromWord(mv); }
    const yr = kY?num(r[kY]):S.year;
    if(!mo||!yr){ bad.set('periode tidak terbaca',(bad.get('periode tidak terbaca')||0)+1); continue; }
    const cnt=num(r[kC]);
    const aov=kA?num(r[kA]):0;
    let val = kV?num(r[kV]):0;
    if(!val && aov) val = cnt*aov;
    if(!cnt && !val){ blank++; continue; }              // baris kosong (bulan belum berjalan) tidak menimpa data
    out.set(sid+'|'+yr+'|'+mo,{store_id:sid,year:yr,month:mo,jumlah_transaksi:cnt,nilai_transaksi:val,is_manual:true});
  }
  if(!out.size) throw new Error('tidak ada baris transaksi yang berisi angka');
  const arr=[...out.values()];
  await DB.write('transaksi',arr,'store_id,year,month');
  const badN=[...bad.values()].reduce((a,b)=>a+b,0);
  await DB.write('ingest_log',[{kind:'TRANSAKSI',file_name:file.name,
    rows_total:arr.length,rows_mapped:arr.length,rows_unmapped:badN,
    total_amount:arr.reduce((s,r)=>s+r.nilai_transaksi,0),status:'OK'}]);
  logLine(`  ✓ ${file.name} · ${arr.length} baris transaksi tersimpan, ${blank} baris kosong dilewati${badN?`, ${badN} tidak dikenali`:''}`);
  reportSkips(bad);
}

async function ingestMaster(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kI=col(r0,'Item Name','itemname'), kB=col(r0,'Brand Name','brand'), kC=col(r0,'Category Name','category'),
        kN=colx(r0,'Name','Nama'), kW=col(r0,'WARNA','warna','color'), kS=col(r0,'Master SKU','sku');
  if(!kI) throw new Error('kolom Item Name tidak ditemukan');
  const m=new Map(); let autoW=0;
  for(const r of rows){
    const it=String(r[kI]??'').trim(); if(!it) continue;
    const warnaFile=kW?String(r[kW]??'').trim().toUpperCase():'';
    /* round 22: kalau file master tidak punya kolom WARNA atau barisnya kosong, coba tebak dari Item
       Name pakai daftar kosakata warna yang sama dengan colorHex() — daripada dibiarkan NULL (yang bikin
       item hilang total dari Top Color karena item_rollup mengelompokkan berdasar kolom ini). */
    const warna = warnaFile || deriveWarna(it) || null;
    if(!warnaFile && warna) autoW++;
    m.set(it,{item_name:it,brand:kB?String(r[kB]??'').trim().toUpperCase()||null:null,
      category:kC?String(r[kC]??'').trim()||null:null, name:kN?String(r[kN]??'').trim()||null:null,
      warna, sku:kS?String(r[kS]??'').trim()||null:null});
  }
  const arr=[...m.values()];
  if(!arr.length) throw new Error('tidak ada baris master yang valid');
  await DB.write('product_master',arr,'item_name');
  await DB.write('ingest_log',[{kind:'MAPPING',file_name:file.name+' (master produk)',rows_total:arr.length,rows_mapped:arr.length,rows_unmapped:0,status:'OK'}]);
  logLine(`  ✓ ${file.name} · ${int(arr.length)} item master (brand, kategori, warna)${autoW?` · ${int(autoW)} warna ditebak otomatis dari nama item`:''}`);
}

/* round 22: tombol "Perbaiki Warna Kosong" di Upload Data — membaca SEMUA baris product_master yang
   sudah ada di database (bukan dari file upload), lalu mengisi kolom warna yang masih kosong dengan hasil
   deriveWarna(item_name). Dipicu oleh laporan user: Top Color 0 warna utk semua kategori MAMU, karena
   warna item2 MAMU memang belum pernah terisi di database sejak awal (bukan soal upload file sekarang). */
async function repairWarna(){
  if(guard()) return;
  const btn=$('#repair-warna-btn'); if(btn){ btn.disabled=true; btn.textContent='Memindai…'; }
  logLine('  … memindai item master dengan warna kosong…');
  try{
    const rows=await DB.selAll('product_master?select=item_name,brand,warna');
    const empty=rows.filter(r=>!r.warna);
    if(!empty.length){
      logLine(`  ✓ ${int(rows.length)} item master, semuanya sudah ada warnanya. Tidak ada yang perlu diperbaiki.`);
      toast('Semua item master sudah ada warnanya.');
      return;
    }
    const fixes=[]; const stillEmptyByBrand={};
    empty.forEach(r=>{
      const w=deriveWarna(r.item_name);
      if(w) fixes.push({item_name:r.item_name,warna:w});
      else { const b=r.brand||'(tanpa brand)'; stillEmptyByBrand[b]=(stillEmptyByBrand[b]||0)+1; }
    });
    if(fixes.length) await DB.write('product_master',fixes,'item_name');
    await DB.write('ingest_log',[{kind:'MAPPING',file_name:'Perbaiki Warna Kosong (otomatis)',
      rows_total:empty.length,rows_mapped:fixes.length,rows_unmapped:empty.length-fixes.length,status:'OK'}]);
    const sisa=Object.entries(stillEmptyByBrand).sort((a,b)=>b[1]-a[1]).map(([b,n])=>`${b}: ${int(n)}`).join(', ');
    logLine(`  ✓ Selesai. ${int(rows.length)} item master, ${int(empty.length)} warna kosong ditemukan, `+
      `${int(fixes.length)} berhasil diisi otomatis dari nama item.`+
      (sisa?` ${int(empty.length-fixes.length)} masih kosong karena nama itemnya tidak mengandung kata warna yang dikenali (${sisa}) — perlu diisi manual lewat kolom WARNA di file Master Produk, lalu upload ulang.`:''));
    toast(fixes.length?`${fixes.length} warna item berhasil diperbaiki otomatis.`:'Tidak ada warna yang bisa ditebak otomatis dari nama item.');
    await loadAll();
  }catch(e){ logLine('  ✗ Gagal memperbaiki data warna: '+e.message); toast('Gagal: '+e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Pindai & perbaiki warna kosong'; } }
}

async function ingestKpi(file,rows){
  if(!rows.length) throw new Error('file kosong');
  const r0=rows[0];
  const kC=col(r0,'KODE','code'), kN=col(r0,'KPI','METRIK','NAMA','name','indikator');
  const kP=col(r0,'PERSPEKTIF'), kU=col(r0,'UOM','SATUAN','unit'), kPer=col(r0,'PERIODE');
  const kD=col(r0,'POLARITAS','ARAH','direction');
  const kW=col(r0,'BOBOT','weight'), kSt=col(r0,'STATUS');
  const kT=col(r0,'TARGET YTD','TARGET'), kA=col(r0,'REALISASI YTD','AKTUAL','ACTUAL','realisasi');
  const kCat=col(r0,'CATATAN','note');
  if(!kN) throw new Error('kolom KPI/nama metrik tidak ditemukan — pastikan header sesuai template (No;KPI;Perspektif;UOM;...)');
  const mets=[]; let i=0;
  for(const r of rows){
    const nm=String(r[kN]??'').trim();
    if(!nm||/^(total|grand total|total \/ cek bobot)$/i.test(nm)) continue;
    const code=(kC&&String(r[kC]??'').trim()) || nm.toUpperCase().replace(/[^A-Z0-9]+/g,'_').slice(0,40);
    const wRaw=kW?String(r[kW]??'').replace('%',''):'0';
    mets.push({code,name:nm,
      perspektif:kP?String(r[kP]??'').trim()||null:null,
      unit:kU?String(r[kU]??'').trim()||null:null,
      periode:kPer?String(r[kPer]??'').trim()||'Monthly':'Monthly',
      direction:(kD&&/min|kecil|lower|turun|rendah/i.test(String(r[kD])))?'lower':'higher',
      weight:num(wRaw)||0,
      status:kSt?String(r[kSt]??'').trim()||'Running':'Running',
      catatan:kCat?String(r[kCat]??'').trim()||null:null,
      target_override:kT?(num(String(r[kT]??'').replace('%',''))||null):null,
      actual_override:kA?(num(String(r[kA]??'').replace('%',''))||null):null,
      sort_order:++i});
  }
  if(!mets.length) throw new Error('tidak ada baris KPI yang terbaca dari file ini');
  await DB.write('kpi_metrics',mets,'code');
  await DB.write('ingest_log',[{kind:'KPI',file_name:file.name,rows_total:mets.length,
    rows_mapped:mets.length,rows_unmapped:0,status:'OK'}]);
  logLine(`  ✓ ${file.name} · ${mets.length} metrik KPI diperbarui`);
}

function parseDisp(t){
  t=String(t||'').trim();
  if(!t||t==='—'||t==='-') return null;
  let m=/^(-?)\s*Rp\s*(-?[\d.,]+)\s*(T|M|jt|rb)?$/.exec(t);
  if(m){ let n=m[2]; n=n.includes(',')?n.replace(/\./g,'').replace(',','.'):n.replace(/\./g,'');
    let v=Number(n); if(isNaN(v)) return t;
    v*= {T:1e12,M:1e9,jt:1e6,rb:1e3}[m[3]]||1; return m[1]?-v:v; }
  m=/^(-?[\d.,]+)\s*%$/.exec(t);
  if(m){ const v=Number(m[1].replace(/\./g,'').replace(',','.')); return isNaN(v)?t:v/100; }
  if(/^-?[\d.,]+$/.test(t)){ const v=/,\d{1,2}$/.test(t)?Number(t.replace(/\./g,'').replace(',','.')):Number(t.replace(/[.,]/g,'')); return isNaN(v)?t:v; }
  return t;
}
function cellVal(td){
  let v=td.dataset.v; if(v==null||v==='') v=td.querySelector('[data-v]')?.dataset.v;
  if(v!=null&&v!==''&&!isNaN(Number(v))) return Number(v);
  return parseDisp(td.textContent);
}
function sortTable(tbl,ci,dir){

  const rows=[...tb.rows].filter(r=>!r.classList.contains('tot')), tots=[...tb.rows].filter(r=>r.classList.contains('tot'));
  const vals=rows.map(r=>r.cells[ci]?cellVal(r.cells[ci]):null);
  const numeric=vals.filter(v=>typeof v==='number').length >= vals.filter(v=>v!=null).length/2;
  const idx=rows.map((r,i)=>i);
  idx.sort((a,b)=>{
    let x=vals[a], y=vals[b];
    if(numeric){ x=typeof x==='number'?x:null; y=typeof y==='number'?y:null; }
    if(x==null&&y==null) return a-b; if(x==null) return 1; if(y==null) return -1;   // kosong selalu di bawah
    const c=numeric?x-y:String(x).localeCompare(String(y),'id',{numeric:true,sensitivity:'base'});
    return (dir==='asc'?c:-c)||a-b; });

      const v=cellVal(td);

      return td.textContent.trim(); }));
  }
  const fname=(name||'data').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10);
  try{

    for(let r=1;r<aoa.length;r++) for(const c of pctCols){ const cell=ws[XLSX.utils.encode_cell({r,c})]; if(cell&&cell.t==='n') cell.z='0.0%'; }
    ws['!cols']=aoa[0].map((h,i)=>({wch:Math.min(46,Math.max(10,String(h).length+2,...aoa.slice(1,40).map(r=>String(r[i]??'').length+1)))}));

/* round 13 (visual fidelity): sama seperti bakeSvgPaint() di atas untuk grafik, warna/gaya pill/chip/
   header tabel dkk di SINI didefinisikan lewat kelas CSS + var()/color-mix() di <style> halaman (mis.
   .pill.ok{background:color-mix(in srgb,var(--good) 13%,transparent)...}) — begitu tabel/kartu disalin
   sebagai HTML lepas (ditempel ke Word/PowerPoint/Excel/Gmail dkk, yang TIDAK memuat <style> halaman ini
   dan banyak yang tidak mendukung color-mix()), semua pewarnaan itu hilang/jadi hitam polos. Perbaikannya:
   SEBELUM elemen diserialisasi jadi HTML, baca nilai RESOLVED dari elemen ASLI (masih terpasang di
   dokumen — getComputedStyle() otomatis menyelesaikan var()/color-mix() jadi rgb() literal) dan "bekukan"
   jadi inline style eksplisit di elemen clone — supaya tampilannya tetap sama persis dengan di app
   meski ditempel di aplikasi lain yang tidak kenal stylesheet/variabel CSS kita. */
function bakeVisualStyles(orig,clone){
  const PROPS=['color','backgroundColor','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor',
    'borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','borderTopStyle','borderRightStyle',
    'borderBottomStyle','borderLeftStyle','borderRadius','fontWeight','textAlign','textTransform','letterSpacing',
    'fontSize','whiteSpace','paddingTop','paddingRight','paddingBottom','paddingLeft','display','verticalAlign'];
  /* buang deklarasi lama yang masih memuat var()/color-mix() literal — dibiarkan, teks mentahnya tetap
     ada di HTML yang disalin walau ditimpa, dan beberapa aplikasi tujuan (Word dkk) tidak selalu
     menangani deklarasi tertimpa/tak-valid dengan rapi. Style non-warna (mis. width kolom sticky) yang
     TIDAK memuat var()/color-mix() tetap dipertahankan apa adanya. */
  const stripVarDecls=s=>(s||'').split(';').filter(d=>{ const t=d.trim(); return t&&!/var\(--|color-mix\(/.test(t); }).join(';');
  const COLOR_PROPS=new Set(['color','backgroundColor','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor']);
  const walk=(o,c)=>{
    if(!o||!c||o.nodeType!==1||c.nodeType!==1) return;
    const cs=getComputedStyle(o);
    let extra=stripVarDecls(c.getAttribute('style'));
    PROPS.forEach(p=>{ let v=cs[p]; if(v==null||v===''||v==='rgba(0, 0, 0, 0)'||v==='transparent') return;
      if(COLOR_PROPS.has(p)) v=canonColor(v);
      extra+=`;${p.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}:${v}`; });
    if(extra) c.setAttribute('style',extra); else c.removeAttribute('style');
    const oc=o.children, cc=c.children;
    for(let i=0;i<oc.length;i++) walk(oc[i],cc[i]);
  };
  walk(orig,clone);
}

/* round 10 item 9: satu helper warna tren untuk SEMUA indikator naik/turun di seluruh app — hijau=naik/baik,
   merah=turun/jelek (tidak pernah tertukar), DAN intensitas warnanya mengikuti besar perubahan (bukan cuma
   dua warna flat seperti sebelumnya). `ratio` = pecahan bertanda seberapa besar perubahannya, mis.
   (cur-prev)/prev untuk growth, atau (achievement-1) untuk capaian vs target 100%. Diklem ke langit-langit
   yang wajar (50%) lalu dipetakan lewat akar (sqrt) ke intensitas 25%–100% — perubahan kecil tetap kebaca
   tapi jelas lebih redup dari perubahan besar. Pakai color-mix yang sama persis dengan .pill.ok/.pill.bad
   di <style> (~baris 163-164) supaya tetap konsisten tema terang/gelap. */
function trendColor(ratio){
  if(ratio==null||!isFinite(ratio)) return 'var(--muted)';
  const CEIL=.5; // perubahan ≥50% sudah dianggap "paling pekat"
  const mag=Math.min(Math.abs(ratio),CEIL)/CEIL;
  const intensity=Math.round((0.25+Math.sqrt(mag)*0.75)*100);
  const base=ratio>=0?'var(--good)':'var(--crit)';
  return `color-mix(in srgb, ${base} ${intensity}%, var(--muted))`;
}
function trendBg(ratio){ const c=trendColor(ratio); return `color-mix(in srgb, ${c} 14%, transparent)`; }
function trendBorder(ratio){ const c=trendColor(ratio); return `color-mix(in srgb, ${c} 40%, transparent)`; }
/* item 8 (ronde ini): gradien BESAR/KECIL untuk kolom net sales yang diurutkan dari terbesar ke
   terkecil — beda tujuan dari trendColor() di atas (itu soal arah naik/turun, hijau/merah). Ini
   soal rank: baris net sales paling besar = warna paling pekat/terang, makin kecil nilainya makin
   pudar — supaya urutan besar→kecil langsung "kebaca" dari warnanya juga, bukan cuma posisi baris. */
function magColor(v,max){
  if(v==null||!isFinite(v)||!max||max<=0) return 'var(--ink)';
  const frac=Math.max(0,Math.min(1,v/max));
  const intensity=Math.round((0.35+Math.sqrt(frac)*0.65)*100);
  return `color-mix(in srgb, var(--accent) ${intensity}%, var(--ink-2))`;
}

function h2hCurrentYear(){
  const now=new Date().getFullYear();

  if(years.has(now)) return now;                       // tahun kalender sekarang, kalau datanya sudah ada

function h2hData(years,m1,m2,window=null){

async function comparisonRollup(dim,year,w,o={}){

 const results=await Promise.all(jobs.map(async j=>{const rows=await rollup(dim,year,j.m1,j.m2,{...o,stores:ids,limit:10000});if(rows.length>=10000)throw Error('Hasil item mencapai batas 10.000 kelompok. Persempit filter toko/periode.');return {rows,f:j.f};})),agg=new Map();for(const {rows,f} of results)for(const r of rows){const v=agg.get(r.k)||{k:r.k,qty:0,refunded:0,sales:0,n:0};v.qty+=r.qty*f;v.refunded+=r.refunded*f;v.sales+=r.sales*f;v.n=Math.max(v.n,r.n||0);agg.set(r.k,v);}return [...agg.values()].sort((a,b)=>b.sales-a.sales);
}

function sssgInit(){const key='sssg-period-v3';if(S.sssg?.key!==key)S.sssg=comparisonInit(key);return S.sssg;}
function sssgOpenMD(store){if(!/^\d{4}-\d{2}-\d{2}$/.test(store?.opening_date||''))return null;const [year,m,day]=store.opening_date.split('-').map(Number);if(m<1||m>12||day<1||day>daysInMonth(year,m))return null;return {year,m,day};}
function sssgData(years,m1,m2,window){
 const w=window||{mode:'month',m1,m2,d1:1,d2:31},data=h2hData(years,w.m1,w.m2,w),out=new Map();
 for(const store of S.stores){if(store.name==='DC TIGALAPAN'||!storeOk(store.id))continue;const anchor=sssgOpenMD(store),by={};for(const y of years){const start=`${y}-${String(w.m1).padStart(2,'0')}-${String(Math.min(w.d1,daysInMonth(y,w.m1))).padStart(2,'0')}`;by[y]=!anchor||store.opening_date>start?null:(data[y].get(store.id)||{sales:0,kom:0,usr:0,kt:0,ut:0,um:0,tgt:0,trx:0,val:0,days:comparisonDays(w,y)});}out.set(store.id,{anchor,by,name:store.name,opening_date:store.opening_date||null});}return out;
}

  {

  /* ---------- segmen komersial & user (same-window idsY2) — round 12: tambah Δ/GAP y3 vs y1 (2024 vs 2026) langsung ---------- */
  {
    const heads=[H('SEGMEN',{s:1}),...[y1,y2,y3].map(y=>H(String(y),{r:1})),H(`Δ ${y3} VS ${y2}`,{r:1}),H(`GAP ${y3}-${y2}`,{r:1}),H(`Δ ${y3} VS ${y1}`,{r:1}),H(`GAP ${y3}-${y1}`,{r:1}),H('PORSI '+y3,{r:1})];

  {

        ['TOTAL',...totV.map(x=>compact(x)),growthPill(totV[2],totV[1]),gapTxt(totV[2],totV[1]),growthPill(totV[2],totV[0]),gapTxt(totV[2],totV[0]),pct(tot?totV[2]/tot:null)])));

  /* ---------- Segmen per toko (same-window idsY2) — item 4: section H2H yang belum ada di SSSG.
     round 12: tambah Δ/GAP KOM & USER y3 vs y1 langsung. ---------- */
  {
    const heads=[H('TOKO',{s:1}),...[y1,y2,y3].map(y=>H('KOMERSIAL '+y,{r:1})),H(`Δ KOM ${y3}/${y2}`,{r:1}),H(`GAP KOM ${y3}-${y2}`,{r:1}),H(`Δ KOM ${y3}/${y1}`,{r:1}),H(`GAP KOM ${y3}-${y1}`,{r:1}),

    const rows=idsY2.slice().sort((a,b)=>G(y3,b,'sales')-G(y3,a,'sales')).map(id=>[names.get(id),...[y1,y2,y3].map(y=>compact(G(y,id,'kom'))),

        ...footUsrV.map(x=>compact(x)),growthPill(footUsrV[2],footUsrV[1]),gapTxt(footUsrV[2],footUsrV[1]),growthPill(footUsrV[2],footUsrV[0]),gapTxt(footUsrV[2],footUsrV[0])])));

  /* Item amounts and units use the same selected calendar-day proportions. */
  const host=el('div',{style:'display:flex;flex-direction:column;gap:18px'});
  p.append(host);
  host.append(el('div',{class:'empty'},'Memuat item sales same-window…'));
  (async()=>{
    try{
      /* round 22: dim 'color' dihitung client-side dari dim 'product' — lihat colorRowsFromProducts. */
      const dims=['store','category','product','size'];
      const res={}; await Promise.all(dims.map(async d=>{ res[d]=await Promise.all([y1,y2,y3].map(y=>comparisonRollup(d,y,window,{limit:d==='product'?400:d==='store'?60:40,stores:idsFull}))); }));
      res.color=res.product.map(yearRows=>colorRowsFromProducts(yearRows));
      host.innerHTML='';
      const mk=(dim,title,keyCell,limit)=>{
        const mg=mergeRoll(res[dim]);
        let arr=[...mg.entries()].filter(([k])=>!(dim==='color'&&k==='(Tanpa warna)')&&!(dim==='size'&&k==='(Tanpa size)'));
        /* item 8 (round 11): diurutkan dari NET SALES tahun berjalan (y3) terbesar→terkecil, bukan qty —
           tabel ini soal net sales, jadi urutannya ikut net sales, sama seperti kolom bergradasinya.
           round 12 (lanjutan): kolom ITEM/qty DIHAPUS sesuai permintaan user — murni data sales
           (NET SALES per tahun + growth/gap y3 vs y2 DAN y3 vs y1), tidak lagi memuat unit terjual. */
        arr.sort((a,b)=>(b[1][2]?.sales||0)-(a[1][2]?.sales||0));
        const maxN=arr.length?(arr[0][1][2]?.sales||0):0;
        const heads=[H(title,{s:1}),...[y1,y2,y3].map(y=>H('NET SALES '+y,{r:1})),H(`Δ NET ${y3}/${y2}`,{r:1}),H(`NET SALES GAP ${y3}/${y2}`,{r:1}),H(`Δ NET ${y3}/${y1}`,{r:1}),H(`NET SALES GAP ${y3}/${y1}`,{r:1})];
        const rows=arr.slice(0,limit).map(([k,v])=>{ const n=v.map(x=>x?x.sales:0);
          return [keyCell(k),...n.map((x,i)=>i===2?magCell(x,maxN,compact(x)):compact(x)),growthPill(n[2],n[1]),gapTxt(n[2],n[1]),growthPill(n[2],n[0]),gapTxt(n[2],n[0])]; });
        const totN=res[dim].map(r=>r.reduce((s,x)=>s+x.sales,0));
        return card(`Item sales per ${title.toLowerCase()} (same-window penuh)`,`${idsFull.length} toko · ${y1}/${y2}/${y3} · ${periodText} · diurutkan NET SALES ${y3} terbesar→terkecil`,
          mkTable(heads,rows,dim==='store'||dim==='category'?['TOTAL',...totN.map(x=>compact(x)),growthPill(totN[2],totN[1]),gapTxt(totN[2],totN[1]),growthPill(totN[2],totN[0]),gapTxt(totN[2],totN[0])]:null));
      };
      host.append(mk('store','Toko',k=>k,60));
      host.append(mk('category','Kategori',k=>k,40));
      host.append(mk('product','Produk',k=>k,60));
      host.append(mk('color','Warna',k=>colorChip(k),30));
      host.append(mk('size','Ukuran',k=>k,20));
    }catch(e){ host.innerHTML=''; host.append(el('div',{class:'note warn'},'Gagal memuat item sales: '+e.message)); }
  })();

/* =====================================================================
   PROGRAM SALES — round 17: kelompokkan beberapa kategori item jadi satu
   "program" (mis. Program Lebaran, Promo Akhir Tahun) dengan TARGET
   sendiri per bulan. Realisasi sales program TIDAK ditarik dari tabel
   baru — murni dijumlah dari sales item yang sudah ada (rollup kategori,
   fungsi yang sama dipakai H2H/SSSG/Item Sales), difilter ke kategori
   yang dipilih program itu. Halaman dilengkapi kartu & analisa H2H-style:
   tahun berjalan (h2hCurrentYear()) dibandingkan hingga 2 tahun sebelumnya,
   per bulan terpilih — pola & fungsi pembanding PERSIS sama dengan H2H
   (growthPill/gapTxt/mkTable dgn footer TOTAL), bukan logika baru.

   CATATAN PENTING (dicatat jujur, bukan disembunyikan): definisi program
   & targetnya idealnya disimpan di tabel khusus (mis. `sales_programs` +
   `sales_program_targets`, dengan unique(program_id,year,month) seperti
   pola channel_targets/kpi_weekly). Sesi yang mengerjakan round ini TIDAK
   kebagian akses tool database langsung (Supabase MCP menolak dgn
   "FGA Authentication Error. Unauthorized"), sehingga tabel baru itu
   TIDAK bisa dibuat. Sebagai solusi yang tetap berfungsi penuh hari ini,
   seluruh data program (nama, kategori, target per bulan) disimpan
   sebagai SATU blob JSON di `app_settings` (key 'sales_programs_json') —
   baca/tulisnya diisolasi lewat programsLoad()/programsSave() di bawah
   supaya kalau nanti akses tool database tersedia lagi, migrasi ke tabel
   sungguhan tinggal mengganti isi 2 fungsi ini saja, UI tidak perlu
   disentuh. Ini bukan batasan permanen, melainkan keterbatasan sesi ini. */
function programsLoad(){
  try{ const raw=S.settings&&S.settings.sales_programs_json; const arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr.map(pr=>({id:pr.id,name:pr.name,categories:Array.isArray(pr.categories)?pr.categories:[],targets:pr.targets||{}})):[]; }
  catch(e){ return []; }
}
async function programsSave(arr){ await DB.write('app_settings',[{key:'sales_programs_json',value:JSON.stringify(arr)}],'key'); S.settings.sales_programs_json=JSON.stringify(arr); }
async function programCategorySales(categories,year,m1,m2){
  const months=[]; for(let m=m1;m<=m2;m++) months.push(m);
  const perMonth=await Promise.all(months.map(m=>rollup('category',year,m,m,{})));
  return perMonth.map(rows=>rows.filter(r=>categories.includes(r.k)).reduce((s,r)=>s+r.sales,0));
}
/* Round 20: target program SEBELUMNYA selalu satu angka blended utk SELURUH program (kunci polos
   "tahun-bulan"), walau programnya punya beberapa kategori — tidak ada cara mengisi target terpisah per
   kategori ("masing2 punya target untuk dicapai", keluhan user). Diubah jadi kunci majemuk
   "KATEGORI|tahun-bulan" supaya tiap kategori di dalam satu program bisa punya target sendiri; migrasi
   data lama (kunci polos, dibuat sebelum round ini) ditangani oleh progCatTarget() sendiri — dibaca
   sebagai fallback HANYA kalau programnya memang cuma 1 kategori (supaya tidak salah assign ke kategori
   yang keliru pada program multi-kategori lama, yang sebelum round ini memang tidak pernah mendukung
   per-kategori sama sekali). Target per-bulan (fungsi tgtOf di renderProgram) menjumlah progCatTarget()
   di semua kategori program, jadi "Target {y3}" tile/kolom TOTAL otomatis tetap benar tanpa perlu
   disentuh — hanya sumber datanya yang sekarang per-kategori. */
function progCatTarget(targetsObj,prog,cat,y,m){
  const t=targetsObj||{};
  const k=cat+'|'+y+'-'+m;
  if(t[k]!=null && t[k]!=='') return N(t[k]);
  if(prog.categories.length===1){ const legacy=t[y+'-'+m]; if(legacy!=null && legacy!=='') return N(legacy); }
  return 0;
}
function renderProgram(){

     kategori banyak) jadi dropdown multi-select reusable (multiSelectDropdown — sama dengan filter
     Brand/SPV/Toko), lebih rapi dan sudah otomatis dapat kotak cari begitu kategori >6. */

  mgCard.append(el('p',{class:'note',style:'margin-top:10px'},

  const prog=programs.find(pr=>pr.id===S.programSel);

    MONTHS.map((m,i)=>el('option',{value:String(i+1),selected:S[k]===i+1?'':null},m)));
  const selCard=el('div',{class:'card'});

  const m1=S.programM1, m2=S.programM2;

  const host=el('div',{style:'display:flex;flex-direction:column;gap:18px'});

      const totY=y=>byYear[y].reduce((s,v)=>s+v,0);

      const tgtOf=(y,m)=>prog.categories.reduce((s,c)=>s+progCatTarget(prog.targets,prog,c,y,m),0);

      const companyTot=y=>S.dashAll.filter(r=>r.year===y&&r.month>=m1&&r.month<=m2&&storeOk(r.store_id)).reduce((s,r)=>s+N(r.total_sales),0);
      host.innerHTML='';

         Target y3 + Pencapaian thd target + Porsi thd total sales toko ---------- */
      const tl=el('div',{class:'grid g4'});

      host.append(tl);
      const tl2=el('div',{class:'grid g4'});
      const g31=s1>0?(s3-s1)/s1:null;
      tl2.append(tile(`Growth ${y3} vs ${y1}`,pct(g31),`GAP ${s1>0?compact(s3-s1):'—'}`,null,
        g31==null?el('span',{class:'pill neu'},'—'):el('span',{class:'pill '+(g31>=0?'ok':'bad')},g31>=0?'Tumbuh':'Turun')));
      const t3=tgtY(y3);
      tl2.append(tile(`Target ${y3}`,compact(t3),'dijumlah dari target per bulan yang diisi di bawah',null));
      tl2.append(tile(`Pencapaian thd target ${y3}`,pct(t3>0?s3/t3:null),t3>0?'sales program vs target program':'target belum diisi',null));
      const cp=companyTot(y3);
      tl2.append(tile(`Porsi thd total sales toko ${y3}`,pct(cp>0?s3/cp:null),compact(s3)+' dari '+compact(cp)+' total sales toko pada cakupan filter',null));

      /* ---------- chart per bulan, 3 tahun ---------- */
      const cols=['var(--s7)','var(--s2)','var(--s1)'];
      const ser=years.map((y,i)=>({name:String(y),color:cols[i],vals:byYear[y]}));
      host.append(chartCard('Sales program per bulan, tiga tahun',ymLabel(y1,m1,m2)+' · '+ymLabel(y2,m1,m2)+' · '+ymLabel(y3,m1,m2),

      /* ---------- Round 20: chart trend Sales vs Target + Achievement (tahun berjalan y3) — SEBELUMNYA
         Program Sales hanya punya chart 3-tahun di atas tanpa target/achievement sama sekali. Memakai
         comboBarsLine() yang sama dipakai Dashboard/Marketplace: bar Sales/Target sumbu kiri (Rp), garis
         Achievement sumbu kanan (%). ---------- */
      {
        const salesY3=byYear[y3], tgtArr=monthsArr.map(m=>tgtOf(y3,m));
        const achArr=monthsArr.map((m,i)=>tgtArr[i]>0&&salesY3[i]>0?salesY3[i]/tgtArr[i]:null);
        const ser2=[{name:'Sales '+y3,color:'var(--s1)',vals:salesY3},{name:'Target '+y3,color:'var(--target-bar)',vals:tgtArr}];
        host.append(chartCard(`Sales vs Target & Achievement per bulan (${y3})`,ymLabel(y3,m1,m2),
          el('div',{},
            el('div',{style:'display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px'},
              legend(ser2), el('span',{class:'sub'},'— ● Achievement (garis, sumbu kanan %)')),
            comboBarsLine(MON3.slice(m1-1,m2),ser2,achArr,{h:300,lineRef:1,lineColor:'var(--s7)',lineName:'Achievement'}),
            el('div',{class:'sub',style:'margin-top:4px'},'Sumbu kiri: Rp (batang Sales/Target) · Sumbu kanan: % (garis Achievement, titik putus = bulan tanpa sales/target)'))));
      }

      /* ---------- tabel bulan demi bulan — H2H style persis (growth y3vsy2 & y3vsy1 langsung, +GAP, +TOTAL footer) ---------- */
      {
        const heads=[H('BULAN',{s:1}),...years.map(y=>H('SALES '+y,{r:1})),H(`Δ ${y3} VS ${y2}`,{r:1}),H(`GAP ${y3}-${y2}`,{r:1}),H(`Δ ${y3} VS ${y1}`,{r:1}),H(`GAP ${y3}-${y1}`,{r:1}),H(`TARGET ${y3}`,{r:1}),H(`ACHIEV ${y3}`,{r:1})];
        const rows=monthsArr.map((m,i)=>{ const a=byYear[y1][i],b=byYear[y2][i],c=byYear[y3][i],t=tgtOf(y3,m);
          if(!a&&!b&&!c&&!t) return null;
          return [MONTHS[m-1],compact(a),compact(b),compact(c),growthPill(c,b),gapTxt(c,b),growthPill(c,a),gapTxt(c,a),compact(t),pillCell(t>0?c/t:null)]; }).filter(Boolean);
        host.append(card('Bulan demi bulan',ymLabel(y1,m1,m2)+' · '+ymLabel(y2,m1,m2)+' · '+ymLabel(y3,m1,m2),
          mkTable(heads,rows,['TOTAL',...years.map(y=>compact(totY(y))),growthPill(s3,s2),gapTxt(s3,s2),growthPill(s3,s1),gapTxt(s3,s1),compact(t3),pillCell(t3>0?s3/t3:null)])));
      }

      /* ---------- per kategori (kalau program punya >1 kategori) ----------
         Round 20: ditambah kolom TARGET {y3}/ACHIEV {y3} per kategori — SEBELUMNYA tabel ini hanya
         menunjukkan sales & growth per kategori, tanpa target sama sekali (padahal target sekarang
         memang disimpan per kategori, lihat progCatTarget() di atas), jadi tidak terlihat kategori mana
         yang tercapai/tidak. */
      if(prog.categories.length>1){
        const perCatYear={};
        await Promise.all(years.map(async y=>{
          const rows=await rollup('category',y,m1,m2,{});
          perCatYear[y]=new Map(rows.map(r=>[r.k,r.sales]));
        }));
        const catTgtY3=c=>monthsArr.reduce((s,m)=>s+progCatTarget(prog.targets,prog,c,y3,m),0);
        const heads=[H('KATEGORI',{s:1}),...years.map(y=>H(String(y),{r:1})),H(`Δ ${y3} VS ${y2}`,{r:1}),H(`GAP ${y3}-${y2}`,{r:1}),H(`Δ ${y3} VS ${y1}`,{r:1}),H(`GAP ${y3}-${y1}`,{r:1}),H(`TARGET ${y3}`,{r:1}),H(`ACHIEV ${y3}`,{r:1}),H('PORSI '+y3,{r:1})];
        const catRows=prog.categories.map(c=>{ const v=years.map(y=>N(perCatYear[y].get(c))); const t=catTgtY3(c);
          return [c,...v.map(x=>compact(x)),growthPill(v[2],v[1]),gapTxt(v[2],v[1]),growthPill(v[2],v[0]),gapTxt(v[2],v[0]),compact(t),pillCell(t>0?v[2]/t:null),pct(s3?v[2]/s3:null)]; })
          .sort((ra,rb)=>N(rb[3].props?.['data-v'])-N(ra[3].props?.['data-v']));
        host.append(card('Per kategori',`Rincian sales program per kategori, lengkap target & achievement masing-masing (${years.join('/')})`,
          mkTable(heads,catRows,
            ['TOTAL',...years.map(y=>compact(totY(y))),growthPill(s3,s2),gapTxt(s3,s2),growthPill(s3,s1),gapTxt(s3,s1),compact(t3),pillCell(t3>0?s3/t3:null),pct(1)])));
      }

      /* ---------- target per bulan — editable, 3 tahun sekaligus (y1/y2/y3), disimpan ke blob JSON program
         Round 19: tabel 12-baris diganti dropdown "Bulan" — hanya SATU baris input per bulan yang tampil
         sekaligus, draft disimpan di memori supaya pindah bulan tidak membuang input yang belum Simpan.
         Round 20: SEBELUMNYA satu baris input itu cuma 1 target blended utk SELURUH program — tidak bisa
         dipisah per kategori saat program punya >1 kategori (keluhan user "masing² punya target untuk
         dicapai"). Sekarang, kalau program punya >1 kategori, baris input digandakan per kategori (satu
         grup input per kategori, label namanya di atas) untuk bulan yang sama; kunci draft memakai format
         majemuk "KATEGORI|tahun-bulan" (lihat progCatTarget()) — utk program 1-kategori tetap cukup satu
         grup input saja (UI tidak berubah dari sebelumnya), migrasi data lama ditangani progCatTarget()
         sendiri saat draft di-inisialisasi di bawah. ---------- */
      {
        /* migrasi: draft SELALU memakai kunci majemuk kategori|tahun-bulan; kunci lama (polos, dari
           sebelum round 20, hanya mungkin ada pada program 1-kategori) disalin ke kunci baru di sini —
           sekali disimpan ulang lewat tombol "Simpan target", kunci lama otomatis tidak terpakai lagi. */
        const draft={};
        Object.keys(prog.targets||{}).forEach(k=>{ if(k.includes('|')) draft[k]=prog.targets[k]; });
        if(prog.categories.length===1){
          const cat=prog.categories[0];
          Object.keys(prog.targets||{}).forEach(k=>{
            if(!k.includes('|')){ const nk=cat+'|'+k; if(draft[nk]==null) draft[nk]=prog.targets[k]; }
          });
        }
        const nowM=new Date().getMonth()+1;
        let curM=monthsArr.includes(nowM)?nowM:monthsArr[0];
        const mSelTgt=el('select',{},...monthsArr.map(m=>el('option',{value:m},MONTHS[m-1])));
        mSelTgt.value=String(curM);
        const rowHost=el('div',{style:'display:flex;flex-direction:column;gap:12px'});
        const filledHost=el('div',{class:'sub',style:'margin-top:10px'});
        function paintFilled(){
          const withVal=monthsArr.filter(m=>prog.categories.some(c=>years.some(y=>{ const v=draft[c+'|'+y+'-'+m]; return v!=null&&v!==''; })));
          filledHost.textContent=withVal.length?('Bulan sudah terisi: '+withVal.map(m=>MONTHS[m-1]).join(', ')):'Belum ada bulan yang diisi.';
        }
        function paintRow(){
          rowHost.innerHTML='';
          prog.categories.forEach(cat=>{
            const grp=el('div',{style:'display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end'});
            if(prog.categories.length>1) grp.append(el('div',{class:'fld',style:'min-width:150px'},el('label',{},'Kategori'),el('div',{style:'font-weight:700;padding:7px 0'},cat)));
            years.forEach(y=>{
              const key=cat+'|'+y+'-'+curM;
              const inp=el('input',{type:'number',min:'0',value:draft[key]!=null?draft[key]:'',style:'width:150px',
                oninput:e=>{ const v=e.target.value; if(v==='') delete draft[key]; else draft[key]=N(v); paintFilled(); }});
              grp.append(el('div',{class:'fld'},el('label',{},'Target '+y),inp));
            });
            rowHost.append(grp);
          });
        }
        mSelTgt.onchange=e=>{ curM=Number(e.target.value); paintRow(); };
        paintRow(); paintFilled();
        host.append(card('Target per bulan',(prog.categories.length>1?'Target dipisah per kategori — ':'')+'pilih bulan, isi target per tahun, lalu Simpan — dipakai utk kolom ACHIEV di tabel di atas (tahun berjalan '+y3+').',
          el('div',{style:'display:flex;flex-direction:column;gap:4px'},
            el('div',{class:'fld',style:'max-width:220px'},el('label',{},'Bulan'),mSelTgt),
            rowHost, filledHost),
          el('div',{class:'rowline',style:'margin-top:13px'},
            el('button',{class:'btn pri',onclick:async()=>{
              if(guard()) return;
              const arr=programsLoad(); const target=arr.find(pr=>pr.id===prog.id); if(!target) return;
              target.targets=draft;
              try{ await programsSave(arr); toast('Target disimpan.'); renderProgram(); }catch(e){ toast('Gagal: '+e.message); } }},'Simpan target'))));
      }
    }catch(e){ host.innerHTML=''; host.append(el('div',{class:'note warn'},'Gagal memuat realisasi sales program: '+e.message)); }
  })();
}

/* =====================================================================
   MARKETPLACE — Shopee & TikTok dari Sales Type
   ===================================================================== */
function mktChannels(){
  const set=new Set(['SHOPEE','TIKTOK']);
  S.map.forEach(m=>{ if(m.channel) set.add(String(m.channel).toUpperCase()); });
  S.mkt.forEach(r=>set.add(r.channel)); S.chanTargets.forEach(t=>set.add(String(t.channel).toUpperCase()));
  return [...set];
}
function mktRows(year,m1,m2,ch){
  return S.mkt.filter(r=>r.year===year&&r.month>=m1&&r.month<=m2&&(!ch||r.channel===ch)&&storeOk(r.store_id));
}
/* round 22: target channel KHUSUS SATU toko offline (dipakai tabel "Marketplace per toko") — null kalau
   toko itu belum diisi target per-tokonya sendiri di kartu "Target marketplace per Toko Offline". */
function chanTargetStore(ch,sid,year,m1,m2){
  const t=S.chanTargets.filter(t=>String(t.channel).toUpperCase()===ch&&t.year===year&&t.month>=m1&&t.month<=m2&&t.store_id===sid)
    .reduce((s,t)=>s+N(t.target),0);
  return t||null;
}
function chanTarget(ch,year,m1,m2){
  const ids=scopeStoreIds();
  const all=S.chanTargets.filter(t=>String(t.channel).toUpperCase()===ch&&t.year===year&&t.month>=m1&&t.month<=m2);
  if(ids) return all.filter(t=>t.store_id!=null&&ids.includes(t.store_id)).reduce((s,t)=>s+N(t.target),0);
  const overall=all.filter(t=>t.store_id==null).reduce((s,t)=>s+N(t.target),0);
  return overall||all.reduce((s,t)=>s+N(t.target),0);
}
/* round 17: channel 'MARKETPLACE' (bucket generik round 10) sudah dinormalisasi jadi SHOPEE di loadAll()
   (lihat normCh di sana) sehingga tidak akan pernah muncul sebagai channel tersendiri lagi di sini — entri
   MARKETPLACE di peta warna ini dipertahankan hanya sebagai jaga-jaga (fallback warna, tidak pernah
   dipakai dalam alur normal) dan BUKAN lagi channel yang dipilih user; opsi dropdown-nya sudah dihapus. */
const CH_COLOR={SHOPEE:'var(--s2)',TIKTOK:'var(--s5)',TOKOPEDIA:'var(--s3)',LAZADA:'var(--s7)',MARKETPLACE:'var(--s6)'};
function renderMkt(){
  parkFilters();
  const p=$('#p-mkt'); p.innerHTML='';
  const [m1,m2]=periodM1M2(S.year);

  const tot=y=>mktRows(y,m1,m2).reduce((s,r)=>s+N(r.amount),0);
  const allSales=S.dash.filter(r=>r.month>=m1&&r.month<=m2&&storeOk(r.store_id)).reduce((s,r)=>s+N(r.total_sales),0);
  if(!S.mkt.length) p.append(el('div',{class:'note warn'},el('b',{},'Belum ada penjualan marketplace pada data. '),
    'Sales Type yang namanya mengandung Shopee atau Tiktok otomatis dikenali. Tipe lain (mis. Tokopedia, Lazada) bisa ditandai di Pengaturan → Database Sales Type → kolom Channel.'));

  /* Round 18: SEBELUMNYA dibatasi tepat 4 tile (Total/Growth/Channel terbaik + maks 2 channel lain) —
     begitu channel bertambah dari 2 default (Shopee/Tiktok) jadi 3-4 (Tokopedia/Lazada, round 17 item 3
     menyebut "bisa ditambah nantinya"), channel ke-3/4 tidak pernah tampil di tile sama sekali walau
     datanya ada. Sekarang: 3 tile ringkasan (Total/Growth/Channel terbaik) LALU satu tile per channel
     yang BENAR-BENAR ada datanya (tanpa dibatasi jumlahnya) — grid g4 otomatis membungkus ke baris baru,
     jadi selalu lengkap sesuai channel yang tersedia. */
  const tl=el('div',{class:'grid g4 gauto'});
  const totCy=tot(S.year), totPy=tot(S.year-1);
  const mktGrowth=totPy>0?(totCy-totPy)/totPy:null;
  const chTotals=chs.map(ch=>({ch,s:mktRows(S.year,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0)})).sort((a,b)=>b.s-a.s);
  const bestCh=chTotals[0];
  tl.append(tile('Total marketplace',compact(totCy),`${pct(allSales?totCy/allSales:null)} dari total sales toko`,null));
  tl.append(tile(`Growth vs ${S.year-1}`, mktGrowth!=null?pct(mktGrowth):'—',
    mktGrowth!=null?(mktGrowth>=0?'naik':'turun')+' dibanding tahun lalu':`belum ada data ${S.year-1}`, mktGrowth!=null?(mktGrowth>=0?1:0):null));
  if(bestCh&&bestCh.s>0) tl.append(tile('Channel terbaik',bestCh.ch,`${compact(bestCh.s)} · ${pct(totCy?bestCh.s/totCy:null)} dari total marketplace`,null));
  chTotals.forEach(({ch,s})=>{
    const t=chanTarget(ch,S.year,m1,m2);
    tl.append(tile(ch,compact(s),t>0?`target ${compact(t)} · GAP ${compact(s-t)}`:(s>0?'target belum diisi (lihat bawah)':'belum ada data pada periode ini'),t>0?s/t:null));
  });
  p.append(tl);

  /* ringkasan + analisis per channel */
  const sumHeads=[H('CHANNEL',{s:1}),H('SALES',{r:1}),H('TARGET',{r:1}),H('ACHIEV',{r:1}),H('GAP',{r:1}),H('TRANSAKSI',{r:1}),H('AOV',{r:1}),
    H(`SALES ${S.year-1}`,{r:1}),H('GROWTH',{r:1}),H('GAP GROWTH',{r:1}),H('PORSI THD TOTAL',{r:1})];
  const chSales=ch=>mktRows(S.year,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0);
  const chsSorted=chs.slice().sort((a,b)=>chSales(b)-chSales(a));   // item 8: diurutkan sales terbesar→terkecil
  const maxChSales=chsSorted.length?chSales(chsSorted[0]):0;
  const sumRows=chsSorted.map(ch=>{ const rr=mktRows(S.year,m1,m2,ch), s=rr.reduce((a,r)=>a+N(r.amount),0), c=rr.reduce((a,r)=>a+N(r.trx),0);
    const t=chanTarget(ch,S.year,m1,m2), py=mktRows(S.year-1,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0);
    return [ch,magCell(s,maxChSales,compact(s)),t>0?compact(t):'—',pillCell(t>0?s/t:null),t>0?compact(s-t):'—',int(c),c>0?rp(s/c):'—',py>0?compact(py):'',growthPill(s,py),gapTxt(s,py),pct(allSales?s/allSales:null)]; });
  p.append(card('Pencapaian per channel',ymLabel(S.year,m1,m2)+' · diurutkan sales terbesar→terkecil',mkTable(sumHeads,sumRows)),el('p',{class:'note'},'TRX/AOV memakai input manual atau upload khusus Transaksi per toko/bulan. Data itu belum memiliki rincian channel, sehingga TRX/AOV per channel ditampilkan — dan tidak dihitung dari Sales Type.'));

  /* grafik per bulan per channel — round 7 item 6: SEBELUMNYA ditaruh dalam grid 2 kolom (g2) sehingga
     tiap chart groupedBars() tampil ±separuh lebar (teks/bar jadi kecil) dibanding chart H2H sepenuh-lebar
     yang memakai fungsi SAMA. Sekarang ditumpuk satu per baris, selebar card, agar ukurannya sepadan. */
  /* round 9 item 5: bar Sales/Target + garis Achievement digabung dalam SATU chart (comboBarsLine),
     bukan dua elemen (groupedBars + lineChart) ditumpuk seperti sebelumnya. */
  /* Round 18: sebelumnya dibatasi `.slice(0,2)` (cuma 2 chart teratas) — sekarang tampilkan chart utk
     SEMUA channel yang punya data pada tahun ini ATAU tahun lalu (bukan cuma 2 teratas tahun ini),
     supaya channel baru (Tokopedia/Lazada dkk) tetap kebagian analisisnya begitu datanya ada. */
  chsSorted.filter(ch=>chSales(ch)>0||mktRows(S.year-1,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0)>0).forEach(ch=>{
    const sales=MONTHS.map((_,i)=>mktRows(S.year,i+1,i+1,ch).reduce((a,r)=>a+N(r.amount),0));
    const tg=MONTHS.map((_,i)=>chanTarget(ch,S.year,i+1,i+1));
    const ser=[{name:'Sales',color:CH_COLOR[ch]||'var(--s1)',vals:sales},{name:'Target',color:'var(--target-bar)',vals:tg}];
    const ach=MONTHS.map((_,i)=>tg[i]>0&&sales[i]>0?sales[i]/tg[i]:null);
    const wrap=el('div',{},
      el('div',{style:'display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px'},

      el('div',{class:'sub',style:'margin-top:4px'},'Sumbu kiri: Rp (batang Sales/Target) · Sumbu kanan: % (garis Achievement, titik putus = bulan tanpa sales/target)'));

    const t=chanTarget(ch,S.year,m1,m2), py=mktRows(S.year-1,m1,m2,ch).reduce((a,r)=>a+N(r.amount),0);

    notes.push(el('div',{class:'item'},el('div',{class:'t'},ch+' · '+compact(s)),
      el('div',{class:'c'},`Kontribusi terbesar dari ${best[0]} (${pct(best[1]/s)}). Bulan terbaik ${MONTHS[bm[0]-1]} (${compact(bm[1])}). `+

        (py>0?`Dibanding ${S.year-1}: ${s>=py?'naik':'turun'} ${pct(Math.abs((s-py)/py),0)}.`:`Belum ada pembanding ${S.year-1}.`))));
  });
  if(notes.length) p.append(card('Analisis marketplace','dihitung otomatis dari data pada filter aktif',el('div',{style:'display:flex;flex-direction:column;gap:9px'},...notes)));

  /* per toko x channel — round 22: tambah kolom TARGET & ACHIEV per channel per toko (dari target yang
     diisi di kartu "Target marketplace per Toko Offline" di bawah), supaya kelihatan toko mana yang
     tercapai/tidak, bukan cuma angka sales-nya. */
  {
    const storeIds=[...new Set(mktRows(S.year,m1,m2).map(r=>r.store_id))];
    const nameOf=sid=>(S.stores.find(s=>s.id===sid)||{}).name||'—';
    const storesSorted=storeIds.sort((a,b)=>mktRows(S.year,m1,m2).filter(r=>r.store_id===b).reduce((s,r)=>s+N(r.amount),0)-mktRows(S.year,m1,m2).filter(r=>r.store_id===a).reduce((s,r)=>s+N(r.amount),0));
    const heads=[H('TOKO',{s:1}),...chs.flatMap(ch=>[H(ch+' SALES',{r:1}),H(ch+' TARGET',{r:1}),H(ch+' ACHIEV',{r:1})]),H('TOTAL MARKETPLACE',{r:1}),H('PORSI THD SALES TOKO',{r:1})];
    const totals=storesSorted.map(sid=>mktRows(S.year,m1,m2).filter(r=>r.store_id===sid).reduce((a,r)=>a+N(r.amount),0));
    const maxStoreMkt=Math.max(0,...totals);
    const rows=storesSorted.map((sid,i)=>{ const cells=chs.flatMap(ch=>{ const rr=mktRows(S.year,m1,m2,ch).filter(r=>r.store_id===sid);
        const s=rr.reduce((a,r)=>a+N(r.amount),0), t=chanTargetStore(ch,sid,S.year,m1,m2);
        return [compact(s),t?compact(t):'—',t?pillCell(s/t):''];
      });
      const n=nameOf(sid), tt=totals[i];
      const ss=S.dash.filter(r=>r.store_name===n&&r.month>=m1&&r.month<=m2).reduce((a,r)=>a+N(r.total_sales),0);
      return [n,...cells,magCell(tt,maxStoreMkt,compact(tt)),pct(ss?tt/ss:null)]; });
    p.append(card('Marketplace per toko',ymLabel(S.year,m1,m2)+' · diurutkan total marketplace terbesar→terkecil · TARGET dari "Target marketplace per Toko Offline" di bawah',mkTable(heads,rows)));
  }
  /* per bulan */
  {
    const heads=[H('BULAN',{s:1}),...chs.flatMap(ch=>[H(ch+' SALES',{r:1}),H(ch+' TARGET',{r:1}),H(ch+' ACHIEV',{r:1})]),H('TOTAL',{r:1})];
    const rows=MONTHS.map((mn,i)=>{ const cells=chs.flatMap(ch=>{ const s=mktRows(S.year,i+1,i+1,ch).reduce((a,r)=>a+N(r.amount),0), t=chanTarget(ch,S.year,i+1,i+1);
        return [compact(s),t>0?compact(t):'—',pillCell(t>0&&s>0?s/t:null)]; });
      return [mn,...cells,compact(mktRows(S.year,i+1,i+1).reduce((a,r)=>a+N(r.amount),0))]; });
    p.append(card('Marketplace per bulan',String(S.year),mkTable(heads,rows)));
  }

  /* round 24: user melaporkan "Target marketplace jadinya ada 2" (editor gabungan + editor per toko dari
     round 22/23) dan minta DIJADIKAN SATU — transaksi marketplace memang selalu terjadi lewat satu toko
     offline, jadi target-nya pun seharusnya hanya diisi per toko, tanpa editor "gabungan" terpisah.
     Editor gabungan (store_id selalu NULL) DIHAPUS di sini. `chanTarget()` tidak perlu diubah: logika
     fallback-nya (`overall||all.reduce(...)`) sudah otomatis MENJUMLAHKAN semua target per toko kalau
     tidak ada baris gabungan — jadi total/tile/tabel yang belum difilter ke toko tertentu tetap benar
     selama tiap toko offline diisi targetnya di bawah ini. */
  const edS=el('div',{class:'card'});
  edS.append(el('header',{},el('h2',{},'Target marketplace per Toko Offline '+S.year),
    el('span',{class:'sub'},'target Shopee/TikTok dkk diisi per toko offline tempat transaksinya terjadi')));
  edS.append(el('p',{style:'margin:0 0 12px;color:var(--ink-2);font-size:12.5px'},
    'Pilih toko offline tempat transaksi marketplace itu terjadi, lalu isi target per channel per bulan khusus utk toko itu — '+
    'meskipun channel-nya sama (Shopee/TikTok), target tiap toko bisa berbeda. Total & achievement yang belum difilter ke toko tertentu '+
    'otomatis menjumlahkan target semua toko di bawah ini.'));
  const stoSel=el('select',{},S.stores.map(s=>el('option',{value:String(s.id),selected:S.mktTgtStore===s.id?'':null},s.name)));
  if(!S.mktTgtStore&&S.stores[0]) S.mktTgtStore=S.stores[0].id;
  const tbS=el('tbody'); const inputsS={};
  const fillStoreRows=()=>{
    tbS.innerHTML=''; const sid=Number(stoSel.value);
    chs.forEach(ch=>{
      const tr=el('tr',{},el('td',{class:'sticky1',style:'font-weight:700'},ch));
      MONTHS.forEach((_,i)=>{ const cur=S.chanTargets.find(t=>String(t.channel).toUpperCase()===ch&&t.year===S.year&&t.month===i+1&&t.store_id===sid);
        const inp=el('input',{type:'number',min:'0',step:'1000',value:cur?String(Math.round(N(cur.target))):'',style:'width:104px'});
        inputsS[ch+'|'+(i+1)]=inp; tr.append(el('td',{},inp)); });
      tbS.append(tr); });
  };
  fillStoreRows();
  stoSel.onchange=fillStoreRows;
  edS.append(el('div',{class:'fld',style:'max-width:320px;margin-bottom:12px'},el('label',{},'Toko offline'),stoSel));
  edS.append(el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},[H('CHANNEL'),...MON3.map(m=>H(m))].map((h,i)=>el('th',{class:i===0?'sticky1':''},h.t)))),tbS)));
  edS.append(el('div',{class:'rowline',style:'margin-top:12px'},el('button',{class:'btn pri',onclick:async()=>{
    if(guard()) return;
    const sid=Number(stoSel.value);

        await DB.del('channel_targets',`channel=eq.${encodeURIComponent(ch)}&year=eq.${S.year}&month=eq.${m}&store_id=eq.${sid}`);
        if(v!==''&&N(v)>0) await DB.write('channel_targets',[{channel:ch,store_id:sid,year:S.year,month:m,target:N(v)}]); }
      S.mktTgtStore=sid;
      toast('Target marketplace toko '+(S.stores.find(s=>s.id===sid)||{}).name+' tersimpan.'); await loadAll();
    }catch(e){ toast('Gagal: '+e.message); } }},'Simpan target toko ini')));
  p.append(edS);

  p.append(el('div',{class:'note'},el('b',{},'Catatan. '),'Penjualan marketplace tetap ikut dalam total sales toko (Sales Type Shopee/Tiktok terpetakan ke segmen User). '+
    'Halaman ini hanya memisahkannya untuk dianalisis. Channel tiap Sales Type diatur di Pengaturan → Database Sales Type.'));
}

/* =====================================================================
   TRACKING DATA — status ingest per toko×bulan & deteksi anomali (round 9 item 4)
   ===================================================================== */
function dtStores(){ return S.stores.filter(s=>s.name!=='DC TIGALAPAN'); }   // DC bukan toko ritel, dikecualikan
function dtStatus(store,year,month,row,todayY,todayM){
  if(store.opening_date){
    const d=new Date(store.opening_date+'T00:00:00');
    if(!isNaN(d) && (year<d.getFullYear() || (year===d.getFullYear() && month<d.getMonth()+1))) return 'closed';   // belum buka
  }
  const sales=N(row&&row.total_sales);
  if(sales>0) return 'ok';
  const isFuture = year>todayY || (year===todayY && month>todayM);
  if(isFuture) return 'future';                      // belum waktunya
  return 'missing';                                   // kosong — sudah lewat tapi tak ada data
}
const DT_STATUS_LABEL={ok:'Ada data',missing:'Kosong',future:'Belum waktunya',closed:'Belum buka'};
const DT_STATUS_CLASS={ok:'ok',missing:'bad',future:'neu',closed:'neu'};
function renderDataTrack(){
  parkFilters();
  const p=$('#p-datatrack'); p.innerHTML='';
  const today=new Date(), todayY=today.getFullYear(), todayM=today.getMonth()+1;
  /* round 10 item 6: tampilkan hingga 3 tahun sekaligus. Kalau filter Tahun global cuma 1 nilai (biasa),
     default-nya [tahun-2, tahun-1, tahun] — kalau user multi-select Tahun lewat chip atas, hormati pilihan
     itu persis (tidak dipaksa -2/-1). */
  const years=(S.years&&S.years.length>1)?S.years.slice().sort((a,b)=>a-b):[S.year-2,S.year-1,S.year];
  p.append(el('div',{class:'phead'},el('div',{},el('h1',{},'Tracking Data'),
    el('p',{},`Status kelengkapan data per toko × bulan, dan deteksi anomali otomatis. Tahun ${years.join(', ')} · per ${today.toLocaleDateString('id-ID',{dateStyle:'long'})}.`))));
  const pf=pageFilterBar('datatrack'); if(pf) p.append(pf);
  if(S.demo) p.append(demoBanner());

  const stores=dtStores();
  const mFilter=S.month||0;    // 0 = semua bulan (filter ini hanya menyaring tabel anomali/ingest log)

  /* ---------- cakupan + anomali, dihitung per tahun yang ditampilkan ---------- */
  const perYear=years.map(year=>{
    const dashByKey=new Map(S.dashAll.filter(r=>r.year===year).map(r=>[r.store_id+'|'+r.month,r]));
    const trxByKey=new Map(manualTrxRows().filter(r=>r.year===year).map(r=>[r.store_id+'|'+r.month,r]));
    const cells=[];
    stores.forEach(st=>{ for(let m=1;m<=12;m++){
      cells.push({store:st,month:m,status:dtStatus(st,year,m,dashByKey.get(st.id+'|'+m),todayY,todayM)});
    }});
    const anoms=[];
    stores.forEach(st=>{
      const aovHist=[];
      for(let m=1;m<=12;m++){
        const st_=dtStatus(st,year,m,dashByKey.get(st.id+'|'+m),todayY,todayM);
        if(st_==='closed'||st_==='future') continue;
        const row=dashByKey.get(st.id+'|'+m), trxRow=trxByKey.get(st.id+'|'+m);
        const sales=N(row&&row.total_sales), target=N(row&&row.target_total);
        const ym=MON3[m-1]+' '+year;
        if(target>0 && sales>0){ const ach=sales/target;
          if(ach<0.1) anoms.push({store:st.name,ym,year,month:m,metric:'Achievement',value:pct(ach),
            note:`Sales hanya ${pct(ach)} dari target (${compact(sales)} vs target ${compact(target)}) — jauh di bawah wajar, kemungkinan data belum lengkap masuk.`});
          else if(ach>3) anoms.push({store:st.name,ym,year,month:m,metric:'Achievement',value:pct(ach),
            note:`Sales ${pct(ach)} dari target (${compact(sales)} vs target ${compact(target)}) — 300%+ dari target, cek apakah target salah input.`});
        }
        if(m>1){ const prevRow=dashByKey.get(st.id+'|'+(m-1)), prev=N(prevRow&&prevRow.total_sales);
          if(prev>0 && sales>=0){ const chg=(sales-prev)/prev;
            if(chg<-0.7) anoms.push({store:st.name,ym,year,month:m,metric:'MoM sales',value:pct(chg),
              note:`Sales turun ${pct(Math.abs(chg))} dari bulan sebelumnya (${compact(prev)} → ${compact(sales)}) — turun drastis, cek apakah data bulan ini sudah lengkap.`});
            else if(chg>3) anoms.push({store:st.name,ym,year,month:m,metric:'MoM sales',value:'+'+pct(chg),
              note:`Sales naik ${pct(chg)} dari bulan sebelumnya (${compact(prev)} → ${compact(sales)}) — lonjakan tajam, cek kemungkinan duplikasi data.`});
          }
        }
        if(trxRow && N(trxRow.jumlah_transaksi)>0){
          const aov=N(trxRow.nilai_transaksi)/N(trxRow.jumlah_transaksi);
          if(aovHist.length>=2){ const avg=aovHist.reduce((a,b)=>a+b,0)/aovHist.length;
            if(avg>0 && (aov>avg*2.5||aov<avg*0.4)) anoms.push({store:st.name,ym,year,month:m,metric:'AOV',value:rp(aov),
              note:`AOV ${rp(aov)} jauh berbeda dari rata² toko ini (${rp(avg)}) — kemungkinan salah input nilai/jumlah transaksi.`});
          }
          aovHist.push(aov);
        }
        const trxCount=N(trxRow&&trxRow.jumlah_transaksi);
        if(sales>0 && trxCount===0) anoms.push({store:st.name,ym,year,month:m,metric:'Konsistensi',value:compact(sales),
          note:`Ada sales (${compact(sales)}) tapi jumlah transaksi tercatat 0 — data Sales Type & Transaksi tidak sinkron.`});
        else if(sales===0 && trxCount>0) anoms.push({store:st.name,ym,year,month:m,metric:'Konsistensi',value:int(trxCount)+' trx',
          note:`Ada ${int(trxCount)} transaksi tercatat tapi sales 0 — data Sales Type & Transaksi tidak sinkron.`});
      }
    });
    return {year,cells,anoms};
  });
  const allAnoms=perYear.flatMap(y=>y.anoms).filter(a=>!mFilter||a.month===mFilter);
  const allExpected=perYear.flatMap(y=>y.cells.filter(c=>c.status==='ok'||c.status==='missing'));
  const allCovered=allExpected.filter(c=>c.status==='ok');
  const lastLog=S.logs[0];   // sudah terurut created_at.desc dari loadAll()

  /* ---------- tiles ringkasan (gabungan semua tahun yang ditampilkan) ---------- */
  const tl=el('div',{class:'grid g4'});
  tl.append(tile('Cakupan data',allExpected.length?pct(allCovered.length/allExpected.length):'—',
    `${int(allCovered.length)} dari ${int(allExpected.length)} toko×bulan terisi · ${years.join('/')}`,allExpected.length?allCovered.length/allExpected.length:null));
  tl.append(tile('Toko×bulan hilang',int(allExpected.length-allCovered.length),'sudah lewat tanggalnya tapi belum ada sales',null,
    el('span',{class:'pill '+((allExpected.length-allCovered.length)>0?'bad':'ok')},(allExpected.length-allCovered.length)>0?'Perlu dicek':'Lengkap')));
  tl.append(tile('Sinkron terakhir',lastLog?new Date(lastLog.created_at).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}):'—',
    lastLog?lastLog.file_name:'belum ada riwayat upload',null));
  tl.append(tile('Anomali terdeteksi',int(allAnoms.length),'dari achievement, MoM, AOV & konsistensi'+(mFilter?' · '+MONTHS[mFilter-1]:''),null,
    el('span',{class:'pill '+(allAnoms.length?'bad':'ok')},allAnoms.length?'Ada temuan':'Bersih')));
  p.append(tl);

  /* ---------- matriks cakupan — satu kartu per tahun, Jan–Des penuh (round 10 item 6) ---------- */
  perYear.forEach(({year,cells})=>{
    const heads=[H('TOKO',{s:1}),...MON3.map(m=>H(m,{r:1}))];
    const rows=stores.map(st=>{
      const rowCells=[st.name];
      for(let m=1;m<=12;m++){ const c=cells.find(c=>c.store.id===st.id&&c.month===m);
        rowCells.push(el('span',{class:'pill '+DT_STATUS_CLASS[c.status]+(mFilter&&mFilter===m?' mid':'')},DT_STATUS_LABEL[c.status])); }
      return rowCells;
    });
    p.append(card(`Matriks cakupan per toko × bulan — ${year}`,`Ada data = sales>0 · Kosong = sudah lewat tapi belum ada sales · Belum buka = sebelum opening_date toko · Belum waktunya = bulan di masa depan`,
      mkTable(heads,rows)));
  });

  /* ---------- item 5 (ronde ini): cakupan per JENIS DATA upload (Item Sales / Sales Type / Transaksi),
     bukan cuma gabungannya seperti matriks sales di atas. Item Sales & Sales Type dicek dari riwayat
     ingest_log (yang menyimpan store_id/year/month per upload); Transaksi dicek dari data aktualnya
     (S.trxAll) karena upload Transaksi bisa satu file gabungan tanpa store/periode di ingest_log itu
     sendiri. "Lainnya" (Target, Master produk/DATABASE STOCK, Database Sales Type) bukan data per
     toko×bulan, jadi ditampilkan sebagai status upload terakhir saja. ---------- */
  {
    const hasItemLog=(sid,y,m)=>S.logs.some(l=>l.kind==='ITEM_SALES'&&l.store_id===sid&&l.year===y&&l.month===m&&l.status==='OK'&&!uploadLogWasReset(l));
    const hasSalesTypeLog=(sid,y,m)=>S.logs.some(l=>l.kind==='SALES_TYPE'&&l.store_id===sid&&l.year===y&&l.month===m&&l.status==='OK'&&!uploadLogWasReset(l));
    const hasTrx=(sid,y,m)=>manualTrxRows().some(r=>r.store_id===sid&&r.year===y&&r.month===m&&N(r.jumlah_transaksi)>0);
    const typeStatus=(fn,st,year,month)=>{
      if(st.opening_date){ const d=new Date(st.opening_date+'T00:00:00');
        if(!isNaN(d)&&(year<d.getFullYear()||(year===d.getFullYear()&&month<d.getMonth()+1))) return 'closed'; }
      if(fn(st.id,year,month)) return 'ok';
      const isFuture=year>todayY||(year===todayY&&month>todayM);
      return isFuture?'future':'missing';
    };
    const monthsCovered=(fn,st,year)=>{ let c=0,expect=0; for(let m=1;m<=12;m++){ const s=typeStatus(fn,st,year,m); if(s==='closed'||s==='future') continue; expect++; if(s==='ok') c++; } return {c,expect}; };
    const typeDefs=[['ITEM_SALES','Item Sales',hasItemLog,'item'],['SALES_TYPE','Sales Type',hasSalesTypeLog,'sales'],['TRANSAKSI',"Transaksi",hasTrx,'trx']];

    /* ringkasan tiles per jenis, gabungan semua tahun yang ditampilkan */
    const tl2=el('div',{class:'grid g4'});
    typeDefs.forEach(([kindKey,label,fn])=>{
      let c=0,e=0; years.forEach(y=>stores.forEach(st=>{ const r=monthsCovered(fn,st,y); c+=r.c; e+=r.expect; }));
      tl2.append(tile('Cakupan '+label,e?pct(c/e):'—',`${int(c)} dari ${int(e)} toko×bulan terisi · ${years.join('/')}`,e?c/e:null));
    });
    const lastMap=S.logs.find(l=>l.kind==='MAPPING'), lastKpi=S.logs.find(l=>l.kind==='KPI');
    tl2.append(tile('Master/Mapping terakhir',lastMap?new Date(lastMap.created_at).toLocaleDateString('id-ID',{dateStyle:'short'}):'—',
      lastMap?lastMap.file_name:'belum pernah diupload (Target/Master produk/Database Sales Type)',null));
    p.append(tl2);

    /* tabel ringkas per toko: bulan terisi dari 12, per jenis data, per tahun ditampilkan */
    const heads2=[H('TOKO',{s:1}),...years.flatMap(y=>typeDefs.map(([,label])=>H(label+' '+y,{r:1})))];
    const rows2=stores.map(st=>[st.name,...years.flatMap(y=>typeDefs.map(([,,fn])=>{ const r=monthsCovered(fn,st,y);
      return el('span',{class:'pill '+(r.expect===0?'neu':r.c===r.expect?'ok':r.c===0?'bad':'mid')},r.expect===0?'—':`${r.c}/${r.expect}`); }))]);
    p.append(card('Cakupan per jenis data upload',`Jumlah bulan terisi dari bulan yang seharusnya sudah ada · ${years.join(', ')} · Item Sales/Sales Type dari riwayat upload — data yang dimasukkan lewat jalur lain (muat-massal) bisa tertulis "Kosong" di sini meski datanya sudah ada; silang-cek dgn matriks di atas. Transaksi sudah dicek dari data aktual.`,
      mkTable(heads2,rows2)));
    p.append(el('div',{class:'rowline',style:'flex-wrap:wrap'},
      el('span',{class:'sub'},'Unggah data yang masih kosong di halaman Upload Data: '),
      ...typeDefs.map(([,label])=>el('button',{class:'btn sm',onclick:()=>go('upload')},'⭱ '+label)),
      el('button',{class:'btn sm',onclick:()=>go('upload')},'⭱ Target / Master / Database Sales Type')));
  }

  /* ---------- anomali (disaring ke bulan terpilih bila ada) ---------- */
  if(allAnoms.length){
    p.append(card('Anomali terdeteksi',`${allAnoms.length} temuan pada tahun ${years.join(', ')}`+(mFilter?' · '+MONTHS[mFilter-1]:''),
      el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},
        ['TOKO','PERIODE','METRIK','NILAI','KETERANGAN'].map((h,i)=>el('th',{class:i===0?'sticky1':''},h)))),
        el('tbody',{},allAnoms.map(a=>el('tr',{},
          el('td',{class:'sticky1'},a.store), el('td',{},a.ym), el('td',{},a.metric),
          el('td',{class:'mono'},a.value), el('td',{},a.note))))))));
  } else {
    p.append(el('div',{class:'note'},el('b',{},'Tidak ada anomali. '),'Tidak ada temuan achievement/MoM/AOV/konsistensi yang mencurigakan pada tahun '+years.join(', ')+(mFilter?' · '+MONTHS[mFilter-1]:'')+'.'));
  }

  /* ---------- riwayat ingest_log ---------- */
  if(S.logs.length){
    const tb=el('tbody');
    S.logs.forEach(l=>{ const st=S.stores.find(s=>s.id===l.store_id);
      tb.append(el('tr',{},
        el('td',{},new Date(l.created_at).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})),
        el('td',{},l.kind), el('td',{class:'sticky1'},l.file_name),
        el('td',{},st?st.name:'—'),
        el('td',{},l.year&&l.month?MON3[l.month-1]+' '+l.year:'—'),
        el('td',{class:'r'},int(l.rows_total)),
        el('td',{class:'r'},int(l.rows_unmapped)),
        el('td',{class:'r'},compact(l.total_amount)),
        el('td',{},el('span',{class:'pill '+(uploadLogWasReset(l)?'neu':l.status==='OK'?'ok':'bad')},uploadLogWasReset(l)?'Direset':l.status)))); });
    p.append(card('Riwayat upload (ingest log)',`${S.logs.length} baris`,
      el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},
        ['WAKTU','JENIS','FILE','TOKO','PERIODE','BARIS','BELUM MAP','NILAI','STATUS']
          .map((h,i)=>el('th',{class:(i>4&&i<8?'r':'')+(i===2?' sticky1':'')},h)))),tb))));
  } else {
    p.append(el('div',{class:'empty'},el('b',{},'Belum ada riwayat upload'),'Mode contoh tidak menyimpan ingest_log — hubungkan Supabase untuk melihat riwayat yang sebenarnya.'));
  }
}

const BRAND_TARGET_KEY={TIGALAPAN:'TIGALAPAN KAOS',MAMU:'MAMU',MYNO:'MYNO'};
function brandTarget(b,year,m1,m2){
  const k=BRAND_TARGET_KEY[b]; if(!k) return 0;
  return S.brandTargets.filter(t=>t.brand===k&&t.year===year&&t.month>=m1&&t.month<=m2).reduce((s,t)=>s+N(t.target),0);
}
async function loadCatBrand(){
  if(S.catBrand) return S.catBrand;
  if(S.demo){ S.catBrand=new Map(); return S.catBrand; }
  try{ const rows=await DB.sel('category_brand?select=*'); S.catBrand=new Map(rows.map(r=>[r.category,r.brand])); }
  catch(e){ S.catBrand=new Map(); }
  return S.catBrand;
}
function renderBrand(){
  parkFilters();
  const p=$('#p-brand'); p.innerHTML='';
  const [m1,m2]=periodM1M2(S.year);
