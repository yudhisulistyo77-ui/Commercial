/* =====================================================================
   TARIK DATA LANGSUNG DARI GOOGLE SHEET (butuh sheet bisa dibaca lewat link)
   ===================================================================== */
async function sheetCsvFile(tab){
  const id=S.settings.source_spreadsheet||'1am4zrJ3TK-ODZmrVFNQv3Ci1nudh-AUb50EzQ5daL9M';
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
  let r; try{ r=await fetch(url); }catch(e){ throw new Error('tidak bisa mengambil sheet dari browser ini ('+e.message+') — unduh tab itu sebagai CSV lalu unggah manual'); }
  if(!r.ok) throw new Error('HTTP '+r.status+' dari Google Sheet');
  const txt=await r.text();
  if(/^\s*<(!doctype|html)/i.test(txt)) throw new Error('sheet tidak bisa dibaca publik — bagikan “siapa saja yang punya link” atau unggah CSV manual');
  return new File([txt],tab+'.csv',{type:'text/csv'});
}
async function pullSheet(kind,btn){
  if(guard()) return;
  const old=btn.textContent; btn.disabled=true; btn.textContent='Menarik…';
  try{
    logLine(`\n=== tarik dari Google Sheet · ${kind} ===`);
    if(kind==='trx'){ const f=await sheetCsvFile('TRANSAKSI'); const rows=await readSheet(f,NEED.trx); await ingestTrx(f,rows); }
    else if(kind==='master'){ const f=await sheetCsvFile('DATABASE STOCK'); const rows=await readSheet(f,NEED.master); logLine(`  ▸ ${int(rows.length)} baris master terbaca`); await ingestMaster(f,rows); }
    else if(kind==='target'){ await pullTargets(); }
    else if(kind==='spv'){ await pullSpv(); }
    S.rollCache.clear(); await loadAll(); toast('Selesai ditarik dari Google Sheet.');
  }catch(e){ logLine('  ✗ '+e.message); toast('Gagal: '+e.message); }
  btn.disabled=false; btn.textContent=old;
}
/* Parser inti sheet TARGET (dipakai baik untuk tarik Drive dulu maupun upload manual).
   Struktur: row header bulan di baris pertama, lalu section "TOTAL TARGET NAMA TOKO" (section
   pertama ini headernya ikut di row 0 makanya sec diawali 'TOTAL'), "TARGET KOMERSIAL",
   "TARGET USER", lalu "TARGET BRAND". */
function parseTargetAoa(aoa){
  const hdr=aoa[0]||[]; const per=[];
  for(let i=1;i<=12;i++){ const t=String(hdr[i]||''); const m=monthFromWord(t.split(/[\s-]+/)[0]); const ym=/(\d{2,4})\s*$/.exec(t);
    per.push({m:m||i,y:ym?(ym[1].length===2?2000+Number(ym[1]):Number(ym[1])):S.year}); }
  let sec='TOTAL'; const T=new Map(), BT=[];
  for(const row of aoa.slice(1)){
    const nm=String(row[0]||'').trim(), up=nm.toUpperCase(); if(!nm) continue;
    if(/^TOTAL TARGET/.test(up)){ sec='TOTAL'; continue; } if(up==='TARGET KOMERSIAL'){ sec='KOM'; continue; }
    if(up==='TARGET USER'){ sec='USER'; continue; } if(up==='TARGET BRAND'){ sec='BRAND'; continue; }
    if(up==='NAMA TOKO'||up==='TOTAL') continue;
    if(sec==='BRAND'){ per.forEach((pp,i)=>BT.push({brand:up,year:pp.y,month:pp.m,target:num(row[i+1])})); continue; }
    if(!sec) continue;
    const sid=findStore(nm); if(!sid) continue;
    per.forEach((pp,i)=>{ const k=sid+'|'+pp.y+'|'+pp.m; const o=T.get(k)||{store_id:sid,year:pp.y,month:pp.m,target_total:0,target_komersial:0,target_user:0};
      const v=num(row[i+1]); if(sec==='TOTAL')o.target_total=v; else if(sec==='KOM')o.target_komersial=v; else o.target_user=v; T.set(k,o); });
  }
  /* jaring pengaman: TOTAL TARGET = KOMERSIAL + USER selalu, jadi bila section TOTAL kosong/tidak
     terbaca (misalnya file manual cuma punya 2 section), tetap hitung dari komersial+user */
  for(const o of T.values()) if(!o.target_total) o.target_total=o.target_komersial+o.target_user;
  return {T,BT};
}
async function pullTargets(){
  const f=await sheetCsvFile('TARGET');
  const wb=XLSX.read(await f.text(),{type:'string',raw:true});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
  const {T,BT}=parseTargetAoa(aoa);
  if(!T.size) throw new Error('tidak ada baris target yang dikenali');
  await DB.write('targets',[...T.values()],'store_id,year,month');
  if(BT.length) await DB.write('brand_targets',BT,'brand,year,month');
  logLine(`  ✓ TARGET · ${T.size} baris target toko-bulan, ${BT.length} baris target brand`);
}
/* Upload manual file TARGET (xlsx/csv dengan struktur sama seperti tab TARGET) */
async function ingestTarget(file){
  const isCsv=/\.csv$/i.test(file.name);
  const wb=isCsv ? XLSX.read(await file.text(),{type:'string',raw:true}) : XLSX.read(await file.arrayBuffer(),{type:'array'});
  let best=null;
  for(const sn of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});
    if(!aoa.length) continue;
    const {T,BT}=parseTargetAoa(aoa);
    if(!best||T.size>best.T.size) best={T,BT,sheet:sn};
  }
  if(!best||!best.T.size) throw new Error('tidak ada baris target yang dikenali pada file ini');
  await DB.write('targets',[...best.T.values()],'store_id,year,month');
  if(best.BT.length) await DB.write('brand_targets',best.BT,'brand,year,month');
  logLine(`  ▸ ${file.name}: sheet "${best.sheet}" · ${best.T.size} baris target toko-bulan, ${best.BT.length} baris target brand`);
}
async function pullSpv(){
  const f=await sheetCsvFile('MAPING SPV'); const rows=await readSheet(f,['SPV AREA','STORE NAME']);
  if(!rows.length) throw new Error('tab MAPING SPV kosong');
  const r0=rows[0]; const kM=col(r0,'OPR MGR'), kS=col(r0,'SPV AREA'), kN=col(r0,'STORE NAME'), kZ=col(r0,'ZONA'), kA=col(r0,'ALAMAT');
  let n=0; const skip=[]; const ppl=new Map();
  for(const r of rows){
    const nm=String(r[kN]||'').trim(); if(!nm) continue;
    const spv=String(r[kS]||'').trim().toUpperCase(), mgr=String(r[kM]||'').trim();
    if(spv) ppl.set(spv,{name:spv,label:'SPV '+spv[0]+spv.slice(1).toLowerCase(),role:'SPV',is_active:true,sort_order:10});
    if(mgr) ppl.set(mgr,{name:mgr,label:'Mgr '+mgr.split(' ')[0],role:'MGR',is_active:true,sort_order:1});
    const sid=findStore(nm); if(!sid){ skip.push(nm); continue; }
    await DB.patch('stores','id=eq.'+sid,{spv:spv||null,opr_mgr:mgr||null,zona:kZ?String(r[kZ]||'').trim()||null:null,alamat:kA?String(r[kA]||'').trim()||null:null}); n++;
  }
  const existing=new Set(S.people.map(q=>q.name)); const addP=[...ppl.values()].filter(q=>!existing.has(q.name));
  if(addP.length) await DB.write('people',addP,'name');
  logLine(`  ✓ MAPING SPV · ${n} toko diperbarui`+(skip.length?`, dilewati (belum ada di daftar toko): ${skip.join(', ')}`:''));
}

  const gm=new Map(); growthScope().filter(r=>r.growth_vs_y1!=null).forEach(r=>{ const o=gm.get(r.store_id)||{cy:0,py:0}; o.cy+=N(r.sales_cy); o.py+=N(r.sales_y1); gm.set(r.store_id,o); });
  const tm=new Map(); trxScope().forEach(r=>{ const o=tm.get(r.store_id)||{c:0,v:0}; o.c+=N(r.jumlah_transaksi); o.v+=N(r.nilai_transaksi); tm.set(r.store_id,o); });

    return [r.store_name,s.spv?spvLabel(s.spv):'—',compact(r.total_sales),compact(r.target_total),pillCell(r.achiev_total),

  const a=agg(rows);
  return card('Ringkasan per toko',periodLabel(),mkTable(heads,body,['TOTAL','',compact(a.total_sales),compact(a.target_total),pillCell(a.achiev_total),compact(a.gap_sales),compact(a.sales_komersial),compact(a.sales_user),'','','','']));

    if(y===2025&&si>2) return; const a=Math.round((20+seeded(si*17+m*3+ci)*90)*1e6*(y===2025?0.7:1));
    S.mkt.push({store_id:s.id,store_name:s.name,brand:s.brand,spv:s.spv,year:y,month:m,channel:ch,sales_type:ch,amount:a,trx:Math.round(a/150000)}); }); }); });
  S.chanTargets=[]; ['SHOPEE','TIKTOK'].forEach((ch,ci)=>{ for(let m=1;m<=12;m++) S.chanTargets.push({channel:ch,store_id:null,year:2026,month:m,target:(ci?260:420)*1e6}); });
  const d=n=>{ const t=new Date(); t.setDate(t.getDate()+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };

   INIT
   ===================================================================== */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme'); }
$('#themebtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':cur==='light'?'':'dark';
  applyTheme(next); save('theme',next||'');
  toast(next==='dark'?'Tema gelap':next==='light'?'Tema terang':'Mengikuti sistem');
};
$('#reloadbtn').onclick=()=>withLoading($('#reloadbtn'),async()=>{ S.itemScope=''; await loadAll(); },'Memuat…');
$('#railtog').onclick=()=>$('#rail').classList.toggle('open');
(function(){
  const shell=$('#shell');
  try{ if(localStorage.getItem('sc_rail_collapsed')==='1') shell.classList.add('railcollapsed'); }catch(e){}
  $('#railcollapse').onclick=()=>{
    shell.classList.toggle('railcollapsed');
    try{ localStorage.setItem('sc_rail_collapsed', shell.classList.contains('railcollapsed')?'1':'0'); }catch(e){}
  };
})();
/* #f-year, #f-brand, #f-spv, #f-store kini dropdown multi-select (multiSelectDropdown) — listenernya
   dipasang sekali per build di dalam fillFilters()/syncStoreOptions(), bukan di sini. */
$('#f-month').onchange=e=>{ S.month=Number(e.target.value); S.itemScope=''; S.monthRange=null; S.rangeTag=''; $('#f-range').value=''; $('#f-custom-wrap').style.display='none'; render(); };
function fillCustomMonthSelects(){
  ['#f-custom-m1','#f-custom-m2'].forEach(sel=>{
    const s=$(sel); if(s.options.length) return;
    MONTHS.forEach((m,i)=>s.append(el('option',{value:String(i+1)},m)));
  });
}
$('#f-range').onchange=e=>{
  const v=e.target.value;
  $('#f-custom-wrap').style.display = v==='custom' ? 'flex' : 'none';
  if(v===''){ S.monthRange=null; S.rangeTag=''; }
  else if(v==='q1'){ S.monthRange=[1,3]; S.rangeTag='Kuartal 1'; }
  else if(v==='q2'){ S.monthRange=[4,6]; S.rangeTag='Kuartal 2'; }
  else if(v==='q3'){ S.monthRange=[7,9]; S.rangeTag='Kuartal 3'; }
  else if(v==='q4'){ S.monthRange=[10,12]; S.rangeTag='Kuartal 4'; }
  else if(v==='ytd'){ S.monthRange=[1,(S.month||lastMonthWithData(S.year))]; S.rangeTag='YTD'; }
  else if(v==='mom'){ const cm=S.month||lastMonthWithData(S.year); S.monthRange=[Math.max(1,cm-1),cm]; S.rangeTag='MoM'; }
  else if(v==='yoy'){ const cm=S.month||lastMonthWithData(S.year); S.monthRange=[cm,cm]; S.rangeTag='YoY (lihat H2H untuk banding tahun)'; }
  else if(v==='custom'){ fillCustomMonthSelects(); const m1=Number($('#f-custom-m1').value)||1, m2=Number($('#f-custom-m2').value)||12; S.monthRange=[Math.min(m1,m2),Math.max(m1,m2)]; S.rangeTag='Custom'; }
  render();
};
fillCustomMonthSelects();
$('#f-custom-m1').onchange=$('#f-custom-m2').onchange=()=>{
  const m1=Number($('#f-custom-m1').value)||1, m2=Number($('#f-custom-m2').value)||12;
  S.monthRange=[Math.min(m1,m2),Math.max(m1,m2)]; S.rangeTag='Custom'; render();
};
$('#f-clear').onclick=()=>{
  /* Round 19: tombol Clear SEBELUMNYA mereset S.month jadi 0 (logika data memang sudah benar membaca
     S.month, lihat storeOk()/periodM1M2() dkk), TAPI elemen <select id="f-month"> sendiri tidak pernah
     di-set ulang .value-nya — jadi secara VISUAL dropdown Bulan tetap menampilkan bulan yang dipilih
     sebelumnya walau datanya sudah balik ke "Semua (YTD)" di baliknya, persis laporan user "clear tidak
     merubah ke tampilan awal". Diperbaiki dengan eksplisit mengembalikan .value tiap kontrol native
     (<select>) yang TIDAK lewat multiSelectDropdown (f-month, f-range sudah ada sebelumnya). */
  S.year=2026; S.years=[2026]; S.month=0; S.brand=''; S.store=''; S.spv=''; S.monthRange=null; S.rangeTag=''; S.itemScope='';
  $('#f-month').value='0';
  $('#f-range').value=''; $('#f-custom-wrap').style.display='none';
  fillFilters(); loadAll();
};
document.addEventListener('scroll',tipHide,{passive:true});

(function init(){
  applyTheme(load('theme')||'');
  S.url = load('url') || S.url;
  S.key = load('key') || '';
  buildNav();
  fillFilters();
  go('dash');
  if(S.key) loadAll(); else { buildDemo(); render(); }
})();
